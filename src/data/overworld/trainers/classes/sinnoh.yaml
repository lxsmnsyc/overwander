# Sinnoh's trainer classes, each by its enum name: `types` it fields
# (an empty list is every type), the `sheets` it may stand in, and the
# `trade` it is one region's version of, left out where it is its own.
# What each is called and says is text/en/trainers.

# Sinnoh's own fifteen, which are the trades nobody had before it: the
# ranger who keeps the country, the worker out of the tunnel under the
# mountain, and the rest of the road it fills
Ranger:
  types: [Grass, Bug]
  sheets:
    - characters/dppt/ranger-f
    - characters/dppt/ranger-m
Worker:
  types: [Rock, Steel]
  sheets: [characters/dppt/worker]
Rancher:
  types: [Normal, Ground]
  sheets:
    - characters/dppt/rancher
    - characters/dppt/cowgirl
