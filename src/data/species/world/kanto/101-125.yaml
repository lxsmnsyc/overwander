MrMime:
  MrMime:
    types: [Psychic, Fairy]
    egg-groups: [HumanLike]
    biomes: [Grassland]
    active: [Day]
    evolves-from: MimeJr
    held: { common: OranBerry, uncommon: TwistedSpoon, rare: LightClay }
  # A Mr. Mime still learning the routine: a Mime Jr. copies whoever it
  # is watching and does not stop when they notice
  MimeJr:
    types: [Psychic, Fairy]
    egg-groups: [NoEggsDiscovered]
    biomes: [Grassland, TemperateForest, Woodland]
    active: any
    evolves-into:
      - species: MrMime
        method: [Level, KnownMove]
        level: 20
        move: Mimic
      # The Galarian one, which tap-dances on ice: both are offered
      - species: MrMimeGalar
        method: [Level, KnownMove]
        level: 20
        move: Mimic
    rank: baby
  MrMimeGalar:
    types: [Ice, Psychic]
    egg-groups: [HumanLike]
    biomes: [Tundra, Taiga]
    active: any
    base-form: false
    evolves-from: MimeJr
    awaiting: evolution
