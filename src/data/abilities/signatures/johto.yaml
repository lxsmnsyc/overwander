  # The three beasts share one signature, told three ways: what Ho-Oh
  # did for them in the burned tower, once per battle
  Raikou: RisenThunder
  Entei: RisenFlame
  Suicune: RisenTide
  Larvitar: Tyrant

  # The tower duo share one signature, told either side of a fall: the
  # guardian keeps its party standing once per battle
  Lugia: SilverAegis
  HoOh: RainbowRekindling
  Celebi: TimelineSplit

forms:
  # Galar's regional lines whose every stage is regional carry their own
  CoralHusk: [CorsolaGalar, Cursola]
