# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
DefendOrder:
  name: A Defender
  description: Sube 1 nivel la Defensa y la Defensa Esp. del usuario.
HealOrder:
  name: Auxilio
  description: Restaura 1/2 de los PS del usuario.
HeadSmash:
  name: Testarazo
  description: El usuario recibe 1/2 del daño que causa.
DoubleHit:
  name: Doble Golpe
  description: Golpea dos veces.
RoarOfTime:
  name: Distorsión
  description: Tras acertar, el usuario debe recargar durante 2 segundos.
SpacialRend:
  name: Corte Vacío
  description: Más probabilidad de golpe crítico.
LunarDance:
  name: Danza Lunar
  description: El usuario se debilita, y un aliado del campo recupera todos sus PS, se cura y tiene todos sus movimientos listos para lanzar.
CrushGrip:
  name: Agarrón
  description: Golpea más fuerte contra un objetivo con todos sus PS, y casi nada contra uno débil.
MagmaStorm:
  name: Lluvia Ígnea
  description: 'Atrapa al objetivo: pierde 1/8 de sus PS cada 2 segundos durante 8 segundos y no puede escapar, salvo si es de tipo Fantasma.'
DarkVoid:
  name: Brecha Negra
  description: Duerme al objetivo.
SeedFlare:
  name: Fulgor Semilla
  description: 40 % de probabilidad de bajar 2 niveles la Defensa Esp. del objetivo.
OminousWind:
  name: Viento Aciago
  description: 10 % de probabilidad de subir 1 nivel todas las estadísticas del usuario.
ShadowForce:
  name: Golpe Umbrío
  description: Desaparece y luego golpea atravesando Protección y Detección, y rompe la guardia. Un Sustituto aún lo bloquea.
