# One flat price, for the same reason the gear has one: what a player is
# picking is the moment they expect to have, not the one they can afford.
#
# The price is half again of a gem, which is the other thing in the game
# that is held for exactly one moment. A gem lifts a hit its holder chose
# to throw; these answer something done to the holder, which is worth
# more precisely because it cannot be planned.

FocusSash:
  type: Held
  icon: held/focus-sash
  flags: [Consumable, Holdable, Marketable]
  buy: 3000
  sell: 1500

