# What the line carries, in the order it grows into: a square timber,

# The labourers: the whole line works a building site, and none of
# them will put down what it is carrying
Timburr:
  types: [Fighting]
  egg-groups: [HumanLike]
  biomes: [TemperateForest, Woodland]
  active: [Morning, Day]
  evolves-into:
    - species: Gurdurr
      method: [Level]
      level: 25
Gurdurr:
  types: [Fighting]
  egg-groups: [HumanLike]
  biomes: [TemperateForest, Woodland]
  active: [Morning, Day]
  evolves-from: Timburr
  evolves-into:
    - species: Conkeldurr
      method: [Trade]
Conkeldurr:
  types: [Fighting]
  egg-groups: [HumanLike]
  biomes: [TemperateForest, Woodland]
  active: [Morning, Day]
  evolves-from: Gurdurr
