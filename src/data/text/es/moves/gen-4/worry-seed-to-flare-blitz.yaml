# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
WorrySeed:
  name: Abatidoras
  description: Cambia 1 de las habilidades del objetivo por Insomnio, así que no se le puede dormir.
SuckerPunch:
  name: Golpe Bajo
  description: Solo acierta a un objetivo que esté lanzando un movimiento dañino.
ToxicSpikes:
  name: Púas Tóxicas
  description: Envenena a todo lo que entre pisando el suelo en el bando contrario, gravemente con dos capas. Un tipo Veneno que pise el suelo las elimina.
HeartSwap:
  name: Cambiaalmas
  description: Intercambia todos los niveles del usuario con los del objetivo.
AquaRing:
  name: Acua Aro
  description: Restaura 1/16 de los PS máximos cada vez que actúa el usuario.
MagnetRise:
  name: Levitón
  description: El usuario se eleva del suelo durante 10 segundos, así que los movimientos de tipo Tierra fallan.
FlareBlitz:
  name: Envite Ígneo
  description: El usuario recibe 1/3 del daño que causa. 10 % de probabilidad de quemar.
