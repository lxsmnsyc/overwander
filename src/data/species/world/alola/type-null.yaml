# The seventeen types a Memory sets a Silvally to

# Worn rather than met: a Memory in its hands is what sets it

TypeNull:
  types: [Normal]
  egg-groups: [NoEggsDiscovered]
  biomes: [Beach]
  active: any
  evolves-into:
    - species: Silvally
      method: [Friendship]
