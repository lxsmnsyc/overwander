# シンオウの トレーナーの クラスの なまえと、 しょうぶを いどまれた ときの せりふ。
# ふたつの ちほうに いる クラスは おなじ なまえで、 がめんが ちほうを つけたす。

Ranger:
  name: ポケモンレンジャー
  quote: この あたりの ちいきは わたしが みている。 だれが とおれるかも わたしが きめる。
Worker:
  name: さぎょういん
  quote: この やまを ぶちぬいた トンネルは おれたちが ほった。 きみは しごとの らくな ところだ。
Rancher:
  name: ぼくじょうおじさん
  quote: この こたちは ぜんぶ むれから そだてた。 いうことは ちゃんと きくぞ。
Cyclist:
  name: サイクリング
  quote: あの おかを スピードを だして くだってきた。 ついてこれるかは きみしだいだ。
PokeKid:
  name: ポケモンごっこ
  quote: わたしのは きみのより かわいいよ。 つよさも だよ。 みてみる？
Collector:
  name: コレクター
  quote: この くにの へんな ものは ぜんぶ ひとつずつ もっている。 きみに かてば そろう。
Artist:
  name: アーティスト
  quote: じっと して。 きみが きづく しゅんかんを えがきたいの。
Reporter:
  name: レポーター
  quote: ちもとの トレーナーが カメラの まえで まける。 みだしは できた、 あとは きみだけ。
RichBoy:
  name: おぼっちゃま
  quote: おかねで いい ポケモンは かえない。 でも きたえる ひようは いくらでも だせる。
Waiter:
  name: ウエーター
  quote: ちゅうぼうは あつくて、 ぼくの ポケモンも あついよ。 なにか ちゅうもんを どうぞ。
ParasolLady:
  name: パラソルおねえさん
  quote: あめは わたしに あたらない。 きみが だす ポケモンも あたらないわ。
Twins:
  name: ふたごちゃん
  quote: わたしたちは おなじときに おなじことを かんがえるの。 きみは ふたりぶん ふりよ。
Policeman:
  name: おまわりさん
  quote: この みちの ちあんは わたしが まもる。 きみとの バトルも ちあんの うちだ。
Jogger:
  name: ジョギング
  quote: あさごはんの まえに 20キロ。 バトルは クールダウンだ。
Breeder:
  name: ポケモンブリーダー
  quote: この こたちは みんな わたしの てで かえった。 だから わたしの ために たたかうの。
SinnohAceTrainer:
  name: エリートトレーナー
  quote: ここから きたの みちは ぜんぶ あるいた。 どの みちも わたしを とめられなかった。
SinnohLass:
  name: ミニスカート
  quote: ここは こおりそうに さむいけど、 わたしは かっている。 つぎは あなたの ばん。
SinnohBugCatcher:
  name: むしとりしょうねん
  quote: この もりは むしで いっぱいだよ。 ぼくが いちばん はやおきだったんだ。
SinnohSwimmer:
  name: かいパンやろう
  quote: この みずうみは ゆきどけみずだ。 それでも およいだ。 きみは じゅんびうんどうを しな。
SinnohYoungster:
  name: たんパンこぞう
  quote: やまの はんぶんを ほって これを みつけたんだ。 みてよ！
SinnohSchoolKid:
  name: じゅくがえり
  quote: こんがっきは バトルの けっかを グラフに してるよ。 きみは ひとつの データさ。
SinnohCamper:
  name: キャンプボーイ
  quote: ゆうべは いわの うえで ねたんだ。 その したから こいつを みつけたよ。
SinnohBeauty:
  name: おねえさん
  quote: バトルだけじゃなく コンテストも するの。 まけるのは ひとつだけで いいわ。
SinnohFisherman:
  name: つりびと
  quote: こおりに あなを あけて 4じかん まった。 きみの ほうが いい えものだ。
SinnohSailor:
  name: ふなのり
  quote: わたしは わんを ふねで わたしている。 かいきょうの ほうが わたしより あらいぞ。
SinnohGentleman:
  name: ジェントルマン
  quote: ばんさんの まえに すこし スポーツを。 おもしろく して くれたまえ。
SinnohScientist:
  name: けんきゅういん
  quote: やまから でてくる ポケモンを けんきゅうしている。 きみのは たいしょうぐんに ちょうど いい。
SinnohBirdKeeper:
  name: とりつかい
  quote: わたしの とりは やまなみ ぜんたいを とぶ。 ふもとの ことは きに しない。
SinnohHiker:
  name: やまおとこ
  quote: とうげを のぼって ひるまえに もどる。 きみは くだりの じゃまだ。
SinnohPsychic:
  name: サイキッカー
  quote: みずうみの せいれいは ハミングのような ものを のこす。 ながいこと みみを すませてきた。
SinnohSkier:
  name: スキーヤー
  quote: ここの パウダースノーは さいこうだ。 わたしの チームも だ。
SinnohBlackBelt:
  name: からておう
  quote: トバリシティの どうじょうは だれも ことわらない。 だれも ゆるさない。
SinnohDragonTamer:
  name: ドラゴンつかい
  quote: みねの したの どうくつで タマゴを みつけた。 かえった ものを そだてたんだ。
SinnohGuitarist:
  name: ギタリスト
  quote: ナギサシティは たいようこうで うごいている。 この アンプも だ。 さがって。
SinnohAromaLady:
  name: アロマなおねえさん
  quote: ここでは なにもかも ゆっくり そだち、 つよく しがみつく。 わたしも よ。
SinnohRuinManiac:
  name: いせきマニア
  quote: この くにの ちかには リーグより ふるい へやが ある。 わたしが ほりだしている。
SinnohNinjaBoy:
  name: にんじゃごっこ
  quote: きみは ぼくの まえを まっすぐ 2かい とおった。 3かいめは バトルに なるよ。
SinnohTuber:
  name: うきわボーイ
  quote: みずは つめたいけど、 あがる つもりは ないよ。 そこから かかってきな。
SinnohPokeFan:
  name: ポケモンファン
  quote: この こたちの しゃしんは ぜんぶ もってるよ。 つぎは きみが まける しゃしんが ほしい。
SinnohRoughneck:
  name: スキンヘッズ
  quote: この あたりは おれたちの なわばりだ。 つうこうりょうは バトル いっかい、 かちでも まけでも だ。
SinnohClown:
  name: ピエロ
  quote: てに ちゅうもく。 ちがう、 もうひとつの てだ。 もう おそい。
SinnohCouple:
  name: ラブラブカップル
  quote: わたしたち、 この みちを ふたりで あるいてきたの。 きみも ふたりで たおすわ。
