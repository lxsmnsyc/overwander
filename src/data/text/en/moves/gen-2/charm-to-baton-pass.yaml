Charm:
  name: Charm
  description: Drops the target's Attack 2 stages.
Rollout:
  name: Rollout
  description: Rolls 5 times over, each pass twice the power of the last. Defense Curl doubles it again.
FalseSwipe:
  name: False Swipe
  description: Always leaves the target on at least 1 HP.
Swagger:
  name: Swagger
  description: Confuses the target and raises its Attack 2 stages.
MilkDrink:
  name: Milk Drink
  description: Heals the user or a party member 1/2 its HP.
Spark:
  name: Spark
  description: 30% to paralyse.
FuryCutter:
  name: Fury Cutter
  description: Cuts 4 times over, each one twice the power of the last.
SteelWing:
  name: Steel Wing
  description: 10% to raise the user's Defense a stage.
MeanLook:
  name: Mean Look
  description: The target cannot be swapped out for 10 seconds, ghosts aside. It takes no damage from it.
Attract:
  name: Attract
  description: A target of the opposite gender has a 50% chance of not acting at all.
SleepTalk:
  name: Sleep Talk
  description: Only works while the user is asleep. Casts one of its other moves at random.
HealBell:
  name: Heal Bell
  description: Cures burns, poison, paralysis, sleep and freezing across the user's whole party. It is a sound.
Return:
  name: Return
  description: The fonder of you the user is, the harder it hits, up to 102 power.
Present:
  name: Present
  description: 'A parcel: usually 40, 80 or 120 power, and 1 time in 5 it heals the target instead.'
Frustration:
  name: Frustration
  description: The less fond of you the user is, the harder it hits, up to 102 power.
Safeguard:
  name: Safeguard
  description: For 10 seconds nothing can put a status on the user's side.
PainSplit:
  name: Pain Split
  description: Adds up both sides' HP and splits it evenly between them.
SacredFire:
  name: Sacred Fire
  description: 50% to burn. The user thaws itself out casting it.
Magnitude:
  name: Magnitude
  description: Shakes the ground under everything else on the field for 10 to 150 power. Dug-in targets take 2x.
DynamicPunch:
  name: Dynamic Punch
  description: Always confuses what it hits.
Megahorn:
  name: Megahorn
  description: Plain contact damage.
DragonBreath:
  name: Dragon Breath
  description: 30% to paralyse.
BatonPass:
  name: Baton Pass
  description: Swaps the user out and hands its stat stages to whoever comes in.
