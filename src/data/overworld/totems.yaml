# Alola's Totems, as the trials had them (Ultra Sun and Ultra Moon where the
# two differ). `aura` is the stages each stat starts the fight raised by, or
# `all` for the five a stage can raise; height and weight are in meters and
# kilograms; `crystal` is what the trial hands over. Hakamo-o was a Totem only
# in the special demo, so it is not one here.

