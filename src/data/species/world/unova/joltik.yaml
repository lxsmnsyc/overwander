# The spiders: a Joltik clings to something bigger and drinks the
# static off it, and a Galvantula strings a fence of charged silk
# across whatever it wants kept away
Joltik:
  types: [Bug, Electric]
  egg-groups: [Bug]
  biomes: [Mountain]
  active: [Evening, Night]
  evolves-into:
    - species: Galvantula
      method: [Level]
      level: 36
Galvantula:
  types: [Bug, Electric]
  egg-groups: [Bug]
  biomes: [Mountain]
  active: [Evening, Night]
  evolves-from: Joltik
