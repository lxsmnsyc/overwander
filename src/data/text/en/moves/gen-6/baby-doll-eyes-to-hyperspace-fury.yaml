BabyDollEyes:
  name: Baby-Doll Eyes
  description: Drops the target's Attack a stage, with a shorter wind-up than most.
Nuzzle:
  name: Nuzzle
  description: Always paralyses.
HoldBack:
  name: Hold Back
  description: Always leaves the target on at least 1 HP.
Infestation:
  name: Infestation
  description: 'Binds the target: 1/8 of its HP every 2 seconds for 8 seconds, and no escape, ghosts aside.'
PowerUpPunch:
  name: Power-Up Punch
  description: Always raises the user's Attack a stage.
OblivionWing:
  name: Oblivion Wing
  description: Heals the user for 3/4 the damage dealt.
ThousandArrows:
  name: Thousand Arrows
  description: Hits everything opposite, reaches anything in the air, and brings it down to the ground.
ThousandWaves:
  name: Thousand Waves
  description: Hits everything opposite, and none of them can be swapped out for 10 seconds, ghosts aside.
LandsWrath:
  name: Land's Wrath
  description: Hits everything opposite.
LightOfRuin:
  name: Light of Ruin
  description: The user takes 1/2 of the damage it deals.
OriginPulse:
  name: Origin Pulse
  description: Hits everything opposite.
PrecipiceBlades:
  name: Precipice Blades
  description: Hits everything opposite.
DragonAscent:
  name: Dragon Ascent
  description: Drops the user's Defense and Special Defense 1 stage each.
HyperspaceFury:
  name: Hyperspace Fury
  description: Hits through Protect and Detect, breaks the guard, and never misses. Drops the user's Defense a stage.
