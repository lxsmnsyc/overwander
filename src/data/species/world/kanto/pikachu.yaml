# A baby lays no egg of its own: the stage above it does

Pikachu:
  types: [Electric]
  egg-groups: [Field, Fairy]
  biomes: [TemperateForest, Woodland]
  active: any
  evolves-from: Pichu
  # Both Raichu take the same stone, and the catch sheet lets the player pick
  evolves-into:
    - species: Raichu
      method: [UsedItem]
      item: ThunderStone
    - species: RaichuAlola
      method: [UsedItem]
      item: ThunderStone
Raichu:
  types: [Electric]
  egg-groups: [Field, Fairy]
  biomes: [TemperateForest, Woodland]
  active: any
  evolves-from: Pikachu
Pichu:
  types: [Electric]
  egg-groups: [NoEggsDiscovered]
  biomes: [TemperateForest, Woodland]
  active: any
  evolves-into:
    - species: Pikachu
      method: [Friendship]
PichuSpikyEared:
  types: [Electric]
  egg-groups: [NoEggsDiscovered]
  # Met in Ilex Forest, where Celebi is, and only in the mythical band
  biomes: [TemperateForest]
  active: any
  base-form: false
RaichuAlola:
  types: [Electric, Psychic]
  egg-groups: [Field, Fairy]
  biomes: [Beach, TropicalSeasonalForest]
  active: any
  base-form: false
  evolves-from: Pikachu
