# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
Payback:
  name: Vendetta
  description: El doble de potencia si el objetivo ha empezado un lanzamiento en los últimos 2 segundos.
Assurance:
  name: Buena Baza
  description: El doble de potencia si el objetivo ya ha recibido daño en los últimos 2 segundos.
Embargo:
  name: Embargo
  description: El objetivo no puede usar su objeto durante 10 segundos.
Fling:
  name: Lanzamiento
  description: 'Lanza el objeto que lleva el usuario: 10 de potencia si es una baya, 60 si es otra cosa. El objeto se pierde después.'
PsychoShift:
  name: Psicocambio
  description: Pasa el problema de estado del usuario al objetivo, y así el usuario se cura.
TrumpCard:
  name: As Oculto
  description: 'Cada vez que el usuario juega As Oculto en este combate, el siguiente es más fuerte: de 40 a 200 de potencia.'
