Electabuzz:
  Electabuzz:
    types: [Electric]
    egg-groups: [HumanLike]
    biomes: [Grassland]
    active: any
    evolves-from: Elekid
    evolves-into:
      - species: Electivire
        method: [HeldItem, Trade]
        item: Electirizer
    held: { common: OranBerry, uncommon: Electirizer, rare: Magnet }
  Elekid:
    types: [Electric]
    # A baby lays no egg of its own: the stage above it does
    egg-groups: [NoEggsDiscovered]
    biomes: [Grassland]
    active: any
