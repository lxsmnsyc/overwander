  name: Rock Slide
  description: Hits everything opposite, 30% to flinch.
ThunderShock:
  name: Thunder Shock
  description: 10% to paralyse.
ThunderWave:
  name: Thunder Wave
  description: Paralyses the target.
Thunder:
