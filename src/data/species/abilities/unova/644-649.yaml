Zekrom:
  Zekrom:
    abilities: [Teravolt]
    # Teravolt is all the mainline gives it, so the other three are
    # this registry's: the current it eats, the weight a legendary
    # puts on a fight, and a blow thrown without hedging it
    hidden: [MotorDrive, Pressure, SheerForce]
Landorus:
  Landorus:
    abilities: [SandForce]
    # Harvest and Sand Stream are this registry's rather than the
    # mainline's: it follows the other two to make the ground rich
    # again, and it brings its own sand to do it in. Intimidate
    # belongs to its other shape and never counts toward these four
    hidden: [SheerForce, Harvest, SandStream]
  LandorusTherian:
    abilities: [Intimidate]
    hidden: []
Kyurem:
  Kyurem:
    abilities: [Pressure]
    # Pressure is all the mainline gives it, so the other three are
    # this registry's: the cold it drags in, what that cold mends,
    # and the look that empties a room
    hidden: [SnowWarning, IceBody, Intimidate]
  KyuremBlack:
    abilities: [Teravolt]
  KyuremWhite:
    abilities: [Turboblaze]
