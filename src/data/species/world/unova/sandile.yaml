# The desert crocs: they swim through the sand with only the eyes out,
# and the black film over those eyes is what lets them look into the
# glare and wait
Sandile:
  types: [Ground, Dark]
  egg-groups: [Field]
  biomes: [Desert, Badlands]
  active: [Morning, Day]
  evolves-into:
    - species: Krokorok
      method: [Level]
      level: 29
Krokorok:
  types: [Ground, Dark]
  egg-groups: [Field]
  biomes: [Desert, Badlands]
  active: [Morning, Day]
  evolves-from: Sandile
  evolves-into:
    - species: Krookodile
      method: [Level]
      level: 40
Krookodile:
  types: [Ground, Dark]
  egg-groups: [Field]
  biomes: [Desert, Badlands]
  active: [Morning, Day]
  evolves-from: Krokorok
