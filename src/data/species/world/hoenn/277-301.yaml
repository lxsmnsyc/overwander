Nincada:
  Nincada:
    types: [Bug, Ground]
    egg-groups: [Bug]
    biomes: [Woodland, Badlands]
    active: [Evening, Night]
    # Both at once, as in the mainline: the husk is left in the Poke
    # Ball the bag has to be carrying when the Ninjask emerges
    evolves-into:
      - species: Ninjask
        method: [Level]
        level: 20
      - species: Shedinja
        method: [Level, UsedItem]
        level: 20
        item: PokeBall
        shed: true
  Ninjask:
    types: [Bug, Flying]
    egg-groups: [Bug]
    biomes: [Woodland, Badlands]
    active: [Evening, Night]
    evolves-from: Nincada
  Shedinja:
    types: [Bug, Ghost]
    # A shed shell is not something anything breeds with
    egg-groups: [Mineral]
    active: [Evening, Night]
    evolves-from: Nincada
