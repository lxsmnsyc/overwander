  greeting: まわして！ とまった めは ふたりに かかる。 それが おもしろいの。
Darach:
  name: コクラン
  house: バトルキャッスル
  greeting: おじょうさまが ごらんに なって おります。 あいにく この やかたの くすりは やかたの ものに ございます。
Caitlin:
  name: カトレア
  house: バトルキャッスル
  greeting: いつもは コクランが やるのだけれど。 きょうは きになるから わたしが やるわ。
Argenta:
  name: ケイト
  house: バトルステージ
  greeting: わたしの いっぴき、 あなたの いっぴき。 ほかの だれにも かくれられないわ。
