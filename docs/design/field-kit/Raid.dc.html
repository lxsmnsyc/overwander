<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raid battle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.field{position:absolute;inset:0;background:linear-gradient(180deg,#6C7FB8 0 40%,#7E9A6E 40% 100%)}
.glass{background:rgba(255,255,255,.95);backdrop-filter:blur(8px)}
.boss{position:absolute;left:820px;top:200px;width:200px;height:200px;border-radius:44px;animation:breathe 1600ms steps(2,end) infinite}
@keyframes breathe{50%{transform:translateY(-6px)}}
.unit{position:absolute;width:56px;height:56px;border-radius:14px;animation:breathe 1400ms steps(2,end) infinite}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;min-width:0}
.track{position:relative;height:12px;border-radius:6px;background:#E7EEF8;border:1px solid #C3D2E8;overflow:hidden}
.track .ghost{position:absolute;inset:0 auto 0 0;background:#F2B33D;animation:ghost 3000ms cubic-bezier(.2,.8,.2,1) infinite}
.track .fill{position:absolute;inset:0 auto 0 0;animation:fill 3000ms cubic-bezier(.2,.8,.2,1) infinite}
@keyframes fill{0%,40%{width:57%}44%,100%{width:49%}}
@keyframes ghost{0%,48%{width:57%}80%,100%{width:49%}}
.tick{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#14203A}
.tick.passed{background:#fff}
.burst{position:absolute;left:770px;top:150px;width:300px;height:300px;border-radius:150px;border:6px solid #F0584A;box-sizing:border-box;animation:burst 1800ms cubic-bezier(.5,0,.75,0) infinite}
@keyframes burst{from{transform:scale(1.6);opacity:0}20%{opacity:1}to{transform:scale(.7);opacity:1}}
.mark{position:absolute;width:18px;height:18px;border-radius:4px;background:#F0584A;transform:rotate(45deg);animation:blink 450ms steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes banner{from{transform:translateY(-30px) scale(.9);opacity:0}}
.stars{position:absolute;left:880px;top:170px;font-size:22px;color:#F2B33D;letter-spacing:.2em;animation:spin 1200ms linear infinite}
@keyframes spin{50%{transform:translateY(-4px)}}
.pass{position:absolute;left:50%;top:150px;margin-left:-160px;width:320px;text-align:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:28px;color:#fff;-webkit-text-stroke:2px #14203A;animation:pass 3000ms cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes pass{0%,42%{opacity:0;transform:scale(.6)}48%,76%{opacity:1;transform:none}84%,100%{opacity:0}}
.btn{font-family:Nunito,sans-serif;font-weight:800;font-size:13px;border-radius:12px;border:2px solid #C3D2E8;background:#fff;color:#14203A;padding:0 14px;height:40px;box-shadow:0 3px 0 0 rgba(20,32,58,.2);cursor:pointer;transition:transform 90ms cubic-bezier(.2,.8,.2,1),box-shadow 90ms}
.btn:active{transform:translateY(3px) scale(.98,.94);box-shadow:none}
.btn.go{background:#1E8F52;border-color:#156B3D;color:#fff;box-shadow:0 3px 0 0 #0F5430}
.btn.on{background:#2360C8;color:#fff;border-color:#163F86;box-shadow:0 3px 0 0 #102E63}
.prop{position:absolute;padding:2px 8px;border-radius:999px;background:#6E46C9;color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: Nunito, sans-serif; color: #14203A">
<div class="field"></div>
<div class="boss" style="background: {{ bossColor }}"></div>
<sc-if value="{{ isNoble }}" hint-placeholder-val="{{ false }}"><div class="burst"></div><span class="mark" style="left: 270px; top: 352px"></span><span class="mark" style="left: 390px; top: 432px"></span><span class="mark" style="left: 230px; top: 492px"></span></sc-if>
<sc-if value="{{ isAlpha }}" hint-placeholder-val="{{ false }}"><div class="unit" style="left: 1080px; top: 300px; background: #A07A54"></div><div class="unit" style="left: 1120px; top: 420px; background: #A07A54"></div><div class="unit" style="left: 1000px; top: 470px; background: #A07A54"></div></sc-if>
<div class="unit" style="left: 260px; top: 380px; background: #F0584A"></div><div class="unit" style="left: 380px; top: 460px; background: #4A8BF0; animation-delay: 200ms"></div><div class="unit" style="left: 220px; top: 520px; background: #36B26F; animation-delay: 400ms"></div><div class="unit" style="left: 460px; top: 360px; background: #F2B33D; animation-delay: 600ms"></div>
<sc-if value="{{ proposals }}" hint-placeholder-val="{{ false }}"><div class="pass">{{ passText }}</div></sc-if>

<div class="glass" style="position: absolute; top: 12px; left: 50%; width: 640px; margin-left: -320px; border: 2px solid #C3D2E8; border-radius: 22px; padding: 10px 16px 12px 12px; box-sizing: border-box; display: flex; gap: 14px; align-items: center; box-shadow: 0 4px 0 0 rgba(20,32,58,.2),0 18px 30px -18px rgba(20,32,58,.6); animation: banner 560ms cubic-bezier(.34,1.56,.64,1) both">
<span style="width: 64px; height: 64px; flex: 0 0 64px; border-radius: 18px; background: {{ bossColor }}; border: 3px solid #14203A; box-sizing: border-box"></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #52627F; white-space: nowrap">{{ title }}</span><sc-if value="{{ proposals }}" hint-placeholder-val="{{ false }}"><span style="height: 20px; padding: 0 8px; border-radius: 999px; background: {{ kindColor }}; color: #fff; display: flex; align-items: center; font-size: 10px; font-weight: 800; text-transform: uppercase">{{ kindLabel }}</span></sc-if></div>
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 22px">{{ bossLabel }}</span><span style="font-family: Fredoka, sans-serif; color: #52627F">49%</span></div>
<div class="track" style="height: 16px"><span class="ghost"></span><span class="fill" style="background: #D6372A"></span><sc-if value="{{ proposals }}" hint-placeholder-val="{{ false }}"><span class="tick" style="left: 75%"></span><span class="tick passed" style="left: 50%"></span><span class="tick" style="left: 25%"></span></sc-if></div>
</div>
</div>
<div class="glass" style="position: absolute; left: 14px; bottom: 80px; width: 300px; border: 2px solid #C3D2E8; border-radius: 18px; padding: 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between"><span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 17px">You</span><span style="font-size: 12px; font-weight: 800; color: #52627F">22 of 24 standing</span></div><div class="track"><span class="fill" style="animation: none; width: 70%; background: #1E8F52"></span></div></div>
<button class="btn" style="position: absolute; right: 14px; bottom: 80px">Leave</button>
<sc-if value="{{ proposals }}" hint-placeholder-val="{{ false }}"><span class="prop" style="left: 960px; top: 40px">Proposal: kind badge, ticks, callout</span></sc-if>
<sc-if value="{{ isNoble }}" hint-placeholder-val="{{ false }}"><span class="stars">★ ★</span></sc-if>

<div class="glass" style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); border: 2px solid #C3D2E8; border-radius: 18px; padding: 6px; display: flex; gap: 6px; align-items: center">
<sc-for list="{{ kinds }}" as="k" hint-placeholder-count="5"><button class="{{ k.cls }}" onClick="{{ k.pick }}">{{ k.label }}</button></sc-for>
<span style="width: 2px; height: 28px; background: #E7EEF8"></span>
<button class="{{ propCls }}" onClick="{{ toggleProps }}">Show proposals</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { kind: 'legendary', props: false }; }
  renderVals() {
    const kinds = {
      legendary: { label: 'Legendary', title: 'Raid Battle: Spear Pillar', bossLabel: 'Dialga', kindLabel: 'Legendary', kindColor: '#2360C8', bossColor: '#7F8FD0', pass: 'Half way!' },
      max: { label: 'Max Raid', title: 'Raid Battle: Max Raid', bossLabel: 'Charizard', kindLabel: 'Max Raid', kindColor: '#D6372A', bossColor: '#F0584A', pass: 'Half way!' },
      tera: { label: 'Tera', title: 'Raid Battle: Tera crystal', bossLabel: 'Garchomp', kindLabel: 'Tera · Water', kindColor: '#2360C8', bossColor: '#7FB8F0', pass: 'Half way!' },
      noble: { label: 'Noble', title: 'Raid Battle: Noble Arena', bossLabel: "Kleavor's Frenzy", kindLabel: 'Noble', kindColor: '#C98A0A', bossColor: '#B9A27A', pass: 'Staggered! 1.5x' },
      alpha: { label: 'Alpha', title: 'Raid Battle: Alpha', bossLabel: 'Ursaring', kindLabel: 'Alpha', kindColor: '#6E46C9', bossColor: '#A07A54', pass: 'Its kind returns' },
    };
    const k = kinds[this.state.kind];
    return {
      ...k,
      passText: k.pass,
      proposals: this.state.props,
      propCls: this.state.props ? 'btn on' : 'btn',
      toggleProps: () => this.setState({ props: !this.state.props }),
      isNoble: this.state.kind === 'noble',
      isAlpha: this.state.kind === 'alpha',
      kinds: Object.keys(kinds).map((id) => ({ label: kinds[id].label, cls: id === this.state.kind ? 'btn on' : 'btn', pick: () => this.setState({ kind: id }) })),
    };
  }
}
</script>
</body>
</html>
