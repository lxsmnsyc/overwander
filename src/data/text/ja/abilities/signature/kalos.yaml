# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
SpineBond:
  name: とげのきずな
  description: いる あいだ、 じぶんを ふくむ てもちが ぶつりわざから うける ダメージが 0.85ばいに なる。
EmberBond:
  name: ひだねのきずな
  description: いる あいだ、 じぶんを ふくむ てもちの とくしゅわざの いりょくが 1.15ばいに なる。
LoosenedEarth:
  name: ほぐれたつち
  description: じめんタイプの わざは、 あいての ぼうぎょの あがりを むしする。
Stoop:
  name: とびかかり
  description: じゅんびちゅうか ためている あいてへの ひこうタイプの わざの いりょくが 1.3ばいに なる。
Wingscale:
  name: まどわしのはね
  description: あてた わざごとに、 その あいての めいちゅうが 1だん さがる。 この りんぷんで さがるのは 2だんまで。
Hothouse:
  name: ガラスのおんしつ
  description: みかたは とくしゅわざを うける とき、 じぶんの とくぼうが ひくければ、 この ポケモンの とくぼうで うける。
SaddleBurden:
  name: くらのにもつ
  description: HPが 1/2より おおく じょうたいいじょうでない あいだ、 みかたに むけられた へんかわざを かわりに うける。
PedigreeCoat:
  name: けっとうのけなみ
  description: HPが 1/2 いじょうの あいだ、 とくしゅわざから うける ダメージが 0.8ばいに なる。
Restraint:
  name: おあずけ
  description: バトルで はじめの 3かいの わざは いりょくが 0.8ばいに なり、 それ いこうの わざは いりょくが 1.25ばいに なる。
TurnTheBlade:
  name: うけながし
  description: フォルムごとに はじめて うける こうげきの ダメージが 0.5ばいに なる。
Keyring:
  name: かぎたば
  description: うまれつきより もちものを 1つ おおく もてる。 バトルで あつかえる はんいで。
ManyHands:
  name: たくさんのて
  description: もっている のうりょくランクの へんかは、 あがっても さがっても 1.5ばいに かぞえられる。
DeepKelp:
  name: こんぶのもり
  description: HPの 1/8 みまんの ダメージしか あたえない こうげきは、 ぜんぜん きかない。
RangingShot:
  name: ロングショット
  description: とくしゅわざは、 どれだけ こうかが うすくても あいての HPを 1/8 いじょう へらす。
JawSnap:
  name: あごばさみ
  description: あてた わざは、 あいてが じゅんびちゅうか ためている わざを とめる。 おなじ あいてには 8びょうに 1かいまで。
Frostbound:
  name: こおりのかせ
  description: ダメージを あたえた あいては、 つぎの 6びょうかん、 じゅんびと ためる じかんが 30% ながくなる。
Overturn:
  name: ひっくりかえし
  description: あてた わざで、 あいてが もつ のうりょくランクの あがりさがりを ぜんぶ さかさまに する。 おなじ あいてには 10びょうに 1かいまで。
Backfeed:
  name: ぎゃくりゅう
  description: あてた でんきタイプの わざごとに、 あたえた ダメージの 1/16を てもち ぜんいんの HPとして かいふくする。
TopRope:
  name: トップロープ
  description: あいての おもさが 50kgごとに ちょくせつこうげきの わざの いりょくが 10% ふえ、 さいだい 1.5ばいに なる。
Undergrowth:
  name: したくさ
  description: あてた わざで、 あいてに くさタイプを くわえる。 おなじ あいてには 1かいだけ。
Hollowing:
  name: くりぬき
  description: あてた わざで、 あいてに ゴーストタイプを くわえる。 おなじ あいてには 1かいだけ。
Deadweight:
  name: おもし
  description: ぼうぎょの ほうが こうげきより たかい あいだ、 ぶつりわざは こうげきの かわりに ぼうぎょで ダメージを けいさんする。
Seepage:
  name: しみこみ
  description: ちょくせつ うける ダメージの 40%は、 かわりに つぎの 4びょうかんで うける。
Echolocation:
  name: エコーロケーション
  description: わざを あててきた あいては おとで とらえられ、 その あいてへの つぎの ダメージを あたえる わざは きゅうしょに あたる。
Begrudge:
  name: ねたみ
  description: あいてが かいふくする たびに、 こうげきが 1だん あがる。
SugarRush:
  name: さとうのいきおい
  description: もちものを つかいきると、 てもち ぜんいんの すばやさが 1だん あがる。
QuickWhiskers:
  name: はやひげ
  description: わざの ゆうせんどが 1だん たかくなる。 まちじかんは かわらない。
CrystalGrowth:
  name: けっしょうのせいちょう
  description: 10びょうごとに ぼうぎょと とくぼうが 1だん ずつ あがる。 それぞれ 3だんまで。
Quickening:
  name: もうひとおし
  description: てもちの のうりょくが あがる たびに、 あがる ランクが 1だん おおきくなる。
Withering:
  name: おとろえ
  description: あいての のうりょくを さげる たびに、 さがる ランクが 1だん ふかくなる。
EvenKeel:
  name: つりあい
  description: フィールドの のうりょくランクの へんかは、 じぶんの ぶんも ふくめて 0.5ばいに かぞえられる。
Regalia:
  name: レガリア
  description: 10びょうごとに てもち ぜんいんの ぼうぎょが 1だん あがる。 3だんまで。
Ringback:
  name: かえしわざ
  description: ねらわれた たんたいの わざの 20%は、 だした あいてに はねかえされる。
Boiler:
  name: ボイラー
  description: あめの とき ほのおタイプ、 はれの とき みずタイプの わざの いりょくが 1.15ばいに なる。
PrideCall:
  name: ししのよびごえ
  description: フィールドに でると、 あいてに おたけびを つかう。
CalmingScent:
  name: やすらぎのかおり
  description: もちものを つかいきると、 あいての がわの すばやさが 1だん さがる。
ShadeBond:
  name: かげのきずな
  description: いる あいだ、 じぶんを ふくむ てもちの じゅんびと ためる じかんが 0.85ばいに なる。 まちじかんは かわらない。
