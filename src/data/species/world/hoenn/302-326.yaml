Roselia:
  Roselia:
    types: [Grass, Poison]
    egg-groups: [Fairy, Grass]
    biomes: [Grassland, Shrubland]
    active: any
    evolves-from: Budew
    evolves-into:
      - species: Roserade
        method: [UsedItem]
        item: ShinyStone
  # What a Roselia was and what it becomes: a Budew closes its bud in
  # the cold, and a Roserade hides a whip of thorns behind each bouquet
  Budew:
    types: [Grass, Poison]
    egg-groups: [NoEggsDiscovered]
    biomes: [Grassland, Shrubland]
    active: any
    evolves-into:
      - species: Roselia
        method: [Friendship, TimeOfDay]
        time: [Morning, Day]
  Roserade:
    types: [Grass, Poison]
    egg-groups: [Fairy, Grass]
    biomes: [Grassland, Shrubland]
    active: any
    evolves-from: Roselia
