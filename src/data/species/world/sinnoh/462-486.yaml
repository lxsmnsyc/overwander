    biomes: [Woodland, TemperateForest]
    active: any
    base-form: false
    evolves-from: Rotom
    evolves-into:
      - species: Rotom
        method: [UsedItem]
        item: RotomCatalog
      - species: RotomHeat
        method: [UsedItem]
        item: RotomCatalog
      - species: RotomFrost
        method: [UsedItem]
        item: RotomCatalog
      - species: RotomFan
        method: [UsedItem]
        item: RotomCatalog
      - species: RotomMow
        method: [UsedItem]
        item: RotomCatalog
  RotomFrost:
