  description: あいての ぼうぎょを 2だん さげる。 おとの わざ。
Acid:
  name: ようかいえき
  description: あいて ぜんいんに あたる。 10%の かくりつで あいての とくぼうを 1だん さげる。
RockSlide:
  name: いわなだれ
  description: あいて ぜんいんに あたる。 30%の かくりつで ひるませる。
ThunderShock:
  name: でんきショック
  description: 10%の かくりつで まひに する。
ThunderWave:
  name: でんじは
  description: あいてを まひに する。
Thunder:
