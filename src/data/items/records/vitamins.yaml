# Drawn on the medicine sheet, which is what a vitamin is: something a
# pokemon swallows for what it does to it

# What the market charges. Dear on purpose: it is three wings and a
# third in one bottle, and the only training in the game that gold
# alone can buy
HPUp:
  type: Training
  icon: medicine/hp-up
  flags: [Consumable, Usable, Marketable]
  buy: 5000
  sell: 2500

