# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
PokeBall:
  name: モンスターボール
  description: ふつうの ボール。 ほじょも ジャマも ない。
GreatBall:
  name: スーパーボール
  description: ふつうの ボールより 1.5ばい つかまえやすい。
UltraBall:
  name: ハイパーボール
  description: ふつうの ボールの 2ばい つかまえやすい。
MasterBall:
  name: マスターボール
  description: かならず つかまえられる。
PremierBall:
  name: プレミアボール
  description: ふつうの ボールと おなじ つかまえやすさ。 きねんの しなもの。
HealBall:
  name: ヒールボール
  description: ふつうの ボールと おなじ つかまえやすさ。 あいぼうの HPが ぜんかいふくし、 じょうたいいじょうも なおる。
LuxuryBall:
  name: ゴージャスボール
  description: ふつうの ボールと おなじ つかまえやすさ。 なかの ポケモンは、 ずっと 2ばいの はやさで なついてくる。
NetBall:
  name: ネットボール
  description: むしタイプと みずタイプに 3.5ばい。
DiveBall:
  name: ダイブボール
  description: みずの うえで 3.5ばい。
NestBall:
  name: ネストボール
  description: レベルの ひくい あいてに さいだい 4ばい。 レベルが あがるほど よわまる。
RepeatBall:
  name: リピートボール
  description: すでに もっている しゅるいの ポケモンに 3.5ばい。
TimerBall:
  name: タイマーボール
  description: この であいで なげたり えさを あげたり する たびに 0.3ばいほど ふえ、 さいだい 4ばい。
QuickBall:
  name: クイックボール
  description: この であいで まだ なにも なげても えさを あげても いないとき 5ばい。 そのあとは ふつう。
LevelBall:
  name: レベルボール
  description: いっしょに あるく あいぼうより レベルが ずっと ひくい あいてに さいだい 8ばい。
LureBall:
  name: ルアーボール
  description: さざなみの たつ みずから おどろいて とびだした あいてに 5ばい。
MoonBall:
  name: ムーンボール
  description: つきのいしで しんかする ながれの ポケモンに 4ばい。
FriendBall:
  name: フレンドボール
  description: ふつうの ボールと おなじ つかまえやすさ。 なかの ポケモンの なつきどは 200から はじまる。 ただし ダークは のぞく。
LoveBall:
  name: ラブラブボール
  description: あいぼうと おなじ しゅるいで せいべつが はんたいの ポケモンに 8ばい。
HeavyBall:
  name: ヘビーボール
  description: おもさで さいだい 4ばい。 100kgで 2ばいから。
FastBall:
  name: スピードボール
  description: しゅぞくちの すばやさが 100いじょうの ポケモンに 4ばい。
BeastBall:
  name: ウルトラボール
  description: ウルトラビーストに 5ばい。 ほかの あいてには 0.1ばい。
DuskBall:
  name: ダークボール
  description: ゆうがたと よるに 3ばい。
