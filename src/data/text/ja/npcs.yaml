# What each of the people is called, what they are for in a line, what
# they open with when walked up to, and, for those who serve once a
# window, what they say once that visit is spent

Breeder:
  name: ブリーダー
  description: あいしょうの いい ポケモンを 2ひき かけあわせて、 タマゴを つくる。 りょうきんが かかる。
  quote: なかの いい ふたりなら、 それで いい。 ひきあわせるのは わたし、 あるくのは きみだ。
  spent: その ペアは もう やくめを はたした。 つぎに ここを とおる ときに、 べつの ペアを つれておいで。
DaycareLady:
  name: そだてやの おばあさん
  description: タマゴを あたためて、 うまれるまでに あるく ぶんを はんぶんに する。 りょうきんが かかる。
  quote: タマゴを ちょっと あずけて ごらん、 あなた。 のこりの はんぶんが、 あっと いう まに なくなるよ。
  spent: あなたの タマゴは もう あたためたよ。 つぎに わたしが ここへ くる ときに おいで。
NurseJoy:
  name: ジョーイさん
  description: てもちを むりょうで かいふくする。 なんどでも たのめる。
  quote: あら、 みんな あずけて ちょうだい。 おだいは いりません。 カウンターは いつでも あいていますよ。
Groomer:
  name: トリマー
  description: ポケモンを ブラッシングして、 トレーナーを もっと すきに させる。 りょうきんが かかる。
  quote: ひとブラシ かければ、 きみが だいすきに なるよ。 ダークポケモン？ あれは わたしの てに おえない。
  spent: ブラッシングは 1かいの ほうもんで ひとつ、 それが わたしの きまりさ。 また こんど おいで。
Vendor:
  name: あきんど
  description: いちばの はこから しなものを うり、 たいていの ものを かいとる。
  quote: さあさあ、 よってらっしゃい。 はこの なかの ものを うって、 たいていの ものは かいとるよ。 おかねが あれば ね。
MoveReminder:
  name: わざおもいだし
  description: わすれた レベルアップわざを おもいださせる。 ハートのウロコが ひつよう。
  quote: わすれた？ はっ。 ほんとうに わすれる ことなんて ない。 ハートのウロコ 1こで しょうめい してやろう。
RocketGrunt:
  name: ロケットだんの したっぱ
  description: ダークポケモンで とおせんぼうし、 まけると しょうきんを はらう。
  quote: ここは とおさないぜ、 ぼうず。 おれの 3ひきが そう いってる。
FossilManiac:
  name: かせきマニア
  description: もっている ふたつの かせきの うち、 ひとつを うる。
  quote: ぜんぶ じぶんで ほりだしたんだ！ いい いわが ふたつ。 ひとつなら わけてやる。 ひとつだけ だぞ！
  spent: わけてやれるのは あれだけだ。 つぎは もっと ほりだしておく。
FossilScientist:
  name: かせきの けんきゅういん
  description: かせきを ポケモンに ふっかつさせる。 むりょう。
  quote: かせき？ すばらしい！ さあ、 わたしなさい。 なかで もう じゅうぶん ながく まっていたはずだ。
MoveTutor:
  name: わざおしえ
  description: レベルアップでは おぼえない わざを おしえる。 ハートのウロコが ひつよう。
  quote: わざには、 おそわる だけで おぼえる ものも ある。 ハートのウロコ 1こで レッスンしよう。
Trainer:
  name: トレーナー
  description: せいせいどうどうの しょうぶを もちかけ、 かった ほうが しょうきんを うけとる。
  quote: つよそう だな。 ためして みろ。 この あたりの えりすぐり 3ひきだ、 かった ほうが しょうきんを とる。
Chef:
  name: コック
  description: のみものと おやつを うり、 たいていの ものを かいとる。
  quote: コンロから ほかほか、 れいぞうこから ひやひや。 ポケモンに もたせれば、 ごちそうだ。
Channeler:
  name: きとうし
  description: ポケモンの とくせいを もう ひとつ よびだす。 ハートのウロコが ひつよう。
  quote: この こには、 ほんにんも しらない ちからが ある。 ハートのウロコ 1こで よびだしましょう。 なにが こたえるかは、 わたしには えらべません。
  spent: よびだせる ものは よびだしました。 のこりは また ここを とおる ときまで とっておきましょう。
Kurt:
  name: ガンテツ
  description: ぼんぐりを けずって ボールに する。 むりょう。
  quote: ぼんぐりか？ よこしな。 ひとつに つき ボール ひとつ、 どの ボールかは いろが きめる。 ただで いい、 えらんだのは おまえさんだ。
Geologist:
  name: ちしつがくしゃ
  description: いしと ほうせきを うり、 たいていの ものを かいとる。
  quote: どれも わたしが つるはしで やまの しゃめんから ほりだした ものだ。 いし、 ほうせき、 なんでも ある。 すきな ものを えらびたまえ。
DojoMaster:
  name: どうじょうの しはん
  description: ポケモンが わざを もう ひとつ もてるように きたえる。 ハートのウロコが ひつよう。
  quote: ポケモンは じぶんが おもうより もっと もてる ものだ。 ハートのウロコ 1こで わざの わくを もう ひとつ あけてやろう。
Trader:
  name: こうかんや
  description: とおくの ポケモン 6ひきの うち 1ひきを、 おなじ しゅるいの ポケモンと こうかんする。
  quote: とおくから つれてきた ポケモンたちだ。 どれでも きみの ポケモンと こうかんするよ、 おなじ しゅるいなら ね。
  spent: こうかんは 1かいの たちよりで ひとつ。 つぎは あたらしい かおぶれを つれてくるよ。
HyperTrainer:
  name: ハイパートレーナー
  description: ポケモンの こたいちを ひとつ、 さいだいまで きたえる。 ポイントごとに おかねが かかる。
  quote: いいと さいこうは ちがう。 ポケモンを みせて こたいちを えらべ、 てっぺんまで きたえてやる。 たかく つくぞ。
  spent: 1かいの ほうもんで 1ひきだ。 つぎの ポケモンは、 また ここに もどってきた ときに つれてこい。
