Clamperl:
  types: [Water]
  egg-groups: [Water1]
  habitat: Water
  biomes: [CoralReef, Ocean]
  active: any
  # The shell opens one of two ways, and what it was holding
  # decides which. Neither branch is a level, so a Clamperl left
  # alone stays one
  evolves-into:
    - species: Huntail
      method: [HeldItem, Trade]
      item: DeepSeaTooth
    - species: Gorebyss
      method: [HeldItem, Trade]
      item: DeepSeaScale
Huntail:
  types: [Water]
  egg-groups: [Water1]
  habitat: Water
  biomes: [DeepOcean]
  active: any
  evolves-from: Clamperl
Gorebyss:
  types: [Water]
  egg-groups: [Water1]
  habitat: Water
  biomes: [DeepOcean]
  active: any
  evolves-from: Clamperl
