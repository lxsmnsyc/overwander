# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
GyroBall:
  name: Giro Bola
  description: Cuanto más lento es el usuario frente al objetivo, más fuerte golpea, hasta 150 de potencia.
HealingWish:
  name: Deseo Cura
  description: El usuario se debilita, y un aliado del campo recupera todos sus PS y se cura.
Brine:
  name: Salmuera
  description: x2 de potencia contra un objetivo con menos de 1/2 de PS.
NaturalGift:
  name: Don Natural
  description: Lanza la baya del usuario con 80 de potencia, del tipo que la baya resiste o Normal. La baya se gasta.
Feint:
  name: Amago
  description: Golpea atravesando Protección y Detección, y rompe la guardia que atravesó.
