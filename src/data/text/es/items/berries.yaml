templates:
  bait: 'Se da a un Pokémon salvaje: x{bonus} a la probabilidad de captura.'
  nanabHalve: 'Se da a un Pokémon salvaje: x{bonus} a la probabilidad de captura, y reduce a la mitad su probabilidad de huir de la siguiente Ball.'
  nanabStop: 'Se da a un Pokémon salvaje: x{bonus} a la probabilidad de captura, e impide que huya de la siguiente Ball.'
  pinapOne: 'Se da a un Pokémon salvaje: x{bonus} a la probabilidad de captura. Si lo capturas, recibes una ración extra de su caramelo.'
  pinap: 'Se da a un Pokémon salvaje: x{bonus} a la probabilidad de captura. Si lo capturas, recibes {helpings} raciones extra de su caramelo.'
  resist: Reduce a la mitad un golpe supereficaz de tipo {type}.
  resistNormal: Reduce a la mitad el primer golpe de tipo {type} que reciba el portador.
  pinch: '{stat} +1 con 1/4 de PS.'
  nature: Restaura 1/3 de los PS máximos con 1/2 de PS. Si la naturaleza de un Pokémon reduce {stat}, lo confunde.
  effort: Quita 10 de esfuerzo en {stat} al Pokémon al que se da.
