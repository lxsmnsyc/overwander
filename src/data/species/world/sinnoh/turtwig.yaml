# The grass starter of Sinnoh, a shell that grows into a continent:
# the tree on a Torterra's back is why the line ends up part Ground
Turtwig:
  types: [Grass]
  egg-groups: [Monster, Grass]
  biomes: [TemperateRainforest, MontaneForest, Woodland]
  active: [Morning, Day]
  evolves-into:
    - species: Grotle
      method: [Level]
      level: 18
Grotle:
  types: [Grass]
  egg-groups: [Monster, Grass]
  biomes: [TemperateRainforest, MontaneForest, Woodland]
  active: [Morning, Day]
  evolves-from: Turtwig
  evolves-into:
    - species: Torterra
      method: [Level]
      level: 32
Torterra:
  types: [Grass, Ground]
  egg-groups: [Monster, Grass]
  biomes: [TemperateRainforest, MontaneForest, Woodland]
  active: [Morning, Day]
  evolves-from: Grotle
