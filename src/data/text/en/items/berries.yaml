templates:
  bait: Fed to a wild pokemon for {bonus}x catch odds.
  nanabHalve: Fed to a wild pokemon for {bonus}x catch odds, and halves its chance of bolting from the next ball.
  nanabStop: Fed to a wild pokemon for {bonus}x catch odds, and stops it bolting from the next ball.
  pinapOne: Fed to a wild pokemon for {bonus}x catch odds. Catching it pays one extra helping of its candy.
  pinap: Fed to a wild pokemon for {bonus}x catch odds. Catching it pays {helpings} extra helpings of its candy.
  resist: Halves one {type} blow that was landing hard.
  resistNormal: Halves the first {type} blow to land on its holder.
  pinch: +1 {stat} at 1/4 HP.
  nature: Restores 1/3 of max HP at 1/2 HP. Confuses a pokemon whose nature lowers {stat}.
  effort: Takes 10 {stat} effort off a pokemon it is fed to.
