name: Test

# The type-check, the linter and the unit suite. The database and
# end-to-end suites are left out, since both need the local database and
# have to run one at a time.
#
# Off for now: run by hand from the Actions tab. Put `push` (on main) and
# `pull_request` back to turn it on again.
on:
  workflow_dispatch:

# A branch pushed twice only needs its newest commit checked
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # Warnings are the repo's own backlog, so only errors fail this
      - name: Lint
        run: pnpm exec oxlint src test

      - name: Unit tests
        run: pnpm test
