# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
FlareBoost:
  name: Ímpetu Ardiente
  description: x1,5 de Ataque Esp. mientras está quemado.
Klutz:
  name: Zoquete
  description: Lo que lleva equipado no sirve de nada.
Merciless:
  name: Ensañamiento
  description: Sus movimientos son siempre críticos contra un objetivo envenenado, salvo que una armadura lo impida.
FriendGuard:
  name: Compiescolta
  description: Mientras está en el campo, sus aliados reciben 0,75 veces el daño de cualquier ataque.
SlowStart:
  name: Inicio Lento
  description: Su Ataque y su Velocidad se reducen a la mitad durante los 8 primeros segundos en el campo.
Multitype:
  name: Multitipo
  description: Adopta el tipo de la Tabla que lleva.
CheekPouch:
  name: Carrillo
  description: Al comer una baya, también recupera 1/3 de sus PS, sea cual sea el efecto de la baya.
AromaVeil:
  name: Velo Aroma
  description: Ni él ni sus aliados pueden recibir Mofa, Tormento, Otra Vez, Encanto ni Anticura.
Heatproof:
  name: Ignífugo
  description: Los movimientos de tipo Fuego le hacen la mitad de daño, y las quemaduras le quitan la mitad.
