# Las palabras con que se forma el nombre de un pueblo. El orden y la
# cantidad son los del inglés, así que un pueblo es el mismo en todos los
# idiomas y solo cambian las palabras. Se unen como «Ciudad Nueva Concha
# del Risco, Marca Ceniza»: título, marca, cabeza, cola y comarca; los adjetivos
# concuerdan con el título

