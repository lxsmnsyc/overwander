Magmar:
  Magmar:
    types: [Fire]
    egg-groups: [HumanLike]
    biomes: [Mountain, Desert, Volcano]
    active: any
    evolves-from: Magby
    evolves-into:
      - species: Magmortar
        method: [HeldItem, Trade]
        item: Magmarizer
  Magby:
    types: [Fire]
    # A baby lays no egg of its own: the stage above it does
    egg-groups: [NoEggsDiscovered]
    biomes: [Mountain, Desert]
    active: any
    evolves-into:
      - species: Magmar
        method: [Level]
        level: 30
  # A Magmar with its arms rebuilt as cannons: a Magmortar fires a ball
  # of its own fire and steps back from the heat
  Magmortar:
    types: [Fire]
    egg-groups: [HumanLike]
    biomes: [Volcano, Badlands, Desert]
    active: any
    evolves-from: Magmar
