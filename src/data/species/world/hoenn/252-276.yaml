Wurmple:
  Wurmple:
    types: [Bug]
    egg-groups: [Bug]
    active: any
    # The mainline reads a hidden number nobody is shown; here the
    # split follows what it was born as, which the catch sheet says
    evolves-into:
      - species: Silcoon
        method: [Level, Gender]
        level: 7
        gender: Male
      - species: Cascoon
        method: [Level, Gender]
        level: 7
        gender: Female
  Silcoon:
    types: [Bug]
    egg-groups: [Bug]
    active: [Morning, Day]
    evolves-from: Wurmple
    evolves-into:
      - species: Beautifly
        method: [Level]
        level: 10
  Beautifly:
    types: [Bug, Flying]
    egg-groups: [Bug]
    biomes: [Woodland, TemperateForest]
    active: [Morning, Day]
    evolves-from: Silcoon
  Cascoon:
    types: [Bug]
    egg-groups: [Bug]
    active: [Evening, Night]
    evolves-from: Wurmple
    evolves-into:
      - species: Dustox
        method: [Level]
        level: 10
  Dustox:
    types: [Bug, Poison]
    egg-groups: [Bug]
    biomes: [Woodland, TemperateForest]
    active: [Evening, Night]
    evolves-from: Cascoon
