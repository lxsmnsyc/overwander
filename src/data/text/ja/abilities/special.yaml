# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
Boss:
  description: HPが 110ばい、 ほかの のうりょくが 2ばいに なるが、 わざの じゅんびが 2ばい おそく おわる。 あいて 1ぴきを ねらう わざは あいて ぜんいんに あたり、 わざの じゅんびは ひんしに ならない かぎり とまらない。 こうげき いがいの ダメージや HPの わりあいで うける ダメージは 1かいに 200までしか うけず、 HPの かいふくは 1びょうに 1,000までしか できない。
Shadow:
  description: こうげきと とくこうが 1.25ばい、 ぼうぎょと とくぼうが 0.75ばいに なる。
Totem:
  description: バトルの はじめに オーラで のうりょくが あがり、 HPが 1/2に なると おなじ しんかの ながれの なかまを よぶ。 よばれた なかまは ぬしが たおれると にげる。
TotemAlly:
  description: HPが 50ばい、 ほかの のうりょくが 1.5ばいに なる。 よんだ ぬしが たおれると にげる。
Alpha:
  description: HPが 80ばいに なり、 ほかの のうりょくは ボスの かわりに 1.5ばいに なる。 HPが 3/4、 1/2、 1/4に なる たびに、 なかまを 6ぴきまで よびもどし、 まだ いる なかまの HPを かいふくする。 なかまは オヤブンが たおれると にげる。
Noble:
  description: ひんしに ならない。 HPは あらぶりで、 すべて しずめられると おちついて さっていく。 3/4、 1/2、 1/4に なる たびに 4びょうの あいだ よろめいて、 うごけず こうげきの ダメージを 1.5ばい うける。 そのあいだ 10びょうごとに 1.8びょうの じゅんびの あと、 あいて ぜんいんに いちげきを はなつ。
Purified:
  description: ダークから リライブされた しるし。 バトルでは なんの こうかも ない。 あいぼうに している あいだ、 やせいの ダークポケモンの つかまえやすさが 1.5ばいに なる。
