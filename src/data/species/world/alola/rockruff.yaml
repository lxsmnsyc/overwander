# The puppy and the three wolves it can grow into. Which one is the
# hour it grew up at: the day makes a Midday, the night a Midnight and
# the evening between them a Dusk
Rockruff:
  types: [Rock]
  egg-groups: [Field]
  biomes: [Steppe, Grassland, Badlands]
  active: any
  evolves-into:
    - species: Lycanroc
      method: [Level, TimeOfDay]
      level: 25
      time: [Morning, Day]
    - species: LycanrocMidnight
      method: [Level, TimeOfDay]
      level: 25
      time: [Night]
    - species: LycanrocDusk
      method: [Level, TimeOfDay]
      level: 25
      time: [Evening]
Lycanroc:
  types: [Rock]
  egg-groups: [Field]
  biomes: [Steppe, Grassland, Badlands]
  active: [Morning, Day]
  evolves-from: Rockruff
LycanrocMidnight:
  types: [Rock]
  egg-groups: [Field]
  biomes: [Steppe, Grassland, Badlands]
  active: [Night]
  base-form: false
  evolves-from: Rockruff
LycanrocDusk:
  types: [Rock]
  egg-groups: [Field]
  biomes: [Steppe, Grassland, Badlands]
  active: [Evening]
  base-form: false
  evolves-from: Rockruff
