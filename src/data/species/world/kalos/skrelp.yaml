# The weed beds it hides in, both stages alike

# The kelp that is not kelp. It lies in the weed until something
# comes close enough, and grows into a dragon that never has to move
Skrelp:
  types: [Poison, Water]
  egg-groups: [Water1, Dragon]
  habitat: Water
  biomes: [KelpForest, CoralReef]
  active: [Morning, Day]
  evolves-into:
    - species: Dragalge
      method: [Level]
      level: 48
Dragalge:
  types: [Poison, Dragon]
  egg-groups: [Water1, Dragon]
  habitat: Water
  biomes: [KelpForest, CoralReef]
  active: [Morning, Day]
  evolves-from: Skrelp
