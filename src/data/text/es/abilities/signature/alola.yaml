# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
QuillAudience:
  name: Público de la Pluma
  description: Su Velocidad cuenta x1,1 por cada rival en pie, hasta 4 rivales.
HeelAudience:
  name: Público del Villano
  description: Su Ataque cuenta x1,1 por cada rival en pie, hasta 4 rivales.
AriaAudience:
  name: Público del Aria
  description: Su Ataque Esp. cuenta x1,1 por cada aliado en pie, hasta 4 aliados.
Drumroll:
  name: Redoble
  description: Sus movimientos de varios golpes dan 1 golpe más.
ScoreToSettle:
  name: Cuentas Pendientes
  description: Sus movimientos tienen x1,3 de potencia contra el rival que le golpeó por última vez.
TrickleCharge:
  name: Carga Gradual
  description: Su Ataque Esp. sube un 10 % por cada movimiento de tipo Eléctrico que acierte cualquiera, de cualquier bando, hasta x1,5.
ReboundPunch:
  name: Rebote de Puño
  description: Cuando uno de sus movimientos de puñetazo falla o es bloqueado, el siguiente tiene x1,5 de potencia.
DizzyTwirl:
  name: Giro Mareado
  description: Mientras está confuso nunca se hiere a sí mismo, y sus movimientos tienen x1,3 de potencia.
HoneyShare:
  name: Miel Compartida
  description: Mientras está en el campo, las bayas que comen sus aliados curan x1,5 y suben una estadística 1 nivel más.
Provoke:
  name: Provocación
  description: Un rival al que golpea debe dirigirle a él su siguiente movimiento de un solo objetivo.
Regroup:
  name: Reagrupamiento
  description: Mientras nada solo, restaura 1/8 de sus PS cada vez que actúa, para que el banco pueda volver a reunirse.
HeavyHooves:
  name: Cascos Pesados
  description: Sus movimientos físicos tienen un 1 % más de potencia por cada 20 kg que pesa, hasta x1,4.
BubbleWard:
  name: Burbuja Protectora
  description: Mientras está en el campo, los movimientos de tipo Fuego hacen x0,75 de daño a sus aliados y no pueden quemarlos.
OrchidGuise:
  name: Disfraz de Orquídea
  description: Los rivales no pueden dirigirle movimientos de un solo objetivo hasta que acierte su primer ataque, que tiene x1,3 de potencia.
TropStride:
  name: Paso Tropical
  description: Sus movimientos de patada tienen x1,3 de potencia.
DrowsyGlow:
  name: Resplandor Soñoliento
  description: Cada movimiento con daño que acierta usa Bostezo sobre el objetivo con un 20 % de probabilidad.
LeiGift:
  name: Regalo de Guirnalda
  description: Al entrar al campo, regala una guirnalda a su aliado más herido, que restaura 1/16 de sus PS cada vez que actúa durante el combate.
SagesCall:
  name: Llamada del Sabio
  description: Cada vez que actúa, el aliado con más Ataque o Ataque Esp. prepara su siguiente movimiento un 25 % más rápido.
RushPass:
  name: Pase Rápido
  description: Sus movimientos tienen x1,3 de potencia cuando se lanzan más rápido de lo que se lanzarían por sí solos.
ToxicDome:
  name: Cúpula Tóxica
  description: El primer golpe que recibe tras cada entrada al campo le hace x0,5 de daño, y usa Tóxico sobre el atacante.
FumeFlare:
  name: Humo Ponzoñoso
  description: Sus movimientos de tipo Fuego envenenan al objetivo con un 20 % de probabilidad.
FondCrush:
  name: Flechazo
  description: Sus movimientos tienen x1,3 de potencia contra un objetivo enamorado.
OpeningSlash:
  name: Primer Tajo
  description: El primer movimiento que acierta tras cada entrada al campo tiene x1,5 de potencia.
CastleDrain:
  name: Drenaje del Castillo
  description: Quien le acierta un movimiento de contacto pierde 1/8 de sus PS, y él los restaura.
TossedBack:
  name: Lanzado de Vuelta
  description: El primer golpe que lo debilitaría lo deja con 1 PS y lo saca del campo para dejar su sitio al aliado más fuerte. Una vez por combate.
Starfall:
  name: Estrella Fugaz
  description: El primer movimiento que lanza tras cada entrada al campo se prepara un 50 % más rápido.
ChargedSpines:
  name: Púas Cargadas
  description: Un movimiento de contacto que le acierta lo carga, y su siguiente movimiento de tipo Eléctrico que acierte tiene x1,5 de potencia.
NapTime:
  name: Siesta
  description: Cada 3 veces que actúa, restaura 1/4 de sus PS.
BlastShell:
  name: Caparazón Explosivo
  description: Un movimiento físico que le acierta a él o a un aliado lo carga, y su siguiente movimiento de tipo Fuego que acierte tiene x1,5 de potencia.
EldersIre:
  name: Ira del Anciano
  description: Un movimiento especial que le acierta a él o a un aliado lo carga, y su siguiente movimiento de tipo Dragón que acierte tiene x1,5 de potencia.
GrudgeShroud:
  name: Mortaja Rencorosa
  description: La primera vez que cada rival le acierta un movimiento, usa Rencor sobre él.
MemoryEcho:
  name: Eco de Recuerdos
  description: Sus movimientos supereficaces tienen x1,2 de potencia.
PsychicGnash:
  name: Rechinar Psíquico
  description: Sus movimientos de mordisco confunden al objetivo con un 20 % de probabilidad.
GhostShip:
  name: Barco Fantasma
  description: Con lluvia, sus movimientos de tipo Fantasma y Planta tienen x1,3 de potencia.
WarClangor:
  name: Estruendo de Guerra
  description: Cada movimiento de sonido que acierta le sube 1 nivel la Defensa, hasta 3 niveles.
StormBlessing:
  name: Bendición de la Tormenta
  description: Mientras hay Campo Eléctrico, la Velocidad de su equipo cuenta x1,25.
MindBlessing:
  name: Bendición de la Mente
  description: Mientras hay Campo Psíquico, el Ataque Esp. de su equipo cuenta x1,25.
WildBlessing:
  name: Bendición Silvestre
  description: Mientras hay Campo de Hierba, el Ataque de su equipo cuenta x1,25.
MistBlessing:
  name: Bendición de la Niebla
  description: Mientras hay Campo de Niebla, la Defensa Esp. de su equipo cuenta x1,25.
Zenith:
  name: Apogeo
  description: Sus movimientos con daño tienen más potencia cuantos más PS tiene, hasta x1,3, y x1 cuando casi no le quedan.
Nadir:
  name: Perigeo
  description: Sus movimientos con daño tienen más potencia cuantos menos PS tiene, hasta x1,3, y x1 con los PS al máximo.
Earthless:
  name: Sin Suelo
  description: Los movimientos de tipo Tierra le hacen un daño neutro en lugar de supereficaz.
Windbreak:
  name: Cortavientos
  description: Los movimientos de tipo Volador le hacen un daño neutro en lugar de supereficaz.
GaleWard:
  name: Guarda del Vendaval
  description: Los movimientos de tipo Volador le hacen un daño neutro en lugar de supereficaz.
Unearthed:
  name: Desenterrado
  description: Los movimientos de tipo Tierra le hacen un daño neutro en lugar de supereficaz.
HeatShield:
  name: Escudo Térmico
  description: Los movimientos de tipo Fuego le hacen un daño neutro en lugar de supereficaz.
Fireproof:
  name: A Prueba de Fuego
  description: Los movimientos de tipo Fuego le hacen un daño neutro en lugar de supereficaz.
Unenchanted:
  name: Sin Hechizo
  description: Los movimientos de tipo Hada le hacen un daño neutro en lugar de supereficaz.
ClosedMind:
  name: Mente Cerrada
  description: Los movimientos de tipo Psíquico le hacen un daño neutro en lugar de supereficaz.
DeepFooting:
  name: Cimiento Hondo
  description: Los movimientos de tipo Tierra le hacen un daño neutro en lugar de supereficaz.
DryFuse:
  name: Mecha Seca
  description: Los movimientos de tipo Agua le hacen un daño neutro en lugar de supereficaz.
SoulRelay:
  name: Herencia de Almas
  description: Cuando un aliado se debilita, hereda todos los niveles de estadística que tenía subidos.
UmbralStrike:
  name: Estocada Sombría
  description: Sus movimientos tienen x1,25 de potencia contra un objetivo con alguna estadística subida.
IonField:
  name: Campo Iónico
  description: Mientras está en el campo, los movimientos de tipo Normal de los rivales pasan a ser de tipo Eléctrico.
MetalEater:
  name: Comemetales
  description: Los movimientos de tipo Acero le restauran 1/4 de sus PS máximos en lugar de dañarle.
