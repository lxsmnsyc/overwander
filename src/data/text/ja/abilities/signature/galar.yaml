# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
DrumCue:
  name: ドラムのあいず
  description: あてた くさタイプの わざごとに、 こうげきか とくこうが いちばん たかい みかたに てだすけを つかう。 8びょうに 1かいまで。
KickCue:
  name: キックのあいず
  description: あてた ほのおタイプの わざごとに、 じゅんびちゅうの みかたに おさきにどうぞを つかう。 8びょうに 1かいまで。
ScopeCue:
  name: スコープのあいず
  description: あてた みずタイプの わざごとに、 その あいてに スポットライトを つかい、 てもちの たんたいの わざを そこに ひきつける。 8びょうに 1かいまで。
PantryRaid:
  name: つまみぐい
  description: いる あいだ、 あいてが たべる はずの きのみは かわりに この ポケモンの ほおに はいり、 きのみと おなじ かいふくや じょうたいいじょうの かいふくを する。
SteelEscort:
  name: はがねのつきそい
  description: あいてが こちらの がわ ぜんたいに あたる わざの じゅんびを はじめると、 ワイドガードを つかう。 10びょうに 1かいまで。
EarlyWarning:
  name: はやめのけいほう
  description: あいてが みかたに たんたいの わざの じゅんびを はじめると、 その みかたが みきりを つかう。 10びょうに 1かいまで。
Fence:
  name: ぬすみのうけわたし
  description: ぬすんだ もちものは、 てが あいている HPが いちばん すくない みかたに わたり、 じぶんの ては あいたままに なる。
CottonCradle:
  name: わたのゆりかご
  description: いる あいだ、 てもちが やどりぎのタネ、 ねをはる、 グラスフィールドで かいふくする りょうが 1.5ばいに なる。
Shorn:
  name: こげたようもう
  description: はじめて うける ほのおタイプの わざで けが やけおちて、 やけどが なおり、 こうそくいどうを つかう。
ShellSnap:
  name: こうらわり
  description: かみつく わざは、 あいての がわの リフレクター、 ひかりのかべ、 オーロラベールを かわらわりと おなじように こわす。
Zoomies:
  name: かけまわり
  description: すばやさが あがる たびに、 じぶんに じゅうでんを つかう。
SharedHarvest:
  name: みのりのわかちあい
  description: きのみを たべると、 いちばん きずついた みかたにも その きのみの かいふくや じょうたいいじょうの かいふく、 のうりょくの あがりが おなじように あたえられる。
CoilBurrow:
  name: とぐろのすあな
  description: すなあらしの あいだ、 じめんタイプの わざは あいて ぜんいんに あたる。
ThroatPouch:
  name: のどぶくろ
  description: あてた みずタイプの わざごとに、 じぶんに たくわえるを つかう。
Spearhead:
  name: やりさき
  description: あいてが この ポケモンに むけた わざの じゅんびを はじめると、 その あいてに アクアジェットを つかう。 6びょうに 1かいまで。
VenomCharge:
  name: どくでんち
  description: あいてが どくで HPを へらす たびに、 じぶんに じゅうでんを つかう。 6びょうに 1かいまで。
CinderCoils:
  name: ひだねのとぐろ
  description: あてた ほのおタイプの わざごとに、 あいての もっている きのみを やきつくす。
ArmLock:
  name: うでがらみ
  description: ちょくせつこうげきの わざを あてると、 まだ だれも とらえていなければ あいてを たこがために する。
LiveSpines:
  name: ほうでんのとげ
  description: ちょくせつこうげきの わざを あててきた あいてに、 でんきショックで はんげきする。
LastPour:
  name: さいごのいっぱい
  description: ひんしに なると、 いちばん きずついた みかたに いやしのねがいを つかう。
SilentWrath:
  name: しずかないかり
  description: あいてが じぶんで のうりょくを あげる たびに、 その あいての HPが 1/8 へる。 ぜつぼうのうたげを もつ ポケモンが フィールドに いれば はたらかない。
DespairFeast:
  name: ぜつぼうのうたげ
  description: あいての のうりょくが さがる たびに、 HPが 1/8 かいふくする。 しずかないかりを もつ ポケモンが フィールドに いれば はたらかない。
Sugarcoat:
  name: さとうごろも
  description: みかたに へんかわざを つかう たびに、 その みかたに デコレーションも つかう。
MirrorScales:
  name: かがみのうろこ
  description: うけた わざの ついかこうかは、 やけどや ひるみ、 のうりょくが さがる ものも ふくめて、 かわりに わざを だした あいてに あらわれる。
ChippedIce:
  name: かけたこおり
  description: ぶつりわざを うけると、 てんきが なければ あられを つかう。
RankAndFile:
  name: へいたいのつとめ
  description: へいたいは うけとめる。 はじめの 5かい うける こうげきの ダメージが 0.5ばいに なる。
Attendant:
  name: おせわがかり
  description: みかたが こうかばつぐんの こうげきを うけると、 その みかたに いやしのはどうを つかう。 8びょうに 1かいまで。
HangrySpark:
  name: はらぺこのひばな
  description: あいてが きのみを たべる たびに、 その あいてに ほっぺすりすりを つかう。
Overhang:
  name: かばいだて
  description: あいてが てもちの ポケモンに まとめて あたる わざを だしても、 この ポケモン 1ぴきだけに あたる。
DreepyLaunch:
  name: ドラメシヤのはっしゃ
  description: あてた ドラゴンタイプの わざで ドラメシヤを はっしゃし、 ドラメシヤが ほかの あいてに ドラゴンアローを つかう。 10びょうに 1かいまで。
Solstice:
  name: ソルスティス
  description: 30びょうごとに 6びょうの あいだ、 てもち ぜんいんの わざの いりょくが 1.3ばいに なる。
Boltdrake:
  name: いかずちのりゅう
  description: でんきタイプの わざは、 ドラゴンタイプの わざが こうかばつぐんに なる あいてには ドラゴンタイプの わざとして あたる。
Boltfrost:
  name: いかずちのれいき
  description: でんきタイプの わざは、 こおりタイプの わざが こうかばつぐんに なる あいてには こおりタイプの わざとして あたる。
Gilldrake:
  name: えらのりゅう
  description: みずタイプの わざは、 ドラゴンタイプの わざが こうかばつぐんに なる あいてには ドラゴンタイプの わざとして あたる。
Gillfrost:
  name: えらのれいき
  description: みずタイプの わざは、 こおりタイプの わざが こうかばつぐんに なる あいてには こおりタイプの わざとして あたる。
SwornBlade:
  name: ちかいのつるぎ
  description: じぶんか みかたの HPが はじめて 1/2 みまんに なると、 そうさせた あいてに せいなるつるぎを つかう。 1ぴきに つき 1かいだけ。
SwornShield:
  name: ちかいのたて
  description: あいてが みかたの HPを 1/2 みまんに すると、 このゆびとまれを つかい、 その みかたから あいての わざを そらす。 みかた 1ぴきに つき 1かいだけ。
DarkestDay:
  name: くらやみのいちにち
  description: いる あいだ、 あいて ぜんいんは こうどうする たびに HPが 1/16 へり、 へった ぶんだけ HPが かいふくする。
Kata:
  name: カタのけいこ
  description: 3かい わざを あてる ごとに、 じぶんに ビルドアップを つかう。
VoltSeal:
  name: ボルトのふういん
  description: 8びょうの あいだ、 あたえる ダメージも うける ダメージも 0.5ばいに なる。 そのあと あたえる ダメージが 1.25ばいに なり、 すばやさが 2だん あがる。
WyrmSeal:
  name: りゅうのふういん
  description: 8びょうの あいだ、 あたえる ダメージも うける ダメージも 0.5ばいに なる。 そのあと あたえる ダメージが 1.25ばいに なり、 とくこうが 2だん あがる。
Frostreign:
  name: こおりのしはい
  description: あいてを たおす たびに、 てもち ぜんいんの こうげきが 1だん あがる。
Shadereign:
  name: かげのしはい
  description: あいてを たおす たびに、 てもち ぜんいんの とくこうが 1だん あがる。
Crownreign:
  name: かんむりのしはい
  description: あいてを たおす たびに、 てもち ぜんいんの HPが 1/8 かいふくする。
