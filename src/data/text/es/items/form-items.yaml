# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
AdamantOrb:
  name: Diamansfera
  description: Un Dialga que lo lleve equipado combate en su otra forma, que además aporta Ignorante.
LustrousOrb:
  name: Lustresfera
  description: Un Palkia que lo lleve equipado combate en su otra forma, que además aporta Sombra Trampa.
GriseousOrb:
  name: Griseosfera
  description: Un Giratina que lo lleve equipado combate en su otra forma, que además aporta Levitación.
BlueOrb:
  name: Prisma Azul
  description: Un Kyogre que lo lleve equipado combate en su forma primigenia, que además aporta Mar del Albor.
RedOrb:
  name: Prisma Rojo
  description: Un Groudon que lo lleve equipado combate en su forma primigenia, que además aporta Tierra del Ocaso.
PrisonBottle:
  name: Vasija Castigo
  description: Un Hoopa que lo lleve equipado combate en su forma desatada, con sus aros liberados.
RevealGlass:
  name: Espejo Veraz
  description: Un Tornadus, Thundurus, Landorus o Enamorus que lo lleve equipado combate en su forma Tótem, que además aporta Regeneración, Absorbe Electricidad, Intimidación o Funda.
Gracidea:
  name: Gracídea
  description: Un Shaymin que lo lleve equipado combate en su otra forma, que además aporta Dicha.
Meteorite:
  name: Meteorito
  description: Convierte al Deoxys sobre el que se usa en otra de sus formas. Se gasta con cada cambio.
DnaSplicers:
  name: Punta ADN
  description: Fusiona un dragón con Kyurem, o lo separa de nuevo. Se gasta con cada uso.
RedNectar:
  name: Néctar Rojo
  description: Hace que el Oricorio sobre el que se usa adopte su Estilo Apasionado. Se gasta con cada cambio.
YellowNectar:
  name: Néctar Amarillo
  description: Hace que el Oricorio sobre el que se usa adopte su Estilo Animado. Se gasta con cada cambio.
PinkNectar:
  name: Néctar Rosa
  description: Hace que el Oricorio sobre el que se usa adopte su Estilo Plácido. Se gasta con cada cambio.
PurpleNectar:
  name: Néctar Violeta
  description: Hace que el Oricorio sobre el que se usa adopte su Estilo Refinado. Se gasta con cada cambio.
NSolarizer:
  name: Necrosol
  description: Fusiona un Solgaleo con Necrozma, o lo separa de nuevo. Se gasta con cada uso.
NLunarizer:
  name: Necroluna
  description: Fusiona un Lunala con Necrozma, o lo separa de nuevo. Se gasta con cada uso.
ReinsOfUnity:
  name: Riendas Unión
  description: Monta a un Calyrex sobre un Glastrier o un Spectrier, o lo baja de nuevo. Se gasta con cada uso.
RustedSword:
  name: Espada Oxidada
  description: Un Zacian que lo lleve equipado combate en su forma Espada Suprema, y su Cabeza de Hierro se convierte en Tajo Supremo.
RustedShield:
  name: Escudo Oxidado
  description: Un Zamazenta que lo lleve equipado combate en su forma Escudo Supremo, y su Cabeza de Hierro se convierte en Embate Supremo.
TealMask:
  name: Máscara Turquesa
  description: Devuelve al Ogerpon sobre el que se usa a su Máscara Turquesa, como tipo Planta. Se gasta con cada cambio.
WellspringMask:
  name: Máscara Fuente
  description: Pone al Ogerpon sobre el que se usa en su Máscara Fuente, como tipo Planta y Agua. Se gasta con cada cambio.
HearthflameMask:
  name: Máscara Horno
  description: Pone al Ogerpon sobre el que se usa en su Máscara Horno, como tipo Planta y Fuego. Se gasta con cada cambio.
CornerstoneMask:
  name: Máscara Cimiento
  description: Pone al Ogerpon sobre el que se usa en su Máscara Cimiento, como tipo Planta y Roca. Se gasta con cada cambio.
