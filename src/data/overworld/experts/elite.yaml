# Sinnoh

# Drapion is a Poison and Dark pokemon that Aaron closes with in every
# game he is in, which is Agatha's Golbat again: the type chart does not
# reach it and the man fields it anyway
# Not the Drapion he actually closes with: a signature is of the expert's
# own kind, and the bug he keeps in both his teams is the Heracross
Aaron:
  type: Bug
  honor: AaronDefeated
  sheets: [characters/dppt/aaron]
  signature: Heracross
  pool:
    types: [Bug]
    also: [Drapion]
# The Sudowoodo is hers in Diamond and Pearl, and it is rock rather than
# ground
Bertha:
  type: Ground
  honor: BerthaDefeated
  sheets: [characters/dppt/bertha]
  signature: Hippowdon
  pool:
    types: [Ground]
    also: [Sudowoodo]
# Platinum's ace, from the team that is fire all the way down. Diamond and
