# The rabbit that keeps its ears rolled up until it trusts whoever is
# holding the other end of the walk: it is friendship rather than
# levels that unrolls them
Buneary:
  types: [Normal]
  egg-groups: [Field, HumanLike]
  biomes: [Grassland, Woodland, TemperateForest]
  active: any
  evolves-into:
    - species: Lopunny
      method: [Friendship]
Lopunny:
  types: [Normal]
  egg-groups: [Field, HumanLike]
  biomes: [Grassland, Woodland, TemperateForest]
  active: any
  evolves-from: Buneary
