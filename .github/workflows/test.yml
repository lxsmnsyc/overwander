name: Test

# Every push and every pull request: the type-check, the linter and the
# unit suite. The RLS and end-to-end suites are left out, since both
# need the local Supabase stack and have to run one at a time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A branch pushed twice only needs its newest commit checked
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # Warnings are the repo's own backlog, so only errors fail this
      - name: Lint
        run: pnpm exec oxlint src test

      - name: Unit tests
        run: pnpm test
