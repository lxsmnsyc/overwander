# The powders come in at the same levels all the way up the line

Hoppip:
  types: [Grass, Flying]
  egg-groups: [Fairy, Grass]
  biomes: [Grassland, Woodland, Shrubland]
  active: [Morning, Day]
  evolves-into:
    - species: Skiploom
      method: [Level]
      level: 18
Skiploom:
  types: [Grass, Flying]
  egg-groups: [Fairy, Grass]
  biomes: [Grassland, Woodland, Shrubland]
  active: [Morning, Day]
  evolves-from: Hoppip
  evolves-into:
    - species: Jumpluff
      method: [Level]
      level: 27
Jumpluff:
  types: [Grass, Flying]
  egg-groups: [Fairy, Grass]
  biomes: [Grassland, Woodland, Shrubland]
  active: [Morning, Day]
  evolves-from: Skiploom
