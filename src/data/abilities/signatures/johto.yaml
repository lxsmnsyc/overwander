  Mareep: LiveWire
  Marill: Spillover
  Sudowoodo: FalseWood
  Hoppip: Updraft
  Aipom: Tailthrow
  Sunkern: SunlitCharge
  Yanma: Resonance
  Wooper: ContagiousYawn
  Murkrow: Magpie
  Misdreavus: SharedMisery
  Unown: RuinousScript
  Wobbuffet: Backlash
  Girafarig: Ambidextrous
  Pineco: Shrapnel
  Dunsparce: HiddenDen
  Gligar: SandRider
  Snubbull: Bully
  Qwilfish: LastBarb
  Shuckle: Fermenter
  Heracross: Heave
  Sneasel: SharpClaw
  Teddiursa: SweetPaw
  Slugma: MagmaTrail
