# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
Wrap:
  name: Constricción
  description: 'Atrapa al objetivo: pierde 1/8 de sus PS cada 2 segundos durante 8 segundos y no puede escapar, salvo si es de tipo Fantasma.'
Glare:
  name: Deslumbrar
  description: Paraliza al objetivo.
Screech:
  name: Chirrido
  description: Baja 2 niveles la Defensa del objetivo. Es un sonido.
Acid:
  name: Ácido
  description: Golpea a todos los rivales. 10 % de probabilidad de bajar 1 nivel la Defensa Esp. del objetivo.
RockSlide:
  name: Avalancha
  description: Golpea a todos los rivales. 30 % de probabilidad de amedrentar.
ThunderShock:
  name: Impactrueno
  description: 10 % de probabilidad de paralizar.
ThunderWave:
  name: Onda Trueno
  description: Paraliza al objetivo.
Thunder:
  name: Trueno
  description: 30 % de probabilidad de paralizar. No falla con lluvia y tiene 50 % de precisión con sol.
Thunderbolt:
  name: Rayo
  description: 10 % de probabilidad de paralizar.
PayDay:
  name: Día de Pago
  description: Esparce monedas por valor de x5 el nivel del usuario, que se cobran tras el combate.
FurySwipes:
  name: Golpes Furia
  description: Golpea de 2 a 5 veces.
DoubleKick:
  name: Doble Patada
  description: Golpea 2 veces.
HornAttack:
  name: Cornada
  description: Solo daño por contacto.
HornDrill:
  name: Perforador
  description: Quita todos los PS del objetivo, con 30 % de precisión. Robustez lo anula.
Thrash:
  name: Saña
  description: Repite el mismo golpe 3 veces y deja confuso al usuario.
