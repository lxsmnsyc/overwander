# Unova's trainer classes, each by its enum name: `types` it fields
# (an empty list is every type), the `sheets` it may stand in, and the
# `trade` it is one region's version of, left out where it is its own.
# What each is called and says is text/en/trainers.

# Unova's own, the city trades: the counter and the depot bring what a
# town runs on, the ball court brings what a body does, and the stage
# brings what nobody can see through
Backpacker:
  types: [Ground, Normal]
  sheets:
    - characters/b2w2/backpacker-f
    - characters/b2w2/backpacker-m
Baker:
  types: [Fire]
  sheets: [characters/b2w2/baker]
