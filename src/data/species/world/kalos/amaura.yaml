# The sail in the rock. A Sail Fossil is the only road to it, and the
# lights it hangs over a cold night are what it was named for
Amaura:
  types: [Rock, Ice]
  egg-groups: [Monster]
  active: any
  evolves-into:
    - species: Aurorus
      method: [Level, TimeOfDay]
      level: 39
      time: [Night]
Aurorus:
  types: [Rock, Ice]
  egg-groups: [Monster]
  active: any
  evolves-from: Amaura
