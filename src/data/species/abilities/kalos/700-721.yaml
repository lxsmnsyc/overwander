Hawlucha:
  Hawlucha:
    abilities: [Limber, Unburden]
    # Sheer Force is this line's invented filler: the mainline gives
    # it Limber, Unburden and Mold Breaker and nothing else
    hidden: [MoldBreaker, SheerForce]
Dedenne:
  Dedenne:
    abilities: [CheekPouch, Pickup]
    # Minus is this line's invented filler: the mainline gives the
    # mouse Cheek Pouch, Pickup and Plus, so this is the other half
    # of the pair it is already born with
    hidden: [Plus, Minus]
Carbink:
  Carbink:
    abilities: [ClearBody]
    # Both are this line's invented fillers: the mainline gives the
    # jewel Clear Body and Sturdy and nothing else, and it is drawn
    # floating, which is where the Levitate comes from
    hidden: [Sturdy, Levitate, SolidRock]
Goomy:
  Goomy:
    abilities: [SapSipper, Hydration]
    hidden: [Gooey]
  Sliggoo:
    abilities: [SapSipper, Hydration]
    hidden: [Gooey]
  Goodra:
    abilities: [SapSipper, Hydration]
    # Water Absorb is this line's invented filler: the mainline gives
    # the slug Sap Sipper, Hydration and Gooey, and Hisuian Goodra's
    # Shell Armor belongs to that form rather than to this one
    hidden: [Gooey, WaterAbsorb]
Klefki:
  Klefki:
    abilities: [Prankster]
    # Levitate and Frisk are this line's invented fillers: the
    # mainline gives Klefki the two above and nothing else
    hidden: [Magician, Levitate, Frisk]
Phantump:
  Phantump:
    abilities: [NaturalCure, Frisk]
    hidden: [Harvest]
  Trevenant:
