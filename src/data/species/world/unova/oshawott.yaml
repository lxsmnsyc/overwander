# The water starter of Unova, an otter that fights with the shell on
# its belly: a Samurott draws the two seamitars on its forelegs and
# settles the fight in the time it takes to say so
Oshawott:
  types: [Water]
  egg-groups: [Field]
  habitat: Amphibious
  biomes: [KelpForest, RockyCoast]
  active: [Morning, Day]
  evolves-into:
    - species: Dewott
      method: [Level]
      level: 17
Dewott:
  types: [Water]
  egg-groups: [Field]
  habitat: Amphibious
  biomes: [KelpForest, RockyCoast]
  active: [Morning, Day]
  evolves-from: Oshawott
  evolves-into:
    - species: Samurott
      method: [Level]
      level: 36
Samurott:
  types: [Water]
  egg-groups: [Field]
  habitat: Amphibious
  biomes: [KelpForest, RockyCoast]
  active: [Morning, Day]
  evolves-from: Dewott
