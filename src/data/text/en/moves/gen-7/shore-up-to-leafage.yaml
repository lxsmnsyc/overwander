ShoreUp:
  name: Shore Up
  description: Heals the user 1/2 its HP, or 2/3 in a sandstorm.
FirstImpression:
  name: First Impression
  description: Winds up far faster than an ordinary move. Once a trip onto the field, and no more.
BanefulBunker:
  name: Baneful Bunker
  description: Blocks everything aimed at the user for 2 seconds, and poisons anything that touches it. It fails if used twice over.
SpiritShackle:
  name: Spirit Shackle
  description: The target cannot be swapped out for 10 seconds, ghosts aside.
DarkestLariat:
  name: Darkest Lariat
  description: Ignores the target's stat stages.
SparklingAria:
  name: Sparkling Aria
  description: Hits everything opposite and the user's teammates, and washes a burn off whatever it hits. It is a sound.
IceHammer:
  name: Ice Hammer
  description: Drops the user's Speed a stage after it lands.
FloralHealing:
  name: Floral Healing
  description: Heals the target 1/2 its HP, or 2/3 on Grassy Terrain.
HighHorsepower:
  name: High Horsepower
  description: Plain contact damage.
StrengthSap:
  name: Strength Sap
  description: Heals the user by the target's Attack, then drops that Attack a stage.
SolarBlade:
  name: Solar Blade
  description: Winds up unless the sun is out. Fog, rain, hail and sandstorm halve it.
Leafage:
  name: Leafage
  description: Plain damage from a distance.
