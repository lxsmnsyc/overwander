# What Sinnoh brought, described in this engine's terms rather than
# the mainline's

# Drifloon
FlareBoost:
  name: Flare Boost
  description: Special Attack is 1.5x while it is burned.

# Buneary
Klutz:
  name: Klutz
  description: Whatever it is holding does nothing at all.

# Drapion
Merciless:
  name: Merciless
  description: Its moves land critically on a poisoned target, armour permitting.

# Togepi
FriendGuard:
  name: Friend Guard
  description: Its teammates take 0.75x from every attack while it stands.

# Regigigas
SlowStart:
  name: Slow Start
  description: Attack and Speed are halved for its first 8 seconds on the field.

# Arceus
Multitype:
  name: Multitype
  description: It is whatever type the Plate in its hands is.

# Pachirisu
CheekPouch:
  name: Cheek Pouch
  description: Eating a berry also puts 1/3 of its HP back, whatever the berry was for.

# Cresselia
AromaVeil:
  name: Aroma Veil
  description: It and its teammates cannot be taunted, tormented, encored, charmed or heal blocked.

# Bronzor
Heatproof:
  name: Heatproof
  description: Fire moves hit it at 0.5x, and a burn takes half as much off it.
