# The croakers: the bumps on them shake the water, and by the last
# stage they shake the ground the water sits on
Tympole:
  types: [Water]
  egg-groups: [Water1]
  habitat: Amphibious
  biomes: [Bog, Swamp]
  active: [Evening, Night]
  evolves-into:
    - species: Palpitoad
      method: [Level]
      level: 25
Palpitoad:
  types: [Water, Ground]
  egg-groups: [Water1]
  habitat: Amphibious
  biomes: [Bog, Swamp]
  active: [Evening, Night]
  evolves-from: Tympole
  evolves-into:
    - species: Seismitoad
      method: [Level]
      level: 36
Seismitoad:
  types: [Water, Ground]
  egg-groups: [Water1]
  habitat: Amphibious
  biomes: [Bog, Swamp]
  active: [Evening, Night]
  evolves-from: Palpitoad
