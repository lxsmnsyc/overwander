<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command bar and announcements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.backdrop{position:absolute;inset:0;background:#7CC36A;background-image:linear-gradient(rgba(0,0,0,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.05) 2px,transparent 2px);background-size:32px 32px}
.veil{position:absolute;inset:0;background:rgba(11,18,34,.55)}
.sheet{position:absolute;border-radius:24px;background:#fff;border:2px solid #C3D2E8;box-shadow:0 6px 0 0 rgba(16,46,99,.3),0 28px 48px -18px rgba(20,32,58,.6);display:flex;flex-direction:column;animation:sheet 360ms cubic-bezier(.34,1.56,.64,1) both}
@keyframes sheet{from{transform:translateY(40px) scale(.95);opacity:0}}
@keyframes rise{from{transform:translateY(4px);opacity:0}}
.plate{position:absolute;left:24px;top:-17px;height:34px;padding:0 16px 0 12px;border-radius:999px;background:#2360C8;color:#fff;display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;box-shadow:0 3px 0 0 #163F86;z-index:3}
.btn{font-family:Nunito,sans-serif;font-weight:800;font-size:13px;border-radius:12px;border:2px solid #C3D2E8;background:#fff;color:#14203A;padding:0 14px;height:40px;box-shadow:0 3px 0 0 rgba(20,32,58,.2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform 90ms cubic-bezier(.2,.8,.2,1),box-shadow 90ms,border-color 140ms}
.btn:hover{border-color:#2360C8;transform:translateY(-1px)}
.btn:active{transform:translateY(3px) scale(.98,.94);box-shadow:none}
.btn.go{background:#1E8F52;border-color:#156B3D;color:#fff;box-shadow:0 3px 0 0 #0F5430}
.btn.danger{background:#fff;border-color:#D6372A;color:#B02A1F}
.btn.blue{background:#2360C8;border-color:#163F86;color:#fff;box-shadow:0 3px 0 0 #163F86}
.btn.on{background:#E3ECFA;border-color:#2360C8;color:#163F86}
.btn.quiet{border-color:transparent;background:transparent;box-shadow:none}
.btn.sq40{width:40px;padding:0}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#52627F}
.h{font-family:Fredoka,sans-serif;font-weight:600}
.input{height:40px;border:2px solid #C3D2E8;border-radius:12px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:#52627F}
.field{display:flex;flex-direction:column;gap:4px}
.field .input{color:#14203A;font-size:14px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:#E7EEF8;gap:2px}
.seg .btn{height:34px}
.term{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:#E7EEF8;font-size:12px;font-weight:800;color:#14203A}
.term i{font-style:normal;color:#52627F;font-weight:700}
.term.gold{background:#FDF1D6;color:#8A5A00}
.term.ember{background:#FCE3E0;color:#B02A1F}
.term.leaf{background:#E3F3EA;color:#156B3D}
.term.tide{background:#E3ECFA;color:#163F86}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.pill.leaf{background:#E3F3EA;color:#156B3D}.pill.ember{background:#FCE3E0;color:#B02A1F}.pill.gold{background:#FDF1D6;color:#8A5A00}.pill.tide{background:#E3ECFA;color:#163F86}.pill.arcane{background:#EDE6FA;color:#4B2E9A}.pill.neutral{background:#E7EEF8;color:#52627F}
.count{font-family:Fredoka,sans-serif;font-weight:600;font-size:12px;min-width:26px;height:22px;padding:0 6px;border-radius:999px;background:#E7EEF8;color:#52627F;display:inline-flex;align-items:center;justify-content:center}
.count.hot{background:#D6372A;color:#fff}
.rail{display:flex;flex-direction:column;gap:2px;padding:12px 10px 12px 14px;border-right:2px solid #E7EEF8;flex:0 0 auto}
.rail .grp{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#52627F;padding:10px 10px 4px}
.rail .grp:first-child{padding-top:2px}
.ritem{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:12px;border:2px solid transparent;font-size:14px;font-weight:800;cursor:pointer;background:transparent;font-family:Nunito,sans-serif;color:#14203A;text-align:left;width:100%}
.ritem:hover{background:#F4F7FC}
.ritem.current{border-color:#2360C8;background:#EEF4FC;color:#163F86}
.ritem .count{margin-left:auto}
.dot{width:22px;height:22px;border-radius:7px;flex:0 0 22px}
.tile{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:14px;border:2px solid #E7EEF8}
.tile b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;line-height:1}
.track{height:6px;border-radius:3px;background:#E7EEF8;overflow:hidden}
.track span{display:block;height:100%;border-radius:3px;background:#1E8F52}
.card{border:2px solid #E7EEF8;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;animation:rise 280ms cubic-bezier(.2,.8,.2,1) both}
.card h3{margin:0;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#52627F;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;border:2px solid #E7EEF8;background:#fff;min-height:52px}
.row.sel{border-color:#1E8F52;background:#EAF6EF}
.row.me{border-color:#1E8F52;background:#EAF6EF}
.row.quiet{background:#F4F7FC}
.grow{flex:1 1 auto;min-width:0}
.name{font-weight:800;font-size:14px}
.meta{font-size:12px;color:#52627F}
.dock{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:2px solid #E7EEF8;flex:0 0 auto}
.dock .note{font-size:13px;color:#52627F}
.hint{width:28px;height:28px;border-radius:14px;border:2px solid #C3D2E8;color:#2360C8;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;background:#fff;cursor:pointer}
.sw{width:44px;height:26px;border-radius:13px;background:#C3D2E8;position:relative;flex:0 0 44px;cursor:pointer;border:0;padding:0;transition:background 240ms}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(20,32,58,.25);transition:transform 240ms cubic-bezier(.34,1.56,.64,1)}
.sw.on{background:#1E8F52}.sw.on::after{transform:translateX(18px)}
.opt{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;border:2px solid #C3D2E8;background:#fff;cursor:pointer;text-align:left;font-family:Nunito,sans-serif;color:#14203A}
.opt:hover{border-color:#2360C8}
.opt.on{border-color:#1E8F52;background:#EAF6EF}
.mon{width:44px;height:44px;border-radius:14px;flex:0 0 44px}
.face{width:40px;height:40px;border-radius:12px;flex:0 0 40px}
.sqr{position:relative;height:72px;border-radius:12px;background:#fff;border:2px solid #C3D2E8;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 140ms cubic-bezier(.34,1.56,.64,1),border-color 140ms}
.sqr:hover{transform:translateY(-2px);border-color:#2360C8}
.sqr.on{border-color:#1E8F52;background:#EAF6EF;box-shadow:0 0 0 3px #1E8F5233}
.sqr .lv{position:absolute;left:5px;bottom:3px;font-family:Fredoka,sans-serif;font-weight:600;font-size:10px;color:#52627F}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px;border-radius:18px;border:4px solid #2360C8;background:#EEF4FC}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:8px;border-radius:18px;border:4px solid #2360C8;background:#EEF4FC}
.hero{position:relative;display:flex;gap:16px;align-items:center;padding:16px 18px;border-bottom:2px solid #E7EEF8;border-radius:22px 22px 0 0}
.quote{font-style:italic;font-size:14px;color:#14203A;background:#fff;border:2px solid #E7EEF8;border-radius:14px;padding:8px 12px;position:relative}
.boardchip{position:absolute;z-index:20;display:flex;gap:6px;align-items:center;padding:4px;border-radius:14px;background:rgba(255,255,255,.92);border:2px solid #C3D2E8}
.boardchip .btn{height:30px;font-size:12px}
.prop{outline:3px dashed #6E46C9;outline-offset:3px;border-radius:14px;position:relative}
.proptag{position:absolute;right:6px;top:-12px;background:#6E46C9;color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;z-index:4}
.tip{position:absolute;z-index:5;border-radius:14px;background:#fff;border:2px solid #C3D2E8;box-shadow:0 4px 0 0 rgba(20,32,58,.18),0 18px 30px -18px rgba(20,32,58,.6);padding:10px 12px;display:flex;flex-direction:column;gap:6px;animation:rise 140ms cubic-bezier(.2,.8,.2,1) both}
.scroll{overflow:hidden}
.banner{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;max-width:560px;padding:10px 14px;border-radius:14px;border:2px solid #F2B33D;background:#FFF3D6;box-shadow:0 4px 0 0 rgba(20,32,58,.2);font-weight:700;font-size:14px;animation:rise 240ms cubic-bezier(.34,1.56,.64,1) both}
.banner .x{width:28px;height:28px;border-radius:9px;border:0;background:transparent;color:#8A5A00;cursor:pointer;flex:0 0 28px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.bar{position:absolute;left:50%;top:86px;width:544px;margin-left:-272px;border-radius:24px;background:#fff;border:2px solid #C3D2E8;box-shadow:0 6px 0 0 rgba(16,46,99,.3),0 28px 48px -18px rgba(20,32,58,.6);padding:12px;display:flex;flex-direction:column;gap:8px;animation:sheet 360ms cubic-bezier(.34,1.56,.64,1) both}
.cmd{height:46px;border-radius:14px;border:2px solid #2360C8;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:15px;box-shadow:0 0 0 3px #2360C822}
.opt2{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:800}
.opt2.act{background:#E3ECFA;color:#163F86}
.opt2 small{margin-left:auto;font-size:12px;font-weight:600;color:#52627F}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: Nunito, sans-serif; color: #14203A">
<div class="backdrop"></div>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><div class="veil" style="background: rgba(11,18,34,.7)"></div></sc-if>
<div class="boardchip" style="left: 16px; top: 12px"><span class="label" style="padding: 0 6px">State</span><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button class="{{ t.cls }}" onClick="{{ t.pick }}">{{ t.name }}</button></sc-for></div>

<div style="position: absolute; left: 0; right: 0; top: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 30; pointer-events: none">
<div class="banner" role="status"><span style="flex: 1 1 auto">Maintenance at 14:00 UTC. The world stays up; trades and auctions pause for about ten minutes.</span><button class="x" aria-label="Dismiss">✕</button></div>
<sc-if value="{{ two }}" hint-placeholder-val="{{ false }}"><div class="banner"><span style="flex: 1 1 auto">New: Zeniths of the Kanto region are out in the wild.</span><button class="x" aria-label="Dismiss">✕</button></div></sc-if>
</div>

<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div class="bar" role="dialog" aria-label="Command bar">
<sc-if value="{{ answer }}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 12px; border-radius: 12px; background: #E3F3EA; border: 2px solid #1E8F5255; font-weight: 700; font-size: 13px; color: #156B3D">Teleported you to chunk 100, 0.</div></sc-if>
<div class="cmd"><span style="font-weight: 800; color: #52627F">/</span><span style="color: {{ typedColor }}">{{ typed }}</span></div>
<sc-if value="{{ offers }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 2px" role="listbox" aria-label="Suggestions"><sc-for list="{{ offered }}" as="o" hint-placeholder-count="4"><div class="{{ o.cls }}" role="option"><span>{{ o.label }}</span><small>{{ o.hint }}</small></div></sc-for></div>
</sc-if>
<span class="meta" style="padding: 0 4px">Tab completes, Up and Down choose, Enter runs, Escape closes.</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { at: 0 }; }
  renderVals() {
    const s = this.state;
    const names = ['Banner only', 'Typing', 'Answer'];
    const tabs = names.map((n, i) => ({ name: n, cls: i === s.at ? 'btn on' : 'btn quiet', pick: () => this.setState({ at: i }) }));
    return {
      tabs, two: s.at === 0, open: s.at > 0, answer: s.at === 2, offers: s.at === 1,
      typed: s.at === 2 ? 'tp player:self x:100' : 'tp pl', typedColor: '#14203A',
      offered: [{ label: 'player:self', hint: 'you', cls: 'opt2 act' }, { label: 'player:alice', hint: 'Alice, online', cls: 'opt2' }, { label: 'player:bob', hint: 'Bob', cls: 'opt2' }],
    };
  }
}
</script>
</body>
</html>
