# Dearer than a vitamin, which moves one stat by a little: a nature
# is two stats for the rest of the pokemon's life. Sells back at half.
# There is one picture per stat a nature can raise rather than one per
# mint, so the four that raise Attack share a jar and a neutral one has
# its own

