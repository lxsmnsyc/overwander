GMaxVineLash:
  description: 'Movimiento de tipo Planta de Venusaur Gigamax, tan fuerte como el movimiento al que sustituye. Azota a todos los rivales que no son de tipo Planta: pierden 1/6 de sus PS cada 2 segundos durante 8 segundos.'
GMaxWildfire:
