# ジョウトの トレーナーの クラスの なまえと、 しょうぶを いどまれた ときの せりふ。
# ふたつの ちほうに いる クラスは おなじ なまえで、 がめんが ちほうを つけたす。

Sage:
  name: ぼうず
  quote: とうは しんぼうを おしえる。 わたしの ポケモンは きみより しんぼうづよい。
Skier:
  name: スキーヤー
  quote: この ゲレンデを きみが かんがえるより はやく すべりおりた。 ついてこい。
Scientist:
  name: けんきゅういん
  quote: わたしの ポケモンは はがねだ。 きみのは せいぜい おもしろい データだな。
JohtoPokeManiac:
  name: かいじゅうマニア
  quote: あるけるように なった ころから ドラゴンを そだてている。 きみが そだてたのを みせてくれ。
JohtoBurglar:
  name: どろぼう
  quote: よるの この みちで いいことは おきない。 その わけは おれさ。
JohtoAceTrainer:
  name: エリートトレーナー
  quote: ふたつの ちほうを あるいた。 きみは わたしに ぶつかってきた だけだ。
JohtoLass:
  name: ミニスカート
  quote: むこうでは みんな わたしが いちばんって いうの。 たしかめて みましょう！
JohtoBlackBelt:
  name: からておう
  quote: おれは シジマさんの もとで たきに うたれて きたえている。 おもいしらせてやる。
JohtoBirdKeeper:
  name: とりつかい
  quote: わたしの とりは かいがん ぜんぶを とぶ。 きみの は ひとつの みちしか しらない。
JohtoBiker:
  name: ぼうそうぞく
  quote: おれたちは よるに この みちを はしる。 どくか、 たたかうか だ。
JohtoBugCatcher:
  name: むしとりしょうねん
  quote: コンテストは おわったけど、 ぼくは つかまえるのを やめなかったよ。 みてよ これ！
JohtoSwimmer:
  name: かいパンやろう
  quote: ここの みずは つめたい。 でも おれは へいきさ。
Firebreather:
  name: ヒフキやろう
  quote: ひを ふいて くらしている。 わたしの ポケモンは もっと じょうずだ。
Medium:
  name: イタコ
  quote: しんだ ものたちが こんやは おしゃべりだ。 みんな きみの なまえを いっている。
Teacher:
  name: せんせい
  quote: じゅぎょうを はじめます。 きょうは きれいに まけるのが かだいです。
SchoolKid:
  name: じゅくがえり
  quote: このバトルを けいさんして みたんだ。 こたえは きっと きにいらないよ。
Youngster:
  name: たんパンこぞう
  quote: あさから ずっと つちを ほっていたんだ。 ほら、 でてきたよ！
Camper:
  name: キャンプボーイ
  quote: この やまに みっか いたんだ。 いしころと、 こいつらを みつけたよ。
JohtoGentleman:
  name: ジェントルマン
  quote: コガネシティに いえが ある。 みちでは かんしゃくを おこす だけだ。
JohtoSuperNerd:
  name: りかけいのおとこ
  quote: ぼくの ノートでは きみは 4ふんで まける。 ためして みよう。
JohtoJuggler:
  name: ジャグラー
  quote: むっつ なげて、 ひとつも おとしていない。 みていろ。
Boarder:
  name: スノーボーダー
  quote: あの かべを よこむきで すべりおりた。 じっとしてる ほうが むずかしいね。
