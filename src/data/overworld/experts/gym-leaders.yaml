# The gym leaders, each by their enum name: the `type` they field, the
# `badge` beating them pays, the `sheets` they are seen in, the `signature`
# that stands sixth whatever the other five roll, and the coats a badge pays
# that they are never seen in: `prize` ones, and `later` ones that ask for
# the next league's crown as well. What each is called is text/en.

