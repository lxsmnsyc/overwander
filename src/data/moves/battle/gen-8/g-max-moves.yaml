# The G-Max Moves, which nobody learns: a Gigantamax throws one in place of
# the Max Move of its type. They never miss, and all but Drum Solo, Fireball
# and Hydrosnipe take their power and whether they are physical or special
# from the move they replace; see `src/data/moves/gmax-moves.ts`. The
# category written here is the one a cast with no move behind it falls back on

