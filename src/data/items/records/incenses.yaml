# All of them are held and none is spent: an incense burns for as long as
# its holder carries it.
#
# An incense costs less than the plain item it stands beside: a Sea
# Incense and a Mystic Water do the same thing, and the incense is the
# cheaper way to it.
#
# The `incense` sheet names them by the word in front of the word
# "Incense": a Sea Incense is `sea`.

OddIncense:
  type: Held
  icon: incense/odd
  flags: [Holdable, Marketable]
  buy: 3000
  sell: 1500

