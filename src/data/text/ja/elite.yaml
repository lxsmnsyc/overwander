# してんのう ひとりひとりの なまえと、 たちあがる ときの せりふ

Lorelei:
  name: カンナ
  quote: こおりに なさけは ない。 わたしにも ね。
Bruno:
  name: シバ
  quote: われら ちからで おまえを ひねりつぶす！ フーッ ハッ！
Agatha:
  name: キクコ
  quote: ほんものの ゆうれいを みたいか、 こどもよ。 よく みるがいい。
Lance:
  name: ワタル
  quote: わたしの ドラゴンに じゃくてんは ない。 まちがいだと しょうめい してみろ。
Will:
  name: イツキ
  quote: ぼくは この ひの ために ずっと きたえて きた。 きみには まけない。
Koga:
  name: キョウ
  quote: フッフッフ！ おぬしは もう わしの どくの なかだ。 はじめようか？
Karen:
  name: カリン
  quote: つよい ポケモン。 よわい ポケモン。 だいじなのは おまえの すきな ポケモンだけ。 みせて ごらん。
JohtoBruno:
  name: シバ
  quote: もっと つよくなって もどって きた。 ジョウトの こぶしを あじわえ！
Sidney:
  name: カゲツ
  quote: うらみっこ なしだぜ。 たのしく やろうや。
Phoebe:
  name: フヨウ
  quote: おくりびやまで れいたちと しゅぎょう した。 いまも いっしょに いるのよ。
Glacia:
  name: プリム
  quote: あたたかさを もとめて きたのに、 わたしの こおりは もっと はげしく なった。 みなさい。
Drake:
  name: ゲンジ
  quote: ドラゴンと ともに たたかう とは どういう ことか わかるか？ みせて みろ。
Aaron:
  name: リョウ
  quote: むしポケモンこそ さいきょうだ。 そのわけを おしえて やろう。
Bertha:
  name: キクノ
  quote: あなたが うまれる ずっと まえから これを やって いるのよ。
Flint:
  name: オーバ
  quote: おれの かみより あつい ものが ここに ある。 みてろ。
Lucian:
  name: ゴヨウ
  quote: ちょっと まって、 この ページを よみおえる。 では いこうか。
Shauntal:
  name: シキミ
  quote: あなたのような トレーナーの ほんを かいて いるの。 いい おわりかたを ちょうだい。
Marshal:
  name: レンブ
  quote: ししょうは ちからを もとめよと おしえた。 おまえは その とちゅうの ひとつに みえる。
Grimsley:
  name: ギーマ
  quote: かっても まけても カードは おちる。 どう おちるか みせて もらおう。
Caitlin:
  name: カトレア
  quote: もう じぶんの たたかいは じぶんで やるの。 くいる かも しれないわよ。
Malva:
  name: パキラ
  quote: わたしは ニュースを つたえるわ。 きょうは あなたの はいぼくを ちゅうけい で。
Siebold:
  name: ズミ
  quote: バトルは りょうりだ。 わすれられない いっぴんを ふるまおう。
Wikstrom:
  name: ガンピ
  quote: ようこそ、 ちょうせんしゃ よ！ わがけんと わたしは おまえの いきじを まっている！
Drasna:
  name: ドラセナ
  quote: あらあら、 ちょうせんしゃ ね！ わたしの ドラゴンたち、 ずっと たのしみに していたの。
