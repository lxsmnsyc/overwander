# かんぶの なまえと、 へやの まえで たちはだかる ときの せりふ

Archer:
  name: アポロ
  quote: この さくせんは おれが しきって いる。 おまえは その じゃまものだ。
Ariana:
  name: アテナ
  quote: ヒーローごっこね。 たたきのめすのが たのしみだわ。
Proton:
  name: ランス
  quote: わたしは かんぶで いちばん ざんこくだ。 のこった やつに きいて みろ。
Petrel:
  name: ラムダ
  quote: ヒヒヒ、 わたしが ボスだと おもったか？ おまえには それで じゅうぶんだ。
Tabitha:
  name: ホムラ
  quote: リーダーは この だいちに けいかくが ある。 おまえは その うえに たっている。
Courtney:
  name: カガリ
  quote: おまえの かてる かのうせいを ぶんせき。 けっか、 ゼロ。 じっこう する。
Matt:
  name: ウシオ
  quote: おおっ、 ちょうせんしゃか！ すぐに たおれるなよ、 あきるからな。
Shelly:
  name: イズミ
  quote: うみは ほしい ものを うばう。 きょうは おまえに どいて もらう。
Mars:
  name: マーズ
  quote: おまえは よりよい せかいの じゃまだ。 どけ、 さもなくば どかす。
Jupiter:
  name: ジュピター
  quote: わるく おもうな。 わたしも ほとんど なにも おもって いない。
Saturn:
  name: サターン
  quote: こんな ことに うたがいは ある。 だが おまえに かつ ことには ない。
Colress:
  name: アクロマ
  quote: おまえと いる ポケモンが どこまで つよく なるか みたい。 ただの データ としてな。
Zinzolin:
  name: ヴィオ
  quote: おわる まえに おまえは こごえる。 はじめろ。
Xerosic:
  name: クセロシキ
  quote: きょうみぶかい。 おまえの ポケモンが ストレスに どう たえるか みせて もらおう。
Aliana:
  name: アケビ
  quote: せかいは みにくい。 だから わたしたちが なおす。 おまえも みにくい ほうよ。
Bryony:
  name: バラ
  quote: おまえの かくりつを けいさん。 きりすてると ゼロよ。
Celosia:
  name: コレア
  quote: うつくしい ものだけが のこれる。 おまえが のこれるか、 わたしが きめる。
Mable:
  name: モミジ
  quote: わたしたち かがくしゃは いそがしい の。 てみじかに しずかに すませましょう。
