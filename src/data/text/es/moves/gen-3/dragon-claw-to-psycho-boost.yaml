# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
DragonClaw:
  name: Garra Dragón
  description: Solo daño por contacto.
FrenzyPlant:
  name: Planta Feroz
  description: Después, el usuario debe recargar durante 2 segundos.
BulkUp:
  name: Corpulencia
  description: Sube 1 nivel el Ataque y la Defensa del usuario.
Bounce:
  name: Bote
  description: Salta fuera de alcance, como Vuelo, y luego cae sobre el objetivo. 30 % de probabilidad de paralizar.
MudShot:
  name: Disparo Lodo
  description: Siempre baja 1 nivel la Velocidad del objetivo.
PoisonTail:
  name: Cola Veneno
  description: Más probabilidad de golpe crítico. 10 % de probabilidad de envenenar.
Covet:
  name: Antojo
  description: Roba el objeto del objetivo si el usuario no lleva nada.
VoltTackle:
  name: Placaje Eléctrico
  description: El usuario recibe 1/3 del daño que causa. 10 % de probabilidad de paralizar.
MagicalLeaf:
  name: Hoja Mágica
  description: Nunca falla.
WaterSport:
  name: Hidrochorro
  description: Durante 10 segundos, los movimientos de tipo Fuego hacen 1/2 de daño.
CalmMind:
  name: Paz Mental
  description: Sube 1 nivel el Ataque Esp. y la Defensa Esp. del usuario.
LeafBlade:
  name: Hoja Aguda
  description: Más probabilidad de golpe crítico.
DragonDance:
  name: Danza Dragón
  description: Sube 1 nivel el Ataque y la Velocidad del usuario.
RockBlast:
  name: Pedrada
  description: Golpea de 2 a 5 veces.
ShockWave:
  name: Onda Voltio
  description: Nunca falla.
WaterPulse:
  name: Hidropulso
  description: 20 % de probabilidad de confundir.
DoomDesire:
  name: Deseo Oculto
  description: Impacta 4 segundos después de lanzarse, en el lugar donde esté el objetivo entonces.
PsychoBoost:
  name: Psicoataque
  description: Tras acertar, baja 2 niveles el Ataque Esp. del usuario.
