# The torch: a Larvesta carries five small fires on its head, and the
# moth it becomes was taken for the sun itself once
Larvesta:
  types: [Bug, Fire]
  egg-groups: [Bug]
  biomes: [Desert]
  active: [Morning, Day]
  evolves-into:
    - species: Volcarona
      method: [Level]
      level: 59
Volcarona:
  types: [Bug, Fire]
  egg-groups: [Bug]
  biomes: [Desert]
  active: [Morning, Day]
  evolves-from: Larvesta
