# The Elite Four, each by their enum name: the `type` they are known for,
# the `honor` beating them pays, the `sheets` they are seen in, the
# `signature` that stands last, and the `pool` they field out of: its
# `types`, any `egg-groups` that count as theirs besides, and the species
# no rule reaches that are theirs `also`. What each is called is text/en.
# Which badges each asks to see is read off the honor, by league.

# Kanto

# Slowbro is hers in every game she appears in and there is nothing icy
# about him, so he is named rather than derived
Lorelei:
  type: Ice
  honor: LoreleiDefeated
  sheets: [characters/frlg/lorelei]
  signature: Lapras
  pool:
    types: [Ice]
    also: [Slowbro]
# The Ground half brings the heavy ground with it, and overlaps Brock's
# rock at Golem and Rhydon, which is right: they are the same pokemon a
# fighting specialist and a rock specialist would both want. Onix is
# named, since a Steelix above him puts him below the band the rules read
Bruno:
  type: Fighting
  honor: BrunoDefeated
  sheets:
    - characters/frlg/bruno
    - characters/lgpe/bruno
  signature: Machamp
  pool:
    types: [Fighting, Ground]
    also: [Onix]
# The Ghost type on its own, now that it runs to a dozen grown species
# across the regions. She carried the Amorphous group while Kanto had one
# grown Ghost, and that widener had come to reach Gardevoir and Castform,
# which no ghost specialist would field. Her Golbat and Arbok stay named
Agatha:
  type: Ghost
  honor: AgathaDefeated
  sheets:
    - characters/frlg/agatha
    - characters/lgpe/agatha
  signature: Gengar
  pool:
    types: [Ghost]
    also: [Golbat, Arbok]
# The Dragon egg group is the whole point: it is why a Gyarados stands on
# a dragon master's team. Aerodactyl is a dragon by neither rule and by
# every eye, so he is named
Lance:
  type: Dragon
  honor: LanceDefeated
  sheets:
    - characters/frlg/lance
    - characters/lgpe/lance
  signature: Dragonite
  pool:
    types: [Dragon]
    egg-groups: [Dragon]
    also: [Aerodactyl]

# Johto

# Johto's three each field a type wide enough to stand on its own, so none
# of them needs a widener
Will:
  type: Psychic
  honor: WillDefeated
  sheets: [characters/hgss/will]
  signature: Xatu
  pool:
    types: [Psychic]
# His Heart Gold sheet alone. The other two are the gym leader's, and a
# sprite is unlocked by one deed: the Soul Badge is what he is worn off in
# Kanto, his mark is what he is worn off in Johto
Koga:
  type: Poison
  honor: KogaDefeated
  sheets: [characters/hgss/koga]
  signature: Crobat
  pool:
    types: [Poison]
Karen:
  type: Dark
  honor: KarenDefeated
  sheets: [characters/hgss/karen]
  signature: Houndoom
  pool:
    types: [Dark]
# His Heart Gold sheet, the way the rest of Johto's league is drawn. The
# Kanto seat above keeps the two he is drawn in there
JohtoBruno:
  type: Fighting
  honor: JohtoBrunoDefeated
  sheets: [characters/hgss/bruno]
  signature: Machamp
  pool:
    types: [Fighting, Ground]
    also: [Onix]

