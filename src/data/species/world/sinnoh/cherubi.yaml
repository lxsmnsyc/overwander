# The cherry and what it opens into. A Cherrim keeps its blossom shut
# until the sun is out, so the open shape is worn rather than met:
# the dex fills it in the moment the closed one is
Cherubi:
  types: [Grass]
  egg-groups: [Fairy, Grass]
  biomes: [Woodland, TemperateForest, TropicalSeasonalForest]
  active: any
  evolves-into:
    - species: Cherrim
      method: [Level]
      level: 25
Cherrim:
  types: [Grass]
  egg-groups: [Fairy, Grass]
  biomes: [Woodland, TemperateForest, TropicalSeasonalForest]
  active: any
  evolves-from: Cherubi
CherrimSunshine:
  types: [Grass]
  egg-groups: [Fairy, Grass]
  active: any
  base-form: false
  worn: true
  evolves-from: Cherubi
