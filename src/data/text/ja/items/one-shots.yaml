# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
FocusSash:
  name: きあいのタスキ
  description: HPが まんたんの ときに たおされる ダメージを はじめて うけた とき、 HP1で もちこたえる。
AirBalloon:
  name: ふうせん
  description: もたせた ポケモンは うかぶので、 じめんわざが あたらない。 さいしょに あたった こうげきで われる。
WeaknessPolicy:
  name: じゃくてんほけん
  description: こうかばつぐんの こうげきを うけると、 こうげきと とくこうが 2だん あがる。
BlunderPolicy:
  name: からぶりほけん
  description: もたせた ポケモンの わざが はずれると、 すばやさが 2だん あがる。
AbsorbBulb:
  name: きゅうこん
  description: みずわざを うけると、 とくこうが 1だん あがる。
CellBattery:
  name: じゅうでんち
  description: でんきわざを うけると、 こうげきが 1だん あがる。
Snowball:
  name: ゆきだま
  description: こおりわざを うけると、 こうげきが 1だん あがる。
LuminousMoss:
  name: ひかりごけ
  description: みずわざを うけると、 とくぼうが 1だん あがる。
ThroatSpray:
  name: のどスプレー
  description: もたせた ポケモンが おとの わざを だすと、 とくこうが 1だん あがる。
WhiteHerb:
  name: しろいハーブ
  description: さがった ステータスを すべて いちどに もとに もどし、 そのあと なくなる。
MentalHerb:
  name: メンタルハーブ
  description: メロメロに なった しゅんかん、 なおす。
PowerHerb:
  name: パワフルハーブ
  description: もたせた ポケモンの つぎの わざが、 じゅんびなしで すぐに はつどうする。
AdrenalineOrb:
  name: ビビリだま
  description: いかくを うけると、 すばやさが 1だん あがる。
ElectricSeed:
  name: エレキシード
  description: エレキフィールドに つつまれると、 ぼうぎょが 1だん あがる。
GrassySeed:
  name: グラスシード
  description: グラスフィールドに つつまれると、 ぼうぎょが 1だん あがる。
MistySeed:
  name: ミストシード
  description: ミストフィールドに つつまれると、 とくぼうが 1だん あがる。
PsychicSeed:
  name: サイコシード
  description: サイコフィールドに つつまれると、 とくぼうが 1だん あがる。
RedCard:
  name: レッドカード
  description: こうげきしてきた ポケモンを ひっこめる。 てきなら あいての いちばん よわい ポケモンと、 みかたなら いちばん つよい ポケモンと いれかわる。
EjectButton:
  name: だっしゅつボタン
  description: こうげきを うけると、 もたせた ポケモンを ひかえの いちばん つよい ポケモンと いれかえる。
EjectPack:
  name: だっしゅつパック
  description: ステータスを さげられると、 もたせた ポケモンを ひかえの いちばん つよい ポケモンと いれかえる。
BoosterEnergy:
  name: ブーストエナジー
  description: こだいかっせいか クォークチャージの ポケモンが もたせると、 ひざしが つよくなくても エレキフィールドが なくても ブーストが はつどうする。 はつどうすると なくなる。
