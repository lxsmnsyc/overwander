# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
FocusSash:
  name: Banda Aguante
  description: Deja al portador con 1 PS la primera vez que un golpe lo llevaría desde los PS máximos.
AirBalloon:
  name: Globo Helio
  description: El portador flota, así que los movimientos de tipo Tierra fallan. Explota con el primer golpe que acierta.
WeaknessPolicy:
  name: Seguro Debilidad
  description: Sube 2 niveles el Ataque y el Ataque Esp. tras recibir un golpe supereficaz.
BlunderPolicy:
  name: Seguro Fallo
  description: Sube 2 niveles la Velocidad si el portador falla.
AbsorbBulb:
  name: Tubérculo
  description: Sube 1 nivel el Ataque Esp. tras recibir un movimiento de tipo Agua.
CellBattery:
  name: Pila
  description: Sube 1 nivel el Ataque tras recibir un movimiento de tipo Eléctrico.
Snowball:
  name: Bola de Nieve
  description: Sube 1 nivel el Ataque tras recibir un movimiento de tipo Hielo.
LuminousMoss:
  name: Musgo Brillante
  description: Sube 1 nivel la Defensa Esp. tras recibir un movimiento de tipo Agua.
ThroatSpray:
  name: Espray Bucal
  description: Sube 1 nivel el Ataque Esp. después de que el portador lance un movimiento de sonido.
WhiteHerb:
  name: Hierba Blanca
  description: Restaura de golpe todos los niveles reducidos y luego desaparece.
MentalHerb:
  name: Hierba Mental
  description: Cura el enamoramiento en cuanto se produce.
PowerHerb:
  name: Hierba Única
  description: El siguiente movimiento del portador se lanza al instante, sin preparación.
AdrenalineOrb:
  name: Nerviosfera
  description: Sube 1 nivel la Velocidad cuando el portador es intimidado por Intimidación.
ElectricSeed:
  name: Semilla Electro
  description: Sube 1 nivel la Defensa cuando Campo Eléctrico cubre al portador.
GrassySeed:
  name: Semilla Hierba
  description: Sube 1 nivel la Defensa cuando Campo de Hierba cubre al portador.
MistySeed:
  name: Semilla Bruma
  description: Sube 1 nivel la Defensa Esp. cuando Campo de Niebla cubre al portador.
PsychicSeed:
  name: Semilla Psique
  description: Sube 1 nivel la Defensa Esp. cuando Campo Psíquico cubre al portador.
RedCard:
  name: Tarjeta Roja
  description: 'Aparta al atacante: a un enemigo lo cambia por su Pokémon más débil, a un aliado por el más fuerte.'
EjectButton:
  name: Botón Escape
  description: Cambia al portador por el Pokémon más fuerte de su reserva cuando recibe un golpe.
EjectPack:
  name: Mochila Escape
  description: Cambia al portador por el Pokémon más fuerte de su reserva cuando le bajan una estadística.
BoosterEnergy:
  name: Energía Potenciadora
  description: Activa el aumento de un portador con Paleosíntesis o Carga Cuark sin necesidad de sol ni de Campo Eléctrico, y se gasta al hacerlo.
