# The water birds: a Ducklett dives rather than runs, and a Swanna
# puts on a display at dusk that the rest of the flock follows
Ducklett:
  types: [Water, Flying]
  egg-groups: [Water1, Flying]
  habitat: Amphibious
  biomes: [Bog, Swamp]
  active: [Morning, Day]
  evolves-into:
    - species: Swanna
      method: [Level]
      level: 35
Swanna:
  types: [Water, Flying]
  egg-groups: [Water1, Flying]
  habitat: Amphibious
  biomes: [Bog, Swamp]
  active: [Morning, Day]
  evolves-from: Ducklett
