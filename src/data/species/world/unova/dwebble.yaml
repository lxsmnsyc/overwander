# The masons: a Dwebble bores its own rock to live in and carries it
# everywhere, and a Crustle that loses its slab loses the will to
# fight along with it
Dwebble:
  types: [Bug, Rock]
  egg-groups: [Bug, Mineral]
  biomes: [Desert, Badlands]
  active: [Morning, Day]
  evolves-into:
    - species: Crustle
      method: [Level]
      level: 34
Crustle:
  types: [Bug, Rock]
  egg-groups: [Bug, Mineral]
  biomes: [Desert, Badlands]
  active: [Morning, Day]
  evolves-from: Dwebble
