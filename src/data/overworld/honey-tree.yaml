  Combee: 22
  Burmy: 20
  Aipom: 12
rare:
  Kakuna: 15
  Silcoon: 15
  Cascoon: 15
# The beetles that drink the sap under the honey
elusive:
  Heracross: 5
  Pinsir: 5
prized:
  Munchlax: 1
special: {}
