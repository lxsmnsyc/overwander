# The signature abilities of the families filed under Paldea

PetalScatter:
  name: Petal Scatter
  description: A Grass critical hit it lands also deals 1/4 of that damage to every other enemy.
SpreadingFlame:
  name: Spreading Flame
  description: A burn it inflicts with a Fire move also burns the other enemy lowest on HP.
Wake:
  name: Wake
  description: A Water move it lands drops the target's Speed 1 stage and every other enemy's by 1 as well, at most once every 8 seconds.
PigOut:
  name: Pig Out
  description: Each time it eats a Berry, it casts Stockpile on itself.
Tripwire:
  name: Tripwire
  description: An enemy that takes the field mid-fight winds up its first move 50% slower.
Knockback:
  name: Knockback
  description: Each contact move it lands pushes the target's current wind-up back 0.5 seconds.
StaticPalms:
  name: Static Palms
  description: Its punching moves paralyse the target 20% of the time.
ScatterBrood:
  name: Scatter Brood
  description: Its multi-hit moves send each strike at a different standing enemy in turn.
FreshBatch:
  name: Fresh Batch
  description: Every 20 seconds it hands a Sitrus Berry to the teammate lowest on HP whose hands are empty.
Anoint:
  name: Anoint
  description: Any heal it gives a teammate also cures that teammate's major status.
BrineRebound:
  name: Brine Rebound
  description: A Water move landing on it makes it cast Salt Cure at whoever threw it, at most once every 10 seconds.
Kindling:
  name: Kindling
  description: Each Fire move it lands makes its next move wind up 25% faster.
BubbleShock:
  name: Bubble Shock
  description: Its Electric moves hit 1.5x a target that a Water move has landed on in the last 4 seconds.
LightningDive:
  name: Lightning Dive
  description: Its Electric moves hit 1.3x while Tailwind blows on its side.
Windswept:
  name: Windswept
  description: When a wind move lands on anybody, its own next move winds up 50% faster.
MyceliumMat:
  name: Mycelium Mat
  description: While it stands, each time Grassy Terrain heals one of its teammates it also cures one major status from them.
HeatTolerance:
  name: Heat Tolerance
  description: A burn heals it 1/8 of its HP each time it acts instead of hurting it, and does not halve its Attack.
BallToss:
  name: Ball Toss
  description: When a teammate drops below 1/3 HP with empty hands, it hands them its own held item, once per fight.
StareDown:
  name: Stare Down
  description: Each Psychic move it lands casts Taunt at the target, at most once every 10 seconds per target.
Tinker:
  name: Tinker
  description: The first time each teammate uses up its held item, it remakes it, once per teammate per fight.
SandDuck:
  name: Sand Duck
  description: Ground moves aimed at it miss, and each one that does raises its Speed 1 stage.
Lifeguard:
  name: Lifeguard
  description: While it is above 1/2 HP, the first blow each fight that would knock out a teammate is taken by it instead, once per teammate.
Redline:
  name: Redline
  description: Its moves wind up faster the lower its HP, from 0% faster at full HP to 30% faster near 0 HP.
ShedDecoy:
  name: Shed Decoy
  description: The first time its HP drops below 1/2 each fight, it casts Substitute without paying the HP for it.
SlagTrail:
  name: Slag Trail
  description: Each Steel move it lands lays a layer of Spikes under the target's side, at most once every 10 seconds.
Glimmering:
  name: Glimmering
  description: While it stands, every poisoned enemy winds up its moves 20% slower.
GraveDigger:
  name: Grave Digger
  description: When a teammate faints holding an item and its own hands are empty, the item goes into its hands.
SnowHoard:
  name: Snow Hoard
  description: While snow or hail falls, it gains 1 stage of Attack every 4 seconds, up to +3 from this.
FilletThrift:
  name: Fillet Thrift
  description: Moves that cost HP to use (Fillet Away, Substitute, Belly Drum, Shed Tail) cost it half.
Mouthful:
  name: Mouthful
  description: "When a teammate drops below 1/3 HP, it swallows them: they cannot be targeted for 4 seconds and heal 1/4 of their HP, once per teammate per fight."
BackSeatOrders:
  name: Back Seat Orders
  description: While it is behind a Substitute or under its own Protect, each move a teammate lands hits 1.2x.
GlaiveGuard:
  name: Glaive Guard
  description: After a move that leaves it exposed (Glaive Rush, Outrage, a recharge), its Defense and Special Defense are +2 until it next acts.
