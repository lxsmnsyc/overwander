# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
FrenzyStoneAxe:
  description: El estallido de un Kleavor en frenesí, que golpea a todos los rivales tras una preparación. Deja astillas de roca en cada bando al que alcanza, como hace Trampa Rocas.
FrenzyPetalStorm:
  description: El estallido de un Lilligant de Hisui en frenesí, que golpea a todos los rivales tras una preparación. Baja 1 nivel la Velocidad de cada uno al que alcanza.
FrenzyWildfire:
  description: El estallido de un Arcanine de Hisui en frenesí, que golpea a todos los rivales tras una preparación. Prende fuego al suelo de cada bando al que alcanza durante 8 segundos, y quema el 30 % de las veces.
FrenzyBlast:
  description: El estallido de un Electrode de Hisui en frenesí, una carga lanzada contra todos los rivales tras una preparación. Golpea más fuerte que cualquier otro estallido, y el señorial no se debilita por él.
FrenzyIceberg:
  description: El estallido de un Avalugg de Hisui en frenesí, un iceberg que cae sobre todos los rivales tras una preparación. Amedrenta a cada uno al que alcanza el 30 % de las veces.
FrenzyBurst:
  description: El estallido de un señorial en frenesí con su primer tipo, que golpea a todos los rivales tras una preparación. Lo que deja tras de sí depende de ese tipo.
