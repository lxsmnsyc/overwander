# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
templates:
  name: MT {move}
  stocked: Enseña {move} a un Pokémon que pueda aprenderlo. Se gasta al usarse.
  withdrawn: Enseña {move} a un Pokémon que pueda aprenderlo. Ya no se vende; un vendedor la recompra por lo que costó.
