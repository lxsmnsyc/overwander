# What a move that deals no damage is worth a slot for an expert build.
# Only the ones that change a fight rather than decorate it, priced against
# the attacks they displace: a stat-doubling setup beats a mid attack, a heal
# matches one, and a crippling status sits just under.
#
# `worth` is the price, `kind` is what the move is for (a move with none is a
# Cripple), and `serves` is the half of the split a setup move sharpens. A
# setup that raises a defence or a speed serves either, and has no `serves`

# Setup: what a pokemon spends its first cast on when the rest of
# the fight is worth more for it
SwordsDance: { worth: 120, kind: Setup, serves: Physical }
DragonDance: { worth: 120, kind: Setup, serves: Physical }
TailGlow: { worth: 120, kind: Setup, serves: Special }
