Cramorant:
  Cramorant:
    types: [Flying, Water]
    egg-groups: [Water1, Flying]
    biomes: [RockyCoast, Beach, Ocean]
    active: any
  CramorantGulping:
    types: [Flying, Water]
    egg-groups: [Water1, Flying]
    active: any
    # The catch it comes back up with after a dive, so it is never met
    # this way. Drawn as Cramorant until SpriteCollab draws the form
    base-form: false
    worn: true
  CramorantGorging:
    types: [Flying, Water]
    egg-groups: [Water1, Flying]
    active: any
    # The big catch, which only a badly hurt Cramorant dives for
    base-form: false
    worn: true
