# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
ChoiceBand:
  name: Cinta Elección
  description: x1,5 de Ataque, pero el portador solo puede lanzar el movimiento con el que empezó.
ChoiceSpecs:
  name: Gafas Elección
  description: x1,5 de Ataque Esp., pero el portador solo puede lanzar el movimiento con el que empezó.
ChoiceScarf:
  name: Pañuelo Elección
  description: x1,5 de Velocidad, pero el portador solo puede lanzar el movimiento con el que empezó.
AssaultVest:
  name: Chaleco Asalto
  description: x1,5 de Defensa Esp. El portador no puede lanzar ningún movimiento de estado.
Eviolite:
  name: Mineral Evol
  description: x1,5 en ambas defensas, para un Pokémon que aún pueda evolucionar.
LightBall:
  name: Bola Luminosa
  description: Duplica el Ataque y el Ataque Esp. de un Pikachu. No hace nada a los demás.
ThickClub:
  name: Hueso Grueso
  description: Duplica el Ataque de un Cubone o un Marowak. No hace nada a los demás.
MetalPowder:
  name: Polvo Metálico
  description: Duplica la Defensa de un Ditto. No hace nada a los demás.
QuickPowder:
  name: Polvo Veloz
  description: Duplica la Velocidad de un Ditto. No hace nada a los demás.
