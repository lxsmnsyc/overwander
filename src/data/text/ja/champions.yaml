# チャンピオンの なまえと、 リーグの さいごの しょうぶを いどまれた ときの あいさつ

Blue:
  name: グリーン
  greeting: グリーンは にやりと わらった。 「オレが ここの チャンピオンだ。 じゃあな！」
Lance:
  name: ワタル
  greeting: ワタルは きみを じっと みた。 「ここまで よく きた。 きみの ぜんりょくを みせて くれ。」
Wallace:
  name: ミクリ
  greeting: ミクリは おじぎを した。 「うつくしく、 そして みじかく いきましょう。」
Cynthia:
  name: シロナ
  greeting: シロナは ほんを とじた。 「ぜんいんで たたかう かちの ある ひとを まって いたの。」
Iris:
  name: アイリス
  greeting: アイリスは にっと わらった。 「みんなに この いすは まだ はやいって いわれたの。 ためして みなよ！」
Diantha:
  name: カルネ
  greeting: カルネは カメラが まわって いるように ほほえんだ。 「みんなの きおくに のこる シーンに しましょう？」
