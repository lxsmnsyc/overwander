# The sea slug that comes in two shells. Which one a player meets is
# decided by the side of the world they are standing on rather than
# by the shore itself: west of the meridian is the pink one, east of
# it the blue, and the shell it was met in is the shell it evolves
# with
Shellos:
  types: [Water]
  egg-groups: [Water1, Amorphous]
  habitat: Amphibious
  biomes: [Beach, RockyCoast, Mangrove, CoralReef, KelpForest]
  active: any
  evolves-into:
    - species: Gastrodon
      method: [Level]
      level: 30
ShellosEast:
  types: [Water]
  egg-groups: [Water1, Amorphous]
  habitat: Amphibious
  biomes: [Beach, RockyCoast, Mangrove, CoralReef, KelpForest]
  active: any
  base-form: false
  evolves-into:
    - species: GastrodonEast
      method: [Level]
      level: 30
Gastrodon:
  types: [Water, Ground]
  egg-groups: [Water1, Amorphous]
  habitat: Amphibious
  biomes: [Beach, RockyCoast, Mangrove, CoralReef, KelpForest]
  active: any
  evolves-from: Shellos
GastrodonEast:
  types: [Water, Ground]
  egg-groups: [Water1, Amorphous]
  habitat: Amphibious
  biomes: [Beach, RockyCoast, Mangrove, CoralReef, KelpForest]
  active: any
  base-form: false
  evolves-from: ShellosEast
