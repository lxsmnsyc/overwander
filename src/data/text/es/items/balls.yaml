# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
PokeBall:
  name: Poké Ball
  description: La Ball normal. Ni ayuda ni estorba.
GreatBall:
  name: Super Ball
  description: Tiene 1,5 veces más probabilidad de captura que una Poké Ball.
UltraBall:
  name: Ultra Ball
  description: El doble de probabilidad de captura que una Poké Ball.
MasterBall:
  name: Master Ball
  description: Nunca falla.
PremierBall:
  name: Honor Ball
  description: Captura igual que una Poké Ball. Un recuerdo.
HealBall:
  name: Sana Ball
  description: Captura igual que una Poké Ball y devuelve a tu compañero todos sus PS y le cura los problemas de estado.
LuxuryBall:
  name: Lujo Ball
  description: Captura igual que una Poké Ball. Lo que contiene te toma cariño el doble de rápido, de por vida.
NetBall:
  name: Malla Ball
  description: x3,5 contra los tipos Bicho y Agua.
DiveBall:
  name: Buceo Ball
  description: x3,5 en el agua.
NestBall:
  name: Nido Ball
  description: Hasta x4 contra un encuentro de nivel bajo, y se reduce a medida que sube el nivel.
RepeatBall:
  name: Acopio Ball
  description: x3,5 contra una especie que ya tienes.
TimerBall:
  name: Turno Ball
  description: Gana alrededor de x0,3 con cada lanzamiento o comida en este encuentro, hasta x4.
QuickBall:
  name: Veloz Ball
  description: x5 antes de lanzar o dar de comer nada en este encuentro; después, normal.
LevelBall:
  name: Nivel Ball
  description: Hasta x8 contra algo de nivel muy inferior al del compañero que camina contigo.
LureBall:
  name: Cebo Ball
  description: x5 contra algo que salta asustado de aguas ondulantes.
MoonBall:
  name: Luna Ball
  description: x4 contra cualquier miembro de una línea que evoluciona con una Piedra Lunar.
FriendBall:
  name: Amigo Ball
  description: Captura igual que una Poké Ball. Lo que contiene llega con 200 de amistad, salvo que sea un Pokémon Oscuro.
LoveBall:
  name: Amor Ball
  description: x8 contra la misma especie que tu compañero y del sexo opuesto.
HeavyBall:
  name: Peso Ball
  description: Hasta x4 según el peso, desde x2 a partir de 100 kg.
FastBall:
  name: Rapid Ball
  description: x4 contra una especie con 100 o más de Velocidad base.
BeastBall:
  name: Ente Ball
  description: x5 contra un Ultraente y x0,1 contra cualquier otro.
DuskBall:
  name: Ocaso Ball
  description: x3 al atardecer y de noche.
