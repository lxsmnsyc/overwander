Exeggcute:
  Exeggcute:
    types: [Grass, Psychic]
    egg-groups: [Grass]
    biomes: [TropicalRainforest, TropicalSeasonalForest, Ocean, DeepOcean]
    active: any
    # Both Exeggutor take the same stone, and the catch sheet lets the player pick
    evolves-into:
      - species: Exeggutor
        method: [UsedItem]
        item: LeafStone
      - species: ExeggutorAlola
        method: [UsedItem]
        item: LeafStone
    held: { common: OranBerry, uncommon: MiracleSeed, rare: SitrusBerry }
  Exeggutor:
    types: [Grass, Psychic]
    egg-groups: [Grass]
    biomes: [TropicalRainforest, TropicalSeasonalForest, DeepOcean]
    active: any
    evolves-from: Exeggcute
    held: { common: OranBerry, uncommon: MiracleSeed, rare: SitrusBerry }
  ExeggutorAlola:
    types: [Grass, Dragon]
    egg-groups: [Grass]
    biomes: [Beach, Ocean]
    active: any
    base-form: false
    evolves-from: Exeggcute
Cubone:
  Cubone:
    types: [Ground]
    egg-groups: [Monster]
    biomes: [Mountain, Desert, ColdDesert, Badlands]
    active: [Night]
    # By day it grows into a Kanto Marowak, and by night into an Alolan one
    evolves-into:
      - species: Marowak
        method: [Level, TimeOfDay]
        level: 28
        time: [Morning, Day]
      - species: MarowakAlola
        method: [Level, TimeOfDay]
        level: 28
        time: [Evening, Night]
    held: { common: TinyMushroom, uncommon: HardStone, rare: ThickClub }
  Marowak:
    types: [Ground]
    egg-groups: [Monster]
    biomes: [Mountain, Desert, ColdDesert, Badlands]
    active: [Night]
    evolves-from: Cubone
    held: { common: TinyMushroom, uncommon: HardStone, rare: ThickClub }
  MarowakAlola:
    types: [Fire, Ghost]
    egg-groups: [Monster]
    biomes: [Volcano]
    active: [Evening, Night]
    base-form: false
    evolves-from: Cubone
# Which of the three it becomes, decided the way the games decide it
Tyrogue:
  Hitmonlee:
    types: [Fighting]
    egg-groups: [HumanLike]
    biomes: [Grassland]
    active: [Morning, Day]
    evolves-from: Tyrogue
    held: { common: OranBerry, uncommon: BlackBelt, rare: FocusBand }
  Hitmonchan:
    types: [Fighting]
    egg-groups: [HumanLike]
    biomes: [Grassland]
    active: [Morning, Day]
    evolves-from: Tyrogue
    held: { common: OranBerry, uncommon: BlackBelt, rare: FocusBand }
  Tyrogue:
    types: [Fighting]
    # A baby has nothing to breed with: it is what an egg holds
    egg-groups: [NoEggsDiscovered]
    biomes: [Grassland]
    active: [Morning, Day]
    evolves-into:
      - species: Hitmonlee
        method: [Level, StatComparison]
        level: 20
        compare: { stat: Attack, against: Defense, order: greater }
      - species: Hitmonchan
        method: [Level, StatComparison]
        level: 20
        compare: { stat: Attack, against: Defense, order: lesser }
      - species: Hitmontop
        method: [Level, StatComparison]
        level: 20
        compare: { stat: Attack, against: Defense, order: equal }
    rank: baby
  Hitmontop:
    types: [Fighting]
    egg-groups: [HumanLike]
    biomes: [Grassland]
    active: [Morning, Day]
    evolves-from: Tyrogue
Lickitung:
  Lickitung:
    types: [Normal]
    egg-groups: [Monster]
    biomes: [Grassland, Swamp]
    active: [Morning, Day]
    evolves-into:
      - species: Lickilicky
        method: [Level, KnownMove]
        level: 33
        move: Rollout
    held: { common: OranBerry, uncommon: SilkScarf, rare: Leftovers }
  # The tongue that outgrew the Lickitung: a Lickilicky wraps it around
  # whatever it wants and carries the thing home
  Lickilicky:
    types: [Normal]
    egg-groups: [Monster]
    biomes: [Grassland, Woodland, TropicalSeasonalForest]
    active: any
    evolves-from: Lickitung
Koffing:
  Koffing:
    types: [Poison]
    egg-groups: [Amorphous]
    biomes: [Swamp, Volcano]
    active: [Night]
    evolves-into:
      - species: Weezing
        method: [Level]
        level: 35
      # The Galarian one, in the smog over Galar's towns: both are
      # offered, and the player picks
      - species: WeezingGalar
        method: [Level]
        level: 35
    held: { common: PechaBerry, uncommon: SmokeBall, rare: BlackSludge }
  Weezing:
    types: [Poison]
    egg-groups: [Amorphous]
    biomes: [Swamp, Volcano]
    active: [Night]
    evolves-from: Koffing
    held: { common: PechaBerry, uncommon: SmokeBall, rare: BlackSludge }
  WeezingGalar:
    types: [Poison, Fairy]
    egg-groups: [Amorphous]
    biomes: [Swamp]
    active: [Night]
    base-form: false
    evolves-from: Koffing
Rhyhorn:
  Rhyhorn:
    types: [Ground, Rock]
    egg-groups: [Monster, Field]
    biomes: [Savanna, Desert, Badlands]
    active: [Day]
    evolves-into:
      - species: Rhydon
        method: [Level]
        level: 42
    held: { common: TinyMushroom, uncommon: Protector, rare: HardStone }
  Rhydon:
    types: [Ground, Rock]
    egg-groups: [Monster, Field]
    biomes: [Savanna, Desert, Badlands]
    active: [Day]
    evolves-from: Rhyhorn
    evolves-into:
      - species: Rhyperior
        method: [HeldItem, Trade]
        item: Protector
    held: { common: TinyMushroom, uncommon: Protector, rare: HardStone }
  # A Rhydon in armour it grew itself: a Rhyperior loads rocks into the
  # holes in its hands and fires them off
  Rhyperior:
    types: [Ground, Rock]
    egg-groups: [Monster, Field]
    biomes: [Badlands, Mountain, Steppe]
    active: any
    evolves-from: Rhydon
Chansey:
  Chansey:
    types: [Normal]
    egg-groups: [Fairy]
    biomes: [Grassland, Woodland]
    active: [Morning, Day]
    evolves-from: Happiny
    evolves-into:
      - species: Blissey
        method: [Friendship]
    held: { common: OranBerry, uncommon: SilkScarf, rare: LuckyEgg }
  Blissey:
    types: [Normal]
    egg-groups: [Fairy]
    biomes: [Grassland, Woodland]
    active: [Morning, Day]
    evolves-from: Chansey
  # A Chansey before it has an egg to carry: a Happiny finds a round
  # white stone instead and will not be told the difference
  Happiny:
    types: [Normal]
    egg-groups: [NoEggsDiscovered]
    biomes: [Grassland, Shrubland, TemperateForest]
    active: any
    evolves-into:
      - species: Chansey
        method: [Level, HeldItem, TimeOfDay]
        level: 15
        item: OvalStone
        time: [Morning, Day]
    rank: baby
