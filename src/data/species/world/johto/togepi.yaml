Togepi:
  types: [Fairy]
  # A baby has nothing to breed with: it is what an egg holds
  egg-groups: [NoEggsDiscovered]
  biomes: [Grassland, Woodland, TemperateForest]
  active: [Morning, Day]
  evolves-into:
    - species: Togetic
      method: [Friendship]
Togetic:
  types: [Fairy, Flying]
  egg-groups: [Flying, Fairy]
  biomes: [Grassland, Woodland, TemperateForest]
  active: [Morning, Day]
  evolves-from: Togepi
  evolves-into:
    - species: Togekiss
      method: [UsedItem]
      item: ShinyStone
# The bird that only turns up where nobody is fighting: a Togekiss
# shares what it has with whoever it decided is worth it
Togekiss:
  types: [Fairy, Flying]
  egg-groups: [Flying, Fairy]
  biomes: [Grassland, Woodland, TemperateForest]
  active: [Morning, Day]
  evolves-from: Togetic
