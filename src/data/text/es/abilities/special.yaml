# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
Boss:
  description: 110 veces sus PS y x2 en las demás estadísticas, pero sus lanzamientos se preparan el doble de despacio. Un movimiento dirigido a un rival golpea a todos, solo debilitarse lo interrumpe, y recibe como máximo 200 de un golpe indirecto o proporcional a los PS y cura como máximo 1.000 PS por segundo.
Shadow:
  description: x1,25 de Ataque y Ataque Esp., x0,75 de Defensa y Defensa Esp.
Totem:
  description: Empieza el combate con su aura subiendo sus estadísticas, y con 1/2 de PS llama a su bando a uno de su línea evolutiva. Su aliado huye cuando él cae.
TotemAlly:
  description: 50 veces sus PS y x1,5 en las demás estadísticas. Huye cuando cae el dominante que lo llamó.
Alpha:
  description: 80 veces sus PS y x1,5 en las demás estadísticas en lugar de las de un jefe. Con 3/4, 1/2 y 1/4 de PS repone su bando hasta 6 de su especie y cura a los que siguen en pie, y todos huyen cuando él cae.
Noble:
  description: No puede debilitarse. Sus PS son su frenesí, y cuando se agota se calma y se va. Con 3/4, 1/2 y 1/4 queda aturdido 4 segundos, sin poder actuar y recibiendo x1,5 de los ataques, y cada 10 segundos entre medias estalla contra todos los rivales tras 1,8 segundos de preparación.
Purified:
  description: La marca de un Pokémon Oscuro purificado, que no vale nada en combate. Como compañero, x1,5 de probabilidad de captura de un Pokémon Oscuro salvaje.
