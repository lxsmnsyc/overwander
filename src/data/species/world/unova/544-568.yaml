Cottonee:
  # The cotton: a Cottonee goes wherever the wind takes it, and a
  # Whimsicott is somewhere else by the time anybody looks
  Cottonee:
    types: [Grass, Fairy]
    egg-groups: [Fairy, Grass]
    biomes: [Grassland, Shrubland]
    active: [Morning, Day]
    evolves-into:
      - species: Whimsicott
        method: [UsedItem]
        item: SunStone
  Whimsicott:
    types: [Grass, Fairy]
    egg-groups: [Fairy, Grass]
    biomes: [Grassland, Shrubland]
    active: [Morning, Day]
    evolves-from: Cottonee
Petilil:
  # The flowers: a Petilil's leaves are bitter enough to wake anybody
  # up, and a Lilligant is a garden nobody can keep
  Petilil:
    types: [Grass]
    egg-groups: [Grass]
    biomes: [TemperateForest, Grassland]
    active: [Morning, Day]
    evolves-into:
      - species: Lilligant
        method: [UsedItem]
        item: SunStone
  Lilligant:
    types: [Grass]
    egg-groups: [Grass]
    biomes: [TemperateForest, Grassland]
    active: [Morning, Day]
    evolves-from: Petilil
Basculin:
  # The two schools share everything but the stripe and the ability
  # behind it: one throws itself about, the other takes the landing

  # The two schools: they look the same to anybody but each other, and
  # they will not share a river. The white stripe is left out until the
  # generation that gives it somewhere to go
  Basculin:
    types: [Water]
    egg-groups: [Water2]
    habitat: Water
    biomes: [Bog, Swamp]
    active: any
  BasculinBlue:
    types: [Water]
    egg-groups: [Water2]
    habitat: Water
    biomes: [Bog, Swamp]
    active: any
    base-form: false
Sandile:
  # The desert crocs: they swim through the sand with only the eyes out,
  # and the black film over those eyes is what lets them look into the
  # glare and wait
  Sandile:
    types: [Ground, Dark]
    egg-groups: [Field]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
    evolves-into:
      - species: Krokorok
        method: [Level]
        level: 29
  Krokorok:
    types: [Ground, Dark]
    egg-groups: [Field]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
    evolves-from: Sandile
    evolves-into:
      - species: Krookodile
        method: [Level]
        level: 40
  Krookodile:
    types: [Ground, Dark]
    egg-groups: [Field]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
    evolves-from: Krokorok
Darumaka:
  # The two shapes share everything but their stats and the second type

  # The daruma dolls: a Darumaka burns whatever it eats down to coal in
  # its belly, and a Darmanitan that has taken enough sits down and
  # stops moving, which is when it is at its most dangerous
  Darumaka:
    types: [Fire]
    egg-groups: [Field]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
    evolves-into:
      - species: Darmanitan
        method: [Level]
        level: 35
  Darmanitan:
    types: [Fire]
    egg-groups: [Field]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
    evolves-from: Darumaka
  DarmanitanZen:
    types: [Fire, Psychic]
    egg-groups: [Field]
    active: [Morning, Day]
    # Sitting down turns it inside out: what it hit with becomes what
    # it thinks with, and it is far harder to shift
    base-form: false
    evolves-from: Darumaka
Maractus:
  # The cactus: it keeps the desert's water for the months there is
  # none, and it rattles its arms to put the birds off
  Maractus:
    types: [Grass]
    egg-groups: [Grass]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
Dwebble:
  # The masons: a Dwebble bores its own rock to live in and carries it
  # everywhere, and a Crustle that loses its slab loses the will to
  # fight along with it
  Dwebble:
    types: [Bug, Rock]
    egg-groups: [Bug, Mineral]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
    evolves-into:
      - species: Crustle
        method: [Level]
        level: 34
  Crustle:
    types: [Bug, Rock]
    egg-groups: [Bug, Mineral]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
    evolves-from: Dwebble
Scraggy:
  # The hoodlums: they hitch their loose skin up to take a blow, and
  # neither of them is ever found on its own
  Scraggy:
    types: [Dark, Fighting]
    egg-groups: [Field, Dragon]
    biomes: [Badlands, Steppe]
    active: [Evening, Night]
    evolves-into:
      - species: Scrafty
        method: [Level]
        level: 39
  Scrafty:
    types: [Dark, Fighting]
    egg-groups: [Field, Dragon]
    biomes: [Badlands, Steppe]
    active: [Evening, Night]
    evolves-from: Scraggy
Sigilyph:
  # The guardian: it flies the same route over the old city it was set
  # to watch and has never once been seen to leave it
  Sigilyph:
    types: [Psychic, Flying]
    egg-groups: [Flying]
    biomes: [Desert, Badlands]
    active: [Morning, Day]
Yamask:
  # The tomb pair: a Yamask carries the face it had when it was a person
  # and cries at it, and a Cofagrigus is what the robbers who went
  # looking for gold ended up inside
  Yamask:
    types: [Ghost]
    egg-groups: [Mineral, Amorphous]
    biomes: [Desert, Badlands]
    active: [Evening, Night]
    evolves-into:
      - species: Cofagrigus
        method: [Level]
        level: 34
  Cofagrigus:
    types: [Ghost]
    egg-groups: [Mineral, Amorphous]
    biomes: [Desert, Badlands]
    active: [Evening, Night]
    evolves-from: Yamask
Tirtouga:
  # The prehistoric turtle out of the Cover Fossil. Nothing that comes
  # out of a fossil spawns, so its biomes are empty on purpose
  Tirtouga:
    types: [Water, Rock]
    egg-groups: [Water1, Water3]
    habitat: Amphibious
    active: any
    evolves-into:
      - species: Carracosta
        method: [Level]
        level: 37
  Carracosta:
    types: [Water, Rock]
    egg-groups: [Water1, Water3]
    habitat: Amphibious
    active: any
    evolves-from: Tirtouga
Archen:
  # The first bird, out of the Plume Fossil. It flew badly and knew
  # it: Defeatist is the whole line's, and nothing spawns from a fossil
  Archen:
    types: [Rock, Flying]
    egg-groups: [Flying, Water3]
    active: any
    evolves-into:
      - species: Archeops
        method: [Level]
        level: 37
  Archeops:
    types: [Rock, Flying]
    egg-groups: [Flying, Water3]
    active: any
    evolves-from: Archen
Trubbish:
  # The rubbish: a Trubbish is a bag somebody left out that started
  # breathing, and a Garbodor is the rest of the tip that joined it
  Trubbish:
    types: [Poison]
    egg-groups: [Mineral]
    biomes: [Badlands, Bog]
    active: [Evening, Night]
    evolves-into:
      - species: Garbodor
        method: [Level]
        level: 36
  Garbodor:
    types: [Poison]
    egg-groups: [Mineral]
    biomes: [Badlands, Bog]
    active: [Evening, Night]
    evolves-from: Trubbish
