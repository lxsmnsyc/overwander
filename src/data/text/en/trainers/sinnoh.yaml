# What Sinnoh's trainer classes are called, and what each says as a duel
# is put to the player. Two regions' worth of one trade share a name; the
# screen adds the region where they do.

Ranger:
  name: Pokémon Ranger
  quote: I look after this stretch of country. That includes deciding who crosses it.
Worker:
  name: Worker
  quote: We dug this tunnel through the mountain. You are the easy part of my day.
Rancher:
  name: Rancher
  quote: I raised every one of these from the herd. They do as they are told.
Cyclist:
  name: Cyclist
  quote: I came down that hill at speed. Keeping up is your problem.
PokeKid:
  name: Poké Kid
  quote: Mine are cuter than yours. They also hit harder. Want to see?
Collector:
  name: Collector
  quote: I have one of everything odd in this country. Beating you would round it off.
Artist:
  name: Artist
  quote: Hold still. I want to paint the moment you realise.
Reporter:
  name: Reporter
  quote: Local trainer loses on camera. I have the headline, I just need you.
RichBoy:
  name: Rich Boy
  quote: Money cannot buy a good pokemon. It can buy a great deal of training.
Waiter:
  name: Waiter
  quote: The kitchen runs hot and so do my pokemon. Order something.
ParasolLady:
  name: Parasol Lady
  quote: Rain does not touch me. Neither will anything you send out.
Twins:
  name: Twins
  quote: We think the same thing at the same time. You are outnumbered twice.
Policeman:
  name: Policeman
  quote: I keep this road quiet. Battling you counts as keeping it quiet.
Jogger:
  name: Jogger
  quote: Twelve miles before breakfast. A battle is my cooldown.
Breeder:
  name: Pokémon Breeder
  quote: Every one of these hatched in my hands. They fight for me because of it.
SinnohAceTrainer:
  name: Ace Trainer
  quote: I have walked every road north of here. None of them stopped me either.
SinnohLass:
  name: Lass
  quote: It is freezing out here and I am still winning. Your turn.
SinnohBugCatcher:
  name: Bug Catcher
  quote: The forest here is full of them, and I got up earliest.
SinnohSwimmer:
  name: Swimmer
  quote: This lake is snowmelt. I swam it anyway. You warm up first.
SinnohYoungster:
  name: Youngster
  quote: I dug through half a mountain to find this one. Look at it!
SinnohSchoolKid:
  name: School Kid
  quote: We are graphing battle outcomes this term. You are one data point.
SinnohCamper:
  name: Camper
  quote: Slept on a slab of rock last night. Found this under it.
SinnohBeauty:
  name: Beauty
  quote: I do contests as well as battles. You only have to lose the one.
SinnohFisherman:
  name: Fisherman
  quote: Cut a hole in the ice and waited four hours. You are the better catch.
SinnohSailor:
  name: Sailor
  quote: I run the boat across the bay. The crossing is rougher than I am.
SinnohGentleman:
  name: Gentleman
  quote: A little sport before dinner. Do try to make it interesting.
SinnohScientist:
  name: Scientist
  quote: We study the pokemon that come out of the mountain. Yours will do as a control.
SinnohBirdKeeper:
  name: Bird Keeper
  quote: Mine fly over the whole range. Nothing down here worries them.
SinnohHiker:
  name: Hiker
  quote: Up the pass and back before noon. You are in the way of the descent.
SinnohPsychic:
  name: Psychic
  quote: The lake spirits leave a sort of hum behind. I have been listening for years.
SinnohSkier:
  name: Skier
  quote: The powder up here is the best there is. So is my team.
SinnohBlackBelt:
  name: Black Belt
  quote: The dojo in Veilstone turns nobody away. It also lets nobody off.
SinnohDragonTamer:
  name: Dragon Tamer
  quote: Found the egg in a cave under the peak. Raised what came out of it.
SinnohGuitarist:
  name: Guitarist
  quote: Sunyshore runs on solar power. So does this amplifier. Stand back.
SinnohAromaLady:
  name: Aroma Lady
  quote: Everything here grows slowly and holds on hard. Mine included.
SinnohRuinManiac:
  name: Ruin Maniac
  quote: There are chambers under this country older than the league. I dig them out.
SinnohNinjaBoy:
  name: Ninja Boy
  quote: You walked straight past me twice. The third time costs you a battle.
SinnohTuber:
  name: Tuber
  quote: The water is cold and I am not getting out. Battle me from there.
SinnohPokeFan:
  name: Poké Fan
  quote: I have photographs of every one of these. Now I want one of you losing.
SinnohRoughneck:
  name: Roughneck
  quote: We hold this stretch of road. Toll is one battle, win or lose.
SinnohClown:
  name: Clown
  quote: Watch the hands. No, the other hands. Too late.
SinnohCouple:
  name: Young Couple
  quote: We walked the whole route together. We will take you together as well.
