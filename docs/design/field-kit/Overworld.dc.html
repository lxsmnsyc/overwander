<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overworld HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.world{position:absolute;inset:0;background-color:#7CC36A;background-image:linear-gradient(rgba(0,0,0,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.05) 2px,transparent 2px);background-size:32px 32px}
.water{position:absolute;background:#5AA9E6;background-image:linear-gradient(rgba(255,255,255,.18) 2px,transparent 2px);background-size:32px 16px;animation:wave 2400ms steps(4,end) infinite}
@keyframes wave{to{background-position:0 16px}}
.tree{position:absolute;width:32px;height:32px;border-radius:8px 8px 4px 4px;background:#2F7A3E;box-shadow:inset 0 -8px 0 0 #245E30}
.mon{position:absolute;width:24px;height:24px;border-radius:6px;background:#F2B33D;animation:bob 1200ms steps(2,end) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.glass{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:2px solid #C3D2E8;box-shadow:0 4px 0 0 rgba(20,32,58,.2),0 18px 30px -18px rgba(20,32,58,.6)}
.trainer{position:relative;width:76px;height:76px;border-radius:24px;border:0;padding:0;cursor:pointer;background:transparent;transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.trainer:hover{transform:translateY(-3px)}
.trainer:active{transform:scale(.92)}
.face{position:absolute;inset:10px;border-radius:16px;background:#E3EEFB;border:2px solid #2360C8;box-shadow:0 3px 0 0 #102E63}
.count{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;background:#D6372A;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;animation:pop 2400ms cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes pop{0%,82%{transform:scale(1)}90%{transform:scale(1.25)}100%{transform:scale(1)}}
.capsule{border:0;cursor:pointer;font-family:Nunito,sans-serif;text-align:left;transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.capsule:hover{transform:translateY(-2px)}
.fm{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;cursor:pointer;font-family:Nunito,sans-serif;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.fm span.b{width:56px;height:56px;border-radius:28px;background:#fff;border:3px solid #2360C8;display:flex;align-items:center;justify-content:center;color:#2360C8;box-shadow:0 3px 0 0 rgba(16,46,99,.35);transition:transform 140ms cubic-bezier(.34,1.56,.64,1)}
.fm:hover span.b{transform:translateY(-3px)}
.fm:active span.b{transform:scale(.9)}
.fm.on span.b{background:#2360C8;color:#fff;box-shadow:0 3px 0 0 #102E63,0 0 0 4px rgba(35,96,200,.25)}
.kit{position:absolute;left:20px;bottom:108px;width:520px;border-radius:24px;background:#fff;border:2px solid #C3D2E8;box-shadow:0 6px 0 0 rgba(16,46,99,.25),0 28px 48px -18px rgba(20,32,58,.6);transform-origin:38px 110%;animation:kit 360ms cubic-bezier(.34,1.56,.64,1) both;overflow:hidden}
@keyframes kit{from{transform:scale(.15);opacity:0;border-radius:40px}}
.row{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:12px;border:0;background:transparent;width:100%;font-family:Nunito,sans-serif;font-size:13px;font-weight:800;color:#14203A;cursor:pointer;animation:rise 240ms cubic-bezier(.2,.8,.2,1) both;transition:background 140ms}
.row:hover{background:#E3EEFB}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.row .n{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:#D6372A;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}
.grp{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#2360C8;padding:4px 10px}
.card{position:absolute;left:50%;bottom:20px;width:360px;margin-left:-180px;border-radius:24px;background:#fff;border:2px solid #C3D2E8;box-shadow:0 6px 0 0 rgba(16,46,99,.25),0 28px 48px -18px rgba(20,32,58,.6);transform-origin:50% 100%;animation:morph 360ms cubic-bezier(.34,1.56,.64,1) both;padding:14px;box-sizing:border-box}
@keyframes morph{from{transform:scaleX(.7) scaleY(.25);opacity:.4}}
.toast{position:absolute;top:16px;left:50%;width:320px;margin-left:-160px;border-radius:18px;background:#fff;border:2px solid #2360C8;overflow:hidden;animation:toast 4600ms cubic-bezier(.34,1.56,.64,1) both}
@keyframes toast{0%{transform:translateY(-130%)}8%,90%{transform:none}100%{transform:translateY(-130%)}}
.life{height:4px;background:#2360C8;transform-origin:left;animation:life 4100ms 200ms linear both}
@keyframes life{to{transform:scaleX(0)}}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: Nunito, sans-serif; color: #14203A">
<div class="world"></div>
<div class="water" style="left: 0; top: 0; width: 288px; height: 224px"></div>
<div class="tree" style="left: 864px; top: 128px"></div><div class="tree" style="left: 896px; top: 128px"></div><div class="tree" style="left: 1056px; top: 448px"></div><div class="tree" style="left: 384px; top: 512px"></div>
<div style="position: absolute; left: 624px; top: 328px; width: 32px; height: 32px; border-radius: 8px; background: #fff; border: 3px solid #14203A; box-sizing: border-box"></div>
<div class="mon" style="left: 548px; top: 300px"></div><div class="mon" style="left: 712px; top: 404px; background: #9C7BF0; animation-delay: 300ms"></div><div class="mon" style="left: 1000px; top: 300px; background: #F0584A; animation-delay: 600ms"></div>

<button class="glass" aria-label="Fullscreen" style="position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14203A" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>

<div class="toast" role="status"><div style="display: flex; gap: 10px; padding: 10px 12px; align-items: center"><span style="width: 32px; height: 32px; border-radius: 9px; background: #F2B33D"></span><div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 800; font-size: 14px">Gift waiting</span><span style="font-size: 12px; color: #52627F">A daily gift is in your inbox.</span></div></div><div class="life"></div></div>

<sc-if value="{{ kitOpen }}" hint-placeholder-val="{{ false }}">
<div class="kit" role="dialog" aria-label="Menu">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 10px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
<div role="group" aria-label="{{ g.label }}" style="display: flex; flex-direction: column"><div class="grp">{{ g.label }}</div>
<sc-for list="{{ g.entries }}" as="e" hint-placeholder-count="4"><button class="row" style="animation-delay: {{ e.delay }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2360C8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="{{ e.icon }}"></path></svg>{{ e.label }}<sc-if value="{{ e.hasCount }}" hint-placeholder-val="{{ false }}"><span class="n">{{ e.count }}</span></sc-if></button></sc-for>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 6px; padding: 8px 10px; background: #F4F7FC; border-top: 2px solid #E7EEF8"><button class="row" style="width: auto; animation-delay: 300ms">Settings</button><span style="flex-grow: 1"></span><button class="row" style="width: auto; animation-delay: 330ms" aria-label="Night mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"></path></svg>Night</button></div>
</div>
</sc-if>

<div style="position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 10px">
<button class="trainer" onClick="{{ toggleKit }}" aria-label="Menu, 3 waiting">
<svg width="76" height="76" viewBox="0 0 76 76" style="position: absolute; inset: 0" aria-hidden="true"><circle cx="38" cy="38" r="34" fill="rgba(255,255,255,.95)" stroke="#E7EEF8" stroke-width="5"></circle><circle cx="38" cy="38" r="34" fill="none" stroke="#1E8F52" stroke-width="5" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="75" transform="rotate(-90 38 38)"></circle></svg>
<span class="face" style="border-radius: 50%; inset: 14px"></span><span class="count">3</span>
</button>
<div class="glass" style="border-radius: 14px; padding: 6px 12px; display: flex; flex-direction: column; line-height: 17px"><span style="font-weight: 800; font-size: 13px">Alexis</span><span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 13px; color: #8A5E00">12,500 gold</span><span style="font-size: 11px; color: #1E8F52; font-weight: 800">Egg: 1,280 steps</span></div>
</div>

<sc-if value="{{ placeClosed }}" hint-placeholder-val="{{ true }}">
<button class="capsule glass" onClick="{{ togglePlace }}" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); border-radius: 22px; padding: 8px 18px; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFF3D6; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C98A0A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 18px">Shellford Town</span><span style="font-size: 12px; color: #52627F; font-weight: 700">Clear · Morning 9:12 am</span></span>
</button>
</sc-if>
<sc-if value="{{ placeOpen }}" hint-placeholder-val="{{ false }}">
<div class="card" role="dialog" aria-label="Shellford Town">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 18px">Shellford Town, Ashmarch</span><button onClick="{{ togglePlace }}" aria-label="Close" style="width: 36px; height: 36px; border-radius: 12px; border: 2px solid #C3D2E8; background: #fff; cursor: pointer">×</button></div>
<div style="display: flex; gap: 10px; align-items: center; margin-top: 8px; padding: 10px; border-radius: 16px; background: #FFF8E6"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C98A0A" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg><div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1"><span style="font-weight: 800">Clear · Morning, 9:12 am</span><span style="font-size: 12px; color: #52627F">A cloudless sky; nothing in the air.</span><span style="display: flex; gap: 4px"><span style="height: 20px; padding: 0 8px; border-radius: 999px; background: #F0584A; color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center">Fire</span><span style="height: 20px; padding: 0 8px; border-radius: 999px; background: #6FB458; color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center">Grass</span></span></div></div>
<div style="margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 11px">
<sc-for list="{{ windows }}" as="w" hint-placeholder-count="6"><div style="padding: 6px 8px; border-radius: 12px; background: #F4F7FC; display: flex; flex-direction: column"><span style="font-weight: 800">{{ w.label }}</span><span style="font-family: Fredoka, sans-serif; font-size: 13px; color: #2360C8">{{ w.left }}</span></div></sc-for>
</div>
</div>
</sc-if>

<div style="position: absolute; right: 20px; bottom: 20px; display: flex; gap: 14px">
<sc-for list="{{ moves }}" as="mv" hint-placeholder-count="2"><button class="{{ mv.cls }}" onClick="{{ mv.toggle }}" aria-pressed="{{ mv.on }}"><span class="b"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="{{ mv.icon }}"></path></svg></span>{{ mv.name }}</button></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { kit: false, place: false, surf: true, smash: false }; }
  renderVals() {
    const groups = [
      { label: 'You', entries: [['Boxes', 'M8 10h8M8 14h5', 0], ['Bag', 'M9 4v3h6V4M8 12h8', 0], ['Pokedex', 'M12 8v8M8 12h8', 0], ['Profile', 'M12 8a2 2 0 1 0 0 .1M8 17h8', 1]] },
      { label: 'Play', entries: [['World', 'M4 8l5-2 6 2 5-2v10l-5 2-6-2-5 2z', 0], ['Quests', 'M8 9h8M8 13h8M8 17h4', 2], ['Battle', 'M7 17l10-10M9 7h8v8', 0], ['Raids', 'M12 6c3 4 3 8 0 12-3-4-3-8 0-12z', 0]] },
      { label: 'Inbox', entries: [['Notices', 'M8 10a4 4 0 0 1 8 0v4H8z', 0], ['Gifts', 'M6 10h12v8H6zM12 10v8', 1], ['News', 'M7 8h10M7 12h10M7 16h6', 0]] },
    ];
    let n = 0;
    return {
      kitOpen: this.state.kit,
      toggleKit: () => this.setState({ kit: !this.state.kit, place: false }),
      placeOpen: this.state.place, placeClosed: !this.state.place,
      togglePlace: () => this.setState({ place: !this.state.place, kit: false }),
      groups: groups.map((g) => ({ label: g.label, entries: g.entries.map(([label, icon, count]) => ({ label, icon, count, hasCount: count > 0, delay: (60 + n++ * 25) + 'ms' })) })),
      windows: [['Pokémon', 'in 3m'], ['Landmarks', 'in 13m'], ['Weather', 'in 48m'], ['Phenomena', 'in 48m'], ['Raids', 'in 2h 48m'], ['Nests', 'in 8h 48m']].map(([label, left]) => ({ label, left })),
      moves: [
        { name: 'Surf', icon: 'M2 14c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2', on: this.state.surf, cls: this.state.surf ? 'fm on' : 'fm', toggle: () => this.setState({ surf: !this.state.surf }) },
        { name: 'Rock Smash', icon: 'M4 20l6-8 3 4 7-10', on: this.state.smash, cls: this.state.smash ? 'fm on' : 'fm', toggle: () => this.setState({ smash: !this.state.smash }) },
      ],
    };
  }
}
</script>
</body>
</html>
