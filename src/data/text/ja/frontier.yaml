# フロンティアブレーンの なまえと、 かれらの しせつの なまえと、 はいる ときの あいさつ

Brandon:
  name: ジンダイ
  house: バトルピラミッド
  greeting: わたしの ピラミッドへ ようこそ。 すべてを いりぐちに おいて のぼれ。
Greta:
  name: コゴミ
  house: バトルアリーナ
  greeting: じかんは すすんで いる。 ほんきで たたかえ。 しんぱんが みて いる からな。
Lucy:
  name: アザミ
  house: バトルチューブ
  greeting: カーテンを えらびなさい。 うらに なにが あるかは わたしの しわざでは ないし、 きょうみも ないわ。
Noland:
  name: ダツラ
  house: バトルファクトリー
  greeting: ここに あなたの ものも わたしの ものも ない。 みっつ えらんで みよう。
Anabel:
  name: リラ
