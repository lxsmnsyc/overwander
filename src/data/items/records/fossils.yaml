# The `fossils` sheet names them by the rock rather than by the item, so
# the word "fossil" is the part that is dropped from the icon.
#
# Spent when it is revived, and worth nothing to anybody else: no vendor
# stocks one and no vendor takes one.

HelixFossil:
  type: Fossil
  icon: fossils/helix
  flags: [Consumable]

