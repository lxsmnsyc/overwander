# The Zeniths of the pokemon this stretch of the dex holds, keyed by
# species, in the order the dex meets their pokemon, then the Hisuian
# finals of older lines. Each fights 100 above its pokemon's base stat
# total with its HP untouched, held to by a test, and wears an
# `ability` the line can never be born with. Everything not written
# here is read off `base`.

# The orbs in its antlers bend the space around it into a psychic field
WyrdeerZenith:
  base: Wyrdeer
  stats: { HP: 103, Attack: 115, Defense: 92, SpecialAttack: 145, SpecialDefense: 95, Speed: 75 }
  types: [Normal, Psychic]
  ability: PsychicSurge
  shard: WyrdeerZenithShard

