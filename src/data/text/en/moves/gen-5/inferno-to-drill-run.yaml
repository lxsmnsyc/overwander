Inferno:
  name: Inferno
  description: Burns the target if it lands.
WaterPledge:
  name: Water Pledge
  description: Lands at 150 after a teammate's Fire or Grass Pledge in the last 2 seconds. With Fire it leaves a rainbow over the user's team, with Grass a swamp under the target's.
FirePledge:
  name: Fire Pledge
  description: Lands at 150 after a teammate's Grass or Water Pledge in the last 2 seconds. With Grass it leaves a sea of fire under the target's team, with Water a rainbow over the user's.
GrassPledge:
  name: Grass Pledge
  description: Lands at 150 after a teammate's Water or Fire Pledge in the last 2 seconds. With Water it leaves a swamp under the target's team, with Fire a sea of fire.
VoltSwitch:
  name: Volt Switch
  description: The user swaps out for a teammate once it lands.
StruggleBug:
  name: Struggle Bug
  description: Hits everything opposite, and drops each one's Special Attack a stage.
Bulldoze:
  name: Bulldoze
  description: Hits the user's own team and everything opposite, and drops each one's Speed a stage.
FrostBreath:
  name: Frost Breath
  description: Always lands a critical.
DragonTail:
  name: Dragon Tail
  description: Throws the target off the field and drags its weakest teammate in. Slow to cast.
WorkUp:
  name: Work Up
  description: Raises the user's Attack and Special Attack a stage each.
Electroweb:
  name: Electroweb
  description: Hits everything opposite, and drops each one's Speed a stage.
WildCharge:
  name: Wild Charge
  description: The user takes 1/4 of the damage it deals.
DrillRun:
  name: Drill Run
  description: Lands a critical more often than most.
