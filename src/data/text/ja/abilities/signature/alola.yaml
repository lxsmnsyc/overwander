# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
QuillAudience:
  name: はねのかんきゃく
  description: たっている あいて 1ぴきごとに すばやさが 1.1ばいに かぞえられ、 4ひきぶんまで。
HeelAudience:
  name: わるもののかんきゃく
  description: たっている あいて 1ぴきごとに こうげきが 1.1ばいに かぞえられ、 4ひきぶんまで。
AriaAudience:
  name: アリアのかんきゃく
  description: たっている みかた 1ぴきごとに とくこうが 1.1ばいに かぞえられ、 4ひきぶんまで。
Drumroll:
  name: ドラムロール
  description: れんぞくわざの こうげきかいすうが 1かい ふえる。
ScoreToSettle:
  name: かりをかえす
  description: さいごに こうげきしてきた あいてへの わざの いりょくが 1.3ばいに なる。
TrickleCharge:
  name: じりじりじゅうでん
  description: だれかが でんきタイプの わざを あてる たびに、 どちらの がわでも とくこうが 10% あがり、 さいだい 1.5ばいに なる。
ReboundPunch:
  name: はねかえりのこぶし
  description: パンチわざが はずれたり ふせがれたり すると、 つぎの パンチわざの いりょくが 1.5ばいに なる。
DizzyTwirl:
  name: ふらつきのまい
  description: こんらんしている あいだ、 じぶんを こうげきせず、 わざの いりょくが 1.3ばいに なる。
HoneyShare:
  name: はちみつのおすそわけ
  description: いる あいだ、 みかたが たべた きのみの かいふくりょうが 1.5ばいに なり、 のうりょくが あがる きのみは あがる ランクが 1だん ふえる。
Provoke:
  name: いどみかけ
  description: あてた あいては、 つぎの たんたいの わざを この ポケモンに むけなければ ならない。
Regroup:
  name: さいしゅうけつ
  description: ひとりで およいでいる あいだ、 こうどうする たびに HPが 1/8 かいふくする。 むれが また あつまる ための ちから。
HeavyHooves:
  name: おもいひづめ
  description: じぶんの おもさが 20kgごとに ぶつりわざの いりょくが 1% ふえ、 さいだい 1.4ばいに なる。
BubbleWard:
  name: あわのまく
  description: いる あいだ、 みかたが ほのおタイプの わざから うける ダメージが 0.75ばいに なり、 やけどを しない。
OrchidGuise:
  name: オーキッドのよそおい
  description: はじめて こうげきを あてるまで、 あいては この ポケモンに たんたいの わざを むけられない。 その こうげきは いりょくが 1.3ばいに なる。
TropStride:
  name: なんごくのあしどり
  description: けりわざの いりょくが 1.3ばいに なる。
DrowsyGlow:
  name: ねむけのひかり
  description: ダメージを あたえる わざを あてると、 20%の かくりつで あいてに あくびを つかう。
LeiGift:
  name: レイのおくりもの
  description: フィールドに でると、 いちばん きずついた みかたに レイを おくり、 その みかたは バトルの あいだ こうどうする たびに HPが 1/16 かいふくする。
SagesCall:
  name: けんじゃのよびごえ
  description: こうどうする たびに、 こうげきか とくこうが いちばん たかい みかたの つぎの わざの じゅんびが 25% はやく おわる。
RushPass:
  name: はやがけ
  description: ふだんより はやく だされた わざは、 いりょくが 1.3ばいに なる。
ToxicDome:
  name: どくのドーム
  description: フィールドに でる たびに、 そのあと はじめて うける こうげきの ダメージが 0.5ばいに なり、 こうげきした あいてに どくどくを つかう。
FumeFlare:
  name: どくのほのお
  description: ほのおタイプの わざは、 20%の かくりつで あいてを どくに する。
FondCrush:
  name: ほれこみ
  description: メロメロの あいてへの わざの いりょくが 1.3ばいに なる。
OpeningSlash:
  name: ひとふりめ
  description: フィールドに でる たびに、 そのあと はじめて あてた わざの いりょくが 1.5ばいに なる。
CastleDrain:
  name: とりでのすいとり
  description: ちょくせつこうげきの わざを あててきた あいての HPが 1/8 へり、 その ぶんだけ HPが かいふくする。
TossedBack:
  name: なげもどし
  description: ひんしに なる こうげきを うけても、 はじめの 1かいは HP 1で こらえ、 フィールドから はずれて いちばん つよい みかたと いれかわる。 バトルに つき 1かいだけ。
Starfall:
  name: ながれぼし
  description: フィールドに でる たびに、 そのあと はじめて だす わざの じゅんびが 50% はやく おわる。
ChargedSpines:
  name: たいでんのとげ
  description: ちょくせつこうげきの わざを うけると たいでんし、 つぎに あてた でんきタイプの わざの いりょくが 1.5ばいに なる。
NapTime:
  name: ひるね
  description: 3かい こうどうする ごとに HPが 1/4 かいふくする。
BlastShell:
  name: ばくだんのこうら
  description: じぶんか みかたが ぶつりわざを うけると ちからを ためて、 つぎに あてた ほのおタイプの わざの いりょくが 1.5ばいに なる。
EldersIre:
  name: ちょうろうのいかり
  description: じぶんか みかたが とくしゅわざを うけると ちからを ためて、 つぎに あてた ドラゴンタイプの わざの いりょくが 1.5ばいに なる。
GrudgeShroud:
  name: うらみのとばり
  description: それぞれの あいてに はじめて わざを あてられた とき、 その あいてに うらみを つかう。
MemoryEcho:
  name: きおくのこだま
  description: こうかばつぐんの わざの いりょくが 1.2ばいに なる。
PsychicGnash:
  name: サイコのはぎしり
  description: かみつく わざは、 20%の かくりつで あいてを こんらんさせる。
GhostShip:
  name: ゆうれいせん
  description: あめが ふっている あいだ、 ゴーストタイプと くさタイプの わざの いりょくが 1.3ばいに なる。
WarClangor:
  name: いくさのとどろき
  description: あてた おとの わざごとに、 ぼうぎょが 1だん あがる。 3だんまで。
StormBlessing:
  name: いかずちのしゅくふく
  description: エレキフィールドの あいだ、 てもち ぜんいんの すばやさが 1.25ばいに かぞえられる。
MindBlessing:
  name: サイコのしゅくふく
  description: サイコフィールドの あいだ、 てもち ぜんいんの とくこうが 1.25ばいに かぞえられる。
WildBlessing:
  name: もりのしゅくふく
