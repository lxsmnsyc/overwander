# The one that waits under the sand: a Skorupi holds still until
# something walks over it, and a Drapion holds whatever it caught
Skorupi:
  types: [Poison, Bug]
  egg-groups: [Bug, Water3]
  biomes: [Desert, Shrubland, Steppe]
  active: [Evening, Night]
  evolves-into:
    - species: Drapion
      method: [Level]
      level: 40
Drapion:
  types: [Poison, Dark]
  egg-groups: [Bug, Water3]
  biomes: [Desert, Shrubland, Steppe]
  active: [Evening, Night]
  evolves-from: Skorupi
