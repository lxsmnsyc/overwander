Exeggcute:
  types: [Grass, Psychic]
  egg-groups: [Grass]
  biomes: [TropicalRainforest, TropicalSeasonalForest]
  active: any
  # Both Exeggutor take the same stone, and the catch sheet lets the player pick
  evolves-into:
    - species: Exeggutor
      method: [UsedItem]
      item: LeafStone
    - species: ExeggutorAlola
      method: [UsedItem]
      item: LeafStone
Exeggutor:
  types: [Grass, Psychic]
  egg-groups: [Grass]
  biomes: [TropicalRainforest, TropicalSeasonalForest]
  active: any
  evolves-from: Exeggcute
ExeggutorAlola:
  types: [Grass, Dragon]
  egg-groups: [Grass]
  biomes: [Beach]
  active: any
  base-form: false
  evolves-from: Exeggcute
