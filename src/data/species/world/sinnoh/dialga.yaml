# The three the world was made with: one that decides when a thing
# happens, one that decides where, and the one that was thrown out
# for what it did with either.

# Each of them keeps a second shape, which is what it looks like on
# the other side of its own doorway. A shape is worn rather than met:
# an orb held into a fight is the only way to see one

Dialga:
  types: [Steel, Dragon]
  egg-groups: [NoEggsDiscovered]
  biomes: [AlpineTundra]
  active: any
DialgaOrigin:
  types: [Steel, Dragon]
  egg-groups: [NoEggsDiscovered]
  active: any
  base-form: false
  # Worn rather than met, so the dex fills it in the day its
  # own shape is
  worn: true
