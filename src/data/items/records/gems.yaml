# Unlike every other type item they are consumable: landing the move is
# what spends one. A gem costs a fraction of the booster it out-hits,
# because it only has the one hit in it.
#
# The `gems` sheet holds one per type, named after the type, so the
# gem's own picture is the type it belongs to.

NormalGem:
  type: Held
  icon: gems/normal
  flags: [Consumable, Holdable, Marketable]
  buy: 1500
  sell: 750

