Meltan:
  Meltan:
    types: [Steel]
    egg-groups: [NoEggsDiscovered]
    # Where there is bare metal in the ground to eat
    biomes: [Badlands]
    active: any
    # The mainline asks for 400 candy in GO. Candy here feeds levels,
    # so the same feeding is written as a level
    evolves-into:
      - species: Melmetal
        method: [Level]
        level: 40
    rank: mythical
