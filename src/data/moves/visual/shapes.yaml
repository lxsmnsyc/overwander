# Each way a move can land, keyed by the shape, in the order they were added:
#
# - `span`: how long it runs at ordinary weight, in milliseconds. Wishing
#   and Starfall are timed to the engine's wait instead, in effect/shapes.ts
# - `jolt`: how hard it shakes the scene at ordinary weight, in drawing pixels
# - `arrives`: it crosses the gap or comes down on the target by itself, so
#   the wait before it is the caster winding up rather than a throw
# - `wait`: how the gap before it is spent, where the move does not say
# - `color`: what it is drawn in, where the move's type colour would be wrong
# - `staged`: it pictures a stat moving, and so takes that stat's colour
# - `types`: the types a move falls back on it for when nothing else picks

