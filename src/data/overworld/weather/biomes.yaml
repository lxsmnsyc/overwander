# The skies each country can show, one per band of a reading: clear and
# stirred when dry, then damp, wet and a storm as a front comes in, and a
# `rare` showpiece of its own where it has one. The four `corners` fall over
# every country alike; `corners: false` leaves a country without them.

corners:
  wildest: MeteorShower
  stillest: FataMorgana
  bleakest: DarkDay
  thickest: Fogbow

