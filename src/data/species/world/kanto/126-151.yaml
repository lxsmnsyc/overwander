Eevee:
  Eevee:
    types: [Normal]
    egg-groups: [Field]
    biomes: [Grassland, Woodland]
    active: any
    # The mainline asks for any Fairy move; Baby-Doll Eyes is the
    # one an Eevee learns by itself, so it stands for the lot
    evolves-into:
      - species: Vaporeon
        method: [UsedItem]
        item: WaterStone
      - species: Jolteon
        method: [UsedItem]
        item: ThunderStone
      - species: Flareon
        method: [UsedItem]
        item: FireStone
      - species: Espeon
        method: [Friendship, TimeOfDay]
        time: [Morning, Day]
      - species: Leafeon
        method: [UsedItem]
        item: LeafStone
      - species: Glaceon
        method: [UsedItem]
        item: IceStone
      - species: Umbreon
        method: [Friendship, TimeOfDay]
        time: [Evening, Night]
      - species: Sylveon
        method: [Friendship, KnownMove]
        move: BabyDollEyes
  Vaporeon:
    types: [Water]
    egg-groups: [Field]
    habitat: Amphibious
    biomes: [Beach, Ocean]
    active: any
    evolves-from: Eevee
  Jolteon:
    types: [Electric]
    egg-groups: [Field]
    biomes: [Grassland]
    active: any
    evolves-from: Eevee
  Flareon:
    types: [Fire]
    egg-groups: [Field]
    biomes: [Shrubland, Grassland]
    active: any
    evolves-from: Eevee
  Espeon:
    types: [Psychic]
    egg-groups: [Field]
    biomes: [Grassland]
    active: [Morning, Day]
    evolves-from: Eevee
  Umbreon:
    types: [Dark]
    egg-groups: [Field]
    biomes: [Woodland]
    active: [Evening, Night]
    evolves-from: Eevee
  # The Eevee that settled in a wood and stayed: a Leafeon lives off
  # the light and smells like the clearing it sleeps in
  Leafeon:
    types: [Grass]
    egg-groups: [Field]
    biomes: [TemperateForest, Woodland, TemperateRainforest]
    active: [Morning, Day]
    evolves-from: Eevee
  # The Eevee that settled where the snow does: a Glaceon drops its own
  # temperature until the air around it freezes
  Glaceon:
    types: [Ice]
    egg-groups: [Field]
    biomes: [Glacier, Tundra, AlpineTundra, Taiga]
    active: any
    evolves-from: Eevee
  # The ribboned one, which an Eevee grows into by being kept close
  Sylveon:
    types: [Fairy]
    egg-groups: [Field]
    biomes: [Grassland, Woodland]
    active: any
    evolves-from: Eevee
