        level: 20
  Swadloon:
    types: [Bug, Grass]
    egg-groups: [Bug]
    biomes: [TemperateForest, Woodland]
    active: [Morning, Day]
    evolves-from: Sewaddle
    evolves-into:
      - species: Leavanny
        method: [Friendship]
  Leavanny:
    types: [Bug, Grass]
    egg-groups: [Bug]
    biomes: [TemperateForest, Woodland]
    active: [Morning, Day]
    evolves-from: Swadloon
Venipede:
