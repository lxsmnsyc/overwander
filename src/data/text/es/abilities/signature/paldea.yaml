# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
PetalScatter:
  name: Dispersión de Pétalos
  description: Un golpe crítico de tipo Planta también hace 1/4 de ese daño a todos los demás rivales.
SpreadingFlame:
  name: Llama Contagiosa
  description: Una quemadura que causa con un movimiento de tipo Fuego también quema al otro rival con menos PS.
Wake:
  name: Oleaje de Popa
  description: Un movimiento de tipo Agua que acierta baja 1 nivel la Velocidad del objetivo y también la de todos los demás rivales, como mucho una vez cada 8 segundos.
PigOut:
  name: Atracón
  description: Cada vez que come una baya, usa Reserva sobre sí mismo.
Tripwire:
  name: Cable Trampa
  description: Un rival que entra al campo en pleno combate tarda un 50 % más en preparar su primer movimiento.
Knockback:
  name: Empuje
  description: Cada movimiento de contacto que acierta retrasa 0,5 segundos la preparación en curso del objetivo.
StaticPalms:
  name: Palmas Estáticas
  description: Sus movimientos de puñetazo paralizan al objetivo con un 20 % de probabilidad.
ScatterBrood:
  name: Nidada Dispersa
  description: Sus movimientos de varios golpes envían cada golpe a un rival en pie distinto, por turnos.
FreshBatch:
  name: Hornada Fresca
  description: Cada 20 segundos entrega una Baya Zidra al aliado con menos PS que tenga las manos vacías.
Anoint:
  name: Ungüento
  description: Toda curación que da a un aliado cura también su problema de estado principal.
BrineRebound:
  name: Salmuera Rebotada
  description: Un movimiento de tipo Agua que le acierta le hace usar Salazón sobre quien lo lanzó, como mucho una vez cada 10 segundos.
Kindling:
  name: Yesca
  description: Cada movimiento de tipo Fuego que acierta hace que el siguiente se prepare un 25 % más rápido.
BubbleShock:
  name: Choque de Burbujas
  description: Sus movimientos de tipo Eléctrico tienen x1,5 de potencia contra un objetivo que haya recibido un movimiento de tipo Agua en los últimos 4 segundos.
LightningDive:
  name: Picado Relámpago
  description: Con Viento Afín en su bando, sus movimientos de tipo Eléctrico tienen x1,3 de potencia.
Windswept:
  name: Llevado por el Viento
  description: Cuando un movimiento de viento acierta a cualquiera, su siguiente movimiento se prepara un 50 % más rápido.
MyceliumMat:
  name: Alfombra de Micelio
  description: Mientras está en el campo, cada vez que Campo de Hierba cura a un aliado también le cura un problema de estado principal.
HeatTolerance:
  name: Tolerancia al Calor
  description: Una quemadura le restaura 1/8 de sus PS cada vez que actúa en lugar de dañarle, y no reduce su Ataque a la mitad.
BallToss:
  name: Lanzamiento de Pelota
  description: Cuando un aliado sin objeto baja de 1/3 de PS, le entrega el suyo, una vez por combate.
StareDown:
  name: Duelo de Miradas
  description: Cada movimiento de tipo Psíquico que acierta usa Mofa sobre el objetivo, como mucho una vez cada 10 segundos por objetivo.
Tinker:
  name: Apaño
  description: La primera vez que cada aliado gasta su objeto, lo rehace. Una vez por aliado y combate.
SandDuck:
  name: Esquiva en la Arena
  description: Los movimientos de tipo Tierra dirigidos a él fallan, y cada uno que falla le sube 1 nivel la Velocidad.
Lifeguard:
  name: Socorrista
  description: Mientras tiene más de 1/2 de PS, recibe él en su lugar el primer golpe del combate que debilitaría a un aliado. Una vez por aliado.
Redline:
  name: Zona Roja
  description: Sus movimientos se preparan más rápido cuanto menos PS tiene, de un 0 % más rápido con los PS al máximo a un 30 % más rápido con casi ninguno.
ShedDecoy:
  name: Señuelo de Muda
  description: La primera vez que sus PS bajan de 1/2 en un combate, usa Sustituto sin pagar los PS.
SlagTrail:
  name: Rastro de Escoria
  description: Cada movimiento de tipo Acero que acierta coloca una capa de Púas en el bando del objetivo, como mucho una vez cada 10 segundos.
Glimmering:
  name: Brillo Tenue
  description: Mientras está en el campo, todo rival envenenado tarda un 20 % más en preparar sus movimientos.
GraveDigger:
  name: Sepulturero
  description: Cuando un aliado se debilita con un objeto y él tiene las manos vacías, el objeto pasa a sus manos.
SnowHoard:
  name: Acopio de Nieve
  description: Con nieve o granizo, gana 1 nivel de Ataque cada 4 segundos, hasta +3 por esto.
FilletThrift:
  name: Ahorro de Filete
  description: Los movimientos que cuestan PS (Deslome, Sustituto, Tambor, Autotomía) le cuestan la mitad.
Mouthful:
  name: Bocado
  description: 'Cuando un aliado baja de 1/3 de PS, se lo traga: durante 4 segundos nadie puede apuntarle y el aliado restaura 1/4 de sus PS, una vez por aliado y combate.'
BackSeatOrders:
  name: Órdenes desde Atrás
  description: Mientras está tras un Sustituto o bajo su propia Protección, cada movimiento que acierta un aliado tiene x1,2 de potencia.
GlaiveGuard:
  name: Guardia de Guja
  description: Tras un movimiento que lo deja expuesto (Asalto Espadón, Enfado, una recarga), su Defensa y su Defensa Esp. valen +2 hasta que vuelva a actuar.
BogDown:
  name: Atolladero
  description: Un rival que le acierta un movimiento de tipo Tierra no puede cambiar durante 6 segundos.
Raging:
  name: Enfurecido
  description: Mientras su Ataque está por encima de +0, sus movimientos se preparan un 20 % más rápido.
TeaService:
  name: Servicio de Té
  description: Sus movimientos curativos dirigidos a un aliado se preparan un 40 % más rápido.
CoinScatter:
  name: Lluvia de Monedas
  description: Cada movimiento con daño que acierta esparce monedas como Día de Pago, hasta el mismo límite que Día de Pago.
WitheredTablets:
  name: Tablillas Marchitas
  description: Un objetivo al que acierta un movimiento no puede subir su Ataque durante 6 segundos.
ShatteredSword:
  name: Espada Quebrada
  description: Un objetivo al que acierta un movimiento no puede subir su Defensa durante 6 segundos.
CrackedVessel:
  name: Vasija Agrietada
  description: Un objetivo al que acierta un movimiento no puede subir su Ataque Esp. durante 6 segundos.
ScatteredBeads:
  name: Cuentas Dispersas
  description: Un objetivo al que acierta un movimiento no puede subir su Defensa Esp. durante 6 segundos.
SunSprint:
  name: Carrera al Sol
  description: Con sol, sus movimientos se preparan un 20 % más rápido.
DriveMode:
  name: Modo Conducción
  description: Con Campo Eléctrico, sus movimientos se preparan un 20 % más rápido.
HeadlongGuard:
  name: Guardia Temeraria
  description: Las bajadas de estadísticas que le causan sus propios movimientos (Arremetida, A Bocajarro) se deshacen la próxima vez que acierta un movimiento de contacto.
ShriekSpeed:
  name: Alarido Veloz
  description: Sus movimientos de sonido se preparan un 30 % más rápido.
EerieFlutter:
  name: Aleteo Espectral
  description: Un movimiento de un solo objetivo dirigido a él tiene un 20 % de probabilidad de ir a un aliado del atacante que siga en pie, elegido al azar, o de fallar si el atacante está solo.
AncientCocoon:
  name: Capullo Ancestral
  description: La primera vez que sus PS bajan de 1/3 en un combate, usa Danza Aleteo sobre sí mismo.
EarthCurrent:
  name: Corriente Telúrica
  description: Sus movimientos de tipo Eléctrico hacen daño neutro a los de tipo Tierra en lugar de no afectarles.
MoonHowl:
  name: Aullido a la Luna
  description: Al entrar al campo, el siguiente movimiento de cada rival tarda un 30 % más en prepararse.
SteamSurge:
  name: Oleada de Vapor
  description: Con sol, sus movimientos de tipo Agua no se debilitan por el sol y se preparan un 20 % más rápido.
MoltenBulwark:
  name: Baluarte Fundido
  description: Cada vez que una de sus guardias bloquea un movimiento, restaura 1/8 de sus PS.
StormCloud:
  name: Nube de Tormenta
  description: Cada movimiento de tipo Eléctrico que acierta tiene un 15 % de probabilidad de crear Campo Eléctrico.
TrackLaying:
  name: Tendido de Vías
  description: Cada movimiento de tipo Tierra que acierta coloca Trampa Rocas en el bando del objetivo, como mucho una vez cada 15 segundos.
IcePack:
  name: Bolsa de Hielo
  description: Sus movimientos de tipo Hielo dirigidos a un aliado le restauran 1/4 de sus PS máximos en lugar de dañarle.
IronGrip:
  name: Agarre de Hierro
  description: Un objetivo al que acierta con un movimiento de puñetazo no puede usar guardias durante 4 segundos.
ToxicExhaust:
  name: Escape Tóxico
  description: Sus movimientos de tipo Fuego envenenan al objetivo con un 20 % de probabilidad.
SandGenerator:
  name: Generador de Arena
  description: Un movimiento de tipo Eléctrico que le acierta levanta una tormenta de arena, como mucho una vez cada 15 segundos.
Afterimage:
  name: Imagen Residual
  description: Durante 1 segundo tras recibir un golpe, su siguiente movimiento se prepara un 40 % más rápido.
TerrainEdge:
  name: Filo del Terreno
  description: Mientras hay algún campo activo, sus movimientos cortantes tienen x1,3 de potencia.
HoundsOath:
  name: Juramento del Sabueso
  description: Cuando un aliado se debilita, su siguiente movimiento con daño envenena gravemente sin falta y es un golpe crítico.
MonkeysOath:
  name: Juramento del Mono
  description: Cuando un aliado se debilita, su siguiente movimiento con daño envenena gravemente sin falta y se prepara un 40 % más rápido.
PheasantsOath:
  name: Juramento del Faisán
  description: Cuando un aliado se debilita, su siguiente movimiento con daño envenena gravemente sin falta y golpea a todos los rivales.
MaskAura:
  name: Aura de Máscara
  description: 'Mientras lleva una máscara, los movimientos de aliados del tipo de esa máscara tienen x1,2 de potencia: Planta con la Máscara Turquesa, Agua con la Máscara Fuente, Fuego con la Máscara Horno y Roca con la Máscara Cimiento.'
Prismatic:
  name: Prismático
  description: Sus movimientos de tipo Normal pasan a ser del tipo que más daño hace al objetivo, al lanzarse.
PuppetStrings:
  name: Hilos de Marioneta
  description: Los movimientos de un solo objetivo de un rival confuso dirigidos a él van a uno de los aliados de ese rival, si queda alguno en pie.
