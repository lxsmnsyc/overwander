    evolves-from: Deoxys
    evolves-into:
      - species: Deoxys
        method: [UsedItem]
        item: Meteorite
      - species: DeoxysAttack
        method: [UsedItem]
        item: Meteorite
      - species: DeoxysSpeed
        method: [UsedItem]
        item: Meteorite
    rank: mythical
  DeoxysSpeed:
