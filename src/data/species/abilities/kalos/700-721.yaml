Noibat:
  Noibat:
    abilities: [Frisk, Infiltrator]
    hidden: [Telepathy]
  Noivern:
    abilities: [Frisk, Infiltrator]
    # Soundproof is this line's invented filler: the mainline gives
    # the bat Frisk, Infiltrator and Telepathy and nothing else
    hidden: [Telepathy, Soundproof]
Xerneas:
  Xerneas:
    abilities: [FairyAura]
    # Fairy Aura is all the mainline gives it, so the other three are
    # this registry's: the mending it does, the hide that turns a
    # first blow, and a heal that arrives before anything else
    hidden: [Healer, Multiscale, Triage]
Yveltal:
  Yveltal:
    abilities: [DarkAura]
    # Dark Aura is all the mainline gives it, so the other three are
    # this registry's: what it takes from a kill, what it does to
    # something already dying, and the fact that nothing walks away
    hidden: [Moxie, Merciless, ShadowTag]
Zygarde:
  Zygarde:
    abilities: [AuraBreak]
    # Power Construct is rare to hatch, since the shape it gathers
    # into is the biggest thing the line has. The other two are this
    # registry's: a swarm that eats the ground it lives in and cannot
    # be ended in one blow
    hidden: [PowerConstruct, EarthEater, Sturdy]
  ZygardeTenPercent:
    abilities: [AuraBreak]
    hidden: [PowerConstruct, EarthEater, Sturdy]
  ZygardeComplete:
    abilities: [PowerConstruct]
    hidden: [EarthEater, Sturdy]
Diancie:
  Diancie:
    abilities: [ClearBody]
    # Magic Bounce is the mainline's; the other two are this
    # registry's, and both are Carbink's, since a Diancie is one that
    # changed rather than a stranger
    hidden: [MagicBounce, SolidRock, SereneGrace]
Hoopa:
  Hoopa:
    abilities: [Magician]
    # Magician is all the mainline gives it, so the other three are
    # this registry's: the ring it sits in, the hand that gets there
    # first, and a thief that takes an ability rather than an item
    hidden: [Levitate, Prankster, Trace]
  HoopaUnbound:
    abilities: [Magician]
    hidden: [Levitate, Prankster, Trace]
Volcanion:
  Volcanion:
    abilities: [WaterAbsorb]
    # Water Absorb is all the mainline gives it, so the other three
    # are this registry's: the other half of what it is made of, the
    # jolt a kettle gives when it is struck, and a legendary's weight
    hidden: [FlashFire, SteamEngine, Pressure]
