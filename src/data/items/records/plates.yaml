# Held, never spent, and never listed: a plate is dug up rather than
# bought. The sell price is what a plate fetches from a shop that will
# never stock one.
#
# A plate is not named for its type (a Fist Plate is Fighting), so the
# picture is taken from the plate's own first word, which is what the
# `plates` sheet names them by.

FistPlate:
  type: Held
  icon: plates/fist
  flags: [Holdable]
  sell: 2000

