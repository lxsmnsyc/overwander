# A baby lays no egg of its own: the stage above it does
Pikachu:
  Pikachu:
    types: [Electric]
    egg-groups: [Field, Fairy]
    biomes: [TemperateForest, Woodland]
    active: any
    evolves-from: Pichu
    # Both Raichu take the same stone, and the catch sheet lets the player pick
    evolves-into:
      - species: Raichu
        method: [UsedItem]
        item: ThunderStone
      - species: RaichuAlola
        method: [UsedItem]
        item: ThunderStone
    held: { common: OranBerry, uncommon: Magnet, rare: LightBall }
  Raichu:
    types: [Electric]
    egg-groups: [Field, Fairy]
    biomes: [TemperateForest, Woodland]
    active: any
    evolves-from: Pikachu
    held: { common: OranBerry, uncommon: Magnet, rare: LightBall }
  Pichu:
    types: [Electric]
    egg-groups: [NoEggsDiscovered]
    biomes: [TemperateForest, Woodland]
    active: any
    evolves-into:
      - species: Pikachu
        method: [Friendship]
    rank: baby
  PichuSpikyEared:
    types: [Electric]
    egg-groups: [NoEggsDiscovered]
    # Met in Ilex Forest, where Celebi is, and only in the mythical band
    biomes: [TemperateForest]
    active: any
    base-form: false
    # Met as rarely as a mythical, but no relic calls it and no raid stages it
    rank: mythical-odds
  RaichuAlola:
    types: [Electric, Psychic]
    egg-groups: [Field, Fairy]
    biomes: [Beach, TropicalSeasonalForest]
    active: any
    base-form: false
    evolves-from: Pikachu
