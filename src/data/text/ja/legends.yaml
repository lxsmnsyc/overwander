# でんせつの トレーナーの なまえと、 ひとことでも いう ときの せりふ

Red:
  name: レッド
  greeting: レッドは なにも いわない。 ボールに てを のばした。
Steven:
  name: ダイゴ
  greeting: ダイゴは いしを てのひらで ころがした。 「ほんきの しょうぶを きたいして いた。」
N:
  name: 'N'
  greeting: Nは くびを かしげた。 「きみと ポケモンの かんけいを みせて ほしい。」
Alder:
  name: アデク
  greeting: アデクは わらって かたを まわした。 「この しょうぶ、 たのしもうじゃ ないか。」
AZ:
  name: AZ
  greeting: AZは きみを みおろした。 「わたしは かつて おうだった。 トレーナーとは なにか みせて くれ。」
