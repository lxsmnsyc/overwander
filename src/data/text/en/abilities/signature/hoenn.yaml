# The signature abilities of the families filed under Hoenn

SapSurge:
  name: Sap Surge
  description: It gains a stage of Speed each time it acts, up to 3 of its own.
EmberSurge:
  name: Ember Surge
  description: It gains a stage of Attack each time it lands a move, up to 3 of its own.
SiltSurge:
  name: Silt Surge
  description: It gains a stage of Special Defense each time it takes a hit, up to 3 of its own.
PackHunt:
  name: Pack Hunt
  description: Its moves hit 1.2x against anything a teammate has already damaged.
CrookedRun:
  name: Crooked Run
  description: Each time it acts, moves aimed at it are 0.9x as accurate, stacking 3 times. A landed blow clears it.
Cocoon:
  name: Cocoon
  description: 'The first time it drops below 1/2 HP, it shells over for 4 seconds: it deals and takes 0.5x damage.'
WaterBloom:
  name: Water Bloom
  description: It calls up Rain as it takes the field, and heals 1/16 of its HP each time it acts in Rain.
SunRoot:
  name: Sun Root
  description: It calls up Sun as it takes the field, and its moves deal 1.3x damage in Sun.
MigrantsWind:
  name: Migrant's Wind
  description: It casts Tailwind over its party as it arrives on the field.
GullsGreed:
  name: Gull's Greed
  description: Every heal an enemy receives is 0.75x, and it takes the quarter for itself.
Empath:
  name: Empath
  description: Its Special Attack counts 1.3x while a teammate is below 1/2 HP.
SurfaceWalk:
  name: Surface Walk
  description: It takes no damage from hazards or from weather.
Mycelium:
  name: Mycelium
  description: Anything carrying poison, sleep, paralysis, a burn or a freeze takes 1.2x from every blow while it stands.
WideSwing:
  name: Wide Swing
  description: Its physical moves reach every enemy on the field, not only the one it aimed at.
VanishingAct:
  name: Vanishing Act
  description: For 1 second after it lands a move, single-target moves aimed at it miss.
EchoChamber:
  name: Echo Chamber
  description: A sound move it lands echoes 2 seconds later for 1/4 of the damage it dealt.
Shove:
  name: Shove
  description: A contact move it lands on an enemy winding a move up flinches them, costing them that cast.
Magnetize:
  name: Magnetize
  description: Enemy moves aimed at one of its teammates are pulled onto it instead.
KittenPace:
  name: Kitten Pace
  description: Its Speed counts 1.3x while it is at full HP.
ShadowTax:
  name: Shadow Tax
  description: A move it lands removes one raised stage from the target.
JawClaim:
  name: Jaw Claim
  description: A move it lands moves one raised stage from the target onto itself.
OreHunger:
  name: Ore Hunger
  description: Steel and Rock moves deal it no damage and heal it 1/4 of what they would have.
MindOverBody:
  name: Mind Over Body
  description: It takes 0.5x damage while it is casting or channelling a move.
JoltStart:
  name: Jolt Start
  description: Its first move of a battle goes off a step ahead of everything and hits 1.5x.
CheerOn:
  name: Cheer On
  description: Each time it acts, the teammate lowest on HP gains a stage in its best stat, up to 3 times a battle.
JeerAt:
  name: Jeer At
  description: Each time it acts, the enemy highest on HP loses a stage in its best stat, up to 3 times a battle.
TailLight:
  name: Tail Light
  description: Evasion counts for nothing on the enemy side while it stands.
LureScent:
  name: Lure Scent
  description: Enemy Speed counts 0.85x while it stands.
Perennial:
  name: Perennial
  description: The first time it drops below 1/4 HP it heals 1/3 of its HP and is cured. Once per battle.
Bottomless:
  name: Bottomless
  description: It heals 1/8 of its HP whenever any held item is consumed on the field.
FeedingFrenzy:
  name: Feeding Frenzy
  description: It gains a stage of Attack whenever any enemy faints, up to 3 of them.
Spout:
  name: Spout
  description: Its Water moves reach every enemy on the field, not only the one it aimed at.
MagmaVent:
  name: Magma Vent
  description: The first time it drops below 1/2 HP, every enemy loses 1/8 of their HP. Once per battle.
BodyHeat:
  name: Body Heat
  description: Its Defense and Special Defense count 1.3x while the Sun is up.
StoredBounce:
  name: Stored Bounce
  description: Half of each hit it takes is stored, up to 1/2 its HP, and the next move it lands deals the lot on top.
UniqueSpots:
  name: Unique Spots
  description: It arrives with 2 stages in one random stat and 1 stage off another, rolled fresh each time.
AntlionPit:
  name: Antlion Pit
  description: Any enemy move that misses it costs that enemy 1/8 of their HP.
PatientStalk:
  name: Patient Stalk
  description: Its moves hit 10% harder for each second it has stood idle, up to 50%, spent on the next one it lands.
CloudStep:
  name: Cloud Step
  description: The first move aimed at it each battle deals no damage to it.
FeudClaws:
  name: Feud Claws
  description: Its moves hit 1.4x against a poisoned target.
DeepeningVenom:
  name: Deepening Venom
  description: A move it lands on a poisoned target turns that poison into the badly-poisoned kind.
MoonPull:
  name: Moon Pull
  description: Its party takes 0.85x damage while it stands, unless a Sun Glare holder stands too.
SunGlare:
  name: Sun Glare
  description: Enemies take 1.15x damage while it stands, unless a Moon Pull holder stands too.
SiltBed:
  name: Silt Bed
  description: Every grounded pokemon on the field, its own side included, has Speed count 0.9x.
DirtyFighter:
  name: Dirty Fighter
  description: Its moves hit 1.3x against a target still at full HP.
SpinBalance:
  name: Spin Balance
  description: It cannot be flinched, cannot be forced off the field, and its stages cannot be lowered.
RootHold:
  name: Root Hold
  description: A move it lands stops that target fleeing for 6 seconds, ghosts aside, and counts their Speed 0.7x meanwhile.
ClawRush:
  name: Claw Rush
  description: Its moves hit 1.3x against any target slower than it.
ScarredBeauty:
  name: Scarred Beauty
  description: Its Special Attack counts 1.4x while it carries poison, sleep, paralysis, a burn or a freeze.
WeatherWorn:
  name: Weather Worn
  description: Under any weather its moves deal 1.3x and everything hits it at 0.85x.
BlendIn:
  name: Blend In
  description: While it has stood still for 2 seconds, moves aimed at it are half as accurate.
MalicePool:
  name: Malice Pool
  description: Its moves hit 10% harder for each lowered stage on the target, up to 50%.
SoulHarvest:
  name: Soul Harvest
  description: It heals 1/4 of its HP whenever anything on the field faints, either side.
FruitCrop:
  name: Fruit Crop
  description: Every 8 seconds it grows a Sitrus Berry, if its hands are empty.
RingingHead:
  name: Ringing Head
  description: Enemy cast and channel times run 25% longer while it stands.
DoomMark:
  name: Doom Mark
  description: 'A move it lands marks that target: the next blow anybody lands on them within 4 seconds hits 1.3x.'
ColdSnap:
  name: Cold Snap
  description: Whoever lands a contact move on it is frozen 20% of the time.
Applause:
  name: Applause
  description: It heals 1/16 of its HP each time a teammate lands a move.
PearlGuard:
  name: Pearl Guard
  description: Its Special Attack and Special Defense count 1.5x while it holds an item.
Unchanged:
  name: Unchanged
  description: 'Every move hits it for neutral damage: it has no weaknesses, resistances or immunities.'
SharedHeart:
  name: Shared Heart
  description: Whenever a teammate is healed, it heals half of that amount as well.
SkullCharge:
  name: Skull Charge
  description: Its contact moves deal 1.4x, and it takes 1/8 of the damage they deal back.
HiveMind:
  name: Hive Mind
  description: Its moves hit 10% harder for each teammate standing with it, up to 3 of them.
StoneSeal:
  name: Stone Seal
  description: For 8 seconds it deals and takes 0.5x. It then deals 1.25x and gains 2 stages of Defense.
FrostSeal:
  name: Frost Seal
  description: For 8 seconds it deals and takes 0.5x. It then deals 1.25x and gains 2 stages of Special Defense.
IronSeal:
  name: Iron Seal
  description: For 8 seconds it deals and takes 0.5x. It then deals 1.25x and gains 2 stages of Attack.
EonShield:
  name: Eon Shield
  description: Its teammates take 0.8x damage while it stands. It covers everybody but itself.
EonLance:
  name: Eon Lance
  description: Its moves deal 1.25x and count Reflect and Light Screen for nothing.
PrimalSea:
  name: Primal Sea
  description: Below 1/2 HP it gains 2 stages of Special Attack and its Water moves deal 1.3x, for good.
PrimalLand:
  name: Primal Land
  description: Below 1/2 HP it gains 2 stages of Attack and its Ground moves deal 1.3x, for good.
PrimalSky:
  name: Primal Sky
  description: Below 1/2 HP it gains 2 stages of Special Attack and its Dragon moves deal 1.3x, for good.
SevenWishes:
  name: Seven Wishes
  description: Every 7 times it acts, its whole party heals 1/4 of their HP and it alone is cured.
FormDrift:
  name: Form Drift
  description: Every 6 seconds it gains a stage in its highest battle stat and loses one in its lowest.
