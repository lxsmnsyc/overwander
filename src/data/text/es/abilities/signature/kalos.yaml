# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
SpineBond:
  name: Vínculo de Espina
  description: Mientras está en el campo, su equipo, él incluido, recibe x0,85 de daño de los movimientos físicos.
EmberBond:
  name: Vínculo de Brasa
  description: Mientras está en el campo, los movimientos especiales de su equipo tienen x1,15 de potencia, los suyos incluidos.
LoosenedEarth:
  name: Tierra Suelta
  description: Sus movimientos de tipo Tierra ignoran la Defensa que haya acumulado el objetivo.
Stoop:
  name: Descenso Veloz
  description: Sus movimientos de tipo Volador tienen x1,3 de potencia contra un objetivo que está lanzando o cargando un movimiento.
Wingscale:
  name: Polvo de Escamas
  description: Cada movimiento que acierta baja 1 nivel la Precisión del objetivo, hasta 2 niveles por este polvo.
Hothouse:
  name: Invernadero
  description: Cuando la Defensa Esp. de un aliado es más baja que la suya, el aliado se defiende de los movimientos especiales con la de este Pokémon.
SaddleBurden:
  name: Carga de Montura
  description: Un movimiento de estado dirigido a un aliado le cae a él, mientras tenga más de 1/2 de PS y ningún problema de estado.
PedigreeCoat:
  name: Pelaje de Pedigrí
  description: Con 1/2 de PS o más, los movimientos especiales le hacen x0,8 de daño.
Restraint:
  name: Contención
  description: Sus 3 primeros movimientos de cada combate tienen x0,8 de potencia, y todos los siguientes, x1,25.
TurnTheBlade:
  name: Desviar el Filo
  description: El primer golpe que recibe en cada forma le hace x0,5 de daño.
Keyring:
  name: Llavero
  description: Puede llevar 1 objeto más de los que tenía de nacimiento, en la medida en que el combate lo permita.
ManyHands:
  name: Muchas Manos
  description: Cada nivel de estadística que tiene cuenta x1,5, tanto las subidas como las bajadas.
DeepKelp:
  name: Bosque de Algas
  description: Un golpe que le quitaría menos de 1/8 de sus PS no le hace nada.
RangingShot:
  name: Tiro Largo
  description: Sus movimientos especiales hacen al menos 1/8 de los PS del objetivo, por muy resistidos que sean.
JawSnap:
  name: Chasquido de Mandíbula
  description: Un movimiento que acierta cancela lo que el objetivo estaba lanzando o cargando, una vez cada 8 segundos por objetivo.
Frostbound:
  name: Grillete de Hielo
  description: Un objetivo al que hace daño tarda un 30 % más en preparar y cargar durante los siguientes 6 segundos.
Overturn:
  name: Vuelco
  description: Un movimiento que acierta invierte todos los niveles de estadística del objetivo, una vez cada 10 segundos por objetivo.
Backfeed:
  name: Realimentación
  description: Cada movimiento de tipo Eléctrico que acierta cura a todo su equipo 1/16 del daño causado.
TopRope:
  name: Tercera Cuerda
  description: Sus movimientos de contacto tienen un 10 % más de potencia por cada 50 kg que pesa el objetivo, hasta x1,5.
Undergrowth:
  name: Maleza
  description: Un movimiento que acierta añade el tipo Planta al objetivo, una sola vez por objetivo.
Hollowing:
  name: Ahuecamiento
  description: Un movimiento que acierta añade el tipo Fantasma al objetivo, una sola vez por objetivo.
Deadweight:
  name: Peso Muerto
  description: Mientras su Defensa sea mayor que su Ataque, sus movimientos físicos usan la Defensa en lugar del Ataque.
Seepage:
  name: Filtración
  description: El 40 % de cada golpe directo que recibe se paga en los siguientes 4 segundos.
Echolocation:
  name: Ecolocalización
  description: 'Un rival que le acierta un movimiento queda localizado: su siguiente movimiento con daño contra ese rival es un golpe crítico.'
Begrudge:
  name: Resentimiento
  description: Gana 1 nivel de Ataque cada vez que se cura un rival.
SugarRush:
  name: Subida de Azúcar
  description: Cuando gasta su propio objeto, todo su equipo gana 1 nivel de Velocidad.
QuickWhiskers:
  name: Bigotes Rápidos
  description: Sus movimientos se lanzan con 1 escalón más de prioridad. Las recargas no cambian.
CrystalGrowth:
  name: Crecimiento Cristalino
  description: Cada 10 segundos gana 1 nivel de Defensa y de Defensa Esp., hasta 3 de cada una.
Quickening:
  name: Avivamiento
  description: Toda subida de estadística de su equipo es 1 nivel mayor.
Withering:
  name: Marchitamiento
  description: Toda bajada de estadística que causa a un rival es 1 nivel mayor.
EvenKeel:
  name: Equilibrio
  description: Todo nivel de estadística en el campo cuenta x0,5, el suyo incluido.
Regalia:
  name: Insignias Reales
  description: Cada 10 segundos todo su equipo gana 1 nivel de Defensa, hasta 3.
Ringback:
  name: Golpe de Retorno
  description: El 20 % de los movimientos de un solo objetivo dirigidos a él se devuelven a quien los lanzó.
Boiler:
  name: Caldera
  description: Con lluvia, sus movimientos de tipo Fuego tienen x1,15 de potencia, y con sol, los de tipo Agua.
PrideCall:
  name: Llamada del León
  description: Al entrar al campo, usa Rugido de Guerra sobre un rival.
CalmingScent:
  name: Aroma Calmante
  description: Cuando gasta su propio objeto, el bando rival pierde 1 nivel de Velocidad.
ShadeBond:
  name: Vínculo de Sombra
  description: Mientras está en el campo, su equipo, él incluido, tarda x0,85 en prepararse y en cargar. Las recargas no cambian.
