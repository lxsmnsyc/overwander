# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
SapSurge:
  name: Oleada de Savia
  description: Gana 1 nivel de Velocidad cada vez que actúa, hasta 3 propios.
EmberSurge:
  name: Oleada de Brasa
  description: Gana 1 nivel de Ataque cada vez que acierta un movimiento, hasta 3 propios.
SiltSurge:
  name: Oleada de Limo
  description: Gana 1 nivel de Defensa Esp. cada vez que recibe un golpe, hasta 3 propios.
PackHunt:
  name: Caza en Manada
  description: Sus movimientos tienen x1,2 de potencia contra todo lo que un aliado ya haya dañado.
CrookedRun:
  name: Carrera Torcida
  description: Cada vez que actúa, los movimientos dirigidos a él tienen x0,9 de precisión, hasta 3 veces. Un golpe recibido lo reinicia.
Cocoon:
  name: Capullo
  description: 'La primera vez que sus PS bajan de 1/2, se encierra en un capullo 4 segundos: hace y recibe x0,5 de daño.'
WaterBloom:
  name: Flor de Agua
  description: Al entrar al campo, provoca lluvia, y con lluvia restaura 1/16 de sus PS cada vez que actúa.
SunRoot:
  name: Raíz Solar
  description: Al entrar al campo, provoca sol, y con sol sus movimientos hacen x1,3 de daño.
MigrantsWind:
  name: Viento Migratorio
  description: Al entrar al campo, usa Viento Afín sobre su equipo.
GullsGreed:
  name: Codicia de Gaviota
  description: Toda curación que recibe un rival es x0,75, y él se queda con el cuarto restante.
Empath:
  name: Empatía
  description: Su Ataque Esp. cuenta x1,3 mientras un aliado tenga menos de 1/2 de PS.
SurfaceWalk:
  name: Paso en el Agua
  description: No recibe daño de trampas ni del tiempo.
Mycelium:
  name: Micelio
  description: Mientras está en el campo, todo lo que sufra envenenamiento, sueño, parálisis, quemadura o congelación recibe x1,2 de daño de cada golpe.
WideSwing:
  name: Barrido Amplio
  description: Sus movimientos físicos alcanzan a todos los rivales del campo, no solo al que apunta.
VanishingAct:
  name: Desaparición
  description: Durante 1 segundo después de acertar un movimiento, los movimientos de un solo objetivo dirigidos a él fallan.
EchoChamber:
  name: Cámara de Eco
  description: Un movimiento de sonido que acierta resuena 2 segundos después con 1/4 del daño causado.
Shove:
  name: Envite
  description: Un movimiento de contacto que acierta a un rival que prepara un movimiento lo amedrenta y le hace perder esa preparación.
Magnetize:
  name: Magnetizar
  description: Los movimientos rivales dirigidos a uno de sus aliados se desvían hacia él.
KittenPace:
  name: Paso de Gatito
  description: Su Velocidad cuenta x1,3 mientras tiene los PS al máximo.
ShadowTax:
  name: Tributo de Sombra
  description: Un movimiento que acierta elimina un nivel subido del objetivo.
JawClaim:
  name: Reclamo de Mandíbula
  description: Un movimiento que acierta pasa un nivel subido del objetivo a él mismo.
OreHunger:
  name: Hambre de Mineral
  description: Los movimientos de tipo Acero y Roca no le hacen daño y le restauran 1/4 de lo que habrían hecho.
MindOverBody:
  name: Mente sobre Cuerpo
  description: Recibe x0,5 de daño mientras lanza o carga un movimiento.
JoltStart:
  name: Arranque Eléctrico
  description: Su primer movimiento del combate sale un escalón antes que todo lo demás y tiene x1,5 de potencia.
CheerOn:
  name: Ánimo
  description: Cada vez que actúa, el aliado con menos PS gana 1 nivel en su mejor estadística, hasta 3 veces por combate.
JeerAt:
  name: Abucheo
  description: Cada vez que actúa, el rival con más PS pierde 1 nivel en su mejor estadística, hasta 3 veces por combate.
TailLight:
  name: Luz Trasera
  description: Mientras está en el campo, la Evasión del bando rival no cuenta para nada.
LureScent:
  name: Aroma Cebo
  description: Mientras está en el campo, la Velocidad rival cuenta x0,85.
Perennial:
  name: Perenne
  description: La primera vez que sus PS bajan de 1/4, restaura 1/3 de sus PS y se cura de todo problema de estado. Una vez por combate.
Bottomless:
  name: Sin Fondo
  description: Restaura 1/8 de sus PS cada vez que se consume un objeto en el campo.
FeedingFrenzy:
  name: Frenesí Alimenticio
  description: Gana 1 nivel de Ataque cada vez que se debilita un rival, hasta 3.
Spout:
  name: Surtidor
  description: Sus movimientos de tipo Agua alcanzan a todos los rivales del campo, no solo al que apunta.
MagmaVent:
  name: Chimenea de Magma
  description: La primera vez que sus PS bajan de 1/2, todos los rivales pierden 1/8 de sus PS. Una vez por combate.
BodyHeat:
  name: Calor Corporal
  description: Su Defensa y su Defensa Esp. cuentan x1,3 mientras brilla el sol.
StoredBounce:
  name: Rebote Acumulado
  description: Guarda la mitad de cada golpe que recibe, hasta 1/2 de sus PS, y el siguiente movimiento que acierta causa todo lo guardado además de su daño.
UniqueSpots:
  name: Manchas Únicas
  description: Entra con 2 niveles en una estadística al azar y 1 nivel menos en otra, sorteadas de nuevo cada vez.
AntlionPit:
  name: Foso Hormigaleón
  description: Cualquier movimiento rival que falla contra él cuesta a ese rival 1/8 de sus PS.
PatientStalk:
  name: Acecho Paciente
  description: Sus movimientos tienen un 10 % más de potencia por cada segundo que lleva quieto, hasta un 50 %, que se gasta en el siguiente que acierta.
CloudStep:
  name: Paso Nuboso
  description: El primer movimiento dirigido a él en cada combate no le hace daño.
FeudClaws:
  name: Garras Rivales
  description: Sus movimientos tienen x1,4 de potencia contra un objetivo envenenado.
DeepeningVenom:
  name: Veneno Creciente
  description: Un movimiento que acierta a un objetivo envenenado convierte ese veneno en gravemente envenenado.
MoonPull:
  name: Tirón Lunar
  description: Mientras está en el campo, su equipo recibe x0,85 de daño, salvo que haya un portador de Resplandor Solar.
SunGlare:
  name: Resplandor Solar
  description: Mientras está en el campo, los rivales reciben x1,15 de daño, salvo que haya un portador de Tirón Lunar.
SiltBed:
  name: Lecho de Limo
  description: Todos los Pokémon que están en el suelo, también los de su bando, cuentan x0,9 de Velocidad.
DirtyFighter:
  name: Pelea Sucia
  description: Sus movimientos tienen x1,3 de potencia contra un objetivo con los PS al máximo.
SpinBalance:
  name: Equilibrio Giratorio
  description: No puede amedrentarse ni ser sacado del campo a la fuerza, y no se le pueden bajar los niveles de estadísticas.
RootHold:
  name: Agarre de Raíz
  description: Un movimiento que acierta impide huir a ese objetivo durante 6 segundos y cuenta su Velocidad x0,7 mientras tanto, salvo si es de tipo Fantasma.
ClawRush:
  name: Embestida de Garra
  description: Sus movimientos tienen x1,3 de potencia contra cualquier objetivo más lento que él.
ScarredBeauty:
  name: Belleza Cicatrizada
  description: Su Ataque Esp. cuenta x1,4 mientras sufre envenenamiento, sueño, parálisis, una quemadura o congelación.
WeatherWorn:
  name: Curtido por el Clima
  description: Con cualquier tipo de tiempo, sus movimientos hacen x1,3 de daño y todo le hace x0,85.
BlendIn:
  name: Pasar Desapercibido
  description: Tras estar quieto 2 segundos, los movimientos dirigidos a él tienen la mitad de precisión.
MalicePool:
  name: Charco de Malicia
  description: Sus movimientos tienen un 10 % más de potencia por cada nivel bajado del objetivo, hasta un 50 %.
SoulHarvest:
  name: Cosecha de Almas
  description: Restaura 1/4 de sus PS cada vez que algo se debilita en el campo, de cualquier bando.
FruitCrop:
  name: Cosecha de Frutos
  description: Si tiene las manos vacías, cada 8 segundos le crece una Baya Zidra.
RingingHead:
  name: Cabeza Resonante
  description: Mientras está en el campo, el tiempo de preparación y de carga de los rivales es un 25 % más largo.
DoomMark:
  name: Marca de Perdición
  description: 'Un movimiento que acierta marca al objetivo: el siguiente golpe que cualquiera le dé en 4 segundos tiene x1,3 de potencia.'
ColdSnap:
  name: Ola de Frío
  description: Quien lo golpea con un movimiento de contacto queda congelado con un 20 % de probabilidad.
Applause:
  name: Aplauso
  description: Restaura 1/16 de sus PS cada vez que un aliado acierta un movimiento.
PearlGuard:
  name: Guardia de Perla
  description: Su Ataque Esp. y su Defensa Esp. cuentan x1,5 mientras lleva un objeto.
Unchanged:
  name: Inalterado
  description: 'Todo movimiento le hace daño neutro: no tiene debilidades, resistencias ni inmunidades.'
SharedHeart:
  name: Corazón Compartido
  description: Siempre que se cura a un aliado, él también se cura la mitad de esa cantidad.
SkullCharge:
  name: Embestida Craneal
  description: Sus movimientos de contacto hacen x1,4 de daño, y recibe 1/8 del daño que causan.
HiveMind:
  name: Mente Colmena
  description: Sus movimientos tienen un 10 % más de potencia por cada aliado en pie a su lado, hasta 3.
StoneSeal:
  name: Sello de Roca
  description: Durante 8 segundos hace y recibe x0,5 de daño. Después hace x1,25 y gana 2 niveles de Defensa.
FrostSeal:
  name: Sello de Hielo
  description: Durante 8 segundos hace y recibe x0,5 de daño. Después gana 2 niveles de Defensa Esp. y hace x1,25 de daño.
IronSeal:
  name: Sello de Hierro
  description: Durante 8 segundos hace y recibe x0,5 de daño. Después hace x1,25 y gana 2 niveles de Ataque.
EonShield:
  name: Escudo Eón
  description: Mientras está en el campo, sus aliados reciben x0,8 de daño. Protege a todos menos a sí mismo.
EonLance:
  name: Lanza Eón
  description: Sus movimientos hacen x1,25 de daño y no tienen en cuenta Reflejo ni Pantalla de Luz.
PrimalSea:
  name: Mar Primigenio
  description: Con menos de 1/2 de PS gana 2 niveles de Ataque Esp. y sus movimientos de tipo Agua hacen x1,3 de daño, para siempre.
PrimalLand:
  name: Tierra Primigenia
  description: Con menos de 1/2 de PS gana 2 niveles de Ataque y sus movimientos de tipo Tierra hacen x1,3 de daño, para siempre.
PrimalSky:
  name: Cielo Primigenio
  description: Con menos de 1/2 de PS gana 2 niveles de Ataque Esp. y sus movimientos de tipo Dragón hacen x1,3 de daño, para siempre.
SevenWishes:
  name: Siete Deseos
  description: Cada 7 veces que actúa, todo su equipo restaura 1/4 de sus PS y solo él se cura de los problemas de estado.
FormDrift:
  name: Deriva de Forma
  description: Cada 6 segundos gana 1 nivel en su estadística de combate más alta y pierde 1 en la más baja.
Blockade:
  name: Barricada
  description: Un movimiento de contacto que lo golpea mientras no lanza ni carga ningún movimiento baja 2 niveles la Defensa del atacante.
