Ogerpon:
  # A mask is a shape it is kept in rather than one it fights in: each
  # is used to move it between the four, its Teal included, so the line
  # is a wheel the way Rotom's is
  Ogerpon:
    types: [Grass]
    egg-groups: [NoEggsDiscovered]
    biomes: [TemperateForest]
    active: any
    evolves-into:
      - species: OgerponWellspring
        method: [UsedItem]
        item: WellspringMask
      - species: OgerponHearthflame
        method: [UsedItem]
        item: HearthflameMask
      - species: OgerponCornerstone
        method: [UsedItem]
        item: CornerstoneMask
    rank: legendary
  OgerponWellspring:
    types: [Grass, Water]
    egg-groups: [NoEggsDiscovered]
    active: any
