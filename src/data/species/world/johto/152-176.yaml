# What the two above the base pick up: the machines that ask for a
Chikorita:
  Chikorita:
    types: [Grass]
    egg-groups: [Monster, Grass]
    biomes: [Grassland, TemperateForest, Woodland]
    active: [Morning, Day]
    evolves-into:
      - species: Bayleef
        method: [Level]
        level: 16
  Bayleef:
    types: [Grass]
    egg-groups: [Monster, Grass]
    biomes: [Grassland, TemperateForest, Woodland]
    active: [Morning, Day]
    evolves-from: Chikorita
    evolves-into:
      - species: Meganium
        method: [Level]
        level: 32
  Meganium:
    types: [Grass]
    egg-groups: [Monster, Grass]
    biomes: [Grassland, TemperateForest, Woodland]
    active: [Morning, Day]
    evolves-from: Bayleef
# What the two above the base pick up: the machines that ask for a
Cyndaquil:
  Cyndaquil:
    types: [Fire]
    egg-groups: [Field]
    biomes: [Mountain, Volcano]
    active: [Morning, Day]
    evolves-into:
      - species: Quilava
        method: [Level]
        level: 14
  Quilava:
    types: [Fire]
    egg-groups: [Field]
    biomes: [Mountain, Volcano]
    active: [Morning, Day]
    evolves-from: Cyndaquil
    evolves-into:
      - species: Typhlosion
        method: [Level]
        level: 36
      # The Hisuian one, as the old country grew it: both are offered,
      # and the player picks
      - species: TyphlosionHisui
        method: [Level]
        level: 36
  Typhlosion:
    types: [Fire]
    egg-groups: [Field]
    biomes: [Mountain, Volcano]
    active: [Morning, Day]
    evolves-from: Quilava
  TyphlosionHisui:
    types: [Fire, Ghost]
    egg-groups: [Field]
    biomes: [Mountain, Volcano]
    active: [Evening, Night]
    base-form: false
    evolves-from: Quilava
