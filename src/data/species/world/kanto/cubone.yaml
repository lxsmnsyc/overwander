Cubone:
  types: [Ground]
  egg-groups: [Monster]
  biomes: [Mountain, Desert, ColdDesert, Badlands]
  active: [Night]
  # By day it grows into a Kanto Marowak, and by night into an Alolan one
  evolves-into:
    - species: Marowak
      method: [Level, TimeOfDay]
      level: 28
      time: [Morning, Day]
    - species: MarowakAlola
      method: [Level, TimeOfDay]
      level: 28
      time: [Evening, Night]
Marowak:
  types: [Ground]
  egg-groups: [Monster]
  biomes: [Mountain, Desert, ColdDesert, Badlands]
  active: [Night]
  evolves-from: Cubone
MarowakAlola:
  types: [Fire, Ghost]
  egg-groups: [Monster]
  biomes: [Volcano]
  active: [Evening, Night]
  base-form: false
  evolves-from: Cubone
