# The jaw in the rock. Nothing comes out of a Jaw Fossil but this,
# and nothing in the world grows one any more, so the bench is the
# only road to it
Tyrunt:
  types: [Rock, Dragon]
  egg-groups: [Monster, Dragon]
  active: any
  evolves-into:
    - species: Tyrantrum
      method: [Level, TimeOfDay]
      level: 39
      time: [Morning, Day]
Tyrantrum:
  types: [Rock, Dragon]
  egg-groups: [Monster, Dragon]
  active: any
  evolves-from: Tyrunt
