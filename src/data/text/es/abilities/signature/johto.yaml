# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
Sapmark:
  name: Marca de Savia
  description: Lo que alcanza con un movimiento pierde 1/16 de sus PS cada vez que actúa, y él se cura la misma cantidad.
Embermark:
  name: Marca de Brasa
  description: Lo que alcanza con un movimiento pierde 1/16 de sus PS cada vez que actúa, o 1/8 mientras está quemado.
Jawmark:
  name: Marca de Mandíbula
  description: Lo único que tiene entre sus mandíbulas pierde 1/8 de sus PS cada vez que actúa. Solo una cosa a la vez.
Sentry:
  name: Centinela
  description: Mientras está en el campo, nadie de su equipo puede recibir un golpe crítico.
WatchfulRoost:
  name: Percha Vigilante
  description: Al entrar al campo, usa Reflejo sobre su equipo.
Relay:
  name: Traspaso
  description: Cuando se le cambia por otro, sus niveles de estadísticas pasan al aliado que entra.
SilkSnare:
  name: Trampa de Seda
  description: Al entrar al campo, usa Disparo Demora sobre todos los rivales en pie.
LanternLure:
  name: Señuelo Farolillo
  description: Al entrar al campo, usa Rayo Confuso sobre un rival.
FairShare:
  name: Reparto Justo
  description: Cuando un movimiento de menos del 100 % de precisión acierta a alguien de su equipo, el siguiente movimiento así dirigido a ese aliado falla.
Prophecy:
  name: Augurio
  description: Al entrar al campo, usa Premonición sobre un rival.
LiveWire:
  name: Cable Pelado
  description: Al entrar al campo, usa Onda Trueno sobre un rival.
Spillover:
  name: Desbordamiento
  description: La curación que sobrepasa sus PS máximos se lanza contra un rival como daño en lugar de desperdiciarse.
FalseWood:
  name: Madera Falsa
  description: Cuenta como de tipo Planta para calcular qué le hace daño, hasta que recibe el primer golpe.
Updraft:
  name: Corriente Ascendente
  description: No puede quedar atrapado, no se le puede bajar la Velocidad y siempre consigue escapar.
Tailthrow:
  name: Lanzacola
  description: Al entrar al campo, usa Lanzamiento y arroja su objeto a un rival.
SunlitCharge:
  name: Carga Soleada
  description: Sus movimientos de carga tienen x1,3 de potencia y no se pueden interrumpir.
Resonance:
  name: Resonancia
  description: Sus movimientos de sonido alcanzan a todos los rivales del campo, no solo al que apunta.
ContagiousYawn:
  name: Bostezo Contagioso
  description: Al entrar al campo, usa Bostezo sobre un rival.
Magpie:
  name: Urraca
  description: Cualquier objeto que le quiten a otro en el campo pasa a sus manos si las tiene vacías.
SharedMisery:
  name: Miseria Compartida
  description: La primera vez que sus PS bajan de 1/3, usa Divide Dolor sobre el rival más sano.
RuinousScript:
  name: Escritura Ruinosa
  description: Mientras está en el campo, los objetos del bando rival no hacen nada.
Backlash:
  name: Contragolpe
  description: Guarda 1/4 de cada golpe que recibe y, la siguiente vez que actúa, devuelve lo guardado a quien lo golpeó por última vez.
Ambidextrous:
  name: Ambidiestro
  description: Calcula sus movimientos con su Ataque o con su Ataque Esp., el que sea más alto.
Shrapnel:
  name: Metralla
  description: Al debilitarse, usa Púas y Púas Tóxicas sobre el bando rival.
HiddenDen:
  name: Guarida Oculta
  description: Mientras otro de su equipo siga en pie, los rivales no pueden dirigirle un movimiento de un solo objetivo.
SandRider:
  name: Jinete de Arena
  description: Con tormenta de arena, sus movimientos no fallan y todo le hace x0,75 de daño.
Bully:
  name: Abusón
  description: Sus movimientos tienen x1,3 de potencia contra un objetivo con el Ataque bajado.
LastBarb:
  name: Última Púa
  description: Al debilitarse, usa Tóxico sobre quien lo derrotó.
Fermenter:
  name: Fermentador
  description: Cada vez que actúa con la mano libre, aparece un Zumo de Baya en ella.
Heave:
  name: Volteo
  description: El primer movimiento de contacto que acierta a cada rival usa Remolino sobre él.
SharpClaw:
  name: Garra Cortante
  description: Cada movimiento de contacto que acierta baja 1 nivel la Defensa del objetivo.
SweetPaw:
  name: Zarpa Dulce
  description: Sus movimientos de contacto lo curan 1/8 del daño que causan.
MagmaTrail:
  name: Rastro de Magma
  description: Un rival al que ha acertado un movimiento pierde 1/16 de sus PS cada vez que actúa, mientras él siga en pie.
Icebreaker:
  name: Rompehielos
  description: Un movimiento que acierta arranca Reflejo y Pantalla de Luz del bando del objetivo.
CoralBloom:
  name: Flor de Coral
  description: Cada vez que se cura, el aliado con menos PS se cura la misma cantidad.
Ricochet:
  name: Rebote
  description: Cuando un movimiento suyo de un solo objetivo falla, golpea a otro rival en pie con toda su potencia.
Delivery:
  name: Entrega
  description: Al entrar al campo, da un Zumo de Baya al aliado con menos PS.
Escort:
  name: Escolta
  description: Mientras está en el campo, la Defensa Esp. de sus aliados cuenta x1,3.
Steelmolt:
  name: Muda de Acero
  description: Coloca una capa de Púas en el bando rival cuando un golpe deja sus PS en 3/4 y en 1/2.
PackHowl:
  name: Aullido de Manada
  description: Al entrar al campo, todos sus aliados ganan 1 nivel de Ataque.
Momentum:
  name: Ímpetu
  description: Sus movimientos tienen x1,1 de potencia por cada movimiento que acierta desde que entró al campo, hasta x1,5.
MindFog:
  name: Niebla Mental
  description: Mientras está en el campo, el Ataque Esp. rival cuenta x0,85.
Palette:
  name: Paleta
  description: Sus movimientos toman el tipo del último movimiento que lo golpeó.
Cowbell:
  name: Cencerro
  description: Al entrar al campo, usa Cascabel Cura sobre su equipo.
RisenThunder:
  name: Rayo Renacido
  description: El primer golpe que lo debilitaría lo deja con 1 PS, curado y con 1 nivel más de Velocidad. Una vez por combate.
RisenFlame:
  name: Llama Renacida
  description: El primer golpe que lo debilitaría lo deja con 1 PS, curado y con 1 nivel más de Ataque. Una vez por combate.
RisenTide:
  name: Marea Renacida
  description: El primer golpe que lo debilitaría lo deja con 1 PS, curado y con 1 nivel más de Defensa. Una vez por combate.
Tyrant:
  name: Tirano
  description: Mientras está en el campo, nadie del bando rival puede subir una estadística.
SilverAegis:
  name: Égida de Plata
  description: El primer golpe que debilitaría a un aliado lo deja con 1 PS. Una vez por combate.
RainbowRekindling:
  name: Reavivar Arcoíris
  description: El primer aliado que cae se levanta con 1/3 de sus PS. Una vez por combate.
TimelineSplit:
  name: Bifurcación Temporal
  description: La primera vez que sus PS bajan de 1/2, se deshacen todas las bajadas de estadísticas y se eliminan todos los problemas de estado.
CoralHusk:
  name: Cáscara de Coral
  description: Al debilitarse, su cáscara sigue en pie 6 segundos y atrae todos los movimientos rivales de un solo objetivo dirigidos a su equipo, que no golpean a nada.
VenomFeast:
  name: Festín Venenoso
  description: Mientras está en el campo, restaura 1/2 de lo que el veneno cuesta al bando rival.
NerveVenom:
  name: Veneno Nervioso
  description: Sus movimientos de contacto paralizan a un objetivo envenenado con un 30 % de probabilidad, y el veneno se mantiene.
