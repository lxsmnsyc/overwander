# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
Overgrow:
  name: Espesura
  description: Con 1/3 de PS o menos, sus movimientos de tipo Planta tienen x1,5 de potencia.
Chlorophyll:
  name: Clorofila
  description: x2 de Velocidad con sol.
ThickFat:
  name: Sebo
  description: Los movimientos de tipo Fuego y Hielo le hacen la mitad de daño.
Blaze:
  name: Mar Llamas
  description: Con 1/3 de PS o menos, sus movimientos de tipo Fuego tienen x1,5 de potencia.
SolarPower:
  name: Poder Solar
  description: x2 de Ataque Esp. con sol, pero pierde 1/8 de sus PS cada vez que actúa.
ToughClaws:
  name: Garra Dura
  description: Sus movimientos de contacto tienen x1,3 de potencia.
Drought:
  name: Sequía
  description: Al entrar al campo, hace que salga el sol.
Torrent:
  name: Torrente
  description: Con 1/3 de PS o menos, sus movimientos de tipo Agua tienen x1,5 de potencia.
RainDish:
  name: Cura Lluvia
  description: Con lluvia, restaura 1/16 de sus PS cada vez que actúa.
ShieldDust:
  name: Polvo Escudo
  description: Los efectos añadidos de los movimientos que lo golpean nunca se aplican.
RunAway:
  name: Fuga
  description: Siempre escapa de un encuentro con un Pokémon salvaje.
ShedSkin:
  name: Mudar
  description: Cada vez que actúa, 30 % de probabilidad de curarse de un problema de estado.
CompoundEyes:
  name: Ojo Compuesto
  description: x1,3 de Precisión. Como compañero, los Pokémon salvajes llevan un objeto raro 2,5 veces más a menudo.
TintedLens:
  name: Cromolente
  description: Sus movimientos poco eficaces hacen el doble de daño.
Swarm:
  name: Enjambre
  description: Con 1/3 de PS o menos, sus movimientos de tipo Bicho tienen x1,5 de potencia.
Sniper:
  name: Francotirador
  description: Los golpes críticos hacen 1,5 veces el daño. Como compañero, un lanzamiento crítico tiene 2 oportunidades en su sacudida.
KeenEye:
  name: Vista Lince
  description: Los demás no pueden bajar su Precisión, y sus movimientos ignoran las subidas de Evasión del objetivo. Como compañero, el mínimo del rango de nivel de los Pokémon salvajes sube 3.
TangledFeet:
  name: Tumbos
  description: Mientras está confuso, duplica sus subidas y bajadas de Evasión.
BigPecks:
  name: Sacapecho
  description: Los demás no pueden bajar su Defensa.
GaleWings:
  name: Alas Vendaval
  description: Con los PS al máximo, sus movimientos de tipo Volador se preparan un escalón más rápido.
Guts:
  name: Agallas
  description: x1,5 de Ataque con un problema de estado, y las quemaduras ya no reducen a la mitad su daño.
Hustle:
  name: Entusiasmo
  description: x1,5 de Ataque, pero sus movimientos físicos tienen un 20 % menos de precisión. Como compañero, el máximo del rango de nivel de los Pokémon salvajes sube 3.
Intimidate:
  name: Intimidación
  description: Al entrar al campo, baja 1 nivel el Ataque de todos los rivales. Como compañero, el mínimo del rango de nivel de los Pokémon salvajes sube 3.
Unnerve:
  name: Nerviosismo
  description: Mientras está en el campo, los rivales no pueden comer bayas.
Static:
  name: Electricidad Estática
  description: 30 % de probabilidad de paralizar a lo que lo toque.
LightningRod:
  name: Pararrayos
  description: Atrae los movimientos de tipo Eléctrico, no recibe daño de ellos y sube 1 nivel su Ataque Esp. con cada uno. Como compañero, x1,5 de probabilidad de captura de los Pokémon salvajes de tipo Eléctrico.
SandVeil:
  name: Velo Arena
  description: Con tormenta de arena, los movimientos rivales tienen un 20 % menos de precisión contra él, y la tormenta no le hace daño.
SandRush:
  name: Ímpetu Arena
  description: x2 de Velocidad con tormenta de arena, que no le hace daño.
RoughSkin:
  name: Piel Tosca
  description: Quien lo toque pierde 1/8 de sus PS.
PoisonPoint:
  name: Punto Tóxico
  description: 30 % de probabilidad de envenenar a lo que lo toque.
Rivalry:
  name: Rivalidad
  description: Tiene x1,25 de potencia contra el mismo sexo y x0,75 contra el sexo opuesto.
SheerForce:
  name: Potencia Bruta
  description: Sus movimientos con un efecto añadido tienen x1,3 de potencia, pero el efecto nunca se aplica.
CuteCharm:
  name: Gran Encanto
  description: 30 % de probabilidad de enamorar a lo que lo toque. Como compañero, 2/3 de los Pokémon salvajes aparecen del sexo opuesto al suyo.
MagicGuard:
  name: Muro Mágico
  description: No recibe ningún daño indirecto.
Unaware:
  name: Ignorante
  description: Ignora los cambios en los niveles de estadísticas del otro bando en cualquier golpe que da o recibe.
FlashFire:
  name: Absorbe Fuego
  description: Inmune al tipo Fuego. Tras recibir un movimiento de ese tipo, sus propios movimientos de tipo Fuego tienen x1,5 de potencia. Como compañero, x1,5 de probabilidad de captura de los Pokémon salvajes de tipo Fuego.
Competitive:
  name: Tenacidad
  description: Sube 2 niveles el Ataque Esp. cuando un rival le baja una estadística.
Frisk:
  name: Cacheo
  description: Guarda un objeto de un rival, salvo bayas, mientras permanece en el campo. Como compañero, muestra lo que lleva un Pokémon salvaje.
InnerFocus:
  name: Fuerza Mental
  description: Nunca se amedrenta y no le afecta Intimidación.
Infiltrator:
  name: Allanamiento
  description: Ignora las pantallas y los sustitutos.
Stench:
  name: Hedor
  description: 10 % de probabilidad de amedrentar a lo que golpea. Como compañero, aparecen 2 Pokémon salvajes menos.
EffectSpore:
  name: Efecto Espora
  description: 30 % de probabilidad de envenenar, paralizar o dormir a lo que lo toque.
DrySkin:
  name: Piel Seca
  description: Inmune al tipo Agua, que le restaura 1/4 de sus PS. La lluvia lo cura, el sol lo daña y los movimientos de tipo Fuego le hacen x1,25 de daño.
Damp:
  name: Humedad
  description: Nadie en el campo puede usar Autodestrucción ni Explosión.
WonderSkin:
  name: Piel Milagro
  description: Los movimientos de estado dirigidos a él nunca superan el 50 % de precisión.
ArenaTrap:
  name: Trampa Arena
  description: Los rivales que están en el suelo no pueden huir, salvo si son de tipo Fantasma. Como compañero, aparecen 3 Pokémon salvajes más y cada uno tiene la mitad de probabilidad de huir.
SandForce:
  name: Poder Arena
  description: Con tormenta de arena, sus movimientos de tipo Tierra, Roca y Acero tienen x1,3 de potencia, y la tormenta no le hace daño.
Pickup:
  name: Recogida
  description: Recoge un objeto que haya usado otro, si tiene hueco para él. Como compañero, encuentra un objeto cada 512 pasos.
Technician:
  name: Experto
  description: Sus movimientos de 60 de potencia o menos tienen x1,5 de potencia.
Limber:
  name: Flexibilidad
  description: No puede ser paralizado.
CloudNine:
  name: Aclimatación
  description: Mientras está en el campo, el tiempo no afecta a nadie.
SwiftSwim:
  name: Nado Rápido
  description: x2 de Velocidad con lluvia.
VitalSpirit:
  name: Espíritu Vital
  description: No puede dormirse. Como compañero, el máximo del rango de nivel de los Pokémon salvajes sube 3.
AngerPoint:
  name: Irascible
  description: Sube su Ataque al máximo cuando recibe un golpe crítico.
Defiant:
  name: Competitivo
  description: Sube 2 niveles el Ataque cuando un rival le baja una estadística.
Justified:
  name: Justiciero
  description: Sube 1 nivel el Ataque cuando le golpea un movimiento de tipo Siniestro.
WaterAbsorb:
  name: Absorbe Agua
  description: Inmune al tipo Agua, que le restaura 1/4 de sus PS. Como compañero, x1,5 de probabilidad de captura de los Pokémon salvajes de tipo Agua.
Synchronize:
  name: Sincronía
  description: Devuelve el envenenamiento, la quemadura y la parálisis a quien los causó. Como compañero, 1/2 de los Pokémon salvajes comparten su naturaleza.
NoGuard:
  name: Indefenso
  description: Ningún movimiento falla, ni los suyos ni los de los rivales. Como compañero, aparecen 3 Pokémon salvajes más.
Steadfast:
  name: Impasible
  description: Sube 1 nivel la Velocidad cuando se amedrenta.
Gluttony:
  name: Gula
  description: Come sus bayas de apuro con el doble del umbral de PS habitual. Como compañero, el tope de lo que las golosinas añaden a un lanzamiento es 1,5 veces mayor.
ClearBody:
  name: Cuerpo Puro
  description: Los demás no pueden bajarle ninguna estadística.
LiquidOoze:
  name: Lodo Líquido
  description: Si le drenan PS, quien drena recibe el daño en su lugar.
RockHead:
  name: Cabeza Roca
  description: No recibe daño por retroceso.
Sturdy:
  name: Robustez
  description: Aguanta con 1 PS cualquier golpe recibido con los PS al máximo, y los movimientos de KO en 1 golpe no le afectan.
SolidRock:
  name: Roca Sólida
  description: Los golpes supereficaces le hacen 1/4 menos de daño.
FlameBody:
  name: Cuerpo Llama
  description: 30 % de probabilidad de quemar a lo que lo toque. Un huevo encontrado mientras es el compañero eclosiona con la mitad de pasos.
Oblivious:
  name: Despiste
  description: No puede enamorarse y no le afecta Intimidación.
OwnTempo:
  name: Ritmo Propio
  description: No puede confundirse y no le afecta Intimidación.
Regenerator:
  name: Regeneración
  description: Restaura 1/3 de sus PS cuando abandona el campo con vida.
MagnetPull:
  name: Imán
  description: Los rivales de tipo Acero no pueden huir, salvo si son de tipo Fantasma. Como compañero, los Pokémon salvajes de tipo Acero no pueden huir en absoluto.
Analytic:
  name: Cálculo Final
  description: x1,3 de potencia contra un objetivo que ya está lanzando o canalizando un movimiento.
EarlyBird:
  name: Madrugar
  description: Duerme la mitad de tiempo.
Hydration:
  name: Hidratación
  description: Con lluvia, no le afecta ningún problema de estado.
IceBody:
  name: Gélido
  description: Con granizo, restaura 1/16 de sus PS cada vez que actúa, y el granizo no le hace daño.
SlushRush:
  name: Quitanieves
  description: x2 de Velocidad con granizo.
StickyHold:
  name: Viscosidad
  description: Nadie más puede quitarle el objeto.
PoisonTouch:
  name: Toque Tóxico
  description: 30 % de probabilidad de envenenar a lo que toque.
ShellArmor:
  name: Caparazón
  description: No puede recibir golpes críticos.
SkillLink:
  name: Encadenado
  description: Los movimientos de varios golpes siempre aciertan todos los golpes.
Overcoat:
  name: Funda
  description: La tormenta de arena y el granizo no le hacen daño, y los movimientos de polvo no le hacen nada.
Levitate:
  name: Levitación
  description: Flota, así que los movimientos de tipo Tierra fallan a menos que algo lo sujete al suelo.
CursedBody:
  name: Cuerpo Maldito
  description: 30 % de probabilidad de bloquear durante 8 segundos el movimiento que acaba de golpearlo.
WeakArmor:
  name: Armadura Frágil
  description: Un golpe físico le baja 1 nivel la Defensa y le sube 2 niveles la Velocidad.
Insomnia:
  name: Insomnio
  description: No puede dormirse.
Forewarn:
  name: Alerta
  description: Al entrar al campo, deshabilita durante 8 segundos el movimiento más fuerte de los rivales. Como compañero, muestra lo cerca que está de huir un Pokémon salvaje.
BadDreams:
  name: Mal Sueño
  description: Los rivales dormidos pierden 1/8 de sus PS cada vez que actúa.
HyperCutter:
  name: Corte Fuerte
  description: Los demás no pueden bajar su Ataque.
Soundproof:
  name: Insonorizar
  description: Los movimientos de sonido no le afectan.
Aftermath:
  name: Detonación
  description: Quien lo debilita por contacto pierde 1/4 de sus propios PS.
Harvest:
  name: Cosecha
  description: 'Vuelve a cultivar la baya que comió: siempre con sol y la mitad de las veces en los demás casos. Como compañero, una golosina dada a un Pokémon salvaje sobrevive a un lanzamiento fallido.'
BattleArmor:
  name: Armadura Batalla
  description: No puede recibir golpes críticos.
Reckless:
  name: Audaz
  description: Sus movimientos con retroceso o que dañan al fallar tienen x1,2 de potencia.
Unburden:
  name: Liviano
  description: x2 de Velocidad mientras no tiene su objeto.
IronFist:
  name: Puño Férreo
  description: Sus movimientos de puñetazo tienen x1,2 de potencia.
NeutralizingGas:
  name: Gas Reactivo
  description: Las demás habilidades del campo cuentan como si no estuvieran.
NaturalCure:
  name: Cura Natural
  description: Se cura de los problemas de estado al abandonar el campo.
SereneGrace:
  name: Dicha
  description: La probabilidad de que sus movimientos apliquen sus efectos añadidos se duplica.
Healer:
  name: Alma Cura
  description: Cada vez que actúa, 30 % de probabilidad de curar el problema de estado de un aliado.
LeafGuard:
  name: Defensa Hoja
  description: Con sol, no le afecta ningún problema de estado.
Scrappy:
  name: Intrépido
  description: Los movimientos de tipo Normal y Lucha golpean a los de tipo Fantasma, y no le afecta Intimidación.
WaterVeil:
  name: Velo Agua
  description: No puede ser quemado.
Illuminate:
  name: Iluminación
  description: Los demás no pueden bajar su Precisión, y sus movimientos ignoran las subidas de Evasión del objetivo. Como compañero, aparecen 3 Pokémon salvajes más y se ilumina la oscuridad hasta 5 casillas de distancia.
Filter:
  name: Filtro
  description: Los golpes supereficaces le hacen 1/4 menos de daño.
Moxie:
  name: Autoestima
  description: Sube 1 nivel el Ataque cuando debilita a un rival.
MoldBreaker:
  name: Rompemoldes
  description: Las habilidades del objetivo no pueden impedir sus movimientos.
Rattled:
  name: Cobardía
  description: Sube 1 nivel la Velocidad cuando le golpea un movimiento de tipo Bicho, Siniestro o Fantasma, o le afecta Intimidación.
Imposter:
  name: Impostor
  description: Al entrar al campo, se transforma en el rival más fuerte.
Adaptability:
  name: Adaptable
  description: Sus movimientos del mismo tipo tienen x2 de potencia en lugar de x1,5.
Anticipation:
  name: Anticipación
  description: Recibe la mitad de daño del peor movimiento rival para el que se preparó. Como compañero, muestra lo cerca que está de huir un Pokémon salvaje.
VoltAbsorb:
  name: Absorbe Electricidad
  description: Inmune al tipo Eléctrico, que le restaura 1/4 de sus PS. Como compañero, x1,5 de probabilidad de captura de los Pokémon salvajes de tipo Eléctrico.
QuickFeet:
  name: Pies Rápidos
  description: x1,5 de Velocidad con un problema de estado, y la parálisis no se la reduce a la mitad.
Trace:
  name: Calco
  description: Al entrar al campo, copia la habilidad del rival más fuerte. Como compañero, muestra la habilidad de un Pokémon salvaje.
Download:
  name: Descarga
  description: Sube 1 nivel el Ataque o el Ataque Esp., según en cuál de los dos sea más débil el rival.
Sharpness:
  name: Cortante
  description: Sus movimientos cortantes tienen x1,5 de potencia.
Pressure:
  name: Presión
  description: Los movimientos dirigidos a él tienen el doble de recarga. Como compañero, el máximo del rango de nivel de los Pokémon salvajes sube 3.
StrongJaw:
  name: Mandíbula Fuerte
  description: Sus movimientos de mordisco tienen x1,5 de potencia.
Immunity:
  name: Inmunidad
  description: No puede ser envenenado.
SnowCloak:
  name: Manto Níveo
  description: Con granizo, los movimientos rivales tienen un 20 % menos de precisión contra él, y el granizo no le hace daño.
SnowWarning:
  name: Nevada
  description: Al entrar al campo, hace que caiga granizo.
Drizzle:
  name: Llovizna
  description: Al entrar al campo, hace que llueva.
MarvelScale:
  name: Escama Especial
  description: x1,5 de Defensa con un problema de estado.
Multiscale:
  name: Multiescamas
  description: Recibe la mitad de daño de cualquier golpe cuando tiene los PS al máximo.
Protean:
  name: Mutatipo
  description: Adopta el tipo de cada movimiento que usa, así que todos cuentan como del mismo tipo.
