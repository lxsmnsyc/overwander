Poipole:
  types: [Poison]
  egg-groups: [NoEggsDiscovered]
  biomes: [Grassland]
  active: any
  # Any level, once it has been taught Dragon Pulse
  evolves-into:
    - species: Naganadel
      method: [Level, KnownMove]
      level: 1
      move: DragonPulse
Naganadel:
  types: [Poison, Dragon]
  egg-groups: [NoEggsDiscovered]
  active: any
  evolves-from: Poipole
