# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
VerdantField:
  name: みどりのば
  description: いる あいだ、 フィールドの ぜんいんの くさタイプの わざの いりょくが 1.2ばい、 みずタイプの わざの いりょくが 0.8ばいに なる。
EmberField:
  name: ほのおのば
  description: いる あいだ、 フィールドの ぜんいんの ほのおタイプの わざの いりょくが 1.2ばい、 くさタイプの わざの いりょくが 0.8ばいに なる。
DelugeField:
  name: おおみずのば
  description: いる あいだ、 フィールドの ぜんいんの みずタイプの わざの いりょくが 1.2ばい、 ほのおタイプの わざの いりょくが 0.8ばいに なる。
PowderBurst:
  name: こなまき
  description: へんかわざが、 ねらった あいてだけでなく フィールドの あいて ぜんいんに とどく。
TwinStinger:
  name: ふたつのはり
  description: ヒットが 1かいの ぶつりわざは、 いりょく 60%で 2かい あたる。 あたった ときに はんのうする ものは どちらにも はんのうする。
Slipstream:
  name: スリップストリーム
  description: いる あいだ、 てもちの ポケモンの じゅんびと ためる じかんが 20% みじかくなる。
Nibble:
  name: かじり
  description: ダメージを あたえた わざごとに、 ぼうぎょに かかわらず あいての HPの 1/32を さらに うばう。
Relentless:
  name: しつこさ
  description: おなじ あいてに つづけて わざを あてるたびに わざの いりょくが 10% あがり、 さいだい 1.4ばいに なる。 ほかの あいてを ねらうと もとに もどる。
Squeeze:
  name: しめあげ
  description: わざを だしている あいだと ためている あいだ、 さいごに ふれた あいては まいびょう HPが 1/16 へる。
ChainLightning:
  name: れんさでんげき
  description: あてた でんきタイプの わざが、 ほかの たっている あいて 1ぴきに とんで、 あたえた ダメージの 1/3を あたえる。
CurlUp:
  name: まるまり
  description: こうげきを うけるたびに、 じぶんに まるくなるを つかう。
QueensCourt:
  name: じょおうのま
  description: どくに なっている あいて 1ぴきごとに、 ぼうぎょと とくぼうが 15% あがる。 3びきぶんまで かぞえる。
KingsCourt:
  name: おうさまのま
  description: どくに なっている あいて 1ぴきごとに、 こうげきと とくこうが 15% あがる。 3びきぶんまで かぞえる。
WishingWell:
  name: ねがいのいど
  description: こうどうする たびに、 HPが いちばん すくない みかたに ねがいごとを つかう。
NineTails:
  name: きゅうび
  description: うけた こうげき 1かいごとに とくこうが 8% あがる。 9かいぶんまで かぞえる。
Lullaby:
  name: こもりうた
  description: あたえる ねむりの じかんが 1.5ばいに なり、 ねむっている あいてへの わざの いりょくが 1.5ばいに なる。
Bloodthirst:
  name: ちのかわき
  description: すいとる わざと やどりぎのタネで かいふくする りょうが 1.5ばいに なる。 ほかの かいふくは はんぶんに なる。
DeepRoots:
  name: ふかいね
  description: フィールドに でると、 じぶんに ねをはるを つかう。
FungalBloom:
  name: ほうしのはな
  description: あいてに どく、 ねむり、 まひ、 やけど、 こおりの どれかを あたえるたびに、 HPが 1/8 かいふくする。
DustStorm:
  name: ほこりあらし
  description: じょうたいいじょうの あいて 1ぴきごとに とくこうが 12% あがる。 4ひきぶんまで かぞえる。
Undermine:
  name: ほりくずし
  description: わざを あてた あいては、 バトルが おわるまで ぜんいんから うける ダメージが 5%ずつ ふえ、 さいだい 25%に なる。
Cutpurse:
  name: きんちゃくきり
  description: それぞれの あいてに さいしょに あてた わざで、 あいての もちものを はたきおとす。
HeadacheBurst:
  name: ずつうばくはつ
  description: HPが 1/2 いかの とき、 とくこうが 1.5ばいに なり、 エスパータイプの わざが かならず あたる。
BlindRage:
  name: われをわすれる
  description: こうげきが 1.4ばいに なるが、 わざの めいちゅうが 15% さがる。 いかりが つづく あいだ、 なにを しても かいふくできない。
ChaseDown:
  name: おいつめ
  description: HPが 1/3 いかの あいてへの わざの いりょくが 1.5ばいに なり、 その あいては にげられない。 ゴーストタイプは のぞく。
HypnoticSpiral:
  name: さいみんのうず
  description: ちょくせつこうげきの わざを あてた あいては、 つぎの じゅんびが 30% ながくなる。
TeleportGuard:
  name: テレポガード
  description: じぶんに あたる はじめての こうげきを テレポートで かわし、 10びょうの あいだ もう つかえない。
OverheadThrow:
  name: なげおとし
  description: じぶんより おもい あいてへの ちょくせつこうげきの わざの いりょくが 1.4ばい、 かるい あいてへは 1.1ばいに なる。
Digest:
  name: しょうかりょく
  description: HPが 1/4 いかの あいてに わざを あてると、 じぶんの HPが 1/4 かいふくする。 ひんしに させた ときも かぞえる。
TentacleGrasp:
  name: しょくしゅのにぎり
  description: わざを あてた あいては、 じぶんが いる あいだ にげられない。 ゴーストタイプは のぞく。
SolidCore:
  name: かたいコア
  description: ぶつりわざから うける ダメージが 0.7ばい、 とくしゅわざから うける ダメージが 1.3ばいに なる。
Gallop:
  name: かけあし
  description: こうどうする たびに すばやさが 10% あがり、 さいだい 1.5ばいに なる。 どくや てんきを ふくむ ダメージを うけると、 たちどまって もとに もどる。
DelayedReaction:
  name: はんのうおくれ
  description: こうげきの はんぶんだけ すぐに うける。 のこりの はんぶんは 4びょうごに とどく。
RepulsionField:
  name: はんぱつば
  description: フィールドの ぜんいんが とくしゅわざから うける ダメージが 0.9ばいに なる。 じぶんも ふくむ。
LeekDuelist:
  name: ねぎのけんし
  description: きゅうしょランクが 2 あがり、 きゅうしょの ダメージが 1.25ばいに なる。 そのかわり、 なにを うけても ダメージが 1.25ばいに なる。
SecondHead:
  name: ふたつめのあたま
  description: 3かい わざを あてるごとに、 すぐ もう いちど いりょく 50%で こうげきする。
SleekHide:
  name: つるつるはだ
  description: ちょくせつこうげきの わざから うける ダメージが 0.75ばい、 それ いがいは 1.1ばいに なる。
CorrosiveOoze:
  name: ふしょくのヘドロ
  description: ちょくせつこうげきの わざを あてた あいての もちものは、 はたきおとされず こわれて なくなる。
SpikeShell:
  name: とげのから
  description: ちょくせつこうげきの わざから うける ダメージが 0.5ばいに なり、 あてた あいては じぶんの HPの 1/8を うしなう。
NightTerror:
  name: よるのおそれ
  description: ダメージを あたえた あいては、 つぎの 4びょうの あいだ かいふくできない。
LivingTunnel:
  name: いきたトンネル
  description: いる あいだ、 みかたが うける いわと じめんタイプの わざの ダメージが 0.8ばいに なり、 じぶんは 1.2ばいに なる。
DreamFeast:
  name: ゆめのうたげ
  description: ねむっている あいてに わざを あてると、 HPが 1/8 かいふくする。
HeavyPincer:
  name: おもいハサミ
  description: HPが 1/2 いじょうの あいだ、 ちょくせつこうげきの わざの いりょくが 1.45ばいに なる。
Overload:
  name: オーバーロード
  description: HPが 1/2 みまんだと すばやさが 2ばいに なる。
Psyseed:
  name: サイコのタネ
  description: エスパータイプの わざで ダメージを あたえた あいてに、 やどりぎのタネを つかう。
MourningBone:
  name: とむらいのほね
  description: てもちで じぶんだけが のこっている あいだ、 わざの いりょくが 1.4ばいに なる。
SecondWind:
