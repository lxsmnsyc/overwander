# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
AdamantOrb:
  name: こんごうだま
  description: ディアルガに もたせると もうひとつの すがたで たたかう。 その すがたは とくせい てんねんも もつ。
LustrousOrb:
  name: しらたま
  description: パルキアに もたせると もうひとつの すがたで たたかう。 その すがたは とくせい かげふみも もつ。
GriseousOrb:
  name: はっきんだま
  description: ギラティナに もたせると もうひとつの すがたで たたかう。 その すがたは とくせい ふゆうも もつ。
BlueOrb:
  name: あいいろのたま
  description: カイオーガに もたせると ゲンシの すがたで たたかう。 その すがたは とくせい はじまりのうみも もつ。
RedOrb:
  name: べにいろのたま
  description: グラードンに もたせると ゲンシの すがたで たたかう。 その すがたは とくせい おわりのだいちも もつ。
PrisonBottle:
  name: いましめのツボ
  description: フーパに もたせると ときはなたれた すがたで たたかい、 リングを だす。
RevealGlass:
  name: うつしかがみ
  description: トルネロス、 ボルトロス、 ランドロス、 ラブトロスに もたせると れいじゅうフォルムで たたかう。 その すがたは とくせい さいせいりょく、 ちくでん、 いかく、 ぼうじんの どれかも もつ。
Gracidea:
  name: グラシデアのはな
  description: シェイミに もたせると もうひとつの すがたで たたかう。 その すがたは とくせい てんのめぐみも もつ。
Meteorite:
  name: いんせき
  description: つかった デオキシスを ほかの すがたに かえる。 かえる たびに なくなる。
DnaSplicers:
  name: いでんしのくさび
  description: ドラゴンを キュレムに ゆうごうさせるか、 ひきはなす。 つかう たびに なくなる。
RedNectar:
  name: くれないのミツ
  description: つかった オドリドリを めらめらスタイルに おどらせる。 かえる たびに なくなる。
YellowNectar:
  name: やまぶきのミツ
  description: つかった オドリドリを ぱちぱちスタイルに おどらせる。 かえる たびに なくなる。
PinkNectar:
  name: うすもものミツ
  description: つかった オドリドリを ふらふらスタイルに おどらせる。 かえる たびに なくなる。
PurpleNectar:
  name: むらさきのミツ
  description: つかった オドリドリを まいまいスタイルに おどらせる。 かえる たびに なくなる。
NSolarizer:
  name: ネクロプラスソル
  description: ソルガレオを ネクロズマに ゆうごうさせるか、 ひきはなす。 つかう たびに なくなる。
NLunarizer:
  name: ネクロプラスルナ
  description: ルナアーラを ネクロズマに ゆうごうさせるか、 ひきはなす。 つかう たびに なくなる。
ReinsOfUnity:
  name: キズナのタヅナ
  description: バドレックスを ブリザポスか レイスポスに のせるか、 おろす。 つかう たびに なくなる。
RustedSword:
  name: くちたけん
  description: ザシアンに もたせると けんのおうの すがたで たたかい、 アイアンヘッドが きょじゅうざんに なる。
RustedShield:
  name: くちたたて
  description: ザマゼンタに もたせると たてのおうの すがたで たたかい、 アイアンヘッドが きょじゅうだんに なる。
TealMask:
  name: みどりのめん
  description: つかった オーガポンを みどりのめんの すがたに もどす。 タイプは くさ。 かえる たびに なくなる。
WellspringMask:
  name: いどのめん
  description: つかった オーガポンを いどのめんの すがたに する。 タイプは くさと みず。 かえる たびに なくなる。
HearthflameMask:
  name: かまどのめん
  description: つかった オーガポンを かまどのめんの すがたに する。 タイプは くさと ほのお。 かえる たびに なくなる。
CornerstoneMask:
  name: いしずえのめん
  description: つかった オーガポンを いしずえのめんの すがたに する。 タイプは くさと いわ。 かえる たびに なくなる。
