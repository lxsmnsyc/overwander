Toxel:
  Toxel:
    types: [Electric, Poison]
    egg-groups: [NoEggsDiscovered]
    active: any
    # Never met in the wild: it hatches from a Toxtricity's egg, and the
    # nature it is born with decides which Toxtricity it grows into
    evolves-into:
      - species: Toxtricity
        method: [Level]
        level: 30
        natures: [Hardy, Brave, Adamant, Naughty, Docile, Impish, Lax, Hasty, Jolly, Naive, Rash, Sassy, Quirky]
      - species: ToxtricityLowKey
        method: [Level]
        level: 30
        natures: [Lonely, Bold, Relaxed, Timid, Serious, Modest, Mild, Quiet, Bashful, Calm, Gentle, Careful]
    rank: baby
  Toxtricity:
    types: [Electric, Poison]
    egg-groups: [HumanLike]
    biomes: [Swamp, Bog]
    active: [Evening, Night]
    evolves-from: Toxel
  ToxtricityLowKey:
    types: [Electric, Poison]
    egg-groups: [HumanLike]
    biomes: [Swamp, Bog]
    active: [Evening, Night]
    # The calm key, its own pokemon rather than a coat: born Minus where
    # the Amped one is born Plus
    base-form: false
    evolves-from: Toxel
