  description: はじめて HPが 1/3 みまんに なると、 いちばん げんきな あいてに いたみわけを つかう。
RuinousScript:
  name: わざわいのもじ
  description: いる あいだ、 あいてがわの もちものは はたらかない。
Backlash:
