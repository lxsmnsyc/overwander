# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
LeafOpening:
  name: Apertura de Hoja
  description: El primer movimiento que acierta en cada combate baja 1 nivel la Velocidad del objetivo.
EmberOpening:
  name: Apertura de Brasa
  description: El primer movimiento que acierta en cada combate tiene x1,5 de potencia.
ShellOpening:
  name: Apertura de Concha
  description: El primer movimiento que acierta en cada combate le sube 2 niveles la Defensa.
Spotter:
  name: Observador
  description: La precisión de los movimientos de su equipo es x1,2 contra un objetivo que está lanzando o cargando un movimiento.
LoyalGuard:
  name: Guardia Leal
  description: Mientras un aliado tiene menos de 1/2 de PS, su Defensa y su Defensa Esp. cuentan x1,5.
CatBurglar:
  name: Gato Ladrón
  description: El primer movimiento que acierta en cada combate le quita el objeto al objetivo.
LeafCrown:
  name: Corona de Hojas
  description: La primera vez que sus PS bajan de 1/2, planta una semilla en todos los rivales. Una vez por combate.
EmberTuft:
  name: Mechón de Brasa
  description: La primera vez que sus PS bajan de 1/2, quema a todos los rivales. Una vez por combate.
GeyserTail:
  name: Cola de Géiser
  description: La primera vez que sus PS bajan de 1/2, atrapa a todos los rivales en un torbellino. Una vez por combate.
Doze:
  name: Cabezadita
  description: Al actuar de nuevo, restaura 1/16 de sus PS por cada segundo que ha estado quieto, hasta 8.
Homing:
  name: Guiado
  description: Sus movimientos no fallan contra un objetivo al que ya ha acertado un movimiento en este combate.
StormDash:
  name: Carrera Tormentosa
  description: Sus movimientos tienen un 10 % más de potencia por cada nivel de Velocidad que tiene, hasta x1,5.
Aftershock:
  name: Temblor Posterior
  description: Un golpe que lo deja con 1 PS le cuesta a quien lo lanzó 1/4 de sus PS.
HeartMark:
  name: Marca de Corazón
  description: Al entrar al campo, usa Atracción sobre un rival.
Torque:
  name: Par Motor
  description: Sus movimientos tienen x1,25 de potencia, pero se preparan un 25 % más despacio.
Ward:
  name: Amuleto Protector
  description: Mientras está en el campo, el primer golpe que debilitaría a un aliado lo deja con 1 PS. Una vez por aliado.
LoadBearing:
  name: Viga Maestra
  description: Con 1/2 de PS o más, todo le hace x0,6 de daño. Por debajo, recibe el daño entero y hace x1,4.
RippleOut:
  name: Ondas Concéntricas
  description: Un movimiento que acierta también hace 1/4 de ese daño a todos los demás rivales.
RedBelt:
  name: Cinturón Rojo
  description: Mientras está en el campo, los movimientos físicos hacen x0,85 de daño a todo su equipo, él incluido.
BlueBelt:
  name: Cinturón Azul
  description: Mientras está en el campo, los movimientos físicos de todo su equipo tienen x1,15 de potencia, él incluido.
Tailor:
  name: Sastre
  description: Al entrar al campo viste a su aliado más herido, que recibe x0,8 de daño durante el combate.
HurryVenom:
  name: Veneno Veloz
  description: El veneno que causa a un rival le cuesta x1,5 de PS cada vez que actúa.
SporeDrift:
  name: Deriva de Esporas
  description: Sus movimientos de polvo no fallan y nada es inmune a ellos.
PollenWaltz:
  name: Vals de Polen
  description: Cada nivel de estadística que le da uno de sus movimientos de baile se lo da también a sus aliados.
DeathRoll:
  name: Giro Mortal
  description: Sus movimientos de contacto tienen x1,25 de potencia contra un objetivo al que ya ha acertado uno.
GlancingBlow:
  name: Roce
  description: Un movimiento suyo que falla hace igualmente 1/4 del daño que habría hecho.
DrySpell:
  name: Día Seco
  description: Mientras no hay ningún tiempo activo, sus movimientos tienen x1,3 de potencia y restaura 1/16 de sus PS cada vez que actúa.
Slab:
  name: Losa
  description: La roca que carga absorbe el primer daño que recibe en cada combate, hasta 1/4 de sus PS.
GangUp:
  name: Fuerza del Número
  description: Sus movimientos tienen un 10 % más de potencia por cada aliado que sigue en pie, hasta x1,3.
WardCircle:
  name: Círculo de Protección
  description: Mientras está en el campo, nadie puede colocar trampas en su bando, y al entrar al campo retira las que hubiera.
DeathMask:
  name: Máscara Mortuoria
  description: Quien debilite a un aliado suyo pierde 2 niveles en su mejor estadística.
Litterbug:
  name: Tirabasuras
  description: Al entrar al campo, coloca Púas Tóxicas en el bando rival.
Bluff:
  name: Bravata
  description: El primer movimiento que le haría un daño supereficaz lo atraviesa. Una vez por combate.
CleanSweep:
  name: Limpieza de Campo
  description: Al entrar al campo, retira todas las trampas y pantallas de ambos bandos.
Fixation:
  name: Obsesión
  description: Los movimientos de todo su equipo tienen x1,2 de potencia contra el rival con menos PS.
Division:
  name: Carga Compartida
  description: Recibe en su lugar 1/4 de cada golpe dirigido a un aliado.
StaticFeed:
  name: Festín Eléctrico
  description: Restaura 1/8 de sus PS cada vez que un movimiento de tipo Eléctrico acierta a cualquiera, de cualquier bando.
ThornCurtain:
  name: Cortina de Espinas
  description: Mientras está en el campo, sus aliados reciben x0,85 de daño de los movimientos de contacto.
Meshing:
  name: Engranaje
  description: Mientras un aliado sigue en pie, su equipo recibe x0,9 de daño y sus propios movimientos tienen x1,2 de potencia.
BloodWater:
  name: Sangre en el Agua
  description: Sus movimientos tienen un 15 % más de potencia por cada rival con menos de 1/2 de PS, hasta x1,45.
SwanDance:
  name: Danza del Cisne
  description: Cada movimiento de baile que usa le sube además 1 nivel la Velocidad.
FlashFreeze:
  name: Congelación Instantánea
  description: El primer movimiento de tipo Hielo que acierta en cada combate congela al objetivo sin falta.
TidePool:
  name: Poza de Marea
  description: Mientras está en el campo, toda curación de su equipo vale x1,3, la suya incluida.
SwapField:
  name: Campo Trastocado
  description: Al entrar al campo, usa Zona Extraña.
Hexlight:
  name: Luz Embrujada
  description: Sus movimientos tienen x1,4 de potencia contra un objetivo con un problema de estado.
BrokenSeal:
  name: Sello Roto
  description: La primera vez que sus PS bajan de 1/2, gana 2 niveles de Ataque y pierde 1 de Defensa. Una vez por combate.
Scoring:
  name: Rayadura
  description: Todo movimiento físico que acierta baja 1 nivel la Defensa del objetivo.
Sunwarmed:
  name: Baño de Sol
  description: Con sol, preparar sus movimientos lleva x0,75 del tiempo.
ThreeHeads:
  name: Tres Cabezas
  description: Todo movimiento que acierta también muerde a otro rival por 1/3 del daño.
Honed:
  name: Afilado
  description: Cada vez que un rival se sube una estadística, gana 1 nivel de Ataque.
Warcry:
  name: Grito de Guerra
  description: Cada vez que un aliado se debilita, gana 2 niveles de Ataque.
Bonewear:
  name: Armadura de Hueso
  description: Gana 1 nivel de Defensa y de Defensa Esp. cada vez que un rival se debilita.
Anteater:
  name: Oso Hormiguero
  description: Sus movimientos tienen x1,5 de potencia contra un objetivo de tipo Bicho o Acero.
AntGuard:
  name: Coraza de Hormiga
  description: Los movimientos de tipo Fuego le hacen x0,5 de daño.
EmberHalo:
  name: Halo de Brasa
  description: Mientras está en el campo, cada rival pierde 1/16 de sus PS cada vez que actúa.
LatchOn:
  name: Aferramiento
  description: Lo que alcanzan sus movimientos de contacto no puede huir, salvo si es de tipo Fantasma, y pierde 1/16 de sus PS cada vez que actúa. Solo uno a la vez.
FrostFangs:
  name: Colmillos de Escarcha
  description: Sus movimientos de contacto tienen x1,25 de potencia y un 20 % de probabilidad de congelar.
CrystalChain:
  name: Cadena de Cristal
  description: Mientras está en el campo, la congelación de un rival dura el doble.
SleeveGuard:
  name: Manga Protectora
  description: Los movimientos de contacto le hacen x0,75 de daño.
IronVigil:
  name: Vigilia de Hierro
  description: Mientras está en el campo, sus aliados reciben x0,8 de daño de los movimientos físicos.
StoneVigil:
  name: Vigilia de Piedra
  description: Mientras está en el campo, sus aliados reciben x0,8 de daño de los movimientos especiales.
LeafVigil:
  name: Vigilia de Hoja
  description: Mientras está en el campo, sus aliados reciben x0,8 de daño indirecto y no pueden ser envenenados.
TideVigil:
  name: Vigilia de Marea
  description: Mientras está en el campo, sus aliados no se amedrentan y rechazan las bajadas de estadísticas de los rivales.
TruthCreed:
  name: Credo de la Verdad
  description: Sus movimientos tienen x1,3 de potencia contra un rival con un problema de estado.
IdealCreed:
  name: Credo del Ideal
  description: Sus movimientos tienen x1,3 de potencia contra un rival con alguna estadística subida.
HollowCreed:
  name: Credo Hueco
  description: Sus movimientos tienen x1,3 de potencia contra un rival sin problemas de estado ni estadísticas subidas.
Windfall:
  name: Dádiva del Viento
  description: Mientras está en el campo, los movimientos de tipo Volador de su equipo tienen x1,3 de potencia.
Stormfall:
  name: Dádiva de la Tormenta
  description: Mientras está en el campo, los movimientos de tipo Eléctrico de su equipo tienen x1,3 de potencia.
Landfall:
  name: Dádiva de la Tierra
  description: Mientras está en el campo, los movimientos de tipo Tierra de su equipo tienen x1,3 de potencia.
WinnersShare:
  name: Parte del Vencedor
  description: Todo su equipo gana 1 nivel de Ataque y de Ataque Esp. por cada rival que se debilita.
Countertune:
  name: Cambio de Tono
  description: Cambiar de forma intercambia sus niveles de Ataque con los de Ataque Esp., y sus dos defensas entre sí.
Overclock:
  name: Frecuencia Forzada
  description: Con más de 1/2 de PS, se prepara un 25 % más rápido. Con 1/2 o menos, pierde 1/16 de sus PS cada vez que actúa.
Turning:
  name: Cambio de Estación
  description: 'Sus movimientos de tipo Normal toman el tipo de su pelaje y tienen x1,2 de potencia: Planta en primavera, Fuego en verano, Tierra en otoño y Hielo en invierno.'
Glidewake:
  name: Rastro de Planeo
  description: Cada movimiento que acierta le sube 1 nivel la Evasión, hasta +2. Cualquier golpe que recibe se los quita todos.
DeepHold:
  name: Pie Firme
  description: El primer golpe que lo dejaría por debajo de 1/2 de PS lo deja justo en 1/2 y le sube 2 niveles la Defensa.
Featherstone:
  name: Piedra Pluma
  description: La primera vez que sus PS bajan de 1/2, restaura 1/4 de sus PS. Una vez por combate.
ShellThief:
  name: Ladrón de Caparazón
  description: El primer movimiento físico que acierta a cada rival le quita 1 nivel de Defensa y se lo da a él.
Barehide:
  name: Piel Desnuda
  description: Rechaza toda bajada de Defensa causada por otros, y en su lugar su Defensa Esp. sube 1 nivel.
Sporeburst:
  name: Explosión de Esporas
  description: Al debilitarse, usa Paralizador sobre todos los rivales del campo.
StillWater:
  name: Aguas Quietas
  description: Mientras está en el campo, cada rival tarda x1,2 en prepararse. Las recargas no cambian.
Shockmud:
  name: Lodo Chispeante
  description: Sus movimientos de tipo Tierra tienen x1,2 de potencia y un 20 % de probabilidad de paralizar.
HerdBond:
  name: Vínculo de Manada
  description: El Ataque sube un 10 % por cada otro Pokémon de su equipo que sigue en pie.
ColdSink:
  name: Sumidero Gélido
  description: Atrae los movimientos de tipo Hielo dirigidos a sus aliados, y cada uno que lo alcanza le sube 1 nivel el Ataque en vez de hacerle daño.
CarvedGrudge:
  name: Agravio Grabado
  description: Al debilitarse, cada rival que le hizo daño con un movimiento pierde 1/8 de sus PS.
Afterhaunt:
  name: Alma en Pena
  description: La primera vez que se iba a debilitar, se queda 4 segundos, intocable y aún luchando, y luego cae. Una vez por combate.
SoulCloak:
  name: Manto de Almas
  description: Cada aliado que se debilita lo envuelve con su alma, y el siguiente golpe que recibe le hace la mitad de daño.
