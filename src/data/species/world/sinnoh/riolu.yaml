# The aura reader: a Riolu tells how somebody feels from across a
# field, and a Lucario tells what they are about to do
Riolu:
  types: [Fighting]
  egg-groups: [NoEggsDiscovered]
  biomes: [Mountain, MontaneForest, AlpineTundra]
  active: [Morning, Day]
  evolves-into:
    - species: Lucario
      method: [Friendship, TimeOfDay]
      time: [Morning, Day]
Lucario:
  types: [Fighting, Steel]
  egg-groups: [Field, HumanLike]
  biomes: [Mountain, MontaneForest, AlpineTundra]
  active: [Morning, Day]
  evolves-from: Riolu
