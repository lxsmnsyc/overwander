# Every berry sits on the one `berries` sheet under the bare half of
# its name (a Cheri Berry is `cheri`, see `berryFruit`). The sheet
# covers every berry the game has, and one it did not cover would
# draw nothing rather than draw the wrong fruit

# Cures paralysis
CheriBerry:
  type: Berry
  icon: berries/cheri
  flags: [Consumable, Holdable]
  sell: 20

# Cures sleep
ChestoBerry:
  type: Berry
  icon: berries/chesto
  flags: [Consumable, Holdable]
  sell: 20

# Cures poison
PechaBerry:
  type: Berry
  icon: berries/pecha
  flags: [Consumable, Holdable]
  sell: 20

# Cures a burn
RawstBerry:
  type: Berry
  icon: berries/rawst
  flags: [Consumable, Holdable]
  sell: 20

# Thaws the holder
AspearBerry:
  type: Berry
  icon: berries/aspear
  flags: [Consumable, Holdable]
  sell: 20

# Restores PP of a depleted move
LeppaBerry:
  type: Berry
  icon: berries/leppa
  flags: [Consumable, Holdable]
  sell: 20

# Restores a small amount of health when low
OranBerry:
  type: Berry
  icon: berries/oran
  flags: [Consumable, Holdable]
  sell: 20

# Cures confusion
PersimBerry:
  type: Berry
  icon: berries/persim
  flags: [Consumable, Holdable]
  sell: 20

# Cures any status condition
LumBerry:
  type: Berry
  icon: berries/lum
  flags: [Consumable, Holdable]
  sell: 20

# Restores a quarter of max health when low
SitrusBerry:
  type: Berry
  icon: berries/sitrus
  flags: [Consumable, Holdable]
  sell: 20

