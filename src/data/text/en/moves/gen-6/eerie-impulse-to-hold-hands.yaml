EerieImpulse:
  name: Eerie Impulse
  description: Drops the target's Special Attack 2 stages.
VenomDrench:
  name: Venom Drench
  description: Drops the Attack, Special Attack and Speed of every poisoned pokemon opposite a stage each.
Powder:
  name: Powder
  description: If the target casts a Fire move within 2 seconds, the move fails and the target loses 1/4 of its HP. A shorter wind-up than most.
Geomancy:
  name: Geomancy
  description: Winds up, then raises the user's Special Attack, Special Defense and Speed 2 stages each.
MagneticFlux:
  name: Magnetic Flux
  description: Raises the Defense and Special Defense of everyone on the user's team with Plus or Minus a stage each.
HappyHour:
  name: Happy Hour
  description: Doubles the coins the user's team picks up from Pay Day this battle.
ElectricTerrain:
  name: Electric Terrain
  description: For 10 seconds, grounded pokemon cannot fall asleep or be made drowsy, and their Electric moves hit 1.3x.
DazzlingGleam:
  name: Dazzling Gleam
  description: Hits everything opposite.
Celebrate:
  name: Celebrate
  description: Does nothing whatsoever.
HoldHands:
  name: Hold Hands
  description: Takes a teammate's hand, and does nothing else.
