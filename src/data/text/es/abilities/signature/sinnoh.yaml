# The signature abilities of the families filed under Sinnoh, written by hand: this engine's own abilities, so the games name none of them

BarkBrace:
  name: Postura de Corteza
  description: El primer golpe físico que recibe en cada combate le hace la mitad de daño y lo arraiga, así que restaura 1/16 de sus PS cada vez que actúa pero no puede abandonar el campo.
CinderBrace:
  name: Postura de Ceniza
  description: El primer golpe especial que recibe en cada combate le hace la mitad de daño, y el siguiente movimiento que acierta tiene x1,5 de potencia.
CrestBrace:
  name: Postura de Cresta
  description: El primer movimiento de estado que le apunta en cada combate falla, y el insulto le baja el Ataque Esp. 1 nivel.
Murmuration:
  name: Bandada
  description: Sus ataques tienen x1,05 de potencia por cada aliado que sigue en pie, hasta x1,25.
Lodgework:
  name: Obra de Madriguera
  description: Mientras está en el campo, su equipo recibe un 25 % menos de daño indirecto.
Chorus:
  name: Coro
  description: Mientras está en el campo, los movimientos de sonido de su equipo tienen x1,2 de potencia, los suyos incluidos.
GleamEyes:
  name: Ojos Brillantes
  description: Sus ataques ignoran la subida de Evasión del objetivo y alcanzan a uno oculto por Vuelo, Excavar, Buceo, Bote o Golpe Umbrío.
Ramrod:
  name: Perforación
  description: Sus ataques atraviesan Protección, Detección y un Sustituto.
Bulwark:
  name: Baluarte
  description: Una guardia que levanta cubre a todo su equipo mientras dure la suya.
Patchwork:
  name: Retazos
  description: El primer golpe de cada tipo que recibe le sube 1 nivel la Defensa y la Defensa Esp., 3 veces por combate.
TwoSeas:
  name: Dos Mares
  description: La concha del oeste da x1,25 de potencia a los movimientos de tipo Agua, y la del este, a los de tipo Tierra.
PollenDole:
  name: Reparto de Polen
  description: Cada ataque que acierta devuelve a su aliado más herido 1/16 de sus PS.
FloatSac:
  name: Saco Flotador
  description: Flota sobre los movimientos de tipo Tierra y las trampas hasta que un daño lo deja con menos de 1/2 de PS.
SecondBloom:
  name: Segunda Floración
  description: La primera vez que sus PS bajan de 1/2 en un combate, restaura 1/4 de sus PS y le sube el Ataque Esp. 1 nivel.
CarryOff:
  name: Rapto
  description: Un ataque que acierta tiene un 20 % de probabilidad de arrojar lejos al objetivo, como haría Remolino.
Springheel:
  name: Pie de Resorte
  description: Cada uno de los 3 primeros ataques que acierta le sube 1 nivel la Velocidad.
VelvetClaws:
  name: Garras de Terciopelo
  description: Sus movimientos de contacto tienen x1,25 de potencia contra todo lo que haya subido un nivel de estadística en este combate.
RankAir:
  name: Tufo
  description: Sus movimientos tienen x1,25 de potencia contra un objetivo envenenado.
DeepToll:
  name: Tañido Profundo
  description: Cada movimiento que va a lanzar cuesta a cada rival 1/16 de sus PS.
Skyhunt:
  name: Caza Aérea
  description: Sus movimientos de tipo Tierra alcanzan a lo que está en el aire y le hacen x1,2 de daño.
AuraMatch:
  name: Duelo de Auras
  description: Sus movimientos tienen x1,25 de potencia contra un objetivo que conserva una parte mayor de sus PS.
DustBath:
  name: Baño de Arena
  description: Con tormenta de arena, restaura 1/16 de sus PS cada vez que va a lanzar un movimiento.
Ambush:
  name: Emboscada
  description: El primer movimiento que acierta a cada rival tiene x1,3 de potencia.
Finisher:
  name: Remate
  description: Sus movimientos se preparan un 25 % más rápido contra un objetivo con 1/4 de PS o menos.
FalseEyes:
  name: Ojos Falsos
  description: Un movimiento de un solo objetivo dirigido a un aliado con menos de 1/2 de PS se dirige a él.
Evergreen:
  name: Siempreverde
  description: Con granizo o nieve, los movimientos de tipo Fuego le hacen x0,5 de daño.
Sparkfur:
  name: Pelaje Chispeante
  description: Lo que lo toque a él o a uno de sus aliados queda paralizado con un 30 % de probabilidad.
Birdsong:
  name: Gorjeo
  description: Sus movimientos de sonido con daño confunden al objetivo con un 20 % de probabilidad.
Soulwell:
  name: Fuente de Almas
  description: Restaura 1/4 de sus PS cada vez que alguien se debilita en el campo.
Snapvine:
  name: Liana Atadora
  description: El primer movimiento que acierta a cada rival también lo atrapa.
Appliance:
  name: Electrodoméstico
  description: Sus movimientos del tipo que le da su forma, salvo el Eléctrico, tienen x1,3 de potencia.
Mindgift:
  name: Don de Mente
  description: Al entrar al campo, todo su equipo gana 1 nivel de Precisión.
Heartgift:
  name: Don de Corazón
  description: Al entrar al campo, a todo su equipo le sube el Ataque Esp. 1 nivel.
Willgift:
  name: Don de Voluntad
  description: Al entrar al campo, todo su equipo gana 1 nivel de Ataque.
Lavadome:
  name: Cúpula de Lava
  description: Mientras está en el campo, un rival quemado recibe x1,25 de daño de todo.
TitanSeal:
  name: Sello de Titán
  description: Durante 8 segundos recibe x0,5 de daño. Después hace x1,25 y gana 2 niveles de Ataque.
TimeDrag:
  name: Arrastre Temporal
  description: Mientras está en el campo, el nivel de Velocidad de cada rival cuenta 1 menos.
SpaceDrift:
  name: Deriva Espacial
  description: Mientras está en el campo, el nivel de Precisión de cada rival cuenta 1 menos.
VoidWeight:
  name: Peso del Vacío
  description: Mientras está en el campo, el nivel de Ataque de cada rival cuenta 1 menos.
WaningLight:
  name: Luz Menguante
  description: Mientras está en el campo, todo estado temporal de su equipo dura x0,5, los suyos y los beneficiosos incluidos.
WaxingDark:
  name: Oscuridad Creciente
  description: Todo estado temporal que causa a un rival dura x1,5.
Heartcurrent:
  name: Corriente del Corazón
  description: Cada nivel de estadística que gana un rival también se le aplica a él.
Firstlight:
  name: Primera Luz
  description: Sus movimientos de su propio tipo nunca son poco eficaces. Una inmunidad se mantiene.
Purebloom:
  name: Flor Pura
  description: Mientras está en el campo, el veneno no cuesta PS a su equipo.
