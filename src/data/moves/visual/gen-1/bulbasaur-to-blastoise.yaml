# Beams: the picture is the line between the two of them
# The two that hold far longer and far thicker than any other
# Hyper Beam's orange, Solar Beam's sunlight and Aura Sphere's blue, which their types' colours are not
SolarBeam:
  { landing: Blaster, winding: none, wait: { winding: Charge, striking: Charge }, color: '#fff0a0' }

