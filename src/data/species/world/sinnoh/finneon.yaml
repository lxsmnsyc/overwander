# The fish that wears two false eyes: a Finneon hides behind the
# pattern on its fins, and a Lumineon lights the deep water with it
Finneon:
  types: [Water]
  egg-groups: [Water2]
  habitat: Water
  biomes: [Ocean, CoralReef, KelpForest]
  active: any
  evolves-into:
    - species: Lumineon
      method: [Level]
      level: 31
Lumineon:
  types: [Water]
  egg-groups: [Water2]
  habitat: Water
  biomes: [Ocean, CoralReef, KelpForest]
  active: any
  evolves-from: Finneon
