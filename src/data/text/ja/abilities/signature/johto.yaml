  description: おとの わざが、 ねらった あいてだけでなく フィールドの あいて ぜんいんに とどく。
ContagiousYawn:
  name: うつるあくび
  description: フィールドに でると、 あいて 1ぴきに あくびを つかう。
Magpie:
