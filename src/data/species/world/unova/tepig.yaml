# The fire starter of Unova, a pig that blows smoke from its snout
# and ends up fighting with its fists: an Emboar lights its beard
# and throws the fire along with the punch
Tepig:
  types: [Fire]
  egg-groups: [Field]
  biomes: [Badlands, Desert]
  active: [Morning, Day]
  evolves-into:
    - species: Pignite
      method: [Level]
      level: 17
Pignite:
  types: [Fire, Fighting]
  egg-groups: [Field]
  biomes: [Badlands, Desert]
  active: [Morning, Day]
  evolves-from: Tepig
  evolves-into:
    - species: Emboar
      method: [Level]
      level: 36
Emboar:
  types: [Fire, Fighting]
  egg-groups: [Field]
  biomes: [Badlands, Desert]
  active: [Morning, Day]
  evolves-from: Pignite
