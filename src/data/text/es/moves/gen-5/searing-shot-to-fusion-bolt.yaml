# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
SearingShot:
  name: Bomba Ígnea
  description: Golpea a todos los rivales y a los aliados del usuario. 30 % de probabilidad de quemar.
TechnoBlast:
  name: Tecno Shock
  description: Adopta el tipo del ROM que lleve el usuario, y es de tipo Normal si no lleva ninguno.
RelicSong:
  name: Canto Arcaico
  description: Golpea a todos los rivales. 10 % de probabilidad de dormir a cada uno. Es un sonido.
SecretSword:
  name: Sable Místico
  description: Calcula el daño con la Defensa del objetivo, no con su Defensa Esp.
Glaciate:
  name: Mundo Gélido
  description: Golpea a todos los rivales y baja 1 nivel la Velocidad de cada uno.
BoltStrike:
  name: Ataque Fulgor
  description: 20 % de probabilidad de paralizar.
BlueFlare:
  name: Llama Azul
  description: 20 % de probabilidad de quemar.
FieryDance:
  name: Danza Llama
  description: 50 % de probabilidad de subir 1 nivel el Ataque Esp. del usuario.
FreezeShock:
  name: Rayo Gélido
  description: Se prepara y luego golpea. 30 % de probabilidad de paralizar.
IceBurn:
  name: Llama Gélida
  description: Se prepara y luego golpea. 30 % de probabilidad de quemar.
Snarl:
  name: Alarido
  description: Golpea a todos los rivales y baja 1 nivel el Ataque Esp. de cada uno. Es un sonido.
IcicleCrash:
  name: Chuzos
  description: 30 % de probabilidad de amedrentar.
VCreate:
  name: V de Fuego
  description: Baja 1 nivel la Defensa, la Defensa Esp. y la Velocidad del usuario.
FusionFlare:
  name: Llama Fusión
  description: El doble de potencia si Rayo Fusión acertó en algún lugar en los últimos 2 segundos. Descongela al usuario.
FusionBolt:
  name: Rayo Fusión
  description: El doble de potencia si Llama Fusión acertó en algún lugar en los últimos 2 segundos.
