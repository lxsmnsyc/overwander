# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
DrumCue:
  name: Señal de Tambor
  description: Cada movimiento de tipo Planta que acierta usa Refuerzo sobre el aliado con más Ataque o Ataque Esp., como mucho una vez cada 8 segundos.
KickCue:
  name: Señal de Patada
  description: Cada movimiento de tipo Fuego que acierta usa Cede Paso sobre un aliado que está preparando un movimiento, como mucho una vez cada 8 segundos.
ScopeCue:
  name: Señal de Mira
  description: Cada movimiento de tipo Agua que acierta usa Foco sobre ese objetivo, y los movimientos de un solo objetivo de su equipo se dirigen allí, como mucho una vez cada 8 segundos.
PantryRaid:
  name: Asalto a la Despensa
  description: Mientras está en el campo, cualquier baya que un rival fuera a comer va a sus mofletes, y le cura como lo haría la baya.
SteelEscort:
  name: Escolta de Acero
  description: Cuando un rival empieza a preparar un movimiento que golpea a todo su bando, usa Vasta Guardia, como mucho una vez cada 10 segundos.
EarlyWarning:
  name: Aviso Temprano
  description: Cuando un rival empieza a preparar un movimiento de un solo objetivo contra un aliado, ese aliado usa Detección, como mucho una vez cada 10 segundos.
Fence:
  name: Perista
  description: Todo objeto que roba pasa al aliado con menos PS que tenga las manos vacías, así que las suyas siguen libres.
CottonCradle:
  name: Cuna de Algodón
  description: Mientras está en el campo, su equipo recupera x1,5 con Drenadoras, Arraigo y Campo de Hierba.
Shorn:
  name: Esquilado
  description: 'El primer movimiento de tipo Fuego que lo alcanza en cada combate le chamusca el vellón: se cura cualquier quemadura y usa Agilidad.'
ShellSnap:
  name: Chasquido de Concha
  description: Sus movimientos de mordisco rompen Reflejo, Pantalla de Luz y Velo Aurora en el bando del objetivo, como hace Demolición.
Zoomies:
  name: Carrera Loca
  description: Cada vez que le sube la Velocidad, usa Carga sobre sí mismo.
SharedHarvest:
  name: Cosecha Compartida
  description: Cuando come una baya, su aliado más herido recibe también la curación, la cura o la mejora de esa baya.
CoilBurrow:
  name: Madriguera Enroscada
  description: Con tormenta de arena, sus movimientos de tipo Tierra golpean a todos los rivales en lugar de a uno.
ThroatPouch:
  name: Bolsa de la Garganta
  description: Cada movimiento de tipo Agua que acierta le hace usar Reserva sobre sí mismo.
Spearhead:
  name: Punta de Lanza
  description: Cuando un rival empieza a preparar un movimiento contra él, usa Acua Jet sobre ese rival, como mucho una vez cada 6 segundos.
VenomCharge:
  name: Pila Venenosa
  description: Cada vez que el veneno le cuesta PS a un rival, usa Carga sobre sí mismo, como mucho una vez cada 6 segundos.
CinderCoils:
  name: Espirales de Ascua
  description: Cada movimiento de tipo Fuego que acierta quema la baya que lleva el objetivo, como hace Calcinación.
ArmLock:
  name: Llave de Brazo
  description: Sus movimientos de contacto atrapan al objetivo en Octopresa, si no está reteniendo ya a alguien.
LiveSpines:
  name: Púas Eléctricas
  description: Quien le acierta un movimiento de contacto recibe un Impactrueno de vuelta.
LastPour:
  name: Última Gota
  description: Al debilitarse, usa Deseo Cura sobre su aliado más herido.
SilentWrath:
  name: Ira Silenciosa
  description: Un rival pierde 1/8 de sus PS cada vez que se sube una estadística, salvo que en el campo haya un portador de Festín de Desesperación.
DespairFeast:
  name: Festín de Desesperación
  description: Restaura 1/8 de sus PS cada vez que baja una estadística de un rival, salvo que en el campo haya un portador de Ira Silenciosa.
Sugarcoat:
  name: Glaseado
  description: Cada movimiento de estado que usa sobre un aliado usa también Decoración sobre él.
MirrorScales:
  name: Escamas Espejo
  description: Los efectos añadidos de los movimientos que lo golpean, como una quemadura, un amedrentamiento o una bajada de estadística, recaen en quien los lanzó.
ChippedIce:
  name: Hielo Astillado
  description: Un golpe físico que le acierta usa Granizo, si no hay ningún tiempo activo.
RankAndFile:
  name: Soldado Raso
  description: 'Un soldado aguanta el golpe: los 5 primeros golpes que recibe le hacen x0,5 de daño.'
Attendant:
  name: Asistente
  description: Cuando un aliado recibe un golpe supereficaz, usa Pulso Cura sobre él, como mucho una vez cada 8 segundos.
HangrySpark:
  name: Chispa Hambrienta
  description: Cada vez que un rival come una baya, usa Moflete Estático sobre él.
Overhang:
  name: Voladizo
  description: Un movimiento rival que golpearía a varios miembros de su equipo lo golpea solo a él.
DreepyLaunch:
  name: Lanzamiento de Dreepy
  description: Un movimiento de tipo Dragón que acierta lanza un Dreepy, que usa Dracoflechas sobre un segundo rival, como mucho una vez cada 10 segundos.
Solstice:
  name: Solsticio
  description: Cada 30 segundos, los movimientos de su equipo tienen x1,3 de potencia durante 6 segundos.
Boltdrake:
  name: Voltaje Dracónico
  description: Sus movimientos de tipo Eléctrico golpean como movimientos de tipo Dragón contra cualquier objetivo al que el tipo Dragón haga más daño.
Boltfrost:
  name: Voltaje Gélido
  description: Sus movimientos de tipo Eléctrico golpean como movimientos de tipo Hielo contra cualquier objetivo al que el tipo Hielo haga más daño.
Gilldrake:
  name: Branquia Dracónica
  description: Sus movimientos de tipo Agua golpean como movimientos de tipo Dragón contra cualquier objetivo al que el tipo Dragón haga más daño.
Gillfrost:
  name: Branquia Gélida
  description: Sus movimientos de tipo Agua golpean como movimientos de tipo Hielo contra cualquier objetivo al que el tipo Hielo haga más daño.
SwornBlade:
  name: Espada Jurada
  description: La primera vez que él o un aliado bajan de 1/2 de PS, usa Espada Santa sobre quien lo causó. Una vez por Pokémon.
SwornShield:
  name: Escudo Jurado
  description: La primera vez que un rival deja a un aliado con menos de 1/2 de PS, usa Señuelo para desviar de él los movimientos del rival. Una vez por aliado.
DarkestDay:
  name: Día Oscuro
  description: Mientras está en el campo, cada rival pierde 1/16 de sus PS cada vez que actúa, y él restaura lo que pierden.
Kata:
  name: Rutina Marcial
  description: Cada 3 movimientos que acierta, usa Corpulencia sobre sí mismo.
VoltSeal:
  name: Sello del Rayo
  description: Durante 8 segundos hace y recibe x0,5 de daño. Después hace x1,25 y gana 2 niveles de Velocidad.
WyrmSeal:
  name: Sello del Dragón
  description: Durante 8 segundos hace y recibe x0,5 de daño. Después gana 2 niveles de Ataque Esp. y hace x1,25 de daño.
Frostreign:
  name: Reinado Gélido
  description: Cada rival que debilita sube 1 nivel el Ataque de todo su equipo.
Shadereign:
  name: Reinado de Sombra
  description: Cada rival que debilita sube 1 nivel el Ataque Esp. de todo su equipo.
Crownreign:
  name: Reinado de Corona
  description: Cada rival que debilita cura a todo su equipo 1/8 de sus PS.
