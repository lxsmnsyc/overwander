# Cómo se llama cada miembro del Alto Mando y lo que dice al levantarse

Lorelei:
  name: Lorelei
  quote: El hielo no tiene piedad. Yo tampoco.
Bruno:
  name: Bruno
  quote: ¡Te aplastaremos con nuestro poder superior! ¡Hoo hah!
Agatha:
  name: Agatha
  quote: ¿Quieres ver fantasmas de verdad? Mira bien.
Lance:
  name: Lance
  quote: Mis dragones no conocen debilidad. Demuéstrame que me equivoco.
Will:
  name: Mento
  quote: He entrenado toda mi vida para esto. No perderé contra ti.
Koga:
  name: Koga
  quote: ¡Fufufu! Ya estás pisando mi veneno. ¿Empezamos?
Karen:
  name: Karen
  quote: Pokémon fuertes. Pokémon débiles. Solo importan tus favoritos. Enséñame los tuyos.
JohtoBruno:
  name: Bruno
  quote: He vuelto más fuerte. ¡Prueba los puños de Johto!
Sidney:
  name: Sixto
  quote: Sin rencores, ¿vale? Disfrutemos del combate.
Phoebe:
  name: Fátima
  quote: Entrené con los espíritus del Monte Pírico. Siguen conmigo.
Glacia:
  name: Nívea
  quote: Vine buscando calor y mi hielo no hizo más que volverse más feroz. Míralo.
Drake:
  name: Dracón
  quote: ¿Sabes lo que significa combatir junto a un dragón? Demuéstralo.
Aaron:
  name: Alecrán
  quote: Los Pokémon de tipo Bicho son los más fuertes. Te mostraré por qué.
Bertha:
  name: Gaia
  quote: Llevo en esto más tiempo del que llevas vivo, cielo.
Flint:
  name: Fausto
  quote: Mi pelo no es lo más caliente de aquí. Observa.
Lucian:
  name: Delos
  quote: Un momento, déjame terminar esta página. Bien, vamos.
Shauntal:
  name: Anís
  quote: Estoy escribiendo un libro sobre Entrenadores como tú. Dame un buen final.
Marshal:
  name: Lotto
  quote: Mi maestro me enseñó a buscar la fuerza. Pareces un escalón más del camino.
Grimsley:
  name: Aza
  quote: Ganes o pierdas, las cartas caen. Veamos cómo caen para ti.
Caitlin:
  name: Catleya
  quote: Ahora libro mis propios combates. Puede que lo lamentes.
Malva:
  name: Malva
  quote: Yo informo de las noticias. Hoy toca tu derrota, en directo.
Siebold:
  name: Narciso
  quote: Un combate es un plato. Te serviré algo inolvidable.
Wikstrom:
  name: Tileo
  quote: ¡Bien hallado, aspirante! ¡Mi espada y yo aguardamos tu temple!
Drasna:
  name: Drácena
  quote: ¡Ay, qué alegría, alguien que quiere combatir! Mis dragones lo estaban deseando.
