Electabuzz:
  types: [Electric]
  egg-groups: [HumanLike]
  biomes: [Grassland]
  active: any
  evolves-from: Elekid
  evolves-into:
    - species: Electivire
      method: [HeldItem, Trade]
      item: Electirizer
Elekid:
  types: [Electric]
  # A baby lays no egg of its own: the stage above it does
  egg-groups: [NoEggsDiscovered]
  biomes: [Grassland]
  active: any
  evolves-into:
    - species: Electabuzz
      method: [Level]
      level: 30
# What an Electabuzz becomes with the current to spare: an Electivire
# puts both tails on whatever it is hitting and lets go
Electivire:
  types: [Electric]
  egg-groups: [HumanLike]
  biomes: [Grassland, Steppe, Savanna]
  active: any
  evolves-from: Electabuzz
