# The people who answer to a syndicate's boss, each by their enum name:
# the `sheets` they are seen in and the `honor` putting one down is worth,
# one to each. Which team each serves is syndicates.yaml, and what each
# is called and says is text/en.

Archer:
  sheets:
    - characters/hgss/archer
    - characters/lgpe/archer
  honor: ArcherDefeated
