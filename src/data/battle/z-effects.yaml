# The Z-effect a type crystal adds to each status move of its type,
# just before the move goes off. Missing are the moves the mainline
# gives none, and Memento, Parting Shot, Healing Wish and Lunar Dance,
# whose Z-effect heals a replacement that never comes in here.
#
# A move either raises `stages` by `value` (`all` is the five stats),
# or names one of the other effects: `heal` (back to full HP), `clear`
# (every lowered stage back to 0), `critical` (critical hit ratio up
# two, as Focus Energy), `centre` (draws the other side's moves, as
# Follow Me) or `curse` (full HP for a Ghost, Attack up one otherwise)

