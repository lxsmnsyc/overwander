# The cricket that keeps the evening's time: Kricketot knocks its
# antennae together, and a Kricketune conducts what answers
Kricketot:
  types: [Bug]
  egg-groups: [Bug]
  biomes: [Woodland, TemperateForest, MontaneForest]
  active: [Evening, Night]
  evolves-into:
    - species: Kricketune
      method: [Level]
      level: 10
Kricketune:
  types: [Bug]
  egg-groups: [Bug]
  biomes: [Woodland, TemperateForest, MontaneForest]
  active: [Evening, Night]
  evolves-from: Kricketot
