# TM, HM and tutor moves the two with arms share. A Beldum has none:

Beldum:
  types: [Steel, Psychic]
  egg-groups: [Mineral]
  biomes: [Badlands, ColdDesert]
  active: any
  evolves-into:
    - species: Metang
      method: [Level]
      level: 20
Metang:
  types: [Steel, Psychic]
  egg-groups: [Mineral]
  biomes: [Badlands, ColdDesert]
  active: any
  evolves-from: Beldum
  evolves-into:
    - species: Metagross
      method: [Level]
      level: 45
Metagross:
  types: [Steel, Psychic]
  egg-groups: [Mineral]
  biomes: [Badlands, ColdDesert]
  active: any
  evolves-from: Metang
