# カントーの トレーナーの クラスの なまえと、 しょうぶを いどまれた ときの せりふ。
# ふたつの ちほうに いる クラスは おなじ なまえで、 がめんが ちほうを つけたす。

AceTrainer:
  name: エリートトレーナー
  quote: わたしは いちばん つよい なかまだけを つれて あるく。 きみが つれている ポケモンを みせてもらおう。
Lass:
  name: ミニスカート
  quote: こんにちは！ ポケモンバトル しない？ ずっと れんしゅう してきたの。
BlackBelt:
  name: からておう
  quote: おれの ポケモンも おれと おなじだけ きたえてある。 かかってこい。
BirdKeeper:
  name: とりつかい
  quote: きみが みえた ときから、 わたしの とりポケモンが まわりを とんでいる。
Biker:
  name: ぼうそうぞく
  quote: いい みちだろ。 おれたちの もんだ。 ほしけりゃ しょうぶで うばえ。
Hiker:
  name: やまおとこ
  quote: おれは ここまで あるいて のぼってきた。 おれを こえて いってみろ。
PokeManiac:
  name: かいじゅうマニア
  quote: いわタイプを みたことが ないなら、 おれのを みてから いえ！
BugCatcher:
  name: むしとりしょうねん
  quote: ぼくが ぜんぶ じぶんで つかまえたんだ。 ぜんぶ だよ！
Channeler:
  name: きとうし
  quote: おまえの うしろに なにかが いる。 わたしの ものだ。
Burglar:
  name: どろぼう
  quote: ほしいものは いただく。 きょうは おまえの れんしょうが ほしい。
Swimmer:
  name: かいパンやろう
  quote: ここまで およいできたんだ。 おまえと たたかうのは らくな ほうさ。
Rocker:
  name: でんきグループ
  quote: ボリューム あげろ！ おれの ポケモンは うるさくて しびれるのが すきなんだ。
Psychic:
  name: サイキッカー
  quote: あなたは わたしと たたかうことに なる。 もう みえているの。
Beauty:
  name: おねえさん
  quote: じろじろ みているわね。 みるより バトルを しましょう、 そのほうが しつれいじゃないわ。
Fisherman:
  name: つりびと
  quote: よあけから ここに すわっていた。 やっと なにかが かかったな。
Sailor:
  name: ふなのり
  quote: おまえが あるいた どんな あらしより ひどい てんきで ロープを ひいたんだ。
Gentleman:
  name: ジェントルマン
  quote: かけを しようか。 いやか。 では バトルで けっこう。
SuperNerd:
  name: りかけいのおとこ
  quote: この けんきゅうの ろんぶんは ぜんぶ よんだ。 きみは ひとつも よんでないだろう。
Juggler:
  name: ジャグラー
  quote: ボールから めを はなさないで。 それが コツだったのに、 よそみしたね。
Tamer:
  name: もうじゅうつかい
  quote: わたしの ポケモンは いうことを きく。 きみのは どうかな。
Engineer:
  name: でんきやのオヤジ
  quote: この みちの きかいの はんぶんは おれが つくった。 のこりも みせてやる。
Gambler:
  name: ギャンブラー
  quote: この いっぱつは ばいがえしか、 ぜんぶ ゼロだ。 きみに えらぶ けんりは ない。
