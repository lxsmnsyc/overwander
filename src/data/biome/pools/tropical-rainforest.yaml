# The Pikipek line is written but waits on sprites, since the
# collection has drawn no Trumbeak and no finished Toucannon. Once it
# does, mornings and days take Pikipek in base, Trumbeak in rare and
# Toucannon in elusive, each weighed like its neighbours there.

# The Lush Jungle waits the same way. With no Shiinotic drawn,
# evenings and nights will take Morelull in uncommon and Shiinotic in
# scarce. With no Oranguru drawn, mornings, days and evenings will take
# both it and its counterpart Passimian in elusive, and so will the
# tropical seasonal forest
