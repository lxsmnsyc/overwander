# The eels: a Tynamo alone is worth nothing and a shoal of them
# discharges as one, and what they grow into hangs onto its prey with
# a mouth that does not let go
Tynamo:
  types: [Electric]
  egg-groups: [Amorphous]
  biomes: [Mountain, Bog]
  active: [Evening, Night]
  evolves-into:
    - species: Eelektrik
      method: [Level]
      level: 39
Eelektrik:
  types: [Electric]
  egg-groups: [Amorphous]
  biomes: [Mountain, Bog]
  active: [Evening, Night]
  evolves-from: Tynamo
  evolves-into:
    - species: Eelektross
      method: [UsedItem]
      item: ThunderStone
Eelektross:
  types: [Electric]
  egg-groups: [Amorphous]
  biomes: [Mountain, Bog]
  active: [Evening, Night]
  evolves-from: Eelektrik
