Zorua:
  # The tricksters: neither of them is ever what it looks like, and a
  # Zoroark will keep a whole wood looking like somewhere else to keep
  # people away from its den
  Zorua:
    types: [Dark]
    egg-groups: [Field]
    biomes: [TemperateForest, Woodland]
    active: [Evening, Night]
    evolves-into:
      - species: Zoroark
        method: [Level]
        level: 30
  Zoroark:
    types: [Dark]
    egg-groups: [Field]
    biomes: [TemperateForest, Woodland]
    active: [Evening, Night]
    evolves-from: Zorua
  ZoruaHisui:
    types: [Normal, Ghost]
    egg-groups: [Field]
    biomes: [Tundra, Taiga, AlpineTundra]
    active: [Evening, Night]
    base-form: false
    evolves-into:
      - species: ZoroarkHisui
        method: [Level]
        level: 30
  ZoroarkHisui:
    types: [Normal, Ghost]
    egg-groups: [Field]
    biomes: [Tundra, Taiga, AlpineTundra]
    active: [Evening, Night]
    base-form: false
    evolves-from: ZoruaHisui
Minccino:
  # The chinchillas: a Minccino cleans everything it can reach with its
  # tail, and a Cinccino's scarf is oiled enough that nothing sticks to
  # it at all
  Minccino:
    types: [Normal]
    egg-groups: [Field]
    biomes: [Grassland, Shrubland]
    active: [Morning, Day]
    evolves-into:
      - species: Cinccino
        method: [UsedItem]
        item: ShinyStone
  Cinccino:
    types: [Normal]
    egg-groups: [Field]
    biomes: [Grassland, Shrubland]
    active: [Morning, Day]
    evolves-from: Minccino
Gothita:
  # The watchers: they stare at things nobody else can see, and what a
  # Gothitelle reads in the stars it is said not to tell anybody
  Gothita:
    types: [Psychic]
    egg-groups: [HumanLike]
    biomes: [Grassland, Shrubland]
    active: [Evening, Night]
    evolves-into:
      - species: Gothorita
        method: [Level]
        level: 32
  Gothorita:
    types: [Psychic]
    egg-groups: [HumanLike]
    biomes: [Grassland, Shrubland]
    active: [Evening, Night]
    evolves-from: Gothita
    evolves-into:
      - species: Gothitelle
        method: [Level]
        level: 41
  Gothitelle:
    types: [Psychic]
    egg-groups: [HumanLike]
    biomes: [Grassland, Shrubland]
    active: [Evening, Night]
    evolves-from: Gothorita
Solosis:
  # The cells: a Solosis is a mind in a bag of fluid that nothing much
  # gets through, and by the last stage there are enough of them inside
  # one body to think in several directions at once
  Solosis:
    types: [Psychic]
    egg-groups: [Amorphous]
    biomes: [Grassland, Shrubland]
    active: [Morning, Day]
    evolves-into:
      - species: Duosion
        method: [Level]
        level: 32
  Duosion:
    types: [Psychic]
    egg-groups: [Amorphous]
    biomes: [Grassland, Shrubland]
    active: [Morning, Day]
    evolves-from: Solosis
    evolves-into:
      - species: Reuniclus
        method: [Level]
        level: 41
  Reuniclus:
    types: [Psychic]
    egg-groups: [Amorphous]
    biomes: [Grassland, Shrubland]
    active: [Morning, Day]
    evolves-from: Duosion
Ducklett:
  # The water birds: a Ducklett dives rather than runs, and a Swanna
  # puts on a display at dusk that the rest of the flock follows
  Ducklett:
    types: [Water, Flying]
    egg-groups: [Water1, Flying]
    habitat: Amphibious
    biomes: [Bog, Swamp]
    active: [Morning, Day]
    evolves-into:
      - species: Swanna
        method: [Level]
        level: 35
  Swanna:
    types: [Water, Flying]
    egg-groups: [Water1, Flying]
    habitat: Amphibious
    biomes: [Bog, Swamp]
    active: [Morning, Day]
    evolves-from: Ducklett
Vanillite:
  # The snow: a Vanillite is made out of an icicle that froze in the
  # morning, and a Vanilluxe has two heads that breathe the weather it
  # arrives in
  Vanillite:
    types: [Ice]
    egg-groups: [Mineral]
    biomes: [Tundra, Glacier]
    active: [Morning, Day]
    evolves-into:
      - species: Vanillish
        method: [Level]
        level: 35
  Vanillish:
    types: [Ice]
    egg-groups: [Mineral]
    biomes: [Tundra, Glacier]
    active: [Morning, Day]
    evolves-from: Vanillite
    evolves-into:
      - species: Vanilluxe
        method: [Level]
        level: 47
  Vanilluxe:
    types: [Ice]
    egg-groups: [Mineral]
    biomes: [Tundra, Glacier]
    active: [Morning, Day]
    evolves-from: Vanillish
# The deer that wears the year. Which coat a player meets is decided
# by the month rather than by the ground: the season turns for
# everybody at once, so two people walking far apart still meet the
# same coat and the four are collected over a year rather than
# walked to

# The coat is named where it lives, the way the far shore's
# shell is, and the month rather than a pool hands it over
Deerling:
  Deerling:
    types: [Normal, Grass]
    egg-groups: [Field]
    biomes: [Grassland, TemperateForest]
    active: any
    evolves-into:
      - species: Sawsbuck
        method: [Level]
        level: 34
  DeerlingSummer:
    types: [Normal, Grass]
    egg-groups: [Field]
    biomes: [Grassland, TemperateForest]
    active: any
    base-form: false
    evolves-into:
      - species: SawsbuckSummer
        method: [Level]
        level: 34
  DeerlingAutumn:
    types: [Normal, Grass]
    egg-groups: [Field]
    biomes: [Grassland, TemperateForest]
    active: any
    base-form: false
    evolves-into:
      - species: SawsbuckAutumn
        method: [Level]
        level: 34
  DeerlingWinter:
    types: [Normal, Grass]
    egg-groups: [Field]
    biomes: [Grassland, TemperateForest]
    active: any
    base-form: false
    evolves-into:
      - species: SawsbuckWinter
        method: [Level]
        level: 34
  Sawsbuck:
    types: [Normal, Grass]
    egg-groups: [Field]
    biomes: [Grassland, TemperateForest]
    active: any
    evolves-from: Deerling
  SawsbuckSummer:
    types: [Normal, Grass]
    egg-groups: [Field]
    biomes: [Grassland, TemperateForest]
    active: any
    base-form: false
    evolves-from: DeerlingSummer
  SawsbuckAutumn:
    types: [Normal, Grass]
    egg-groups: [Field]
    biomes: [Grassland, TemperateForest]
    active: any
    base-form: false
    evolves-from: DeerlingAutumn
  SawsbuckWinter:
    types: [Normal, Grass]
    egg-groups: [Field]
    biomes: [Grassland, TemperateForest]
    active: any
    base-form: false
    evolves-from: DeerlingWinter
Emolga:
  # The squirrel that glides between the trees on the membranes under
  # its arms, and holds its charge in its cheeks until it lets go
  Emolga:
    types: [Electric, Flying]
    egg-groups: [Field]
    biomes: [TemperateForest, Woodland]
    active: any
Karrablast:
  # The bug that wants somebody else's shell. It only gets one by
  # being handed over as a Shelmet comes the other way
  Karrablast:
    types: [Bug]
    egg-groups: [Bug]
    # The woods of Route 6 it shares with Shelmet, by daylight
    biomes: [TemperateForest, Woodland]
    active: [Morning, Day]
    evolves-into:
      - species: Escavalier
        method: [Trade]
        partner: Shelmet
  Escavalier:
    types: [Bug, Steel]
    egg-groups: [Bug]
    biomes: [TemperateForest, Woodland]
    active: [Morning, Day]
    evolves-from: Karrablast
Foongus:
  # The mushroom that grew into the shape of a ball somebody dropped,
  # and the bigger one it becomes, which does not bother hiding
  Foongus:
    types: [Grass, Poison]
    egg-groups: [Grass]
    # Under the trees at dusk, where a dropped ball would lie
    biomes: [TemperateForest, Woodland]
    active: [Evening, Night]
    evolves-into:
      - species: Amoonguss
        method: [Level]
        level: 39
  Amoonguss:
    types: [Grass, Poison]
    egg-groups: [Grass]
    biomes: [TemperateForest, Woodland]
    active: [Evening, Night]
    evolves-from: Foongus
Frillish:
  # The jellyfish that drifts under ships, and the one sailors blame
  # for the ones that never came back
  Frillish:
    types: [Water, Ghost]
    egg-groups: [Amorphous]
    habitat: Water
    # Drifting in open water, under the ships
    biomes: [Ocean, DeepOcean]
    active: any
    evolves-into:
      - species: Jellicent
        method: [Level]
        level: 40
  Jellicent:
    types: [Water, Ghost]
    egg-groups: [Amorphous]
    habitat: Water
    biomes: [Ocean, DeepOcean]
    active: any
    evolves-from: Frillish
