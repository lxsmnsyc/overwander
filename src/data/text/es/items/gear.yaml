# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
ShellBell:
  name: Cascabel Concha
  description: Devuelve al portador 1/8 del daño que inflige.
MuscleBand:
  name: Cinta Fuerte
  description: Los movimientos físicos del portador hacen x1,1 de daño.
WiseGlasses:
  name: Gafas Especiales
  description: Los movimientos especiales del portador hacen x1,1 de daño.
ExpertBelt:
  name: Cinta Experto
  description: Los movimientos supereficaces del portador hacen x1,2 de daño.
Metronome:
  name: Metrónomo
  description: Cada vez que repite el mismo movimiento suma x0,2 al daño del portador, hasta x2. Se reinicia al cambiar.
WideLens:
  name: Lupa
  description: x1,1 de precisión en todo lo que lance el portador.
ScopeLens:
  name: Periscopio
  description: Sube 1 nivel la probabilidad de golpe crítico del portador.
BrightPowder:
  name: Polvo Brillo
  description: Todo lo dirigido al portador tiene un 10 % más de probabilidad de fallar.
QuickClaw:
  name: Garra Rápida
  description: 1 de cada 5 veces, el siguiente movimiento del portador se prepara un escalón más rápido.
FocusBand:
  name: Cinta Aguante
  description: 1 de cada 10 veces, el portador aguanta con 1 PS.
RockyHelmet:
  name: Casco Dentado
  description: Quien toque al portador pierde 1/6 de sus propios PS.
SafetyGoggles:
  name: Gafa Protectora
  description: No sufre daño de tormenta de arena ni de granizo, y los movimientos de polvo no le afectan.
UtilityUmbrella:
  name: Parasol Multiuso
  description: 'El portador está bajo un cielo despejado: el sol y la lluvia no le afectan.'
SmokeBall:
  name: Bola de Humo
  description: El portador siempre puede ser retirado del combate, incluso si está atrapado.
DestinyKnot:
  name: Lazo Destino
  description: Quien enamore al portador queda enamorado también. Un huevo criado con él copia 5 valores en lugar de 3.
GripClaw:
  name: Garra Garfio
  description: Las ataduras que aplica el portador duran 1,75 veces más.
BindingBand:
  name: Banda Atadura
  description: Las ataduras que aplica el portador hacen 1/3 más de daño.
ZoomLens:
  name: Telescopio
  description: x1,2 de precisión contra un objetivo que ya esté lanzando o canalizando un movimiento.
IronBall:
  name: Bola Férrea
  description: Reduce a la mitad la Velocidad del portador y lo arrastra al suelo.
LaggingTail:
  name: Cola Plúmbea
  description: El portador prepara sus movimientos un escalón más lento de lo normal.
RingTarget:
  name: Blanco
  description: El portador pierde todas sus inmunidades por tipo.
FloatStone:
  name: Piedra Pómez
  description: Reduce a la mitad el peso del portador.
ProtectivePads:
  name: Paracontacto
  description: Nada de lo que lance el portador cuenta como contacto.
ClearAmulet:
  name: Amuleto Puro
  description: Rechaza toda bajada de estadística que intente otro, y nunca se gasta.
BlackSludge:
  name: Lodo Negro
  description: Un tipo Veneno recupera 1/16 de sus PS cada vez que actúa. Cualquier otro pierde 1/8.
LuckyPunch:
  name: Puño Suerte
  description: Sube 2 niveles la probabilidad de golpe crítico de un Chansey. No hace nada a los demás.
Stick:
  name: Puerro
  description: Sube 2 niveles la probabilidad de golpe crítico de un Farfetch’d. No hace nada a los demás.
ShedShell:
  name: Muda Concha
  description: El portador siempre puede ser retirado del combate, incluso si está atrapado.
Leftovers:
  name: Restos
  description: Devuelve al portador 1/16 de sus PS cada vez que actúa.
DampRock:
  name: Roca Lluvia
  description: La lluvia que invoca el portador dura 1,6 veces más.
HeatRock:
  name: Roca Calor
  description: El sol que invoca el portador dura 1,6 veces más.
IcyRock:
  name: Roca Helada
  description: El granizo y la nieve que invoca el portador duran 1,6 veces más.
SmoothRock:
  name: Roca Suave
  description: La tormenta de arena que invoca el portador dura 1,6 veces más.
LightClay:
  name: Refleluz
  description: Las pantallas que levanta el portador duran 1,6 veces más.
TerrainExtender:
  name: Cubresuelos
  description: El campo que establece el portador dura 1,6 veces más.
BigRoot:
  name: Raíz Grande
  description: x1,3 en todo lo que drene el portador.
SoulDew:
  name: Rocío Bondad
  description: Los movimientos de tipo Psíquico y de tipo Dragón de un Latios o una Latias que lo lleve hacen x1,2 de daño.
LoadedDice:
  name: Dado Trucado
  description: Un movimiento del portador que golpea varias veces nunca acierta menos de 4.
HeavyDutyBoots:
  name: Botas Gruesas
  description: El portador pasa por encima de Púas, Púas Tóxicas y Trampa Rocas.
StickyBarb:
  name: Toxiestrella
  description: Cuesta al portador 1/8 de sus PS por movimiento, y se pega a quien lo toque.
DynamaxBand:
  name: Maximuñequera
  description: La primera vez que los PS del portador bajan de 1/2, usa Dinamax durante sus 3 siguientes movimientos, una vez por bando. No se combina con una Megapiedra ni con un Cristal Z.
TeraOrb:
  name: Orbe Teracristal
  description: El portador se teracristaliza a su teratipo al salir al campo, una vez por bando. No se combina con una Megapiedra, un Cristal Z ni una Maximuñequera.
