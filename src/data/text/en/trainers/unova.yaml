# What Unova's trainer classes are called, and what each says as a duel
# is put to the player. Two regions' worth of one trade share a name; the
# screen adds the region where they do.

Backpacker:
  name: Backpacker
  quote: I have walked further than you have. Sit down, I will show you what I picked up.
Baker:
  name: Baker
  quote: The ovens are hot and so am I. Ready when you are.
Clerk:
  name: Clerk
  quote: I have filed everything you could throw at me. Try anyway.
Dancer:
  name: Dancer
  quote: Every step of this is practised. Keep up if you can.
DepotAgent:
  name: Depot Agent
  quote: The train leaves on time. You will not.
Doctor:
  name: Doctor
  quote: I patch trainers up all day. I would rather be the reason one needs it.
Harlequin:
  name: Harlequin
  quote: You look serious. Let us fix that.
Hoopster:
  name: Hoopster
  quote: I do not miss from out here. Watch.
Infielder:
  name: Infielder
  quote: Hit it anywhere you like. I will be under it.
Janitor:
  name: Janitor
  quote: You would not believe what gets left in the bins. Some of it fights.
Lady:
  name: Lady
  quote: My garden cost more than your whole journey. So did these.
Linebacker:
  name: Linebacker
  quote: Nothing gets past this line. Come and test it.
Maid:
  name: Maid
  quote: The house is spotless and the afternoon is mine. Let us battle.
Musician:
  name: Musician
  quote: One song, one battle, same thing. Count me in.
NurseryAide:
  name: Nursery Aide
  quote: I mind twenty of them at once. One of you is nothing.
Pilot:
  name: Pilot
  quote: I fly for a living. Down here I still do not lose.
Smasher:
  name: Smasher
  quote: Serve, return, done. That is how this goes.
Socialite:
  name: Socialite
  quote: I am expected somewhere in an hour. This will not take one.
Striker:
  name: Striker
  quote: I kick things for a living. Guess what happens next.
SuitActor:
  name: Suit Actor
  quote: You never know who is really in the costume. Neither do they.
Veteran:
  name: Veteran
  quote: I have been doing this since before you were born. Let us not drag it out.
Backers:
  name: Backers
  quote: We cheer all day and we still have more energy than you. Go on.
UnovaAceTrainer:
  name: Ace Trainer
  quote: Unova takes its trainers seriously. I am what that looks like.
UnovaArtist:
  name: Artist
  quote: I paint what I battle. Hold still.
UnovaBattleGirl:
  name: Battle Girl
  quote: I train in the tower every morning. This is the easy part of my day.
UnovaBeauty:
  name: Beauty
  quote: Do not let the outfit fool you. It has never lost either.
UnovaBiker:
  name: Biker
  quote: This whole road is ours after dark. It is after dark.
UnovaBlackBelt:
  name: Black Belt
  quote: Strength is the only thing that carries over. Show me yours.
UnovaBreeder:
  name: Pokémon Breeder
  quote: I raised every one of these from an egg. They know what I want.
UnovaCyclist:
  name: Cyclist
  quote: I came down that hill at speed and I have not stopped.
UnovaFisherman:
  name: Fisherman
  quote: Been on this bank since dawn. Something is finally biting.
UnovaGentleman:
  name: Gentleman
  quote: A wager, then. Nothing large. Only everything you are carrying.
UnovaGuitarist:
  name: Guitarist
  quote: Plug in, turn up, knock down. In that order.
UnovaHiker:
  name: Hiker
  quote: I know every stone on this route by name. They know me too.
UnovaLass:
  name: Lass
  quote: I have been waiting all morning for somebody to come past!
UnovaParasolLady:
  name: Parasol Lady
  quote: Rain or shine, I am ready for it. Are you?
UnovaPokeFan:
  name: Poké Fan
  quote: I have photographs of every one of these. Want to be in one?
UnovaPoliceman:
  name: Policeman
  quote: Routine stop. Empty your party, please.
UnovaPsychic:
  name: Psychic
  quote: I saw this battle before you turned the corner. It went badly for you.
UnovaRanger:
  name: Pokémon Ranger
  quote: This stretch is mine to look after. That includes looking after you.
UnovaRichBoy:
  name: Rich Boy
  quote: Everything I have was bought. Everything they can do was earned.
UnovaRoughneck:
  name: Roughneck
  quote: Shaved head, bad attitude, good pokemon. Two out of three should worry you.
UnovaSchoolKid:
  name: School Kid
  quote: I have done the reading. Now I want the practical.
UnovaScientist:
  name: Scientist
  quote: I am testing something. You are the control.
UnovaSwimmer:
  name: Swimmer
  quote: The water is warmer than it looks. Get in.
UnovaWaiter:
  name: Waiter
  quote: Your table is ready. So is my team.
UnovaWorker:
  name: Worker
  quote: We dug this tunnel by hand. You are standing in it.
UnovaYoungster:
  name: Youngster
  quote: I dug up something great out here. Want to see it swing?
