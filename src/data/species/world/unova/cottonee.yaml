# The cotton: a Cottonee goes wherever the wind takes it, and a
# Whimsicott is somewhere else by the time anybody looks
Cottonee:
  types: [Grass, Fairy]
  egg-groups: [Fairy, Grass]
  biomes: [Grassland, Shrubland]
  active: [Morning, Day]
  evolves-into:
    - species: Whimsicott
      method: [UsedItem]
      item: SunStone
Whimsicott:
  types: [Grass, Fairy]
  egg-groups: [Fairy, Grass]
  biomes: [Grassland, Shrubland]
  active: [Morning, Day]
  evolves-from: Cottonee
