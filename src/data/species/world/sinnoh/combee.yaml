# The comb and the queen. A Combee is three grubs flying in step, and
# only a female one has a comb to build: the males stay as they are,
# so a Vespiquen is always the one that was born to be one
Combee:
  types: [Bug, Flying]
  egg-groups: [Bug]
  active: any
  evolves-into:
    - species: Vespiquen
      method: [Level, Gender]
      level: 21
      gender: Female
Vespiquen:
  types: [Bug, Flying]
  egg-groups: [Bug]
  biomes: [Woodland, TemperateForest, Grassland]
  active: any
  evolves-from: Combee
