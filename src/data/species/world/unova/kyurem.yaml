Kyurem:
  types: [Dragon, Ice]
  egg-groups: [NoEggsDiscovered]
  biomes: [Tundra, Glacier]
  active: any
  # A dragon is folded into it with the splicers, and pulled back
  # out with the same pair
  evolves-into:
    - species: KyuremBlack
      method: [UsedItem]
      item: DnaSplicers
    - species: KyuremWhite
      method: [UsedItem]
      item: DnaSplicers
