# Not a stone, but the same kind of item: used on a Rotom to move it into
# one of the machines it lives in, and spent doing it. Nobody stocks one,
# so every shape after the first costs a Catalog found in the ground.
# Drawn on the key sheet, which is where the collection packed it.
RotomCatalog:
  type: Evolution
  icon: key/rotom-catalog
  flags: [Usable]
  sell: 1500

# Also not a stone: the cells a Zygarde is not carrying are kept in it, so
