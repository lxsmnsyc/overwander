XAttack:
  name: X Attack
  description: +2 Attack when its holder’s Attack is knocked down.
XDefense:
  name: X Defense
  description: +2 Defense when its holder’s Defense is knocked down.
XSpAtk:
  name: X Sp. Atk
  description: +2 Special Attack when its holder’s Special Attack is knocked down.
XSpDef:
  name: X Sp. Def
  description: +2 Special Defense when its holder’s Special Defense is knocked down.
XSpeed:
  name: X Speed
  description: +2 Speed when its holder’s Speed is knocked down.
XAccuracy:
  name: X Accuracy
  description: +2 Accuracy when its holder’s Accuracy is knocked down.
DireHit:
  name: Dire Hit
  description: Sharpens its holder’s criticals by 2 stages when any stat is knocked down.
GuardSpec:
  name: Guard Spec
  description: Refuses the first stat drop anybody else tries on its holder.
