# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
ForestsCurse:
  name: Condena Silvana
  description: Añade el tipo Planta a los tipos del objetivo, en lugar de lo que añadiera Halloween.
PetalBlizzard:
  name: Tormenta Floral
  description: Golpea a todos los rivales y a los aliados del usuario.
FreezeDry:
  name: Liofilización
  description: El doble de daño contra el tipo Agua, diga lo que diga la tabla de tipos. 10 % de probabilidad de congelar.
DisarmingVoice:
  name: Voz Cautivadora
  description: Golpea a todos los rivales y nunca falla. Es un sonido.
PartingShot:
  name: Última Palabra
  description: Baja 1 nivel el Ataque y el Ataque Esp. del objetivo y luego cambia al usuario. Es un sonido.
TopsyTurvy:
  name: Reversión
  description: Invierte todos los niveles de estadísticas del objetivo.
DrainingKiss:
  name: Beso Drenaje
  description: Restaura al usuario 3/4 del daño causado.
CraftyShield:
  name: Truco Defensa
  description: Durante 2 segundos, los movimientos de estado se desvían del bando del usuario.
FlowerShield:
  name: Defensa Floral
  description: Sube 1 nivel la Defensa de todos los tipos Planta del campo.
GrassyTerrain:
  name: Campo de Hierba
  description: Durante 10 segundos, los Pokémon que están en el suelo recuperan 1/16 de sus PS cada vez que actúan y sus movimientos de tipo Planta hacen 1,3 veces el daño. Terremoto, Terratemblor y Magnitud les hacen la mitad del daño.
MistyTerrain:
  name: Campo de Niebla
  description: Durante 10 segundos, los Pokémon que están en el suelo no pueden sufrir un problema de estado, confundirse ni quedar somnolientos, y los movimientos de tipo Dragón les hacen la mitad del daño.
Electrify:
  name: Electrificación
  description: El siguiente movimiento del objetivo en los próximos 2 segundos se convierte en Eléctrico.
