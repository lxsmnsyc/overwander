# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
Sapmark:
  name: じゅえきのしるし
  description: わざを あてた あいては、 こうどうする たびに HPが 1/16 へり、 じぶんも おなじだけ かいふくする。
Embermark:
  name: ひだねのしるし
  description: わざを あてた あいては、 こうどうする たびに HPが 1/16 へる。 やけどを している あいだは 1/8 へる。
Jawmark:
  name: かみつきのしるし
  description: かみついている 1ぴきだけが、 こうどうする たびに HPが 1/8 へる。 かみつけるのは いつも 1ぴきだけ。
Sentry:
  name: みはり
  description: いる あいだ、 てもちの だれも きゅうしょに あたらない。
WatchfulRoost:
  name: ねぐらのばん
  description: フィールドに でると、 てもちの ポケモンに リフレクターを つかう。
Relay:
  name: ひきつぎ
  description: こうたいで さがると、 のうりょくランクを でてくる みかたに ひきつぐ。
SilkSnare:
  name: いとのわな
  description: フィールドに でると、 たっている あいて ぜんいんに いとをはくを つかう。
LanternLure:
  name: ちょうちんのさそい
  description: フィールドに でると、 あいて 1ぴきに あやしいひかりを つかう。
FairShare:
