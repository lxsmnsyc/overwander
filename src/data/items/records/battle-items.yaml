# Each one answers a stat being knocked down rather than being reached for
# from a bag, which is what the descriptions say.
#
# Cheaper than a one-shot, because a one-shot answers whatever happens to
# its holder and these answer one thing only: a pokemon nobody bothers to
# weaken carries its X item all fight.

