# Sinnoh's skull fossil, all head and no room for anything else: the
# charge is the whole pokemon, and the Defense says what it costs
Cranidos:
  types: [Rock]
  egg-groups: [Monster]
  active: any
  evolves-into:
    - species: Rampardos
      method: [Level]
      level: 30
Rampardos:
  types: [Rock]
  egg-groups: [Monster]
  active: any
  evolves-from: Cranidos
