# Poke Ball variants. A ball is spent by the throw itself, so they
# are consumable and usable, never held. The catch multipliers live
# with the safari session (BALL_MODIFIERS), not here.

# The plain ball, no modifier
PokeBall:
  type: PokeBall
  icon: balls/poke
  flags: [Consumable, Usable, Marketable]
  buy: 200
  sell: 100

GreatBall:
  type: PokeBall
  icon: balls/great
  flags: [Consumable, Usable, Marketable]
  buy: 600
  sell: 300

UltraBall:
  type: PokeBall
  icon: balls/ultra
  flags: [Consumable, Usable, Marketable]
  buy: 1200
  sell: 600

# Never fails
MasterBall:
  type: PokeBall
  icon: balls/master
  flags: [Consumable, Usable]

# A commemorative Poke Ball; catches like the plain one
PremierBall:
  type: PokeBall
  icon: balls/premier
  flags: [Consumable, Usable, Marketable]
  buy: 200
  sell: 100

# Heals the buddy on a catch
