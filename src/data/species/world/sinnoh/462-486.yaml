# The three that were made when the world was: one to know, one to
# feel, one to decide. They are built to the same plan, three tiny
# bodies with the same nine moves at the same nine levels, and only
# the mind inside each of them differs
Uxie:
  Uxie:
    types: [Psychic]
    egg-groups: [NoEggsDiscovered]
    habitat: Amphibious
    biomes: [Taiga, Tundra]
    active: any
    rank: legendary
Mesprit:
  Mesprit:
    types: [Psychic]
    egg-groups: [NoEggsDiscovered]
    habitat: Amphibious
    biomes: [TemperateForest, Woodland]
    active: any
    rank: legendary
Azelf:
  Azelf:
    types: [Psychic]
    egg-groups: [NoEggsDiscovered]
    habitat: Amphibious
    biomes: [Grassland, Bog]
    active: any
    rank: legendary
# The three the world was made with: one that decides when a thing
# happens, one that decides where, and the one that was thrown out
# for what it did with either.

# Each of them keeps a second shape, which is what it looks like on
# the other side of its own doorway. A shape is worn rather than met:
# an orb held into a fight is the only way to see one
Dialga:
  Dialga:
    types: [Steel, Dragon]
    egg-groups: [NoEggsDiscovered]
    biomes: [AlpineTundra]
    active: any
    rank: legendary
  DialgaOrigin:
    types: [Steel, Dragon]
    egg-groups: [NoEggsDiscovered]
    active: any
    base-form: false
    # Worn rather than met, so the dex fills it in the day its
    # own shape is
    worn: true
Palkia:
  Palkia:
    types: [Water, Dragon]
    egg-groups: [NoEggsDiscovered]
    habitat: Amphibious
    biomes: [AlpineTundra]
    active: any
    rank: legendary
  PalkiaOrigin:
    types: [Water, Dragon]
    egg-groups: [NoEggsDiscovered]
    active: any
    base-form: false
    # Worn rather than met, so the dex fills it in the day its
    # own shape is
    worn: true
Heatran:
  # The thing living in the volcano rather than under it: it hangs off
  # the walls and the ceiling by cross-shaped feet, and its blood is
  # what the mountain is full of
  Heatran:
    types: [Fire, Steel]
    egg-groups: [NoEggsDiscovered]
    biomes: [Volcano]
    active: any
    rank: legendary
Regigigas:
  # The one that made the other three and towed the continents into
  # place, shut in a temple in the snow ever since
  Regigigas:
    types: [Normal]
    egg-groups: [NoEggsDiscovered]
    biomes: [Glacier, Tundra]
    active: any
    rank: legendary
