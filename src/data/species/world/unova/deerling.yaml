# The deer that wears the year. Which coat a player meets is decided
# by the month rather than by the ground: the season turns for
# everybody at once, so two people walking far apart still meet the
# same coat and the four are collected over a year rather than
# walked to

# The coat is named where it lives, the way the far shore's
# shell is, and the month rather than a pool hands it over

Deerling:
  types: [Normal, Grass]
  egg-groups: [Field]
  biomes: [Grassland, TemperateForest]
  active: any
  evolves-into:
    - species: Sawsbuck
      method: [Level]
      level: 34
DeerlingSummer:
  types: [Normal, Grass]
  egg-groups: [Field]
  biomes: [Grassland, TemperateForest]
  active: any
  base-form: false
  evolves-into:
    - species: SawsbuckSummer
      method: [Level]
      level: 34
DeerlingAutumn:
  types: [Normal, Grass]
  egg-groups: [Field]
  biomes: [Grassland, TemperateForest]
  active: any
  base-form: false
  evolves-into:
    - species: SawsbuckAutumn
      method: [Level]
      level: 34
DeerlingWinter:
  types: [Normal, Grass]
  egg-groups: [Field]
  biomes: [Grassland, TemperateForest]
  active: any
  base-form: false
  evolves-into:
    - species: SawsbuckWinter
      method: [Level]
      level: 34
Sawsbuck:
  types: [Normal, Grass]
  egg-groups: [Field]
  biomes: [Grassland, TemperateForest]
  active: any
  evolves-from: Deerling
SawsbuckSummer:
  types: [Normal, Grass]
  egg-groups: [Field]
  biomes: [Grassland, TemperateForest]
  active: any
  base-form: false
  evolves-from: DeerlingSummer
SawsbuckAutumn:
  types: [Normal, Grass]
  egg-groups: [Field]
  biomes: [Grassland, TemperateForest]
  active: any
  base-form: false
  evolves-from: DeerlingAutumn
SawsbuckWinter:
  types: [Normal, Grass]
  egg-groups: [Field]
  biomes: [Grassland, TemperateForest]
  active: any
  base-form: false
  evolves-from: DeerlingWinter
