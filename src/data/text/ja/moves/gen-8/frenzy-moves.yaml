FrenzyStoneAxe:
  description: あらぶった バサギリの いちげき。 じゅんびの あと、 あいて ぜんいんに あたる。 あたった それぞれの がわに、 ステルスロックと おなじく いわの かけらを のこす。
FrenzyPetalStorm:
  description: あらぶった ヒスイの ドレディアの いちげき。 じゅんびの あと、 あいて ぜんいんに あたり、 あたった それぞれの すばやさを 1だん さげる。
FrenzyWildfire:
  description: あらぶった ヒスイの ウインディの いちげき。 じゅんびの あと、 あいて ぜんいんに あたる。 あたった それぞれの がわの じめんを 8びょうの あいだ もやし、 30%の かくりつで やけどに する。
FrenzyBlast:
  description: あらぶった ヒスイの マルマインの いちげき。 じゅんびの あと、 あいて ぜんいんに たいあたりを ぶつける。 ほかの どの いちげきより つよく、 キングは ひんしに ならない。
FrenzyIceberg:
  description: あらぶった ヒスイの クレベースの いちげき。 じゅんびの あと、 あいて ぜんいんに ひょうざんを おとす。 あたった それぞれを 30%の かくりつで ひるませる。
FrenzyBurst:
  description: あらぶった キングの いちげき。 キング じしんの いちばん さいしょの タイプで、 じゅんびの あと あいて ぜんいんに あたる。 のこす ものは その タイプに よる。
