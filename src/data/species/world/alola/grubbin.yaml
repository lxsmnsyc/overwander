Grubbin:
  types: [Bug]
  egg-groups: [Bug]
  biomes: [TropicalRainforest, TropicalSeasonalForest]
  active: [Morning, Day]
  evolves-into:
    - species: Charjabug
      method: [Level]
      level: 20
Charjabug:
  types: [Bug, Electric]
  egg-groups: [Bug]
  biomes: [TropicalRainforest, TropicalSeasonalForest]
  active: [Morning, Day]
  evolves-from: Grubbin
  # A Thunder Stone rather than a magnetic field, the way Magneton and
  # Nosepass ask for one: nowhere here is a place with a field in it
  evolves-into:
    - species: Vikavolt
      method: [UsedItem]
      item: ThunderStone
Vikavolt:
  types: [Bug, Electric]
  egg-groups: [Bug]
  biomes: [TropicalRainforest, TropicalSeasonalForest]
  active: [Morning, Day]
  evolves-from: Charjabug
