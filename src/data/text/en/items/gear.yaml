ShellBell:
  name: Shell Bell
  description: Hands its holder back 1/8 of the damage it deals.
MuscleBand:
  name: Muscle Band
  description: 1.1x damage from physical moves.
WiseGlasses:
  name: Wise Glasses
  description: 1.1x damage from special moves.
ExpertBelt:
  name: Expert Belt
  description: 1.2x damage, but only from super-effective blows.
Metronome:
  name: Metronome
  description: +0.2x damage for each repeat cast of the same move, up to 2x. Resets on a change.
WideLens:
  name: Wide Lens
  description: 1.1x accuracy on everything its holder throws.
ScopeLens:
  name: Scope Lens
  description: Sharpens its holder’s criticals by 1 stage.
BrightPowder:
  name: Bright Powder
  description: Anything aimed at its holder is 10% likelier to miss.
QuickClaw:
  name: Quick Claw
  description: 1/5 of the time, its holder’s next move winds up a bracket faster.
FocusBand:
  name: Focus Band
  description: 1/10 of the time, its holder is left standing on 1 HP.
RockyHelmet:
  name: Rocky Helmet
  description: Anything that touches its holder pays 1/6 of its own HP.
SafetyGoggles:
  name: Safety Goggles
  description: No sandstorm or hail damage, and powder moves do nothing.
UtilityUmbrella:
  name: Utility Umbrella
  description: 'Its holder stands under clear sky: sun and rain change nothing for it.'
SmokeBall:
  name: Smoke Ball
  description: Its holder can always switch out, even when trapped.
DestinyKnot:
  name: Destiny Knot
  description: Whoever infatuates its holder is infatuated back. An egg bred from it copies 5 values instead of 3.
GripClaw:
  name: Grip Claw
  description: Binds its holder lands hold 1.75x as long.
BindingBand:
  name: Binding Band
  description: Binds its holder lands chip 1/3 harder.
ZoomLens:
  name: Zoom Lens
  description: 1.2x accuracy against a target already casting or channelling.
IronBall:
  name: Iron Ball
  description: Halves its holder’s Speed and drags it to the ground.
LaggingTail:
  name: Lagging Tail
  description: Its holder winds up a bracket slower than it otherwise would.
RingTarget:
  name: Ring Target
  description: Its holder loses every type immunity it has.
FloatStone:
  name: Float Stone
  description: Halves what its holder weighs.
ProtectivePads:
  name: Protective Pads
  description: Nothing its holder throws counts as contact.
ClearAmulet:
  name: Clear Amulet
  description: Refuses every stat drop anybody else tries, and is never spent.
BlackSludge:
  name: Black Sludge
  description: A Poison type gets 1/16 of its HP back each time it acts. Anybody else loses 1/8.
LuckyPunch:
  name: Lucky Punch
  description: Sharpens a Chansey’s criticals by 2 stages. Nothing to anybody else.
Stick:
  name: Stick
  description: Sharpens a Farfetch’d’s criticals by 2 stages. Nothing to anybody else.
ShedShell:
  name: Shed Shell
  description: Its holder can always switch out, even when trapped.
Leftovers:
  name: Leftovers
  description: Hands its holder 1/16 of its HP back every time it acts.
DampRock:
  name: Damp Rock
  description: Rain its holder calls lasts 1.6x as long.
HeatRock:
  name: Heat Rock
  description: Sun its holder calls lasts 1.6x as long.
IcyRock:
  name: Icy Rock
  description: Hail and snow its holder calls last 1.6x as long.
SmoothRock:
  name: Smooth Rock
  description: A sandstorm its holder calls lasts 1.6x as long.
LightClay:
  name: Light Clay
  description: Screens its holder puts up last 1.6x as long.
TerrainExtender:
  name: Terrain Extender
  description: Terrain its holder lays lasts 1.6x as long.
BigRoot:
  name: Big Root
  description: 1.3x on everything its holder drains.
SoulDew:
  name: Soul Dew
  description: 1.2x damage from a Latios’ or Latias’ Psychic and Dragon moves.
LoadedDice:
  name: Loaded Dice
  description: A move of its holder’s that strikes several times never lands fewer than 4.
HeavyDutyBoots:
  name: Heavy-Duty Boots
  description: Its holder walks over spikes, toxic spikes and stealth rock.
StickyBarb:
  name: Sticky Barb
  description: Costs its holder 1/8 of its HP per move, and sticks to whoever touches it.
DynamaxBand:
  name: Dynamax Band
  description: The first time its holder drops below 1/2 HP it Dynamaxes for its next 3 moves, once a side. Not with a Mega Stone or a Z-Crystal.
