# The plasma that lives in other people's machines. The five
# appliance shapes are not stages: a Catalog moves a Rotom between
# any two of them, its own included, so the line is a wheel rather
# than a ladder

Rotom:
  types: [Electric, Ghost]
  egg-groups: [Amorphous]
  biomes: [Woodland, TemperateForest]
  active: any
  evolves-into:
    - species: RotomHeat
      method: [UsedItem]
      item: RotomCatalog
    - species: RotomWash
      method: [UsedItem]
      item: RotomCatalog
    - species: RotomFrost
      method: [UsedItem]
      item: RotomCatalog
    - species: RotomFan
      method: [UsedItem]
      item: RotomCatalog
    - species: RotomMow
      method: [UsedItem]
      item: RotomCatalog
RotomHeat:
  types: [Electric, Fire]
  egg-groups: [Amorphous]
  # It lives where a Rotom does, but a Catalog is the only way
  # into this shape, so no pool stages one
  biomes: [Woodland, TemperateForest]
  active: any
  base-form: false
  evolves-from: Rotom
  evolves-into:
    - species: Rotom
      method: [UsedItem]
