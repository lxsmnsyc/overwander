  description: きのみを もっている あいてに ちょくせつこうげきの わざを あてると、 その きのみを たべて、 きのみと おなじ かいふくや じょうたいいじょうの かいふくを する。
SmogScreen:
  name: スモッグのまく
  description: いる あいだ、 あいての わざの めいちゅうが 15% さがる。 みかたには えいきょうしない。
Corkscrew:
  name: きりもみ
  description: ちょくせつこうげきの わざの いりょくが 1.15ばいに なり、 あいての ぼうぎょの あがりを むしする。
Cushioned:
  name: クッション
  description: 1かいの こうげきで HPの 1/4を こえる ダメージは うけない。
VineWeb:
  name: つるのあみ
  description: フィールドに でるたびに、 あいての がわに まきびしを 1かいぶん まく。
MothersShield:
