Milcery:
  Milcery:
    types: [Fairy]
    egg-groups: [Fairy, Amorphous]
    biomes: [Grassland, Shrubland]
    active: [Morning, Day]
    evolves-into:
      - species: Alcremie
        method: [HeldItem]
        item: StrawberrySweet
      - species: AlcremieBerry
        method: [HeldItem]
        item: BerrySweet
      - species: AlcremieLove
        method: [HeldItem]
        item: LoveSweet
      - species: AlcremieStar
        method: [HeldItem]
        item: StarSweet
      - species: AlcremieClover
        method: [HeldItem]
        item: CloverSweet
      - species: AlcremieFlower
        method: [HeldItem]
        item: FlowerSweet
      - species: AlcremieRibbon
        method: [HeldItem]
        item: RibbonSweet
  Alcremie:
    types: [Fairy]
    egg-groups: [Fairy, Amorphous]
    active: [Morning, Day]
    evolves-from: Milcery
  AlcremieBerry:
    types: [Fairy]
    egg-groups: [Fairy, Amorphous]
    active: [Morning, Day]
    # The Berry Sweet on Vanilla Cream, from a Milcery evolving with a Berry
    # Sweet in hand. The other creams are left out on purpose
    base-form: false
    evolves-from: Milcery
  AlcremieLove:
    types: [Fairy]
    egg-groups: [Fairy, Amorphous]
