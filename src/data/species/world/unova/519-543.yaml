    egg-groups: [Bug]
    biomes: [TemperateForest, Woodland]
    active: [Evening, Night]
    evolves-into:
      - species: Whirlipede
        method: [Level]
        level: 22
  Whirlipede:
    types: [Bug, Poison]
    egg-groups: [Bug]
    biomes: [TemperateForest, Woodland]
    active: [Evening, Night]
    evolves-from: Venipede
    evolves-into:
      - species: Scolipede
        method: [Level]
        level: 30
  Scolipede:
    types: [Bug, Poison]
    egg-groups: [Bug]
