TapuKoko:
  # The four guardians of Alola, one to each island. None is born and
  # none evolves: each is met at the ruin its island keeps for it
  TapuKoko:
    types: [Electric, Fairy]
    egg-groups: [NoEggsDiscovered]
    biomes: [TropicalSeasonalForest]
    active: any
TapuLele:
  TapuLele:
    types: [Psychic, Fairy]
    egg-groups: [NoEggsDiscovered]
    biomes: [TropicalRainforest]
    active: any
TapuBulu:
  TapuBulu:
    types: [Grass, Fairy]
    egg-groups: [NoEggsDiscovered]
    biomes: [Desert]
    active: any
TapuFini:
  TapuFini:
    types: [Water, Fairy]
    egg-groups: [NoEggsDiscovered]
    # Its ruin stands at the water's edge, so it rises from the sea as well
    habitat: Amphibious
    biomes: [RockyCoast]
    active: any
Cosmog:
  # The nebula that grows into the sun or the moon. Which one is the
  # hour it finishes growing at: by day a Solgaleo, by night a Lunala
  Cosmog:
    types: [Psychic]
    egg-groups: [NoEggsDiscovered]
    biomes: [Grassland]
    active: any
    evolves-into:
      - species: Cosmoem
        method: [Level]
        level: 43
  Cosmoem:
    types: [Psychic]
    egg-groups: [NoEggsDiscovered]
    biomes: [Grassland]
    active: any
    evolves-from: Cosmog
    evolves-into:
      - species: Solgaleo
        method: [Level, TimeOfDay]
        level: 53
        time: [Morning, Day]
      - species: Lunala
        method: [Level, TimeOfDay]
        level: 53
        time: [Evening, Night]
  Solgaleo:
    types: [Psychic, Steel]
    egg-groups: [NoEggsDiscovered]
    biomes: [Badlands]
    active: any
    evolves-from: Cosmoem
  Lunala:
    types: [Psychic, Ghost]
    egg-groups: [NoEggsDiscovered]
    biomes: [Badlands]
    active: any
    evolves-from: Cosmoem
Nihilego:
  # The creatures that came through the wormholes from Ultra Space. Each
  # is met in the country most like the world it came from
  Nihilego:
    types: [Rock, Poison]
    egg-groups: [NoEggsDiscovered]
    # Its world is a sea, so it drifts in the water as well
    habitat: Amphibious
    # Ultra Deep Sea
    biomes: [Ocean]
    active: any
