# The line's own moves come at the same order the whole way up, only
Larvitar:
  Larvitar:
    types: [Rock, Ground]
    egg-groups: [Monster]
    biomes: [Mountain, Badlands]
    active: any
    evolves-into:
      - species: Pupitar
        method: [Level]
        level: 30
  Pupitar:
    types: [Rock, Ground]
    egg-groups: [Monster]
    biomes: [Mountain, Badlands]
    active: any
    evolves-from: Larvitar
    evolves-into:
      - species: Tyranitar
        method: [Level]
        level: 55
  Tyranitar:
    types: [Rock, Dark]
    egg-groups: [Monster]
    biomes: [Mountain, Badlands]
    active: any
    evolves-from: Pupitar
