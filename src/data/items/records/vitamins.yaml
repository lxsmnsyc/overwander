# The PP items are stocked beside the vitamins and cost more, because
# what they change is permanent and no berry takes it back: a stat can
# be trained back down with a bitter berry, a move's points cannot.
# A PP Max is the whole allowance (PP_UP_LIMIT) bought at once, so it
# costs that many PP Ups
PPUp:
  type: Training
  icon: medicine/pp-up
  flags: [Consumable, Usable, Marketable]
  buy: 9800
  sell: 4900

PPMax:
  type: Training
  icon: medicine/pp-max
  flags: [Consumable, Usable, Marketable]
  buy: 29400
  sell: 14700
