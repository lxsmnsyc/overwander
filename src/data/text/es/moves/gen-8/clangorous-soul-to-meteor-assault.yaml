# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
ClangorousSoul:
  name: Estruendo Escama
  description: Gasta 1/3 de los PS del usuario para subir 1 nivel todas sus estadísticas.
BodyPress:
  name: Plancha Corporal
  description: Golpea con la Defensa del usuario y sus niveles de estadísticas en lugar de su Ataque.
Decorate:
  name: Decoración
  description: Sube 2 niveles el Ataque y el Ataque Esp. de un aliado.
DrumBeating:
  name: Batería Asalto
  description: Baja 1 nivel la Velocidad del objetivo.
SnapTrap:
  name: Cepo
  description: 'Se cierra sobre el objetivo: pierde 1/8 de sus PS cada 2 segundos durante 8 segundos y no puede escapar, salvo si es de tipo Fantasma.'
PyroBall:
  name: Balón Ígneo
  description: 10 % de probabilidad de quemar. Descongela al usuario.
BehemothBlade:
  name: Tajo Supremo
  description: La espada por la que se conoce a Zacian, con el doble de potencia contra un objetivo Dinamax.
BehemothBash:
  name: Embate Supremo
  description: El escudo por el que se conoce a Zamazenta, con el doble de potencia contra un objetivo Dinamax.
AuraWheel:
  name: Rueda Aural
  description: Exclusivo de Morpeko, que ningún otro Pokémon puede usar. Sube 1 nivel su Velocidad, y es de tipo Siniestro mientras está en Forma Voraz.
BreakingSwipe:
  name: Vasto Impacto
  description: Golpea a todos los rivales y baja 1 nivel el Ataque de cada uno.
BranchPoke:
  name: Punzada Rama
  description: Un simple pinchazo con una rama afilada.
Overdrive:
  name: Amplificador
  description: Golpea a todos los rivales.
AppleAcid:
  name: Ácido Málico
  description: Baja 1 nivel la Defensa Esp. del objetivo.
GravApple:
  name: Fuerza G
  description: Baja 1 nivel la Defensa del objetivo, y hace 1,5 veces el daño mientras Gravedad esté activa.
SpiritBreak:
  name: Choque Anímico
  description: Baja 1 nivel el Ataque Esp. del objetivo.
StrangeSteam:
  name: Cautivapor
  description: 20 % de probabilidad de confundir.
LifeDew:
  name: Gota Vital
  description: Restaura 1/4 de los PS del usuario y de sus aliados.
Obstruct:
  name: Obstrucción
  description: Bloquea todos los movimientos de daño dirigidos al usuario durante 2 segundos, y baja 2 niveles la Defensa de lo que lo toque. Los movimientos de estado pasan. Falla si se usa dos veces seguidas.
FalseSurrender:
  name: Irreverencia
  description: Nunca falla.
MeteorAssault:
  name: Asalto Estelar
  description: Tras acertar, el usuario debe recargar durante 2 segundos.
