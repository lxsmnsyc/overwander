# The ore: a Roggenrola is a lump of it with ears, and a Gigalith has
# a core hot enough to fire the country in front of it
Roggenrola:
  types: [Rock]
  egg-groups: [Mineral]
  biomes: [Mountain, Badlands]
  active: [Morning, Day]
  evolves-into:
    - species: Boldore
      method: [Level]
      level: 25
Boldore:
  types: [Rock]
  egg-groups: [Mineral]
  biomes: [Mountain, Badlands]
  active: [Morning, Day]
  evolves-from: Roggenrola
  evolves-into:
    - species: Gigalith
      method: [Trade]
Gigalith:
  types: [Rock]
  egg-groups: [Mineral]
  biomes: [Mountain, Badlands]
  active: [Morning, Day]
  evolves-from: Boldore
