# Every ability the Gen 1 species can carry, grouped by the line
# that introduces it, the same grouping the Abilities enum keeps, so
# the two stay easy to read side by side. What an ability actually
# does is wired in the battle engine, and which species can roll it
# lives in the species data.

# Bulbasaur
Overgrow:
  name: Overgrow
  description: Grass moves hit 1.5x while it is down to 1/3 of its HP.
Chlorophyll:
  name: Chlorophyll
  description: 2x Speed in sunlight.
ThickFat:
  name: Thick Fat
  description: Fire and Ice moves hit it at 0.5x.

# Charmander
Blaze:
  name: Blaze
  description: Fire moves hit 1.5x while it is down to 1/3 of its HP.
SolarPower:
  name: Solar Power
  description: 2x Special Attack in sunlight, and costs 1/8 of its HP each time it acts.
ToughClaws:
  name: Tough Claws
  description: 1.3x power on contact moves.
Drought:
  name: Drought
  description: Calls out the sun as it enters the field.

# Squirtle
Torrent:
  name: Torrent
  description: Water moves hit 1.5x while it is down to 1/3 of its HP.
RainDish:
  name: Rain Dish
  description: Restores 1/16 of its HP each time it acts in rain.

# Caterpie
ShieldDust:
  name: Shield Dust
  description: Added effects of moves that hit it never land.
RunAway:
  name: Run Away
  description: Always escapes a wild encounter.

# Metapod
ShedSkin:
  name: Shed Skin
  description: 30% chance to shed a status each time it acts.

# Butterfree
CompoundEyes:
  name: Compound Eyes
  description: 1.3x accuracy. As a buddy, wild pokemon carry a rare held item 2.5x as often.
TintedLens:
  name: Tinted Lens
  description: Its not-very-effective moves hit 2x.

# Beedrill
Swarm:
  name: Swarm
  description: Bug moves hit 1.5x while it is down to 1/3 of its HP.
Sniper:
  name: Sniper
  description: 1.5x on critical hits. As a buddy, a critical throw gets 2 chances at its shake.

# Pidgey
KeenEye:
  name: Keen Eye
  description: Refuses accuracy drops from anybody else, and its moves ignore the target's evasion boosts. As a buddy, the bottom of the wild level band lifts by 3.
TangledFeet:
  name: Tangled Feet
  description: Doubles its evasion boosts and drops while confused.
BigPecks:
  name: Big Pecks
  description: Refuses Defense drops from anybody else.
GaleWings:
  name: Gale Wings
  description: Winds up Flying moves a bracket faster while at full HP.

# Rattata
Guts:
  name: Guts
  description: 1.5x Attack while statused, and a burn no longer halves its damage.
Hustle:
  name: Hustle
  description: 1.5x Attack, but physical moves are 20% less accurate. As a buddy, the top of the wild level band lifts by 3.

# Ekans
Intimidate:
  name: Intimidate
  description: -1 Attack to every enemy as it enters the field. As a buddy, the bottom of the wild level band lifts by 3.
Unnerve:
  name: Unnerve
  description: Enemies cannot eat berries while it is up.

# Pikachu
Static:
  name: Static
  description: 30% to paralyse anything that touches it.
LightningRod:
  name: Lightning Rod
  description: Draws Electric moves to itself, takes nothing from them, and gains +1 Special Attack. As a buddy, 1.5x the catch chance on wild Electric types.

# Sandshrew
SandVeil:
  name: Sand Veil
  description: Moves are 20% less accurate against it in a sandstorm, which never chips it.
SandRush:
  name: Sand Rush
  description: 2x Speed in a sandstorm, which never chips it.
RoughSkin:
  name: Rough Skin
  description: Anything that touches it loses 1/8 of its HP.

# Nidoran
PoisonPoint:
  name: Poison Point
  description: 30% to poison anything that touches it.
Rivalry:
  name: Rivalry
  description: 1.25x against its own gender, 0.75x against the other.
SheerForce:
  name: Sheer Force
  description: 1.3x on moves with an added effect, which never lands.

# Clefairy
CuteCharm:
  name: Cute Charm
  description: 30% to infatuate anything that touches it. As a buddy, 2/3 of wild pokemon come out the opposite gender to it.
MagicGuard:
  name: Magic Guard
  description: Takes no indirect damage at all.
Unaware:
  name: Unaware
  description: Ignores the other side's stat stages in any blow it deals or takes.

# Vulpix
FlashFire:
  name: Flash Fire
  description: Immune to Fire, and 1.5x its own Fire moves once one has been thrown at it. As a buddy, 1.5x the catch chance on wild Fire types.

# Jigglypuff
Competitive:
  name: Competitive
  description: +2 Special Attack whenever an enemy knocks a stat down.
Frisk:
  name: Frisk
  description: Pockets one enemy item, berries aside, while it stands. As a buddy, shows what a wild pokemon is carrying.

# Zubat
InnerFocus:
  name: Inner Focus
  description: Never flinches, and shrugs off an Intimidate.
Infiltrator:
  name: Infiltrator
  description: Ignores screens and substitutes.

# Oddish
Stench:
  name: Stench
  description: 10% to leave whatever it hits flinching. As a buddy, 2 fewer wild pokemon appear.
EffectSpore:
  name: Effect Spore
  description: 30% to poison, paralyse or put to sleep anything that touches it.

# Paras
DrySkin:
  name: Dry Skin
  description: Immune to Water and healed 1/4 by it. Rain feeds it, sun burns it, and Fire hits 1.25x.
Damp:
  name: Damp
  description: Nothing on the field can blow itself up.

# Venonat
WonderSkin:
  name: Wonder Skin
  description: Status moves aimed at it are never more than 50% accurate.

# Diglett
ArenaTrap:
  name: Arena Trap
  description: Grounded enemies cannot flee, ghosts aside. As a buddy, 3 more wild pokemon appear and each is half as likely to flee.
SandForce:
  name: Sand Force
  description: 1.3x Ground, Rock and Steel moves in a sandstorm, which never chips it.

# Meowth
Pickup:
  name: Pickup
  description: Picks up an item somebody else used, if it has room for one. As a buddy, finds an item every 512 steps walked.
Technician:
  name: Technician
  description: 1.5x on moves of 60 power or less.
Limber:
  name: Limber
  description: Cannot be paralysed.

# Psyduck
CloudNine:
  name: Cloud Nine
  description: Weather does nothing to anybody while it is up.
SwiftSwim:
  name: Swift Swim
  description: 2x Speed in rain.

# Mankey
VitalSpirit:
  name: Vital Spirit
  description: Cannot fall asleep. As a buddy, the top of the wild level band lifts by 3.
AngerPoint:
  name: Anger Point
  description: Maxes its Attack when a critical hits it.
Defiant:
  name: Defiant
  description: +2 Attack whenever an enemy knocks a stat down.

# Growlithe
Justified:
  name: Justified
  description: +1 Attack when a Dark move hits it.

# Poliwag
WaterAbsorb:
  name: Water Absorb
  description: Immune to Water, and healed 1/4 of its HP by it. As a buddy, 1.5x the catch chance on wild Water types.

# Abra
Synchronize:
  name: Synchronize
  description: Passes poison, burn and paralysis back to whoever caused it. As a buddy, 1/2 of wild pokemon share its nature.

# Machop
NoGuard:
  name: No Guard
  description: Nothing misses, in either direction. As a buddy, 3 more wild pokemon appear.
Steadfast:
  name: Steadfast
  description: +1 Speed whenever it flinches.

# Bellsprout
Gluttony:
  name: Gluttony
  description: Eats its pinch items at 2x the usual HP threshold. As a buddy, treats can lift a throw 1.5x as far as usual.

# Tentacool
ClearBody:
  name: Clear Body
  description: Refuses every stat drop from anybody else.
LiquidOoze:
  name: Liquid Ooze
  description: Draining it hurts the drainer instead.

# Geodude
RockHead:
  name: Rock Head
  description: Takes no recoil.
Sturdy:
  name: Sturdy
  description: Survives any one blow from full health on 1 HP, and one-hit KOs never work on it.
SolidRock:
  name: Solid Rock
  description: Super-effective blows on it hit 1/4 softer.

# Ponyta
FlameBody:
  name: Flame Body
  description: 30% to burn anything that touches it. An egg found while it is the buddy hatches in half the walk.

# Slowpoke
Oblivious:
  name: Oblivious
  description: Cannot be infatuated, and shrugs off an Intimidate.
OwnTempo:
  name: Own Tempo
  description: Cannot be confused, and shrugs off an Intimidate.
Regenerator:
  name: Regenerator
  description: Heals 1/3 of its HP when it leaves the field alive.

# Magnemite
MagnetPull:
  name: Magnet Pull
  description: Steel enemies cannot flee, ghosts aside. As a buddy, wild Steel types cannot flee at all.
Analytic:
  name: Analytic
  description: 1.3x against a target already casting or channelling.

# Doduo
EarlyBird:
  name: Early Bird
  description: Sleeps 1/2 as long.

# Seel
Hydration:
  name: Hydration
  description: No status lands on it in rain.
IceBody:
  name: Ice Body
  description: Restores 1/16 of its HP each time it acts in hail, which never chips it.
SlushRush:
  name: Slush Rush
  description: 2x Speed in hail.

# Grimer
StickyHold:
  name: Sticky Hold
  description: Nobody else can take its item.
PoisonTouch:
  name: Poison Touch
  description: 30% to poison whatever it touches.

# Shellder
ShellArmor:
  name: Shell Armor
  description: Cannot be hit by a critical.
SkillLink:
  name: Skill Link
  description: Multi-hit moves always land every hit.
Overcoat:
  name: Overcoat
  description: Sandstorm and hail never chip it, and powder moves do nothing.

# Gastly
Levitate:
  name: Levitate
  description: Floats, so Ground moves miss unless something pins it down.
CursedBody:
  name: Cursed Body
  description: 30% to shut off whatever move just hit it, for 8 seconds.

# Onix
WeakArmor:
  name: Weak Armor
  description: 'A physical blow cracks it: -1 Defense, +2 Speed.'

# Drowzee
Insomnia:
  name: Insomnia
  description: Cannot fall asleep.
Forewarn:
  name: Forewarn
  description: Disables the strongest enemy move for 8 seconds on entry. As a buddy, shows how ready a wild pokemon is to flee.
BadDreams:
  name: Bad Dreams
  description: Sleeping enemies lose 1/8 of their HP each time it acts.

# Krabby
HyperCutter:
  name: Hyper Cutter
  description: Refuses Attack drops from anybody else.

# Voltorb
Soundproof:
  name: Soundproof
  description: Sound moves cannot touch it.
Aftermath:
  name: Aftermath
  description: Whatever knocks it out by touch loses 1/4 of its own HP.

# Exeggcute
Harvest:
  name: Harvest
  description: 'Regrows the berry it ate: always in sun, 1/2 the time otherwise. As a buddy, a treat fed to a wild pokemon survives a missed throw.'

# Cubone
BattleArmor:
  name: Battle Armor
  description: Cannot be hit by a critical.

# Tyrogue (Hitmonlee/Hitmonchan)
Reckless:
  name: Reckless
  description: 1.2x on recoil and crash moves.
Unburden:
  name: Unburden
  description: 2x Speed while its item is gone.
IronFist:
  name: Iron Fist
  description: 1.2x on punching moves.

# Koffing
NeutralizingGas:
  name: Neutralizing Gas
  description: Every other ability on the field reads as absent.

# Chansey
NaturalCure:
  name: Natural Cure
  description: Cures itself when it leaves the field.
SereneGrace:
  name: Serene Grace
  description: 2x the odds of a move's added effect.
Healer:
  name: Healer
  description: 30% to cure an ally's status each time it acts.

# Tangela
LeafGuard:
  name: Leaf Guard
  description: No status lands on it in sunlight.

# Kangaskhan
Scrappy:
  name: Scrappy
  description: Normal and Fighting moves reach Ghosts, and shrugs off an Intimidate.

# Goldeen
WaterVeil:
  name: Water Veil
  description: Cannot be burned.

# Staryu
Illuminate:
  name: Illuminate
  description: Refuses accuracy drops from anybody else, and its moves ignore the target's evasion boosts. As a buddy, 3 more wild pokemon appear and the dark is lit 5 cells out.

# MrMime
Filter:
  name: Filter
  description: Super-effective blows on it hit 1/4 softer.

# Pinsir
Moxie:
  name: Moxie
  description: +1 Attack whenever it knocks something out.
MoldBreaker:
  name: Mold Breaker
  description: The target's abilities cannot hinder its moves.

# Magikarp
Rattled:
  name: Rattled
  description: +1 Speed when a Bug, Dark or Ghost move hits it, or an Intimidate does.

# Ditto
Imposter:
  name: Imposter
  description: Transforms into the strongest enemy as it enters the field.

# Eevee
Adaptability:
  name: Adaptability
  description: Same-type moves hit 2x rather than 1.5x.
Anticipation:
  name: Anticipation
  description: Takes half damage from the worst enemy move it braced for. As a buddy, shows how ready a wild pokemon is to flee.

# Jolteon
VoltAbsorb:
  name: Volt Absorb
  description: Immune to Electric, and healed 1/4 of its HP by it. As a buddy, 1.5x the catch chance on wild Electric types.
QuickFeet:
  name: Quick Feet
  description: 1.5x Speed while statused, and paralysis does not halve it.

# Porygon
Trace:
  name: Trace
  description: Copies the strongest enemy's ability as it enters the field. As a buddy, shows what a wild pokemon’s ability is.
Download:
  name: Download
  description: +1 Attack or Special Attack, whichever side the enemy is softer on.

# Kabuto (Kabutops)
Sharpness:
  name: Sharpness
  description: 1.5x power on slicing moves.

# Aerodactyl
Pressure:
  name: Pressure
  description: Moves aimed at it cost 2x the cooldown. As a buddy, the top of the wild level band lifts by 3.
StrongJaw:
  name: Strong Jaw
  description: 1.5x power on biting moves.

# Snorlax
Immunity:
  name: Immunity
  description: Cannot be poisoned.

# Articuno
SnowCloak:
  name: Snow Cloak
  description: Moves are 20% less accurate against it in hail, which never chips it.
SnowWarning:
  name: Snow Warning
  description: Calls up hail as it enters the field.

# Zapdos
Drizzle:
  name: Drizzle
  description: Calls up rain as it enters the field.

# Dratini
MarvelScale:
  name: Marvel Scale
  description: 1.5x Defense while statused.

# Dragonite
Multiscale:
  name: Multiscale
  description: Halves any blow that lands on it at full health.

# Mew
Protean:
  name: Protean
  description: Takes the type of every move it uses, so all of them are same-type.

# Special (non-standard abilities outside the regular pool)
Boss:
  name: Boss
  description: 110x its own HP and 2x every other stat, but its casts wind up 2x slower. A move aimed at one enemy hits them all, only fainting interrupts it, and it takes at most 200 from an indirect or share-of-HP hit and heals at most 1,000 HP a second.
Shadow:
  name: Shadow
  description: 1.25x Attack and Special Attack, 0.75x Defense and Special Defense.
Totem:
  name: Totem
  description: Starts the fight with its aura raising its stats, and calls one of its own line to its side at 1/2 HP. Its ally flees when it falls.
TotemAlly:
  name: Totem Ally
  description: 50x its own HP and 1.5x every other stat. Flees when the Totem that called it falls.
Purified:
  name: Purified
  description: The mark of a shadow put right, worth nothing in a fight. As a buddy, 1.5x the catch chance on a wild shadow.
