Snorunt:
  types: [Ice]
  egg-groups: [Fairy, Mineral]
  biomes: [Glacier, AlpineTundra, ColdDesert, Tundra]
  active: any
  evolves-into:
    - species: Glalie
      method: [Level]
      level: 42
    - species: Froslass
      method: [UsedItem, Gender]
      item: DawnStone
      gender: Female
Glalie:
  types: [Ice]
  egg-groups: [Fairy, Mineral]
  biomes: [Glacier, AlpineTundra, ColdDesert, Tundra]
  active: any
  evolves-from: Snorunt
# The other way a Snorunt can go, and only a female one: a Froslass
# freezes what it likes the look of and keeps it
Froslass:
  types: [Ice, Ghost]
  egg-groups: [Fairy, Mineral]
  biomes: [Glacier, AlpineTundra, ColdDesert, Tundra]
  active: any
  evolves-from: Snorunt
