# ホウエンの トレーナーの クラスの なまえと、 しょうぶを いどまれた ときの せりふ。
# ふたつの ちほうに いる クラスは おなじ なまえで、 がめんが ちほうを つけたす。

NinjaBoy:
  name: にんじゃごっこ
  quote: きみは ふたたび ぼくの まえを とおった。 ぼくの ポケモンは どちらも うごかなかった。
Tuber:
  name: うきわボーイ
  quote: みずから でる つもりは ないよ。 きしから かかってきな！
PokeFan:
  name: ポケモンファン
  quote: この こたちの しゃしんは ぜんぶ もってるよ。 きみも うつってみる？
HoennAceTrainer:
  name: エリートトレーナー
  quote: この ちほうを あるいて よこぎった。 みちの うえで おどろいたことは まだ ない。
HoennLass:
  name: ミニスカート
  quote: ママは しらない ひとと はなすなって いったけど、 たたかうなとは いわなかったわ。
HoennBirdKeeper:
  name: とりつかい
  quote: わたしの とりは うみかぜに のる。 きみの は みちの かぜしか しらない。
HoennBugCatcher:
  name: むしとりしょうねん
  quote: ここの もりには たくさん いるよ。 いちばん いい 3びきを えらんだんだ。
HoennSwimmer:
  name: かいパンやろう
  quote: ここの ながれが しごとの はんぶんを してくれる。 のこりは おれの ちからだ。
HoennYoungster:
  name: たんパンこぞう
  quote: はいの したから これを ほりだしたんだ。 きっと みたことない よ。
HoennSchoolKid:
  name: じゅくがえり
  quote: きょうは でんどうりつを しらべるよ。 きみが じっけんの たいしょうさ。
HoennCamper:
  name: キャンプボーイ
  quote: この いわの うえで 3ばん すごして、 ざんねんなのは バトルが できないことだけだった。
HoennBeauty:
  name: おねえさん
  quote: うみかぜが ツヤを たもつの。 でも それに だまされては だめよ。
HoennFisherman:
  name: つりびと
  quote: あさから つっているのに なにも かからない。 きみで ゆるそう。
HoennSailor:
  name: ふなのり
  quote: カイナシティまで これより ひどい てんきで わたってきた。 かかってこい。
HoennGentleman:
  name: ジェントルマン
  quote: かいがんに いえが あって、 みちでは かんしゃくを おこす。
HoennScientist:
  name: けんきゅういん
  quote: デボンコーポレーションが この フィールドワークの ひようを だしている。 きみも データだ。
Guitarist:
  name: ギタリスト
  quote: アンプを つないだら さがって。 これは うるさいよ。
Kindler:
  name: ほのおつかい
  quote: やまは もう じゅうぶん あつい。 わたしの ポケモンが もっと あつくする。
BattleGirl:
  name: バトルガール
  quote: ムロタウンの たきで きたえているの。 もうすぐ おもいしるわよ。
Expert:
  name: たつじん
  quote: きみが はなす まえに この けつまつは みえた。 それでも かかってきなさい。
RuinManiac:
  name: いせきマニア
  quote: この トンネルは じぶんで ほった。 ひとつに ねむっていた ものを みてくれ。
StreetThug:
  name: ちんぴら
  quote: この みちは よるに なると おれたちの ものだ。 つうこうりょうは しょうりで はらえ。
DragonTamer:
  name: ドラゴンつかい
  quote: すなの なかで タマゴから そだてた。 わたしの いうことしか きかない。
AromaLady:
  name: アロマなおねえさん
  quote: いきを すって。 わたしの ポケモンは これで そだったから、 つよいのよ。
Couple:
  name: ラブラブカップル
  quote: わたしたちは ふたりで たたかうか、 たたかわないか。 ふたりまとめて かかってきてね。
HoennBreeder:
  name: ポケモンブリーダー
  quote: サイクリングロードだと タマゴが はやく かえるの。 この 3びきは けさ かえったわ。
HoennRanger:
  name: ポケモンレンジャー
  quote: この みちは わたしが まもる。 わたしに あわずに とおれる ものは いない。
HoennCollector:
  name: コレクター
  quote: この かいがんの めずらしい ものは ぜんぶ ほりだした。 きみが いれば たなが そろう。
HoennReporter:
  name: レポーター
  quote: みちばたの バトルを とりあげた とくしゅうを さつえいちゅうです。 カメラに むかって ひとこと どうぞ。
HoennRichBoy:
  name: おぼっちゃま
  quote: パパは ミナモシティに ヨットを もっている。 ぼくの チームは それより ずっと かちが ある。
HoennParasolLady:
  name: パラソルおねえさん
  quote: ここは 7にちのうち 6にち あめ。 でも わたしは いちども ぬれたことが ないの。
Triathlete:
  name: トライアスリート
  quote: きょうは ここまで はしって、 こいで、 およいで きた。 バトルひとつでは おそくならない。
