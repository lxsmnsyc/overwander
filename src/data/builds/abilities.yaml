# What an ability is worth to an expert build, on a scale where 100 is an
# ordinary one worth carrying (anything without a `worth`). The numbers are
# relative to each other and nothing else: they decide which of a species'
# own pool it awakens.
#
# `lean` is what the build carries it for: `offense` to hit with, `guard` to
# still be standing

