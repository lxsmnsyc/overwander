# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
ShellBell:
  name: かいがらのすず
  description: あたえた ダメージの 1/8を、 もたせた ポケモンの HPとして かいふくする。
MuscleBand:
  name: ちからのハチマキ
  description: もたせた ポケモンの ぶつりわざの いりょくが 1.1ばいに なる。
WiseGlasses:
  name: ものしりメガネ
  description: もたせた ポケモンの とくしゅわざの いりょくが 1.1ばいに なる。
ExpertBelt:
  name: たつじんのおび
  description: もたせた ポケモンの こうかばつぐんの わざの いりょくが 1.2ばいに なる。
Metronome:
  name: メトロノーム
  description: おなじ わざを つづけて だす たびに ダメージが 0.2ばい ふえ、 さいだい 2ばい。 ちがう わざを だすと もとに もどる。
WideLens:
  name: こうかくレンズ
  description: もたせた ポケモンの すべての わざの めいちゅうが 1.1ばいに なる。
ScopeLens:
  name: ピントレンズ
  description: もたせた ポケモンの きゅうしょに あたる ランクが 1だん あがる。
BrightPowder:
  name: ひかりのこな
  description: もたせた ポケモンへの わざが、 10%ほど はずれやすく なる。
QuickClaw:
  name: せんせいのツメ
  description: 1/5の かくりつで、 もたせた ポケモンの つぎの わざの じゅんびが 1だん はやく おわる。
FocusBand:
  name: きあいのハチマキ
  description: 1/10の かくりつで、 もたせた ポケモンは HP1で もちこたえる。
RockyHelmet:
  name: ゴツゴツメット
  description: もたせた ポケモンに ふれた あいては、 じぶんの HPの 1/6を うしなう。
SafetyGoggles:
  name: ぼうじんゴーグル
  description: すなあらしや あられの ダメージを うけず、 こなの わざも きかない。
UtilityUmbrella:
  name: ばんのうがさ
  description: もたせた ポケモンは くもりなき そらの もとに いる。 ひざしも あめも えいきょうしない。
SmokeBall:
  name: けむりだま
  description: もたせた ポケモンは バインドの じょうたいでも、 いつでも こうたいできる。
DestinyKnot:
  name: あかいいと
  description: もたせた ポケモンを メロメロに した あいても メロメロに なる。 これを もたせた おやから うまれた タマゴは、 こたいちを 3つでは なく 5つ うけつぐ。
GripClaw:
  name: ねばりのかぎづめ
  description: もたせた ポケモンが かけた バインドが 1.75ばい ながく つづく。
BindingBand:
  name: しめつけバンド
  description: もたせた ポケモンが かけた バインドの ダメージが 1/3 ふえる。
ZoomLens:
  name: フォーカスレンズ
  description: すでに わざの じゅんびちゅうか ちからを ためている あいてへの めいちゅうが 1.2ばいに なる。
IronBall:
  name: くろいてっきゅう
  description: もたせた ポケモンの すばやさが はんぶんに なり、 じめんに ひきずりおろされる。
LaggingTail:
  name: こうこうのしっぽ
  description: もたせた ポケモンの わざの じゅんびが、 ふだんより 1だん おそく なる。
RingTarget:
  name: ねらいのまと
  description: もたせた ポケモンの タイプによる めんえきが、 すべて なくなる。
FloatStone:
  name: かるいし
  description: もたせた ポケモンの おもさが はんぶんに なる。
ProtectivePads:
  name: ぼうごパット
  description: もたせた ポケモンの わざは、 ひとつも せっしょくわざに ならない。
ClearAmulet:
  name: クリアチャーム
  description: ほかの ポケモンが ステータスを さげようと する こうかを すべて ふせぎ、 なくなる ことは ない。
BlackSludge:
  name: くろいヘドロ
  description: どくタイプは こうどうする たびに HPが 1/16 かいふくする。 それ いがいは 1/8を うしなう。
LuckyPunch:
  name: ラッキーパンチ
  description: ラッキーの きゅうしょに あたる ランクが 2だん あがる。 ほかの ポケモンには なにも おこらない。
Stick:
  name: ながねぎ
  description: カモネギの きゅうしょに あたる ランクが 2だん あがる。 ほかの ポケモンには なにも おこらない。
ShedShell:
  name: きれいなぬけがら
  description: もたせた ポケモンは バインドの じょうたいでも、 いつでも こうたいできる。
Leftovers:
  name: たべのこし
  description: こうどうする たびに、 もたせた ポケモンの HPが 1/16 かいふくする。
DampRock:
  name: しめったいわ
  description: もたせた ポケモンが よんだ あめが、 1.6ばい ながく つづく。
HeatRock:
  name: あついいわ
  description: もたせた ポケモンが よんだ ひざしの つよい てんきが、 1.6ばい ながく つづく。
IcyRock:
  name: つめたいいわ
  description: もたせた ポケモンが よんだ あられや ゆきが、 1.6ばい ながく つづく。
SmoothRock:
  name: さらさらいわ
  description: もたせた ポケモンが よんだ すなあらしが、 1.6ばい ながく つづく。
LightClay:
  name: ひかりのねんど
  description: もたせた ポケモンが はった かべが、 1.6ばい ながく つづく。
TerrainExtender:
  name: グランドコート
  description: もたせた ポケモンが ひろげた フィールドが、 1.6ばい ながく つづく。
BigRoot:
  name: おおきなねっこ
  description: もたせた ポケモンが すいとる HPが 1.3ばいに なる。
SoulDew:
  name: こころのしずく
  description: ラティオスか ラティアスが もつと、 エスパーと ドラゴンの わざの いりょくが 1.2ばいに なる。
LoadedDice:
  name: いかさまダイス
  description: もたせた ポケモンの れんぞくわざは、 かならず 4かい いじょう あたる。
HeavyDutyBoots:
  name: あつぞこブーツ
  description: もたせた ポケモンは、 まきびし、 どくびし、 ステルスロックを ものともしない。
StickyBarb:
  name: くっつきバリ
  description: わざを だす たびに、 もたせた ポケモンの HPが 1/8 へる。 ふれた あいてに くっつく。
DynamaxBand:
  name: ダイマックスＢ
  description: もたせた ポケモンの HPが はじめて 1/2を きると ダイマックスして、 つぎの 3かい わざを だす。 1がわ 1かいだけ。 メガストーンや Zクリスタルとは いっしょに つかえない。
TeraOrb:
  name: テラスタルオーブ
  description: もたせた ポケモンは ばに でる ときに テラスタルして、 テラスタイプに なる。 1がわ 1かいだけ。 メガストーン、 Zクリスタル、 ダイマックスＢとは いっしょに つかえない。
