# The smell that clears a route: Stunky sprays from behind and walks
# off, and a Skuntank can put the same cloud out a long way
Stunky:
  types: [Poison, Dark]
  egg-groups: [Field]
  biomes: [Shrubland, Grassland, Woodland]
  active: [Evening, Night]
  evolves-into:
    - species: Skuntank
      method: [Level]
      level: 34
Skuntank:
  types: [Poison, Dark]
  egg-groups: [Field]
  biomes: [Shrubland, Grassland, Woodland]
  active: [Evening, Night]
  evolves-from: Stunky
