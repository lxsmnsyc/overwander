# Kalos's own trades. The sky trainers fly their battles in a wingsuit,
# the fairy tale girl keeps what the stories keep, the furisode girls and
# the butler bring the Chateau's grace and its keys (a Klefki is both),
# the tourist chases Vivillon's wings, and the rising star the spotlight
SkyTrainer:
  types: [Flying]
  sheets:
    - characters/xy/sky-trainer-f
    - characters/xy/sky-trainer-m
FairyTaleGirl:
  types: [Fairy]
  sheets: [characters/xy/fairy-tale-girl]
