  sheets: [characters/dppt/flint]
  signature: Magmortar
  pool:
    types: [Fire]
Lucian:
  type: Psychic
  honor: LucianDefeated
  sheets: [characters/dppt/lucian]
  signature: Bronzong
  pool:
    types: [Psychic]

