# The colour of flower a Flabebe picked, which it carries for life:
# the flower is the pokemon's weapon, so a Floette and a Florges are
# the same colour as the one that found it. Red grows anywhere the
# line grows; the other four are each a country's own

Flabebe:
  types: [Fairy]
  egg-groups: [Fairy]
  biomes: [Grassland, TemperateForest, Woodland]
  active: [Morning, Day]
  evolves-into:
    - species: Floette
      method: [Level]
      level: 19
Floette:
  types: [Fairy]
  egg-groups: [Fairy]
  biomes: [Grassland, TemperateForest, Woodland]
  active: [Morning, Day]
  evolves-from: Flabebe
  evolves-into:
    - species: Florges
      method: [UsedItem]
      item: ShinyStone
Florges:
  types: [Fairy]
  egg-groups: [Fairy]
  biomes: [Grassland, TemperateForest, Woodland]
  active: [Morning, Day]
  evolves-from: Floette
