    evolves-into:
      - species: Marill
        method: [Friendship]
    rank: baby
Sudowoodo:
  Sudowoodo:
    types: [Rock]
    egg-groups: [Mineral]
    biomes: [Woodland, TemperateForest, Mountain]
    active: any
    evolves-from: Bonsly
  # A Sudowoodo before it learned to keep still: a Bonsly leaks the
  # water it cannot hold and calls it crying
  Bonsly:
    types: [Rock]
    egg-groups: [NoEggsDiscovered]
    biomes: [Woodland, TemperateForest, Mountain]
    active: any
    evolves-into:
      - species: Sudowoodo
        method: [Level, KnownMove]
        level: 20
        move: Mimic
    rank: baby
