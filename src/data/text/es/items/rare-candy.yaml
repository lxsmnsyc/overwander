RareCandy:
  name: Caramelo Raro
  description: Sube cualquier Pokémon 1 nivel, sea cual sea el caramelo que admita su familia. El nivel restaura todos los PS, cura el estado y revive a un Pokémon debilitado.
templates:
  max: Sube cualquier Pokémon hasta el nivel {level} y le ofrece cada movimiento que aprende por el camino. Los niveles restauran todos los PS, curan el estado y reviven a un Pokémon debilitado.
