HoneClaws:
  name: Hone Claws
  description: Raises the user's Attack and accuracy a stage each.
WideGuard:
  name: Wide Guard
  description: For 2 seconds, moves that hit several pokemon at once are turned away from the user's team.
GuardSplit:
  name: Guard Split
  description: The user and the target each take the average of their Defense, and of their Special Defense.
PowerSplit:
  name: Power Split
  description: The user and the target each take the average of their Attack, and of their Special Attack.
WonderRoom:
  name: Wonder Room
  description: For 10 seconds every pokemon's Defense and Special Defense trade places. A second one ends it.
Psyshock:
  name: Psyshock
  description: Lands against the target's Defense rather than its Special Defense.
Venoshock:
  name: Venoshock
  description: 2x power against a poisoned target.
Autotomize:
  name: Autotomize
  description: Raises the user's Speed 2 stages and makes it 100 kg lighter.
RagePowder:
  name: Rage Powder
  description: For 4 seconds every single-target move aimed at the user's side comes to it. Grass types and powder-proof pokemon aim past it.
Telekinesis:
  name: Telekinesis
  description: Holds the target off the ground for 6 seconds, and nothing aimed at it misses.
MagicRoom:
  name: Magic Room
  description: For 10 seconds no held item does anything. A second one ends it.
SmackDown:
  name: Smack Down
  description: Knocks the target out of the air and keeps it on the ground for the rest of the fight.
