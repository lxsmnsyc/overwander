# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
PetalScatter:
  name: はなびらちらし
  description: くさタイプの わざが きゅうしょに あたると、 その ダメージの 1/4を ほかの あいて ぜんいんにも あたえる。
SpreadingFlame:
  name: もえうつり
  description: ほのおタイプの わざで あいてを やけどに すると、 もう 1ぴきの HPが いちばん すくない あいても やけどに する。
Wake:
  name: ひきなみ
  description: あてた みずタイプの わざで あいての すばやさが 1だん さがり、 ほかの あいても 1だん さがる。 8びょうに 1かいまで。
PigOut:
  name: やけぐい
  description: きのみを たべる たびに、 じぶんに たくわえるを つかう。
Tripwire:
  name: しかけいと
  description: バトルの さいちゅうに フィールドに でてきた あいては、 さいしょの わざの じゅんびに かかる じかんが 50% ながくなる。
Knockback:
  name: おしもどし
  description: あてた ちょくせつこうげきの わざごとに、 あいての いまの じゅんびが 0.5びょう おくれる。
StaticPalms:
  name: しびれのてのひら
  description: パンチわざは、 20%の かくりつで あいてを まひさせる。
ScatterBrood:
  name: ちりぢりのひな
  description: れんぞくわざは、 いちげきごとに たっている べつの あいてに じゅんばんに あたる。
FreshBatch:
  name: やきたて
  description: 20びょうごとに、 てが あいている HPが いちばん すくない みかたに オボンのみを わたす。
Anoint:
  name: ぬりぐすり
  description: みかたに あたえる かいふくで、 その みかたの おもな じょうたいいじょうも なおす。
BrineRebound:
  name: しおのしぶき
  description: みずタイプの わざを うけると、 だした あいてに しおづけを つかう。 10びょうに 1かいまで。
Kindling:
  name: たきつけ
  description: あてた ほのおタイプの わざごとに、 つぎの わざの じゅんびが 25% はやく おわる。
BubbleShock:
  name: あわのかんでん
  description: さいきん 4びょう いないに みずタイプの わざを うけた あいてへの でんきタイプの わざの いりょくが 1.5ばいに なる。
LightningDive:
  name: かみなりおとし
  description: おいかぜが ふいている あいだ、 でんきタイプの わざの いりょくが 1.3ばいに なる。
Windswept:
  name: かぜまかせ
  description: だれかに かぜの わざが あたると、 つぎに だす わざの じゅんびが 50% はやく おわる。
MyceliumMat:
  name: きのこのじゅうたん
  description: いる あいだ、 グラスフィールドで みかたが かいふくする たびに、 その みかたの おもな じょうたいいじょうを 1つ なおす。
HeatTolerance:
  name: あつさしらず
  description: やけどを すると、 HPが へる かわりに こうどうする たびに HPが 1/8 かいふくし、 こうげきも はんぶんに ならない。
BallToss:
  name: てわたし
  description: もちものが ない みかたの HPが 1/3 みまんに なると、 じぶんの もちものを わたす。 バトルに つき 1かいだけ。
StareDown:
  name: にらみあい
  description: あてた エスパータイプの わざごとに、 その あいてに ちょうはつを つかう。 おなじ あいてには 10びょうに 1かいまで。
Tinker:
  name: つくろい
  description: みかたが もちものを つかいきると、 つくりなおす。 みかた 1ぴきに つき バトルで 1かいだけ。
SandDuck:
  name: すなもぐり
  description: じめんタイプの わざは この ポケモンに あたらず、 あたらなかった わざ 1かいごとに すばやさが 1だん あがる。
Lifeguard:
  name: ライフガード
  description: HPが 1/2より おおい あいだ、 みかたが ひんしに なる はじめの 1かいの こうげきを かわりに うける。 みかた 1ぴきに つき 1かいだけ。
Redline:
  name: レッドゾーン
  description: HPが へるほど わざの じゅんびが はやく おわり、 HPが いっぱいなら 0%、 ほとんど ないと 30% はやくなる。
ShedDecoy:
  name: ぬけがらのおとり
  description: バトルで はじめて HPが 1/2 みまんに なると、 HPを はらわずに みがわりを つかう。
SlagTrail:
  name: スラグのあと
  description: あてた はがねタイプの わざごとに、 あいての がわに まきびしを 1かいぶん まく。 10びょうに 1かいまで。
Glimmering:
  name: ほのかなひかり
  description: いる あいだ、 どくに なっている あいては わざの じゅんびに かかる じかんが 20% ながくなる。
GraveDigger:
  name: はかほり
  description: もちものを もったまま みかたが ひんしに なり、 じぶんの ては あいている とき、 その もちものが じぶんの ては はいる。
SnowHoard:
  name: ゆきのためこみ
  description: ゆきか あられが ふっている あいだ、 4びょうごとに こうげきが 1だん あがる。 これで あがるのは +3まで。
FilletThrift:
  name: みのせつやく
  description: HPを はらって つかう わざ (みをけずる、 みがわり、 はらだいこ、 しっぽきり) の HPの はらいが はんぶんに なる。
Mouthful:
  name: まるのみ
  description: みかたの HPが 1/3 みまんに なると その みかたを のみこみ、 4びょうの あいだ ねらわれず HPが 1/4 かいふくする。 みかた 1ぴきに つき バトルで 1かいだけ。
BackSeatOrders:
  name: うしろからのさしず
  description: みがわりの うしろに いるか まもるを つかっている あいだ、 みかたが あてる わざの いりょくが 1.2ばいに なる。
GlaiveGuard:
  name: なぎなたのかまえ
  description: すきが できる わざ (きょけんとつげき、 げきりん、 はんどう) の あと、 つぎに こうどうするまで ぼうぎょと とくぼうが +2に なる。
BogDown:
  name: ぬかるみ
  description: じめんタイプの わざを あててきた あいては、 6びょうの あいだ こうたい できなくなる。
Raging:
  name: いきりたち
  description: こうげきが +0より あがっている あいだ、 わざの じゅんびが 20% はやく おわる。
TeaService:
  name: おちゃだし
  description: みかたに むけた かいふくの わざは、 じゅんびが 40% はやく おわる。
CoinScatter:
  name: こばんばらまき
  description: ダメージを あたえる わざを あてる たびに、 ネコにこばんと おなじように おかねを まきちらす。 ネコにこばんの じょうげんまで。
WitheredTablets:
  name: かれたせきばん
  description: あてた あいては、 6びょうの あいだ こうげきを あげられない。
ShatteredSword:
  name: くだけたつるぎ
  description: あてた あいては、 6びょうの あいだ ぼうぎょを あげられない。
CrackedVessel:
  name: ひびわれたうつわ
  description: あてた あいては、 6びょうの あいだ とくこうを あげられない。
ScatteredBeads:
  name: ちらばったたま
  description: あてた あいては、 6びょうの あいだ とくぼうを あげられない。
SunSprint:
  name: ひなたばしり
  description: はれの あいだ、 わざの じゅんびが 20% はやく おわる。
DriveMode:
  name: ドライブモード
  description: エレキフィールドの あいだ、 わざの じゅんびが 20% はやく おわる。
HeadlongGuard:
  name: むてっぽうのたて
  description: じぶんの わざで さがった のうりょく (ぶちかまし、 インファイトなど) は、 つぎに ちょくせつこうげきの わざを あてた とき もとに もどる。
ShriekSpeed:
  name: さけびのはやさ
  description: おとの わざは、 じゅんびが 30% はやく おわる。
EerieFlutter:
  name: ぶきみなはばたき
  description: たんたいの わざを ねらわれると、 20%の かくりつで こうげきした あいての ほかの たっている みかたに むかう。 あいてが 1ぴきだけなら はずれる。
AncientCocoon:
  name: いにしえのまゆ
  description: バトルで はじめて HPが 1/3 みまんに なると、 じぶんに ちょうのまいを つかう。
EarthCurrent:
  name: だいちのいなずま
  description: でんきタイプの わざは、 じめんタイプの あいてにも こうかが ない かわりに ふつうの ダメージを あたえる。
MoonHowl:
  name: つきにほえる
  description: フィールドに でると、 あいて ぜんいんの つぎの わざの じゅんびが 30% ながくなる。
SteamSurge:
  name: じょうきのうねり
  description: はれの あいだ、 みずタイプの わざは はれで よわまらず、 じゅんびが 20% はやく おわる。
MoltenBulwark:
  name: とけたとりで
  description: まもる わざが わざを ふせぐ たびに、 HPが 1/8 かいふくする。
StormCloud:
  name: かみなりぐも
  description: あてた でんきタイプの わざごとに、 15%の かくりつで エレキフィールドを はる。
TrackLaying:
  name: せんろのふせつ
  description: あてた じめんタイプの わざごとに、 あいての がわに ステルスロックを しかける。 15びょうに 1かいまで。
IcePack:
  name: こおりぶくろ
  description: みかたに むけた こおりタイプの わざは、 みかたを きずつけず さいだいHPの 1/4を かいふくする。
IronGrip:
  name: てつのにぎり
  description: パンチわざを あてた あいては、 4びょうの あいだ まもる わざを つかえない。
ToxicExhaust:
  name: どくのはいきガス
  description: ほのおタイプの わざは、 20%の かくりつで あいてを どくに する。
SandGenerator:
  name: すなはつでんき
  description: でんきタイプの わざを うけると、 すなあらしを おこす。 15びょうに 1かいまで。
Afterimage:
  name: ざんぞう
  description: こうげきを うけた あと 1びょうの あいだ、 つぎの わざの じゅんびが 40% はやく おわる。
TerrainEdge:
  name: フィールドのやいば
  description: フィールドが はられている あいだ、 きる わざの いりょくが 1.3ばいに なる。
HoundsOath:
  name: いぬのちかい
  description: みかたが ひんしに なると、 つぎの ダメージを あたえる わざは かならず もうどくに し、 きゅうしょに あたる。
MonkeysOath:
  name: さるのちかい
  description: みかたが ひんしに なると、 つぎの ダメージを あたえる わざは かならず もうどくに し、 じゅんびが 40% はやく おわる。
PheasantsOath:
  name: きじのちかい
  description: みかたが ひんしに なると、 つぎの ダメージを あたえる わざは かならず もうどくに し、 あいて ぜんいんに あたる。
MaskAura:
  name: おめんのオーラ
  description: めんを つけている あいだ、 みかたの その めんの タイプの わざの いりょくが 1.2ばいに なる。 みどりのめんは くさ、 いどのめんは みず、 かまどのめんは ほのお、 いしずえのめんは いわ。
Prismatic:
  name: なないろ
  description: ノーマルタイプの わざは、 だす ときに あいてに いちばん ダメージを あたえる タイプに かわる。
PuppetStrings:
  name: あやつりいと
  description: こんらんしている あいてが この ポケモンに むけた たんたいの わざは、 その あいての みかたが いれば かわりに その みかたに むかう。
