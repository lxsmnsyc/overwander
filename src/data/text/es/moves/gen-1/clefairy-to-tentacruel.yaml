# Names and categories are generated by scripts/i18n/official-names.ts from PokeAPI.
# Every other field is written by hand, and a rerun keeps it.
Pound:
  name: Destructor
  description: Solo daño por contacto.
Sing:
  name: Canto
  description: Duerme al objetivo. Es un sonido.
DoubleSlap:
  name: Doble Bofetón
  description: Golpea de 2 a 5 veces.
Minimize:
  name: Reducción
  description: Sube 2 niveles la Evasión del usuario, pero Golpe Cuerpo y Pisotón no fallan contra él y hacen x2 de daño.
Metronome:
  name: Metrónomo
  description: Lanza un movimiento al azar, salvo Metrónomo, Espejo, Esquema y los tres que nadie aprende.
DefenseCurl:
  name: Rizo Defensa
  description: Sube 1 nivel la Defensa del usuario.
LightScreen:
  name: Pantalla de Luz
  description: Durante 10 segundos, reduce 1/3 el daño especial contra el bando del usuario.
Roar:
  name: Rugido
  description: Expulsa al objetivo del campo y hace entrar a su aliado más débil. Tarda en lanzarse. Es un sonido.
ConfuseRay:
  name: Rayo Confuso
  description: Confunde al objetivo.
Disable:
  name: Anulación
  description: Anula durante 8 segundos el movimiento que el objetivo esté usando o haya usado por última vez. Si está en curso, se interrumpe.
LeechLife:
  name: Chupavidas
  description: Restaura al usuario 1/2 del daño causado.
Haze:
  name: Niebla
  description: Restablece los niveles de estadísticas de todos los del campo, incluido el usuario.
Absorb:
  name: Absorber
  description: Restaura al usuario 1/2 del daño causado.
PetalDance:
  name: Danza Pétalo
  description: Repite el mismo golpe 3 veces y deja confuso al usuario.
Spore:
  name: Espora
  description: Duerme al objetivo. Es una espora, así que el tipo Planta la ignora.
KarateChop:
  name: Golpe Kárate
  description: Más probabilidad de golpe crítico.
Hypnosis:
  name: Hipnosis
  description: Duerme al objetivo.
Amnesia:
  name: Amnesia
  description: Sube 2 niveles la Defensa Esp. del usuario.
Recover:
  name: Recuperación
  description: Restaura 1/2 de los PS del usuario.
LowKick:
  name: Patada Baja
  description: 'Su potencia depende del peso del objetivo: 20 por debajo de 10 kg, hasta 120 con 200 kg o más.'
Slam:
  name: Atizar
  description: Solo daño por contacto.
Constrict:
  name: Restricción
  description: 10 % de probabilidad de bajar 1 nivel la Velocidad del objetivo.
Barrier:
  name: Barrera
  description: Sube 2 niveles la Defensa del usuario.
