Calyrex:
  # The king, and the two shapes it takes astride a steed the Reins of
  # Unity have joined it to
  Calyrex:
    types: [Psychic, Grass]
    egg-groups: [NoEggsDiscovered]
    biomes: [Taiga]
    active: any
    evolves-into:
      - species: CalyrexIce
